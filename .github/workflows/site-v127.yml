name: BOAT EDGE V127 Latest Policy Null Safe

on:
  push:
    paths:
      - ".github/workflows/site-v127.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v127-latest-policy-null-safe
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install V127 latest prediction policy
        shell: bash
        run: |
          python - <<'PY'

          from pathlib import Path
          import json, re

          js_path=Path("assets/boat_edge_v108.js")
          s=js_path.read_text(encoding="utf-8")

          old = '''function be122Mean(arr){
            const v=arr.map(Number).filter(Number.isFinite);
            return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
          }'''
          new = '''function be122Mean(arr){
            const v=arr
              .filter(x=>x!==null&&x!==undefined&&String(x).trim()!=="")
              .map(Number)
              .filter(Number.isFinite);
            return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
          }'''
          if old not in s:
              raise SystemExit("be122Mean anchor missing")
          s=s.replace(old,new,1)

          s=s.replace(
              '<b>最新方針準拠・参考予想</b><span>${esc(stageText)}</span><small>正式CURRENTは未接続。実データが増えるたび展開確率を更新。オッズは順位に使いません。</small>',
              '<b>最新予想CURRENT方針・参考</b><span>${esc(stageText)}</span><small>取得済み入力だけ使用。未取得値は補完しません。正式CURRENT接続時はそちらを最優先。オッズは順位に使いません。</small>',
              1
          )
          s=s.replace(
              '${formal?"正式CURRENT メイン予想":"最新方針準拠・参考予想"}',
              '${formal?"正式CURRENT メイン予想":"最新予想CURRENT方針・参考"}',
              1
          )

          js_path.write_text(s,encoding="utf-8")

          idx=Path("index.html")
          html=idx.read_text(encoding="utf-8")
          html=re.sub(r'boat_edge_v108\.js\?v=\d+','boat_edge_v108.js?v=127',html)
          html=re.sub(
              r'<meta name="boat-edge-site-version" content="[^"]+">',
              '<meta name="boat-edge-site-version" content="V127-LATEST-POLICY-NULLSAFE">',
              html
          )
          idx.write_text(html,encoding="utf-8")

          policy={
            "schema_version":"boat-edge-latest-prediction-policy-v127",
            "as_of":"2026-10-08",
            "name":"LATEST_PREDICTION_CURRENT_POLICY",
            "objective":"展開を正しく読み、3連単的中率を最大化する。少点数化は二次目的。",
            "ticket_policy":{
              "solid":"3〜4点を目安",
              "split_or_rough":"展開が割れる・中穴/大穴筋が複数なら最大10点まで拡張可",
              "ranking":"120通りの勝率/着順確率を軸に上位から選ぶ",
              "odds_rank_weight":False,
              "manual_hole_boost":False
            },
            "priority":[
              "実進入 / 前づけ / 深イン / スロー・ダッシュ / カド",
              "場prior + 選手の実コース能力",
              "1号艇の逃げ耐性 + 2コースの壁/逃がし",
              "3/4コース攻撃艇と届き方",
              "5/6コースを含む展開受益艇",
              "実コース平均ST / 隣艇ST差 / 展示ST差 / 平均STと展示STの乖離",
              "モーター直近節状態 / 今節気配 / 部品交換",
              "オリジナル展示の一周・まわり足・直線・展示タイムを実タイム差で評価",
              "風 / 波 / 潮 / 水面条件との相互作用",
              "同日LIVE水面傾向",
              "逃げ / 差し / まくり系 / 受益の複数展開世界",
              "買い目"
            ],
            "site_reference_active_inputs":[
              "全国・当地選手力",
              "モーター/ボート基礎成績",
              "当地最近3か月コース1着率・決まり手",
              "実進入（6艇揃った時のみ枠より優先）",
              "平均ST（欠損除外）",
              "展示STと隣艇ST差",
              "展示タイム",
              "オリジナル展示の取得済み実値",
              "4コース攻撃傾向の一部"
            ],
            "not_yet_fully_connected_to_site_reference":[
              "選手×実コースの1年/6か月/3か月詳細成績",
              "2コース逃がし率 + 1コース差され率/壁性能",
              "攻撃艇→受益艇の完全な局所相互作用",
              "モーター直近節/今節推移/部品交換",
              "venue×season×course / venue×wind×course / venue×tide×course",
              "同日終了レースだけから作るLIVE水面傾向",
              "BOATERS + 競艇日和双方のオリ展source-binding確認"
            ],
            "missing_data_rule":"未取得値は0・平均・proxyで補完しない。利用可能な入力だけで参考予想を出し、正式CURRENT接続時は正式CURRENTを優先。",
            "formal_current_status_rule":"formal_predictions が有効かつ PRE_RESULT guard を満たす場合のみ正式CURRENTとして表示。",
            "original_exhibition_formal_requirement":"正式最新予想ではBOATERS + 競艇日和を確認し、一周・まわり足・直線・展示ST/タイムを実値/艇間差で評価する。"
          }
          Path("data/site_prediction_policy.json").write_text(
              json.dumps(policy,ensure_ascii=False,indent=2),encoding="utf-8"
          )

          todo=Path("BOAT_EDGE_CURRENT_TODO.md")
          t=todo.read_text(encoding="utf-8") if todo.exists() else "# BOAT EDGE CURRENT TODO\n"
          t=re.sub(r"Current UI target: V\d+","Current UI target: V127",t)
          lines=[
            "- V126 detected a real V122/V123 parity mismatch only on fixture 20261005-09-08; top7 matched but positions 8/9 swapped.",
            "- V127 fixes the root cause: browser be122Mean no longer converts missing avg_st null into numeric zero.",
            "- V127 enforces the latest-prediction rule that missing inputs are excluded, never proxy/imputed as zero.",
            "- V127 locks latest prediction priority in data/site_prediction_policy.json: actual entry -> venue/actual-course -> 1 escape/2 wall -> 3/4 attack -> 5/6 beneficiary -> ST -> motor -> exhibition -> water -> LIVE -> scenario worlds -> tickets.",
            "- V127 objective is trifecta hit-rate through scenario reading; fewer tickets are secondary, with up to 10 when scenarios genuinely split.",
            "- V127 keeps odds out of ranking and keeps manual hole boosting disabled.",
            "- V127 clearly distinguishes active site-reference inputs from latest-policy inputs not yet fully connected.",
            "- V127 formal CURRENT remains higher priority than the reference calculation whenever valid formal_predictions are available."
          ]
          marker="## NEXT"
          for line in lines:
              if line not in t:
                  t=t.replace(marker,line+"\n\n"+marker,1) if marker in t else t+"\n"+line+"\n"
          todo.write_text(t,encoding="utf-8")

          PY

      - name: Validate V127
        shell: bash
        run: |
          set -e
          node --check assets/boat_edge_v108.js
          grep -q 'V127-LATEST-POLICY-NULLSAFE' index.html
          grep -q 'boat_edge_v108.js?v=127' index.html
          grep -q '最新予想CURRENT方針・参考' assets/boat_edge_v108.js
          grep -q 'x!==null&&x!==undefined' assets/boat_edge_v108.js
          grep -q 'LATEST_PREDICTION_CURRENT_POLICY' data/site_prediction_policy.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path("data/site_prediction_policy.json").read_text(encoding="utf-8"))
          assert d["ticket_policy"]["odds_rank_weight"] is False
          assert d["ticket_policy"]["manual_hole_boost"] is False
          assert "未取得値は0" in d["missing_data_rule"]
          s=Path("assets/boat_edge_v108.js").read_text(encoding="utf-8")
          m=re.search(r'function be122Mean\(arr\)\{(.*?)\n\}',s,re.S)
          assert m
          body=m.group(1)
          assert 'x!==null&&x!==undefined' in body
          assert '.filter(Number.isFinite)' in body
          print({"policy":d["name"],"null_safe_mean":True})
          PY
          ! grep -q 'Math.sqrt(Math.min(od(b)' assets/boat_edge_v108.js
          ! grep -q 'Math.pow(Math.min(od(b)' assets/boat_edge_v108.js
          ! grep -q 'MutationObserver' assets/boat_edge_v108.js
          ! grep -q 'setInterval(' assets/boat_edge_v108.js

      - name: Save V127
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_v108.js index.html data/site_prediction_policy.json BOAT_EDGE_CURRENT_TODO.md
          git diff --cached --quiet && exit 0
          git commit -m "Apply latest prediction policy and null-safe ST V127"
          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
