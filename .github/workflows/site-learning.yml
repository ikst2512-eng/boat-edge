name: BOAT EDGE 学習・購入分析 V70

on:
  push:
    paths:
      - ".github/workflows/site-learning.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boat-edge-site-learning-v70
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: V70一括反映 + 学習集計
        shell: bash
        env:
          BE70_ADDON_B64: ""
        run: |
          python - <<'PY'
          import os, re, json, base64, statistics
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST).isoformat(timespec="seconds")

          # 1) SITE V70 addon install (idempotent)
          js=Path("assets/boat_edge_simple_v51.js")
          s=js.read_text(encoding="utf-8")
          marker="BOAT_EDGE_SITE_V70_BATCH_LEARNING_PURCHASE"
          if marker not in s:
              addon=base64.b64decode(os.environ["BE70_ADDON_B64"]).decode("utf-8")
              s=re.sub(r'^/\* BOAT_EDGE_SITE_V\d+_[^*]+ \*/',
                       '/* BOAT_EDGE_SITE_V70_BATCH_LEARNING_PURCHASE */',s,count=1)
              s=s.rstrip()+"\n\n"+addon+"\n"
              js.write_text(s,encoding="utf-8")

          # 2) Durable server learning ledger. Prediction files are read-only.
          roots=[Path("data/formal_predictions"),Path("data/formal")]
          results=Path("data/site_results")
          out=Path("data/site_learning/evaluations")
          out.mkdir(parents=True,exist_ok=True)

          def load(p):
              try:return json.loads(p.read_text(encoding="utf-8"))
              except:return None

          def combo(v):
              if isinstance(v,list): return "-".join(map(str,v[:3]))
              m=re.search(r"([1-6])\D+([1-6])\D+([1-6])",str(v or ""))
              return "-".join(m.groups()) if m else None

          def safe_pre_result(d):
              g=((d.get("formal_meta") or {}).get("guards") or
                 (d.get("derived") or {}).get("guards") or {})
              rs=g.get("results_seen",d.get("results_seen"))
              sc=g.get("scoring",d.get("scoring"))
              return rs is False and sc is not True

          def distribution(d):
              candidates=[
                d.get("distribution120"),d.get("distribution_120"),
                d.get("all_combinations"),d.get("trifecta_distribution"),
                d.get("probabilities"),
                (d.get("derived") or {}).get("distribution120"),
                (d.get("derived") or {}).get("distribution_120")
              ]
              src=next((x for x in candidates if x),None)
              if isinstance(src,dict):
                  src=[dict(v,combo=k) if isinstance(v,dict)
                       else {"combo":k,"probability":v} for k,v in src.items()]
              if not isinstance(src,list): return []
              a=[]
              for t in src:
                  if not isinstance(t,dict): continue
                  c=combo(t.get("combo") or t.get("trifecta") or t.get("order"))
                  try:p=float(t.get("probability",t.get("prob",t.get("p",t.get("rate")))))
                  except:continue
                  if c:a.append({"combo":c,"probability":p,
                                  "world":t.get("world") or t.get("scenario") or t.get("pattern"),
                                  "reasons":t.get("reasons") or t.get("reason")})
              a.sort(key=lambda x:x["probability"],reverse=True)
              for i,x in enumerate(a,1):x["rank"]=i
              return a

          preds={}
          for root in roots:
              if root.exists():
                  for p in root.glob("*.json"):
                      d=load(p)
                      if d and safe_pre_result(d):
                          preds[d.get("race_key") or p.stem]=d

          rows=[]
          skipped_no_dist=0
          for key,d in sorted(preds.items()):
              rp=results/f"{key}.json"
              r=load(rp) if rp.exists() else None
              if not r or r.get("status")!="confirmed": continue
              a=distribution(d)
              if not a:
                  skipped_no_dist+=1
                  continue
              win=combo(r.get("trifecta") or r.get("finish_order"))
              hit=next((x for x in a if x["combo"]==win),None)
              row={
                "schema_version":"boat-edge-site-learning-v70",
                "race_key":key,
                "evaluated_at":now,
                "model":d.get("model") or (d.get("formal_meta") or {}).get("model") or d.get("current"),
                "distribution_count":len(a),
                "winning_combo":win,
                "winning_rank":hit.get("rank") if hit else None,
                "winning_probability":hit.get("probability") if hit else None,
                "winning_world":hit.get("world") if hit else None,
                "winning_reasons":hit.get("reasons") if hit else None,
                "trifecta_payout_yen_per_100":r.get("trifecta_payout_yen_per_100"),
                "prediction_guard":{"results_seen":False,"scoring":False}
              }
              (out/f"{key}.json").write_text(
                  json.dumps(row,ensure_ascii=False,indent=2),encoding="utf-8")
              rows.append(row)

          ranks=[x["winning_rank"] for x in rows if isinstance(x.get("winning_rank"),int)]
          def rate(k):
              return round(100*sum(r<=k for r in ranks)/len(ranks),1) if ranks else None

          summary={
            "schema_version":"boat-edge-site-learning-summary-v70",
            "updated_at":now,
            "evaluated":len(rows),
            "ranked":len(ranks),
            "skipped_no_distribution":skipped_no_dist,
            "top3_rate":rate(3),
            "top5_rate":rate(5),
            "top10_rate":rate(10),
            "top20_rate":rate(20),
            "top30_rate":rate(30),
            "top60_rate":rate(60),
            "top120_rate":rate(120),
            "avg_rank":round(sum(ranks)/len(ranks),2) if ranks else None,
            "median_rank":statistics.median(ranks) if ranks else None,
            "source":"server_durable_ledger",
            "results_seen_in_prediction":False
          }
          root=Path("data/site_learning")
          root.mkdir(parents=True,exist_ok=True)
          (root/"summary.json").write_text(
              json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: 変更保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js data/site_learning
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V70 learning and purchase layer"
          git push
