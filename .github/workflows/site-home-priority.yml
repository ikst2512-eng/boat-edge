name: BOAT EDGE トップ締切順・一押し V74

on:
  push:
    paths:
      - ".github/workflows/site-home-priority.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: V74反映
        shell: bash
        env:
          BE74_ADDON_B64: ""
        run: |
          python - <<'PY'
          import os,re,base64
          from pathlib import Path
          js=Path("assets/boat_edge_simple_v51.js")
          s=js.read_text(encoding="utf-8")
          marker="BOAT_EDGE_SITE_V74_DEADLINE_SPOTLIGHT"
          if marker not in s:
              addon=base64.b64decode(os.environ["BE74_ADDON_B64"]).decode("utf-8")
              s=re.sub(r'^/\* BOAT_EDGE_SITE_V\d+_[^*]+ \*/',
                       '/* BOAT_EDGE_SITE_V74_DEADLINE_SPOTLIGHT */',s,count=1)
              s=s.rstrip()+"\n\n"+addon+"\n"
              js.write_text(s,encoding="utf-8")
          PY
      - name: 保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V74 deadline spotlight home"
          git push
