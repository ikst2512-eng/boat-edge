name: BOAT EDGE V175 - Payout Band Display Clarity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V175_PAYOUT_BANDS.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v175-display-only
  cancel-in-progress: false

jobs:
