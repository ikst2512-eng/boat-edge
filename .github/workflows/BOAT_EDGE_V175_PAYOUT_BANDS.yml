          node --check assets/boat_edge_v175_payout_bands.js
          node --check assets/boat_edge_v108.js
          node tests/test_v175_payout_bands.cjs
          git diff --check
          python3 - <<'PYSCOPE'
          import subprocess
          allowed={'assets/boat_edge_v175_payout_bands.js','assets/boat_edge_v108.js','tests/test_v175_payout_bands.cjs','index.html'}
          changed=set(subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines())
          paths={x[3:] for x in changed}
          assert paths<=allowed,repr(paths)
          assert len(paths)<=4
          print('V175_ONLY_UI_SOURCE_AND_TEST_FILES_PASS',sorted(paths))
          PYSCOPE
      - name: Commit V175 without modifying formal predictions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/boat_edge_v175_payout_bands.js assets/boat_edge_v108.js tests/test_v175_payout_bands.cjs index.html
          git diff --cached --quiet && { echo 'V175_ALREADY_APPLIED'; exit 0; }
          git commit -m 'V175 display verified 3-trifecta odds payout bands separately from scenario divergence'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then echo 'V175_UI_PATCH_PUSH_PASS'; exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          echo 'V175_PUSH_FAILED' >&2
          exit 1
