name: BOAT EDGE 01 - Controlled Pages Publisher (Migration Guarded)

# Preparation never changes the existing branch-based Pages source.
# Production publishing requires BOTH an explicit repository opt-in variable
# and GitHub Pages Settings > Build and deployment > Source: GitHub Actions.
on:
  pull_request:
    paths:
      - 'scripts/site_pages_stage.py'
      - 'tests/test_site_pages_stage.py'
      - '.github/workflows/boat-edge-controlled-pages.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/site_pages_stage.py'
      - 'tests/test_site_pages_stage.py'
      - '.github/workflows/boat-edge-controlled-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: boat-edge-01-controlled-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  stage:
    if: ${{ github.event_name != 'schedule' || vars.BOAT_EDGE_PAGES_ACTIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify closed formal gate and public staging regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_site_pages_stage.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/site_pages_stage.py
          cmp index.html _pages_site/index.html
          cmp data/today.json _pages_site/data/today.json
          cmp data/formal_status.json _pages_site/data/formal_status.json
          test ! -e _pages_site/data/raw
          test ! -e _pages_site/data/formal_predictions
          test ! -e _pages_site/scripts
          test ! -e _pages_site/.github
          echo "CONTROLLED_PAGES_STAGED_HEAD=$(git rev-parse HEAD)"
          echo "CONTROLLED_PAGES_STAGING_PASS"
      - name: Upload staged site for inspection and future Pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_site

  deploy:
    needs: stage
    if: >-
      ${{ github.ref == 'refs/heads/main'
          && vars.BOAT_EDGE_PAGES_ACTIONS_ENABLED == 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fail closed unless existing Pages site is configured for Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'BOAT-EDGE-controlled-pages',
          })
          with urllib.request.urlopen(req, timeout=20) as handle:
              page = json.load(handle)
          if page.get('build_type') != 'workflow':
              raise SystemExit('CONTROLLED_PAGES_NOT_ENABLED_IN_REPOSITORY_SETTINGS')
          print('CONTROLLED_PAGES_ACTIONS_SOURCE_VERIFIED')
          PY
      - name: Deploy the staged SHA using existing GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
