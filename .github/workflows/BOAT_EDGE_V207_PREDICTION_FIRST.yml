          for rel,(expected,*chunks) in assets.items():
              blob=gzip.decompress(base64.b64decode(''.join(chunks)))
              assert sha256(blob).hexdigest()==expected,(rel,'SHA_MISMATCH')
              path=Path(rel)
              if path.exists():
                  assert path.read_bytes()==blob,(rel,'CONFLICTING_EXISTING_ASSET')
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(blob)
          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          for x in ['boat_edge_v205_clean.js?v=205','boat_edge_v205_clean.css?v=205','boat_edge_v203_readable.js?v=203','boat_edge_v204_prediction.js?v=204']:
              assert x in text,('REQUIRED',x)
          csses=['boat_edge_v206_quickview.css?v=206','boat_edge_v207_first_prediction.css?v=207']
          jses=['boat_edge_v206_quickview.js?v=206','boat_edge_v207_first_prediction.js?v=207']
          assert text.count('</head>')==1 and text.count('</body>')==1,'INVALID_HTML'
          for asset in csses:
              tag=f'<link rel="stylesheet" href="./assets/{asset}">'
              assert text.count(tag)<=1,('DUPLICATE_CSS',asset)
              if tag not in text:text=text.replace('</head>',tag+'\n</head>')
          for asset in jses:
              tag=f'<script src="./assets/{asset}"></script>'
              assert text.count(tag)<=1,('DUPLICATE_JS',asset)
              if tag not in text:text=text.replace('</body>',tag+'\n</body>')
          assert all(text.count(f'./assets/{name}')==1 for name in csses+jses),'IMPORT_COUNT'
          assert text.index(jses[0])<text.index(jses[1]),'JS_ORDER'
          assert text.index(csses[0])<text.index(csses[1]),'CSS_ORDER'
          index.write_text(text,encoding='utf-8')
          print('V207_INDEX_SOURCE_BOUND_PASS')
