          PYVERIFY
            git add index.html assets/boat_edge_v206_quickview.js assets/boat_edge_v206_quickview.css assets/boat_edge_v207_first_prediction.js assets/boat_edge_v207_first_prediction.css
            python3 - <<'PYSTAGE'
          import subprocess
