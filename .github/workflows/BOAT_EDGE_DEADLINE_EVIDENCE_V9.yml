name: BOAT EDGE Deadline Evidence V9 (research, manual)
on:
  schedule:
    - cron: '45 22 * * *' # 07:45 JST primary research capture
    - cron: '15 23 * * *' # 08:15 JST backup if primary schedule is skipped
  workflow_dispatch:
    inputs:
      jst_date:
        description: Current JST date YYYYMMDD only
        required: true
        type: string
      all_races:
        description: Capture all 12 races per venue (research evidence only)
        required: false
        default: true
        type: boolean
      venues:
        description: Space-separated venue codes e.g. 01 02 03
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture official HTML only; no scoring
        shell: bash
        env:
          DAY: ${{ inputs.jst_date }}
          EVENT: ${{ github.event_name }}
          VENUES: ${{ inputs.venues }}
          ALL_RACES: ${{ inputs.all_races }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "schedule" ]]; then
            DAY="$(TZ=Asia/Tokyo date +%Y%m%d)"
            VENUES="$(printf '%02d ' {1..24})"
            ALL_RACES="false"
          fi
          test "$DAY" = "$(TZ=Asia/Tokyo date +%Y%m%d)"
          read -r -a VENUE_ARR <<< "$VENUES"
          ARGS=()
          if [[ "$ALL_RACES" == "true" ]]; then ARGS+=(--all-races); fi
          python scripts/deadline_v9/capture.py --date "$DAY" --venues "${VENUE_ARR[@]}" --outdir artifacts/snapshots --report artifacts/report.json "${ARGS[@]}"
      - name: Verify snapshot integrity (research only; fail closed)
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/report.json ]]; then
            python scripts/deadline_v9/verify_artifacts.py --root artifacts --report artifacts/report.json --output artifacts/integrity.json
          else
            echo '{"status":"LOCKED","reason":"NO_CAPTURE_REPORT","formal_eligible":false}' > artifacts/integrity.json
            exit 2
          fi
      - name: Classify no-data and late race pages (research only)
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/report.json ]]; then
            python scripts/deadline_v9/classify_pages.py --root artifacts --report artifacts/report.json --output artifacts/page_classification.json
          else
            mkdir -p artifacts
            python - <<'PY'
          import json
          from pathlib import Path
          result = {
              "schema": "V13_RESEARCH_ONLY",
              "capture_integrity": "LOCKED",
              "classifications": [],
              "counts": {},
              "reason": "NO_CAPTURE_REPORT",
              "formal_eligible": False,
              "results_seen": False,
              "scoring": "NOT_RUN",
              "unlock": "LOCKED",
          }
          Path("artifacts/page_classification.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf8"
          )
          PY
            exit 2
          fi
      - name: Record research capture provenance
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          provenance = {
              "schema": "V13_RESEARCH_RUN_PROVENANCE",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "git_sha": os.environ["HEAD_SHA"],
              "event": os.environ["EVENT_NAME"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "formal_eligible": False,
              "results_seen": False,
              "scoring": "NOT_RUN",
              "unlock": "LOCKED",
          }
          Path("artifacts/run_provenance.json").write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2) + "\n", encoding="utf8"
          )
          PY
      - name: Retain capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-v9-${{ inputs.jst_date }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
