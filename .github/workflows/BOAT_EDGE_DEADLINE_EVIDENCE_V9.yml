name: BOAT EDGE Deadline Evidence V9 (research, manual)
on:
  workflow_dispatch:
    inputs:
      jst_date:
        description: Current JST date YYYYMMDD only
        required: true
        type: string
      venues:
        description: Space-separated venue codes e.g. 01 02 03
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture official HTML only; no scoring
        shell: bash
        env:
          DAY: ${{ inputs.jst_date }}
          VENUES: ${{ inputs.venues }}
        run: |
          set -euo pipefail
          test "$DAY" = "$(TZ=Asia/Tokyo date +%Y%m%d)"
          read -r -a VENUE_ARR <<< "$VENUES"
          python scripts/deadline_v9/capture.py --date "$DAY" --venues "${VENUE_ARR[@]}" --outdir artifacts/snapshots --report artifacts/report.json
      - name: Retain capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-v9-${{ inputs.jst_date }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
