name: BOAT EDGE V90 Race Hub
on:
  push:
    paths: [".github/workflows/site-v90.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install V90 race hub
        shell: bash
        run: |
          cat > assets/boat_edge_v90.js <<'JS'
          /* BOAT_EDGE_V90_RACE_HUB */
          (()=>{"use strict";
          const $=s=>document.querySelector(s), E=x=>String(x??"－");
          async function J(u){let r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()}
          function dist(f){let a=f?.distribution120||f?.distribution_120||f?.all_combinations||f?.allCombinations||f?.trifecta_distribution||f?.probabilities;if(Array.isArray(a))return a.map(x=>({c:x.combo||x.combination||x.ticket,p:Number(x.probability??x.prob??x.p),r:x.reason||x.rationale||""})).filter(x=>x.c&&Number.isFinite(x.p)).sort((a,b)=>b.p-a.p);if(a&&typeof a==="object")return Object.entries(a).map(([c,v])=>({c,p:Number(typeof v==="object"?(v.probability??v.prob??v.p):v),r:typeof v==="object"?(v.reason||v.rationale||""):""})).filter(x=>Number.isFinite(x.p)).sort((a,b)=>b.p-a.p);return[]}
          function hub(){let rv=$("#raceView");if(!rv||$("#be90"))return;let x=document.createElement("section");x.id="be90";x.innerHTML='<div class="be90top"><button id="be90back">← ホーム</button><div><small>BOAT EDGE V90</small><h2 id="be90title">レース詳細</h2><p id="be90sub">読込待ち</p></div><button id="be90refresh">更新</button></div><div id="be90status"></div><div id="be90racers"></div><div id="be90pred"></div><div id="be90odds"></div><div id="be90result"></div>';rv.prepend(x);$("#be90back").onclick=()=>{rv.classList.remove("active");$("#homeView")?.classList.add("active");document.body.classList.remove("be48-race-active")};$("#be90refresh").onclick=()=>window.be90cur&&open(window.be90cur.f,window.be90cur.j)}
          async function open(f,j){hub();window.be90cur={f,j};$("#homeView")?.classList.remove("active");$("#raceView")?.classList.add("active");document.body.classList.add("be48-race-active");$("#be90status").textContent="最新データを読込中…";try{let d=await J(f),k=d.race_key||f.match(/(\d{8}-\d{2}-\d{2})/)?.[1],m=d.meta||{},[fp,o,res]=await Promise.all([J("./data/formal_predictions/"+k+".json").catch(()=>null),J("./data/site_odds/"+k+".json").catch(()=>null),J("./data/site_results/"+k+".json").catch(()=>null)]),a=dist(fp);$("#be90title").textContent=(m.venue||"")+" "+(m.race_no||"")+"R";$("#be90sub").textContent="締切 "+(m.deadline||"－")+" / "+(m.event||"");$("#be90status").innerHTML="<b>"+(a.length===120?"正式120確率 接続済み":"正式120確率 未接続")+"</b>　オッズ "+(o?.available_count??0)+"/120　結果 "+(res?.status==="confirmed"?"確定":"待ち");$("#be90racers").innerHTML="<h3>6艇比較</h3><div class=be90racers>"+(d.racers||[]).map(r=>"<div><b>"+r.lane+" "+E(r.name)+"</b><small>"+E(r.class)+" / ST "+E(r.avg_st)+"</small><span>全国 "+E(r.national?.win_rate)+"　当地 "+E(r.local?.win_rate)+"</span><span>M "+E(r.motor?.quinella_rate)+"%　B "+E(r.boat?.quinella_rate)+"%</span></div>").join("")+"</div>";$("#be90pred").innerHTML=a.length?"<h3>正式予想｜120通り確率順位</h3><div class=be90list>"+a.map((x,i)=>"<div><b>#"+(i+1)+"</b><strong>"+E(x.c)+"</strong><span>"+(x.p<=1?x.p*100:x.p).toFixed(2)+"%</span><small>"+E(x.r||"理由データ待ち")+"</small></div>").join("")+"</div>":"<div class=be90box><h3>正式予想</h3><b>最新120確率はまだ未接続</b><p>旧サイト簡易予想を最新予想として代用しません。</p></div>";let om=o?.trifecta_odds||{};$("#be90odds").innerHTML="<h3>3連単オッズ</h3><div class=be90odds>"+Object.entries(om).map(([c,v])=>"<div><b>"+c+"</b><span>"+v+"倍</span></div>").join("")+"</div>";$("#be90result").innerHTML=res?.status==="confirmed"?"<div class=be90box><h3>結果</h3><b>"+E(res.trifecta)+"</b>　"+(res.trifecta_payout_yen_per_100??"払戻取得待ち")+"</div>":"<div class=be90box><h3>結果</h3>確定待ち</div>"}catch(e){$("#be90status").textContent="読込エラー "+e.message}}
          document.addEventListener("click",e=>{let b=e.target.closest("[data-file]");if(!b)return;e.preventDefault();e.stopImmediatePropagation();open(b.dataset.file,b.dataset.jcd)},true);hub();window.BE90_OPEN=open;
          })();
          JS
          cat > assets/boat_edge_v90.css <<'CSS'
          #raceView.active>.race-head,#raceView.active>.race-tabs,#raceView.active>.tab-panel{display:none!important}#be90{max-width:780px;margin:auto;padding:14px 12px 110px;color:#12365f}.be90top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.be90top button{border:0;border-radius:12px;padding:10px;background:#edf5ff;color:#1264d9;font-weight:800}.be90top h2{margin:2px 0}.be90top p,.be90top small{margin:0;color:#71859c}#be90status{background:#fff;border:1px solid #dce7f5;border-radius:12px;padding:10px;margin:12px 0}.be90racers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.be90racers>div,.be90box{background:#fff;border:1px solid #dce7f5;border-radius:14px;padding:11px;display:grid;gap:4px}.be90racers small,.be90racers span{font-size:10px;color:#71859c}.be90list{background:#fff;border-radius:14px;overflow:hidden}.be90list>div{display:grid;grid-template-columns:36px 65px 65px 1fr;gap:6px;padding:9px;border-bottom:1px solid #edf2f8}.be90list small{color:#71859c}.be90odds{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.be90odds>div{background:#fff;border:1px solid #e1e9f3;border-radius:9px;padding:7px;display:flex;justify-content:space-between;font-size:10px}@media(max-width:520px){.be90odds{grid-template-columns:1fr 1fr}.be90list>div{grid-template-columns:30px 58px 58px 1fr}}
          CSS
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html");h=p.read_text()
          h=re.sub(r'\s*<script src=["\']\./assets/boat_edge_v90\.js(?:\?v=\d+)?["\']></script>\s*','\n',h)
          h=re.sub(r'\s*<link[^>]+boat_edge_v90\.css(?:\?v=\d+)?[^>]*>\s*','\n',h)
          h=h.replace("</head>",'<link rel="stylesheet" href="./assets/boat_edge_v90.css?v=90">\n</head>')
          h=h.replace("</body>",'<script src="./assets/boat_edge_v90.js?v=90"></script>\n</body>')
          h=re.sub(r'<meta name="boat-edge-site-version" content="[^"]+">','<meta name="boat-edge-site-version" content="V90-RACE-HUB">',h)
          p.write_text(h)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node --check assets/boat_edge_v90.js
          grep -q 'V90-RACE-HUB' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/boat_edge_v90.js assets/boat_edge_v90.css
          git diff --cached --quiet && exit 0
          git commit -m "Add BOAT EDGE V90 race hub"
          git push
