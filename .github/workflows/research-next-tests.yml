name: Next research framework tests
on:
  push:
    paths:
      - 'research_next/**'
      - '.github/workflows/research-next-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research_next -p 'test_*.py' -v
