name: BOAT EDGE V228 - Safe Autonomous Site and AI Pre-Result Freeze

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V228_SITE_AI_AUTOPILOT.yml']
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v228-safe-pre-result-autopilot
  cancel-in-progress: false

jobs:
  install-monitoring-page:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore checksum-verified monitoring scripts and mobile UI (not models)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V227_INSTALL'
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          payloads = {
            'scripts/boat_edge_v227_autopilot.py': ('cec5de83e7125fd89a062d7dedde755337329b885e7ee3dd6e1af59ad0bd56fd', ''),
            'tests/test_boat_edge_v227_autopilot.py': ('468a214b9e4e2103ddbf5adc09ed130f8f940422c546635ed8691871b7d20d2e', ''),
            'autopilot.html': ('68a499385e858490e9e3ef95486d63704f43a00e53ad85dd11099f51581b019c', ''),
            'scripts/boat_edge_v228_freeze_only.py': ('964b35bc7636ceb68fb1f4d5b36977c49a376dbe3d1d71193571bd957c2ff313', ''),
            'tests/test_boat_edge_v228_freeze_only.py': ('5b7992fed30b172d1de1678f612e0ad9f11f5c6dcb5d4ee625139624a55f0df4', ''),
          }
          def restore(name, info):
              expected, encoded=info
              content=gzip.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(content).hexdigest()==expected, 'V227_PAYLOAD_SHA_MISMATCH'
              dest=Path(name)
              if dest.exists():
                  assert dest.read_bytes()==content, 'V227_EXISTING_FILE_DRIFT_NO_OVERWRITE_'+name
                  print('V227_ALREADY_INSTALLED',name)
                  return
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(content)
              print('V227_INSTALLED',name)
          for path,blob in payloads.items():restore(path,blob)

          # Add one small navigation link to the existing 50k/day paper-simulation page.
          # Do not touch homepage prediction widgets, workflow files, models or formal assets.
          page=Path('ai-simulation.html')
          old_sha='a786c2e8950cd159432644ada10451a9d72c51f6'
          expected_anchor='<a href="./ai-simulation-20261008.html">10/8検証 ↗</a>'
          stamp='<!-- BOAT_EDGE_V227_STATUS_NAV -->'
          if page.exists():
              body=page.read_text(encoding='utf-8')
              if stamp in body:
                  assert body.count(stamp)==1 and body.count('href="./autopilot.html"')==1, 'V227_NAV_DRIFT'
                  print('V227_NAV_ALREADY_INSTALLED')
              elif subprocess.check_output(['git','hash-object',str(page)],text=True).strip()==old_sha and body.count(expected_anchor)==1:
                  body=body.replace(expected_anchor,stamp+'<a href="./autopilot.html">サイト・AI自走状況 ↗</a>'+expected_anchor)
                  page.write_text(body,encoding='utf-8')
                  print('V227_NAV_INSTALLED')
              else:
                  # The independent autopilot.html is still accessible by URL.
                  # Never overwrite a concurrently redesigned simulation page.
                  print('V227_NAV_SKIPPED_UNKNOWN_HTML_SHA')
          PY_V227_INSTALL
      - name: Offline regressions, no network or result access
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v227_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v228_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY_V227_CHECK'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/boat_edge_v227_autopilot.py').read_text())
          ui=Path('autopilot.html').read_text()
          for marker in ('AI予想の自走検証','自走状況','site_autopilot/v227_current.json','site_autovalidation/current.json','ai-simulation.html'):
              assert marker in ui, 'V227_REQUIRED_UI_MISSING_'+marker
          assert 'http://' not in ui and 'https://' not in ui, 'V227_UI_EXTERNAL_DEPENDENCY_NOT_ALLOWED'
          print('V227_CHECKSUM_SAFETY_UI_TEST_PASS')
          PY_V227_CHECK
          git diff --check
      - name: Freeze ONLY eligible site-reference predictions before deadline without any result/formal read
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v228_freeze_only.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v227_autopilot.py
          python3 - <<'PY_V228_CONFIRM'
          from pathlib import Path
          import json
          data=json.loads(Path('data/site_autopilot/v227_current.json').read_text(encoding='utf8'))
          assert data['schema']=='BOAT_EDGE_V227_SITE_AI_SELF_DRIVE_STATUS_V1'
          assert data['formal']['guard_closed'] is True
          assert data['formal']['results_read_by_v227'] is False
          assert data['prediction']['model_auto_promotion'] is False
          assert data['paper']['real_purchases_enabled'] is False
          print('V228_SITE_AUTOPILOT_MONITORING_AND_PRE_RESULT_SAFE_FREEZE_PASS')
          PY_V228_CONFIRM
          git diff --check
      - name: Commit only monitored site/UI/test files; no workflow rewrites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- autopilot.html ai-simulation.html scripts/boat_edge_v227_autopilot.py tests/test_boat_edge_v227_autopilot.py scripts/boat_edge_v228_freeze_only.py tests/test_boat_edge_v228_freeze_only.py data/site_autopilot/v227_current.json
          git add -A -- data/site_prediction_snapshots/
          git diff --cached --quiet && { echo V228_SITE_AND_AI_ALREADY_CURRENT; exit 0; }
          git diff --cached --name-only | while IFS= read -r f; do
            case "$f" in
              autopilot.html|ai-simulation.html|scripts/boat_edge_v227_autopilot.py|tests/test_boat_edge_v227_autopilot.py|scripts/boat_edge_v228_freeze_only.py|tests/test_boat_edge_v228_freeze_only.py|data/site_autopilot/v227_current.json) ;;
              data/site_prediction_snapshots/20??????-??-??.json|data/site_prediction_snapshots/odds_v214/20??????-??-??-*.json) ;;
              *) echo "V227_UNAPPROVED_INSTALL_FILE: $f" >&2; exit 1;;
            esac
          done
          git commit -m 'V228 first-freeze source-proven site picks and show independent AI autopilot status'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then echo V228_SITE_AND_AI_PUBLISHED; exit 0; fi
            sleep 2
          done
          echo V228_INSTALL_PUSH_BLOCKED_NO_DEPLOYMENT_CLAIM >&2
          exit 1
