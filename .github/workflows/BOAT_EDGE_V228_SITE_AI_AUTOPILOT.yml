name: BOAT EDGE V228 - Safe Autonomous Site and AI Pre-Result Freeze

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V228_SITE_AI_AUTOPILOT.yml']
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v228-safe-pre-result-autopilot
  cancel-in-progress: false

jobs:
  install-monitoring-page:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate V228 tracked main sources and existing UI without legacy bootstrap
        shell: bash
        run: |
          set -euo pipefail
          # The old gzip/HTML installer compared today's tracked UI and source
          # against an immutable historical bundle, blocking legitimate updates.
          # All assets already exist in main; reject missing files, not newer code.
          for path in scripts/boat_edge_v227_autopilot.py tests/test_boat_edge_v227_autopilot.py autopilot.html scripts/boat_edge_v228_freeze_only.py tests/test_boat_edge_v228_freeze_only.py ai-simulation.html; do
            git ls-files --error-unmatch "$path" >/dev/null
            test -s "$path"
          done
          python3 - <<'PY_V228_CURRENT'
          from pathlib import Path
          page=Path('ai-simulation.html').read_text(encoding='utf-8')
          assert page.count('BOAT_EDGE_V227_STATUS_NAV')==1, 'V228_CURRENT_NAV_STAMP_UNVERIFIED'
          assert page.count('href="./autopilot.html"')==1, 'V228_CURRENT_AUTOPILOT_LINK_UNVERIFIED'
          print('V228_TRACKED_SOURCES_AND_CURRENT_UI_NAV_PASS')
          PY_V228_CURRENT

      - name: Offline regressions, no network or result access
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v227_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v228_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY_V227_CHECK'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/boat_edge_v227_autopilot.py').read_text())
          ui=Path('autopilot.html').read_text()
          for marker in ('AI予想の自走検証','自走状況','site_autopilot/v227_current.json','site_autovalidation/current.json','ai-simulation.html'):
              assert marker in ui, 'V227_REQUIRED_UI_MISSING_'+marker
          assert 'http://' not in ui and 'https://' not in ui, 'V227_UI_EXTERNAL_DEPENDENCY_NOT_ALLOWED'
          print('V227_CHECKSUM_SAFETY_UI_TEST_PASS')
          PY_V227_CHECK
          git diff --check
      - name: Freeze ONLY eligible site-reference predictions before deadline without any result/formal read
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v228_freeze_only.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v227_autopilot.py
          python3 - <<'PY_V228_CONFIRM'
          from pathlib import Path
          import json
          data=json.loads(Path('data/site_autopilot/v227_current.json').read_text(encoding='utf8'))
          assert data['schema']=='BOAT_EDGE_V227_SITE_AI_SELF_DRIVE_STATUS_V1'
          assert data['formal']['guard_closed'] is True
          assert data['formal']['results_read_by_v227'] is False
          assert data['prediction']['model_auto_promotion'] is False
          assert data['paper']['real_purchases_enabled'] is False
          print('V228_SITE_AUTOPILOT_MONITORING_AND_PRE_RESULT_SAFE_FREEZE_PASS')
          PY_V228_CONFIRM
          git diff --check
      - name: Commit only monitored site/UI/test files; no workflow rewrites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- autopilot.html ai-simulation.html scripts/boat_edge_v227_autopilot.py tests/test_boat_edge_v227_autopilot.py scripts/boat_edge_v228_freeze_only.py tests/test_boat_edge_v228_freeze_only.py data/site_autopilot/v227_current.json
          git add -A -- data/site_prediction_snapshots/
          git diff --cached --quiet && { echo V228_SITE_AND_AI_ALREADY_CURRENT; exit 0; }
          git diff --cached --name-only | while IFS= read -r f; do
            case "$f" in
              autopilot.html|ai-simulation.html|scripts/boat_edge_v227_autopilot.py|tests/test_boat_edge_v227_autopilot.py|scripts/boat_edge_v228_freeze_only.py|tests/test_boat_edge_v228_freeze_only.py|data/site_autopilot/v227_current.json) ;;
              data/site_prediction_snapshots/20??????-??-??.json|data/site_prediction_snapshots/odds_v214/20??????-??-??-*.json) ;;
              *) echo "V227_UNAPPROVED_INSTALL_FILE: $f" >&2; exit 1;;
            esac
          done
          git commit -m 'V228 first-freeze source-proven site picks and show independent AI autopilot status'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then echo V228_SITE_AND_AI_PUBLISHED; exit 0; fi
            sleep 2
          done
          echo V228_INSTALL_PUSH_BLOCKED_NO_DEPLOYMENT_CLAIM >&2
          exit 1
