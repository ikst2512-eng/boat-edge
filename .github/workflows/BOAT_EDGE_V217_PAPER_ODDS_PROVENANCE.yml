name: BOAT EDGE V217 - Verify Frozen Odds Before Paper Decisions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V217_PAPER_ODDS_PROVENANCE.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v217-paper-odds-source-audit
  cancel-in-progress: false

jobs:
  install-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

