      - name: Install exact-source odds guard, regress and commit without modifying workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 /tmp/v217_patch.py
            mkdir -p tests
            if [ -e tests/test_v217_odds_guard.py ] && ! cmp -s tests/test_v217_odds_guard.py /tmp/v217_test.py; then
              echo 'V217_TEST_CONFLICT_FAIL_CLOSED'; exit 1
            fi
            cp /tmp/v217_test.py tests/test_v217_odds_guard.py
            python3 -m py_compile scripts/boat_edge_v211_paper_sim.py tests/test_v217_odds_guard.py
            python3 tests/test_v217_odds_guard.py
            git add -- scripts/boat_edge_v211_paper_sim.py tests/test_v217_odds_guard.py
            if git diff --cached --quiet; then
              echo 'V217_ALREADY_INSTALLED_TESTS_PASS'; exit 0
            fi
            git commit -m 'V217 paper simulation requires immutable SHA-matched pre-result odds evidence'
            if git push origin HEAD:main; then
              echo 'V217_COMMIT_SUCCESS_TESTS_PASS'; exit 0
            fi
            if [ "$attempt" = 8 ]; then
              echo 'V217_PUSH_RETRY_EXHAUSTED'; exit 1
            fi
          done
