name: BOAT EDGE V232 - Independent Pre-Result Accuracy Cohort

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V232_PROSPECTIVE_COHORT.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['BOAT EDGE V231 - Byte-Exact Official Evidence and Reliable Atomic Commit']
    types: [completed]
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v232-safe-site-only-evidence
  cancel-in-progress: false

jobs:
  freeze-independent-cohort:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate V232 tracked main sources and existing UI without legacy bootstrap
        shell: bash
        run: |
          set -euo pipefail
          # The old gzip/HTML installer compared today's tracked UI and source
          # against an immutable historical bundle, blocking legitimate updates.
          # All assets already exist in main; reject missing files, not newer code.
          for path in scripts/boat_edge_v232_pre_result_cohort.py tests/test_boat_edge_v232_pre_result_cohort.py cohort.html autopilot.html; do
            git ls-files --error-unmatch "$path" >/dev/null
            test -s "$path"
          done
          python3 - <<'PY_V232_CURRENT'
          from pathlib import Path
          page=Path('autopilot.html').read_text(encoding='utf-8')
          assert page.count('<a href="./cohort.html">未見予想の検証</a>')==1, 'V232_CURRENT_NAV_UNVERIFIED'
          print('V232_TRACKED_SOURCES_AND_CURRENT_UI_NAV_PASS')
          PY_V232_CURRENT

      - name: Validate exact original V214 and V215 before using pre-result routines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/boat_edge_v214_shadow.py)" = '2fafe6932383c0ace68d82d3cc2591591b6affdb'
          test "$(git hash-object scripts/boat_edge_v215_readiness.py)" = '01da1001eeb628b6733af4d62fb089b002a370c1'
          python3 -m py_compile scripts/boat_edge_v232_pre_result_cohort.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v232_pre_result_cohort.py' -v
          python3 - <<'PY_V232_VALIDATE'
          from pathlib import Path
          s=Path('scripts/boat_edge_v232_pre_result_cohort.py').read_text()
          assert "'data/site_results'" not in s and "'data/formal_predictions'" not in s
          html=Path('cohort.html').read_text()
          assert '未見予想の検証台帳' in html and 'v232_current.json' in html
          assert Path('autopilot.html').read_text().count('<a href="./cohort.html">未見予想の検証</a>')==1
          print('V232_UNIT_AND_SITE_UI_PASS_12')
          PY_V232_VALIDATE
      - name: Freeze source-bound Top1-head Top3 Top5 Top10 and 10-20x research BEFORE results
        shell: bash
        run: |
          set -euo pipefail
          # This command never reads site results, payout, or formal prediction files.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v232_pre_result_cohort.py
          # Update existing V215 readiness so its visible status does not stay stale.
          # Uses the original pinned script's PRE_RESULT diagnostics only.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v215_readiness.py
          # Legacy 8-25x raw-EV research remains distinct from general accuracy cohort.
          # Only run 'freeze', NOT settle/report, and never start a paper purchase.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v214_shadow.py freeze
          python3 - <<'PY_V232_SAFETY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/site_autopilot/v232_current.json').read_text())
          assert d['schema']=='BOAT_EDGE_V232_SITE_PROSPECTIVE_COHORT_SUMMARY_V1'
          assert d['accuracy_improvement_proven'] is False
          assert d['formal_scoring_unlocked'] is False
          assert d['real_or_paper_wagers_placed']==0
          print('V232_GUARDS_AND_ACCURACY_SCOPE_CONFIRMED',d['frozen_research_races_today'])
          PY_V232_SAFETY
      - name: Commit only frozen PRE_RESULT cohorts and already-established readiness fields
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/boat_edge_v232_pre_result_cohort.py tests/test_boat_edge_v232_pre_result_cohort.py cohort.html autopilot.html data/site_autopilot/v232_current.json
          if test -d data/site_autopilot/v232_cohort; then git add -A -- data/site_autopilot/v232_cohort/; fi
          git add -A -- data/site_paper_sim/readiness_v215_current.json data/site_paper_sim/readiness_history_v215/ data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
          python3 - <<'PY_V232_PATHS'
          import subprocess,re
          allow={
           'scripts/boat_edge_v232_pre_result_cohort.py','tests/test_boat_edge_v232_pre_result_cohort.py',
           'cohort.html','autopilot.html','data/site_autopilot/v232_current.json',
           'data/site_paper_sim/readiness_v215_current.json',
           'data/site_paper_sim/shadow_v213_current.json',
           'data/site_paper_sim/shadow_v213_ledger.json',
          }
          for path in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              if path in allow:continue
              if re.fullmatch(r'data/site_autopilot/v232_cohort/20\d{6}-\d{2}-\d{2}\.json',path):continue
              if re.fullmatch(r'data/site_paper_sim/readiness_history_v215/20\d{6}\.json',path):continue
              raise SystemExit('V232_UNAPPROVED_GIT_STAGE_'+path)
          print('V232_APPROVED_ONLY_PRE_RESULT_STAGING')
          PY_V232_PATHS
          git diff --cached --check
          if git diff --cached --quiet; then echo V232_NO_NEW_EVIDENCE_DID_NOT_BACKFILL; exit 0; fi
          git commit -m 'V232 independently freeze validated site-only head Top3 Top5 Top10 research'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then echo V232_SITE_ACCURACY_EVIDENCE_PUBLISHED; exit 0; fi
            sleep 2
          done
          echo V232_PUSH_FAILED_NO_SUCCESS_CLAIM >&2
          exit 1
