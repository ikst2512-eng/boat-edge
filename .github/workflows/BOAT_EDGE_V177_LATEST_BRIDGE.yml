name: BOAT EDGE V177 - Approved Latest Prediction Site Bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V177_LATEST_BRIDGE.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-edge-v177-bridge
  cancel-in-progress: false
jobs:
  guard-and-sync-ui:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Restore hash-checked V177 bridge, strict contract, tests and patch site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import base64,gzip,hashlib,json
          bundles=json.loads('{"assets/boat_edge_v177_latest_bridge.js": {"sha256": "83cef8a972a00c7baab890a4ca1faae81d2d66b69931d504fdd2f841f6b1e044", "payload": ""}, "tests/test_v177_latest_bridge.cjs": {"sha256": "9a319164114a43c3336ea5021272d3e92e09cb96b8efce71ee94f1ed4cbeb483", "payload": ""}, "data/site_latest_bridge_contract.json": {"sha256": "527f62e9c0600e0437616d7195ed4d7386a024fb2018c6510f741a597ea360d9", "payload": ""}}')
          for rel,v in bundles.items():
              raw=gzip.decompress(base64.b64decode(v['payload']))
              assert hashlib.sha256(raw).hexdigest()==v['sha256'],f'SHA_ERROR {rel}'
              path=Path(rel);path.parent.mkdir(parents=True,exist_ok=True)
              if path.exists() and path.read_bytes()!=raw:
                  raise SystemExit('V177_FILE_CONFLICT '+rel)
              path.write_bytes(raw)
          p=Path('index.html');source=p.read_text(encoding='utf-8')
          # Existing external formal reader must never accept unapproved/unverified files.
          old='''      const raw=await r.json();
                const norm=normalizeFormalOverlay(raw);'''
          new='''      const raw=await r.json();
                if(!window.BoatEdgeV177?.acceptRaw?.(raw,raceKey,state.formal))continue;
                const norm=normalizeFormalOverlay(raw);'''
          if old in source:
              assert source.count(old)==1,'V177_AMBIGUOUS_OVERLAY_PATCH'
              source=source.replace(old,new,1)
          elif new not in source:raise SystemExit('V177_UNEXPECTED_OVERLAY_LOADER')
          # Refresh formal gate status when a race is selected, so a newly approved
          # race is accepted without needing an unrelated page refresh.
          old_race='''    const overlay=await loadFormalOverlay(race.race_key);
              race=mergeFormalOverlay(race,overlay);'''
          new_race='''    await refreshFormalStatus();
              const overlay=await loadFormalOverlay(race.race_key);
              race=mergeFormalOverlay(race,overlay);'''
          if old_race in source:
              assert source.count(old_race)==1,'V177_AMBIGUOUS_RACE_REFRESH'
              source=source.replace(old_race,new_race,1)
          elif new_race not in source:raise SystemExit('V177_UNEXPECTED_RACE_LOAD')
          old='''function hasFormalPrediction(d){
            const der=d?.derived||{};
            const worlds=[der.world_a,der.world_b,der.pattern_a,der.pattern_b].filter(Boolean);
            const ticketsReady=worlds.some(w => (w?.tickets||w?.bets||w?.combinations||[]).length);
            const g=d?.formal_meta?.guards || d?.derived?.guards || null;
            const guardOK=!g || (g.results_seen===false && g.scoring!==true);
            return ticketsReady && guardOK;
          }'''
          new='''function hasFormalPrediction(d){
            return window.BoatEdgeV177?.acceptNormalized?.(d,state.formal)===true;
          }'''
          if old in source:
              assert source.count(old)==1,'V177_AMBIGUOUS_FORMAL_GUARD'
              source=source.replace(old,new,1)
          elif new not in source:raise SystemExit('V177_UNEXPECTED_FORMAL_GUARD')
          tag='<script src="./assets/boat_edge_v177_latest_bridge.js?v=177"></script>'
          if tag not in source:
              assert source.count('</body>')==1,'V177_AMBIGUOUS_SCRIPT_INJECTION'
              source=source.replace('</body>',tag+'\n</body>')
          assert source.count(tag)==1
          p.write_text(source,encoding='utf-8')
          # Must keep all existing site mode and odds plugins; never alter ranking/engine.
          assert 'boat_edge_v174_confidence.js?v=174' in source
          assert 'boat_edge_v175_payout_bands.js?v=175' in source
          print('V177_APPROVED_BRIDGE_PATCH_PASS')
          PY_PATCH
      - name: Test approval isolation and preserve existing site prediction
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/boat_edge_v177_latest_bridge.js
          node tests/test_v177_latest_bridge.cjs
          python3 - <<'PY_CONTRACT'
          import json
          from pathlib import Path
          c=json.loads(Path('data/site_latest_bridge_contract.json').read_text())
          assert c['research_only']['V176']=='DO_NOT_PROMOTE'
          assert c['site_reference']['odds_rank_weight'] is False
          f=json.loads(Path('data/formal_status.json').read_text())
          if not(f.get('connected') and f.get('predictions_ready')):
              print('V177_FORMAL_WAITING_NOT_PRETENDING_READY')
          assert not Path('data/formal_predictions').exists() or all(p.is_file() for p in Path('data/formal_predictions').glob('*.json'))
          print('V177_NO_WEIGHTS_NO_FROZEN_PREDICTION_CHANGE_PASS')
          PY_CONTRACT
          git diff --check
      - name: Commit only site consumer contract and display changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/boat_edge_v177_latest_bridge.js data/site_latest_bridge_contract.json tests/test_v177_latest_bridge.cjs
          python3 - <<'PY_STAGE'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'index.html','assets/boat_edge_v177_latest_bridge.js','data/site_latest_bridge_contract.json','tests/test_v177_latest_bridge.cjs'}
          if not actual.issubset(allowed):raise SystemExit('V177_WRONG_PATH '+str(actual))
          print('V177_STAGED',sorted(actual))
          PY_STAGE
          if git diff --cached --quiet; then echo V177_ALREADY_APPLIED; exit 0; fi
          git commit -m 'V177 guard formal current activation and expose latest model version on site'
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then echo V177_SITE_BRIDGE_COMMITTED; exit 0; fi
            git fetch origin main
            git rebase origin/main
            node tests/test_v177_latest_bridge.cjs
            sleep 2
          done
          echo V177_PUSH_FAILED >&2
          exit 1
