name: BOAT EDGE V240 - Effective Second Coverage Prospective Ten Point Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v240.yml']
  workflow_dispatch:
  # 01 runtime dedup: five-minute prospective schedule remains the owner.
  # V235 also runs frequently; a workflow_run relay doubled research jobs,
  # commits and automatic Pages builds without improving freeze cadence.
  schedule:
    # Keep the five-minute PRE_RESULT freeze cadence; score older SITE-only
    # frozen cohorts on one staggered 15-minute tick to reduce Pages churn.
    - cron: '1,16,31,46 0-14,23 * * *'
    - cron: '6,21,36,51 0-14,23 * * *'
    - cron: '11,26,41,56 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v240-independent-site-only-coverage
  cancel-in-progress: false

jobs:
  guarded-v240-site-shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout full history for source provenance
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install exact-pinned resources and run safety regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v240_install.py" <<'PY_INSTALL_V240'
          import json,gzip,hashlib,base64
          from pathlib import Path
          resources=json.loads(r'{"scripts/boat_edge_v240_coverage.py":{"sha256":"81f69e77156167da009b911636b60a72affca7994558f89f571cef68cb0d74cd","gz":""},"tests/test_boat_edge_v240_coverage.py":{"sha256":"18277cc185b7e14b57c1d5cf2421c4ce7a3bf76df995444a11629e872da29e7b","gz":""},"second-coverage.html":{"sha256":"9875676f3481d75790f7b97ef1abdc2d1eba7d0079678dee8b418d94dc8a22a9","gz":""}}')
          for name,item in resources.items():
              b=gzip.decompress(base64.b64decode(item['gz']))
              if hashlib.sha256(b).hexdigest()!=item['sha256']:
                  raise SystemExit('V240_PACKAGED_SHA_INVALID_'+name)
              p=Path(name)
              if p.exists():
                  if p.read_bytes()!=b:
                      raise SystemExit('V240_EXISTING_PRODUCTION_SOURCE_DRIFT_'+name)
              else:
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(b)
                  print('V240_INSTALLED_RESOURCE',name)
          print('V240_PACKAGED_CONTENT_PASS',len(resources))
          PY_INSTALL_V240
          python3 "$RUNNER_TEMP/v240_install.py"
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v240_coverage.py' -q
          python3 -m py_compile scripts/boat_edge_v240_coverage.py
          echo V240_FOURTEEN_FAIL_CLOSED_REGRESSIONS_PASS
      - name: Freeze pre-result alternatives only; commit source bytes separately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v240_frozen data/site_autopilot/v240_pre_current.json
            python3 "$RUNNER_TEMP/v240_install.py"
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v240_coverage.py freeze
            git add -- scripts/boat_edge_v240_coverage.py tests/test_boat_edge_v240_coverage.py second-coverage.html
            if test -f data/site_autopilot/v240_pre_current.json; then git add -- data/site_autopilot/v240_pre_current.json; fi
            if test -d data/site_autopilot/v240_frozen; then git add -A -- data/site_autopilot/v240_frozen; fi
            python3 - <<'PY_V240_STAGE_PRE'
          import re,subprocess
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'scripts/boat_edge_v240_coverage.py','tests/test_boat_edge_v240_coverage.py','second-coverage.html','data/site_autopilot/v240_pre_current.json'}
          for path in staged:
              if path in allowed or re.fullmatch(r'data/site_autopilot/v240_frozen/20\d{6}-\d{2}-\d{2}\.json',path):continue
              raise SystemExit('V240_PRE_RESULT_UNEXPECTED_PATH_'+path)
          print('V240_SOURCE_STAGING_GUARD_PASS',len(staged))
          PY_V240_STAGE_PRE
            git diff --cached --check
            if git diff --cached --quiet; then echo V240_NO_NEW_PRE_RESULT_STATE; success=true; break; fi
            git commit -m 'V240 prospective second coverage frozen site-only research'
            if git push origin HEAD:main; then echo V240_FROZEN_GIT_ATTESTED; success=true; break; fi
            echo "V240_RETRY_PRE_RESULT_${attempt}"
          done
          if test "$success" != true; then echo V240_PRE_RESULT_PUBLISH_FAILED; exit 1; fi
      # Previous Git-attested SITE cohorts can be scored later; never delay
      # the five-minute, result-unseen prospective freeze above.
      - name: Post-result score from earlier Git-frozen rows only
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '11,26,41,56 0-14,23 * * *') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v240_scored data/site_autopilot/v240_score_current.json
            python3 "$RUNNER_TEMP/v240_install.py"
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v240_coverage.py score
            if test -f data/site_autopilot/v240_score_current.json; then git add -- data/site_autopilot/v240_score_current.json; fi
            if test -d data/site_autopilot/v240_scored; then git add -A -- data/site_autopilot/v240_scored; fi
            python3 - <<'PY_V240_STAGE_POST'
          import re,subprocess
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for path in staged:
              if path=='data/site_autopilot/v240_score_current.json' or re.fullmatch(r'data/site_autopilot/v240_scored/20\d{6}-\d{2}-\d{2}\.json',path):continue
              raise SystemExit('V240_POST_RESULT_UNEXPECTED_PATH_'+path)
          print('V240_SCORE_STAGING_GUARD_PASS',len(staged))
          PY_V240_STAGE_POST
            git diff --cached --check
            if git diff --cached --quiet; then echo V240_NO_NEW_SCORE_YET; success=true; break; fi
            git commit -m 'V240 verified site-only paired coverage score'
            if git push origin HEAD:main; then echo V240_SCORING_GIT_PUBLISHED; success=true; break; fi
            echo "V240_RETRY_SCORE_${attempt}"
          done
          if test "$success" != true; then echo V240_POST_RESULT_PUBLISH_FAILED; exit 1; fi
