name: BOAT EDGE V351 Actions Evidence (read-only)

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      c1_day:
        description: 'C1 audit day (YYYYMMDD); default yesterday'
        required: false
        default: 'yesterday'
        type: string
      max_pages:
        description: 'Pages of scheduled runs to inspect (1-20, 100/page)'
        required: true
        default: '20'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
          - '20'

permissions:
  actions: read
  contents: read

concurrency:
  group: boat-edge-v350-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-scheduled-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout read-only code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export scheduled run metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_PAGES: ${{ github.event_name == 'schedule' && '20' || inputs.max_pages || '3' }}
          C1_DAY: ${{ inputs.c1_day || 'yesterday' }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 scripts/boat_edge_v348_actions_run_export.py --repo "$REPO" --max-pages "$MAX_PAGES" > evidence/v348-scheduled-runs.json
          python3 scripts/boat_edge_v349_schedule_run_overlap.py evidence/v348-scheduled-runs.json > evidence/v349-temporal-hints.json
          # Read-only event pressure, including skipped/cancelled workflow_run.
          python3 scripts/boat_edge_v348_actions_run_export.py --repo "$REPO" --max-pages "$MAX_PAGES" --event all > evidence/v352-all-events.json
          python3 scripts/boat_edge_v352_action_pressure.py evidence/v352-all-events.json > evidence/v352-event-pressure.json
          # C1 yesterday's missed save-window run starts; never a writer.
          python3 scripts/boat_edge_01_gate1c_actions_window_audit.py --repo "$REPO" --day "$C1_DAY" --max-pages "$MAX_PAGES" > evidence/c1-missed-freeze-action-windows.json
          # Historical comparison on schedule or explicit 20261019 manual audit; read-only.
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$C1_DAY" == "20261019" ]]; then
            python3 scripts/boat_edge_01_gate1c_actions_window_audit.py --repo "$REPO" --day 20261019 --catalog-git-sha 88051a336dee27b5175f797598b31d110b17db10 --max-pages "$MAX_PAGES" > evidence/c1-20261019-actions-windows.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path("evidence/v348-scheduled-runs.json").read_text())
          report=json.loads(Path("evidence/v349-temporal-hints.json").read_text())
          pressure=json.loads(Path("evidence/v352-event-pressure.json").read_text())
          missed=json.loads(Path("evidence/c1-missed-freeze-action-windows.json").read_text())
          print("C1 audit day:", missed["day_jst"])
          print("Scheduled runs retrieved:", raw["run_count"])
          print("Same-start hints:", len(report["same_start_candidate_pairs"]))
          print("Duplicate writes proven:", report["duplicate_writes_proven"])
          print("Workflow disable authorized:", report["workflow_disable_authorized"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## BOAT EDGE scheduled-run evidence (read-only)\n\n")
              summary.write(f"- Scheduled runs retrieved: **{raw['run_count']}**\n")
              summary.write(f"- Same-start hints (not proof): **{len(report['same_start_candidate_pairs'])}**\n")
              summary.write("- Duplicate-write verification: **NOT ASSESSED** (this collector has no changed-file proof)\n")
              summary.write("- Workflow disable authorized: **No**\n")
              summary.write("- Coverage: paginated metadata only; no proven changed paths or completion times.\n")
              summary.write("- Detailed JSON is uploaded as a 14-day artifact.\n")
              summary.write(f"- All-event records including skipped/cancelled: **{pressure['run_records']}**\n")
              summary.write(f"- Observed five-minute windows: **{pressure['windows_observed']}**\n")
              for item in pressure["busiest_five_minute_windows"][:3]:
                  summary.write(f"- {item['window_start_utc']}: {item['run_count']} runs, {item['capture_owner_skipped']} capture-owner skips, {item['capture_owner_cancelled']} capture-owner cancels\n")
              summary.write("- Metadata-only and paginated: neither duplicate writes nor source eligibility are proven.\n")
              summary.write(f"- C1 audit day: **{missed['day_jst']}**\n")
              summary.write(f"- C1 observed matured races with existing snapshots: **{missed['observed_matured_with_existing_snapshot']}**\n")
              summary.write(f"- C1 observed matured missed snapshots: **{missed['observed_matured_missing_snapshots']}**\n")
              summary.write(f"- C1 fully checked Action start windows: **{missed['complete_window_queries']}**\n")
              summary.write(f"- C1 incomplete Action start windows: **{missed['incomplete_window_queries']}**\n")
              summary.write("\n### C1 missing-freeze race classifications\n\n")
              summary.write("| Race | Deadline (JST) | Actions history | Classification |\n")
              summary.write("| --- | --- | --- | --- |\n")
              for race in missed["races"]:
                  complete = "complete" if race["run_history_complete_for_window"] else "UNVERIFIED"
                  summary.write(f"| `{race['race_key']}` | {race['deadline_jst']} | {complete} | `{race['classification']}` |\n")
              historical_path = Path("evidence/c1-20261019-actions-windows.json")
              if historical_path.is_file():
                  historical = json.loads(historical_path.read_text())
                  summary.write("\\n### C1 Oct 19 full-catalog coverage\\n\\n")
                  summary.write(f"- Catalog matured races: **{historical[\'catalog_matured_races\']}**\\n")
                  summary.write(f"- Catalog missing snapshots: **{historical[\'catalog_matured_missing_snapshots\']}**\\n")
                  summary.write(f"- Unobserved and missing: **{historical[\'catalog_unobserved_missing_snapshots\']}**\\n")
                  summary.write(f"- Complete Actions windows: **{historical[\'complete_window_queries\']}**\\n")
                  summary.write(f"- Incomplete Actions windows: **{historical[\'incomplete_window_queries\']}**\\n")
                  summary.write("- Eligibility denominator / 99%: **NOT PROVEN**\\n")
              summary.write("- C1 independent source eligibility / 99%: **NOT PROVEN**\n")
          PY
      - name: Upload evidence (no repository commit)
        uses: actions/upload-artifact@v4
        with:
          name: boat-edge-v350-scheduled-run-evidence
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 14
