name: BOAT EDGE V216 - Identify Exact Pre-Deadline Source Gaps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V216_SOURCE_DIAGNOSTIC.yml'
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v216-pre-result-source-diag
  cancel-in-progress: false
jobs:
  deadline-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Upgrade V215 to source-specific diagnostics without altering model or gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 - <<'PYV216_INSTALL'
          from pathlib import Path
          import gzip, base64,hashlib,json
          BLOBS=json.loads("{\"assets/boat_edge_v215_readiness.css\": {\"b64\": \"\", \"sha256\": \"44c75700bcc69d9851402d51be4eb03ecbad0d2cc853893fb10c0954c855171d\"}, \"assets/boat_edge_v215_readiness.js\": {\"b64\": \"\", \"sha256\": \"c520d6890dbbed53cbcaaa0b2cca14c7dc92eee80ca3bfbd283df8b9d80db832\"}, \"scripts/boat_edge_v215_readiness.py\": {\"b64\": \"\", \"sha256\": \"3f8e15aa0789ba127412dd911fe18f98413a8bc78cd929bbbb84473cd4645be3\"}}")
          OLD_SHA=json.loads("{\"assets/boat_edge_v215_readiness.css\": \"44c75700bcc69d9851402d51be4eb03ecbad0d2cc853893fb10c0954c855171d\", \"assets/boat_edge_v215_readiness.js\": \"8c7942f83e9472453d6844feae2740bcb3675bfe1d0eeb4f796923171ad49b8f\", \"scripts/boat_edge_v215_readiness.py\": \"da9ef24ff38aa82db7b10e77407d8223acf619ffedab8141687666b776b2d2cd\"}")
          for relative,item in BLOBS.items():
              data=gzip.decompress(base64.b64decode(item['b64']))
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise SystemExit('V216_EMBEDDED_SHA_BAD '+relative)
              file=Path(relative)
              if file.exists():
                  prior=hashlib.sha256(file.read_bytes()).hexdigest()
                  if prior==item['sha256']:continue
                  if prior!=OLD_SHA[relative]:raise SystemExit('V216_UNKNOWN_SOURCE_VERSION '+relative)
                  file.write_bytes(data)
                  print('V216_UPGRADED_VERIFIED_V215 '+relative)
              else:
                  raise SystemExit('V216_REQUIRES_V215_SOURCE '+relative)
          page=Path('ai-simulation.html')
          if not page.exists():raise SystemExit('V216_SITE_MISSING')
          s=page.read_text(encoding='utf-8')
          old='<script defer src="./assets/boat_edge_v215_readiness.js?v=215"></script>'
          new='<script defer src="./assets/boat_edge_v215_readiness.js?v=216"></script>'
          if s.count(new)==1:pass
          elif s.count(old)==1:s=s.replace(old,new)
          else:raise SystemExit('V216_BAD_SCRIPT_IMPORT')
          if s.count(new)!=1:raise SystemExit('V216_DUPLICATE_SCRIPT_IMPORT')
          if s!=page.read_text(encoding='utf-8'):page.write_text(s,encoding='utf-8')
          print('V216_PRE_RESULT_SOURCE_DETAILS_SAFE_NO_MODEL_CHANGE_PASS')
          PYV216_INSTALL
           python3 -m py_compile scripts/boat_edge_v215_readiness.py
           node --check assets/boat_edge_v215_readiness.js
           git add -- ai-simulation.html scripts/boat_edge_v215_readiness.py assets/boat_edge_v215_readiness.js assets/boat_edge_v215_readiness.css
           if git diff --cached --quiet; then echo 'V216_ALREADY_INSTALLED_PASS'; break; fi
           git commit -m 'V216 explain source gaps without relaxing any prediction or betting gate'
           if git push origin HEAD:main; then echo 'V216_INSTALL_SUCCESS'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Audit upcoming races and persist actual pre-result source deficits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v215_readiness.py
           git add -- data/site_paper_sim/readiness_v215_current.json data/site_paper_sim/readiness_history_v215/
           if git diff --cached --quiet; then echo 'V216_NO_CHANGE_READINESS'; break; fi
           git commit -m 'V216 Audit upcoming races and persist actual pre-result source deficits'
           if git push origin HEAD:main; then echo 'V216_COMMITTED_READINESS'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Freeze eligible V214 odds-proof shadow BEFORE results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v214_shadow.py freeze
           git add -- data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
           if git diff --cached --quiet; then echo 'V216_NO_CHANGE_SHADOW_FREEZE'; break; fi
           git commit -m 'V216 Freeze eligible V214 odds-proof shadow BEFORE results'
           if git push origin HEAD:main; then echo 'V216_COMMITTED_SHADOW_FREEZE'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Continue approved-only daily 50000 yen paper selection BEFORE results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v211_paper_sim.py select
           git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
           if git diff --cached --quiet; then echo 'V216_NO_CHANGE_PAPER_SELECT'; break; fi
           git commit -m 'V216 Continue approved-only daily 50000 yen paper selection BEFORE results'
           if git push origin HEAD:main; then echo 'V216_COMMITTED_PAPER_SELECT'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Grade only earlier committed shadow records AFTER freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v214_shadow.py settle
           git add -- data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
           if git diff --cached --quiet; then echo 'V216_NO_CHANGE_SHADOW_SETTLE'; break; fi
           git commit -m 'V216 Grade only earlier committed shadow records AFTER freeze'
           if git push origin HEAD:main; then echo 'V216_COMMITTED_SHADOW_SETTLE'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Settle only previously committed paper records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v211_paper_sim.py settle
           git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
           if git diff --cached --quiet; then echo 'V216_NO_CHANGE_PAPER_SETTLE'; break; fi
           git commit -m 'V216 Settle only previously committed paper records'
           if git push origin HEAD:main; then echo 'V216_COMMITTED_PAPER_SETTLE'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Disable replaced V215 scheduler after successful V216 audit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/BOAT_EDGE_V215_DEADLINE_READINESS.yml/disable"; then
            echo 'V216_PREVIOUS_SCHEDULER_DISABLED'
          else
            echo 'V216_OLD_SCHEDULER_NEEDS_MANUAL_STOP'
          fi
