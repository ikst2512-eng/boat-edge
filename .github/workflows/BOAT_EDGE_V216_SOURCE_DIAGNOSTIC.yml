name: BOAT EDGE V216 - Identify Exact Pre-Deadline Source Gaps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V216_SOURCE_DIAGNOSTIC.yml'
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v216-pre-result-source-diag
  cancel-in-progress: false
jobs:
  deadline-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify installed V265 source diagnostic without restoring pinned V215 code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYV286'
          from pathlib import Path
          import json,subprocess
          script=Path('scripts/boat_edge_v215_readiness.py')
          assert script.is_file() and not script.is_symlink()
          # Immutable previously audited V265 source identity. Unlike the
          # obsolete installer, this step never downgrades or rewrites it.
          expected='f74705858e9bffbe28b4ce444d29aa8565ed6497'
          observed=subprocess.check_output(['git','hash-object',str(script)],text=True).strip()
          assert observed==expected, 'V286_SOURCE_PROVENANCE_CHANGED_REVIEW_REQUIRED'
          contents=script.read_text(encoding='utf-8')
          assert all(token in contents for token in (
             'pre_result_odds_120_incomplete','official_dom_proof_missing',
             'official_beforeinfo_source_status','pre_result_odds_unverified')), 'V286_GUARDS_MISSING'
          for rel in ('assets/boat_edge_v215_readiness.js',
                      'assets/boat_edge_v215_readiness.css','ai-simulation.html'):
              p=Path(rel)
              assert p.is_file() and not p.is_symlink(), 'V286_SITE_SOURCE_MISSING '+rel
          assert 'boat_edge_v215_readiness.js?v=216' in Path('ai-simulation.html').read_text()
          g=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))['guards']
          assert all(g[k] is False for k in ('results_seen','unlock','scoring'))
          assert g['RESULT_UNLOCK_TOKEN'] is None
          print('V286_V265_SOURCE_PIN_AND_FORMAL_LOCK_PASS_NO_REINSTALL')
          PYV286
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 tests/test_boat_edge_v265_readiness_sources.py
          node --check assets/boat_edge_v215_readiness.js
      # The diagnostics and new shadow decisions are both PRE_RESULT-only.
      # Commit their evidence together BEFORE the paper-selection and settled-result
      # phases; one successful push is the first Git freeze receipt for both.
      - name: Freeze PRE_RESULT diagnostics and shadow evidence in one Git commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v215_readiness.py
            python3 scripts/boat_edge_v214_shadow.py freeze
            git add -- data/site_paper_sim/readiness_v215_current.json data/site_paper_sim/readiness_history_v215/ data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
            python3 - <<'PY_V216_PRE_RESULT'
          import json,subprocess
          from pathlib import Path
          status=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))
          guards=status.get('guards') or {}
          if not all(guards.get(k) is False for k in ('results_seen','unlock','scoring')) or guards.get('RESULT_UNLOCK_TOKEN') is not None:
              raise SystemExit('V216_FORMAL_RESULT_UNSEEN_GUARD_BLOCKED')
          if (status.get('formalFirst100') or {}).get('races') != 0:
              raise SystemExit('V216_FORMAL_FIRST100_GUARD_BLOCKED')
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'data/site_paper_sim/readiness_v215_current.json','data/site_paper_sim/shadow_v213_current.json','data/site_paper_sim/shadow_v213_ledger.json'}
          for path in staged:
              if path not in allowed and not path.startswith('data/site_paper_sim/readiness_history_v215/'):
                  raise SystemExit('V216_UNEXPECTED_FROZEN_EVIDENCE_FILE_'+path)
          print('V216_PRE_RESULT_ONLY_ATOMIC_STAGING_PASS',len(staged))
          PY_V216_PRE_RESULT
            git diff --cached --check
            if git diff --cached --quiet; then echo 'V216_NO_NEW_PRE_RESULT_EVIDENCE'; break; fi
            git commit -m 'V216 Freeze eligible pre-result source gaps and shadow evidence atomically'
            if git push origin HEAD:main; then echo 'V216_PRE_RESULT_ATOMIC_FREEZE_GIT_PUBLISHED'; break; fi
            if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Continue approved-only daily 50000 yen paper selection BEFORE results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v211_paper_sim.py select
           git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
           if git diff --cached --quiet; then echo 'V216_NO_CHANGE_PAPER_SELECT'; break; fi
           git commit -m 'V216 Continue approved-only daily 50000 yen paper selection BEFORE results'
           if git push origin HEAD:main; then echo 'V216_COMMITTED_PAPER_SELECT'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      # Both settle commands operate ONLY on past-committed SITE-only shadow/
      # paper ledgers. PRE_RESULT readiness, shadow freeze, and paper selection
      # were already pushed above; never combine prospective decisions with
      # result-consuming settlement in one commit.
      - name: Settle earlier frozen shadow and paper ledgers in one Git commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PY_V216_SETTLED_GUARD'
          import json
          from pathlib import Path
          doc=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))
          guards=doc.get('guards') or {}
          if not all(guards.get(k) is False for k in ('results_seen','unlock','scoring')) or guards.get('RESULT_UNLOCK_TOKEN') is not None:
              raise SystemExit('V216_SETTLE_FORMAL_FRESH_GUARD_BLOCKED')
          if (doc.get('formalFirst100') or {}).get('races') != 0:
              raise SystemExit('V216_SETTLE_FORMAL_FIRST100_GUARD_BLOCKED')
          print('V216_SETTLE_FORMAL_RESULT_UNSEEN_GUARD_PASS')
          PY_V216_SETTLED_GUARD
            python3 scripts/boat_edge_v214_shadow.py settle
            python3 scripts/boat_edge_v211_paper_sim.py settle
            git add -- data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json data/site_paper_sim/current.json data/site_paper_sim/ledger.json
            python3 - <<'PY_V216_SETTLED_PATHS'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'data/site_paper_sim/shadow_v213_current.json','data/site_paper_sim/shadow_v213_ledger.json','data/site_paper_sim/current.json','data/site_paper_sim/ledger.json'}
          if not staged.issubset(allowed):
              raise SystemExit('V216_SETTLEMENT_FORBIDDEN_STAGED_FILES_'+str(staged-allowed))
          print('V216_SETTLEMENT_SITE_ONLY_STAGED_FILES_PASS',len(staged))
          PY_V216_SETTLED_PATHS
            git diff --cached --check
            if git diff --cached --quiet; then echo 'V216_NO_CHANGE_SETTLEMENT'; break; fi
            git commit -m 'V216 settle earlier frozen SITE shadow and paper in one write'
            if git push origin HEAD:main; then echo 'V216_POST_FREEZE_SETTLEMENT_ATOMIC_PUBLISHED'; break; fi
            if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Disable replaced V215 scheduler after successful V216 audit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/BOAT_EDGE_V215_DEADLINE_READINESS.yml/disable"; then
            echo 'V216_PREVIOUS_SCHEDULER_DISABLED'
          else
            echo 'V216_OLD_SCHEDULER_NEEDS_MANUAL_STOP'
          fi
