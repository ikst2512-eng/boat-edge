name: BOAT EDGE V214 - Freeze Original Odds With Prospect Shadow Diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V214_ODDS_ARCHIVE_SHADOW.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v214-prospective-diagnostics
  cancel-in-progress: false
jobs:
  prospect-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install forward-only odds archive hook and diagnostic UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PYV214'
          from pathlib import Path
          import hashlib,base64,gzip,json
          FILES={"assets/boat_edge_v214_health.css": {"gzip_b64": "H4sIAAAAAAAC/y2N0Q6CIBhGX8WNa5uYacJj9AQgP8giYD8YVuvdc9rlt33nHCKhpd0ti7ykTxRKWW/YGNeKNnHlMqACZHTbKTirKjJppUFyKaa7wbB4xYg+66uWfAouICPt2Ml+4Dr4XCf7BkY3mjvroZ7Bmjkzeur/4hqFsktiw/Z4CDTW7+nmiO+KcjD9peHhCahdKHVBEZnwrzIDwvcH/ViahsIAAAA=", "sha256": "8a9af837196cf8ba49edafc8e64ca36c54771b1c465a561bb3464c5ca1c24d42"}, "assets/boat_edge_v214_health.js": {"gzip_b64": "", "sha256": "9a5f34c54e9a6515f6f5adeb62cd3fee1ec73c181195686116b441ebdffcbc30"}, "scripts/boat_edge_v214_preflight.py": {"gzip_b64": "", "sha256": "647f250a94d94fb18221605354e4f0259725043a7c62948a6e0676e350c76aa5"}, "scripts/boat_edge_v214_shadow.py": {"gzip_b64": "", "sha256": "209378d6b818489f89557c06ff8ca5cd680984ed5a0fa1967a921368542a50d8"}}
          PATCH=gzip.decompress(base64.b64decode('')).decode('utf-8')
          for relative,spec in FILES.items():
              f=Path(relative); raw=gzip.decompress(base64.b64decode(spec['gzip_b64']))
              if hashlib.sha256(raw).hexdigest()!=spec['sha256']:raise SystemExit('V214_EMBEDDED_SHA_BAD '+relative)
              if f.exists():
                  if f.read_bytes()!=raw:raise SystemExit('V214_ASSET_CONFLICT '+relative)
              else:
                  f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(raw)
                  print('V214_INSTALLED '+relative)
          src=Path('scripts/site_final_history_v133.py')
          if not src.is_file():raise SystemExit('V214_V133_MISSING')
          text=src.read_text(encoding='utf-8')
          marker='    if write_if_changed(SNAPS/f"{key}.json",snap):'
          if 'V214_LOCK_ODDS_SOURCE' not in text:
              if text.count(marker)!=1:raise SystemExit('V214_V133_ANCHOR_MISSING')
              src.write_text(text.replace(marker,PATCH+marker,1),encoding='utf-8')
              print('V214_PRE_RESULT_ODDS_ARCHIVE_HOOK_INSTALLED')
          page=Path('ai-simulation.html')
          if not page.exists() or 'boat_edge_v213_shadow.js?v=213' not in page.read_text(encoding='utf-8'):
              raise SystemExit('V214_REQUIRES_V213_SITE')
          text=page.read_text(encoding='utf-8')
          links=['<link rel="stylesheet" href="./assets/boat_edge_v214_health.css?v=214">','<script defer src="./assets/boat_edge_v214_health.js?v=214"></script>']
          for link in links:
              if link not in text:
                  if text.count('</head>')!=1:raise SystemExit('V214_BAD_DOCUMENT_HEAD')
                  text=text.replace('</head>',link+'\n</head>')
          if any(text.count(link)!=1 for link in links):raise SystemExit('V214_DUPLICATE_ASSET_LINK')
          if text!=page.read_text(encoding='utf-8'):page.write_text(text,encoding='utf-8')
          print('V214_INSTALL_SOURCE_ARCHIVE_AND_DIAGNOSTICS_PASS')
          PYV214
            python3 -m py_compile scripts/site_final_history_v133.py scripts/boat_edge_v214_shadow.py scripts/boat_edge_v214_preflight.py
            node --check assets/boat_edge_v214_health.js
            git add -- scripts/site_final_history_v133.py scripts/boat_edge_v214_shadow.py scripts/boat_edge_v214_preflight.py assets/boat_edge_v214_health.js assets/boat_edge_v214_health.css ai-simulation.html
            if git diff --cached --quiet; then echo 'V214_INSTALL_NO_CHANGE_PASS'; break; fi
            git commit -m 'V214 preserve original pre-result odds bytes and diagnose shadow source gaps'
            if git push origin HEAD:main; then echo 'V214_INSTALL_PERSISTED'; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Check actual pre-result source gaps
        shell: bash
        run: |
          set -euo pipefail
           git config user.name 'github-actions[bot]'
           git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
           for retry in 1 2 3 4 5 6 7 8; do
             git fetch --no-tags origin main
             git reset --hard origin/main
             python3 scripts/boat_edge_v214_preflight.py
             git add -- data/site_paper_sim/preflight_v214_current.json
             if git diff --cached --quiet; then echo 'V214_NO_CHANGES_PREFLIGHT'; break; fi
             git commit -m 'Check actual pre-result source gaps'
             if git push origin HEAD:main; then echo 'V214_COMMITTED_PREFLIGHT'; break; fi
             if [ "$retry" -eq 8 ]; then exit 1; fi
           done
      - name: Freeze V214 immutable-odds shadow candidates without results
        shell: bash
        run: |
          set -euo pipefail
           git config user.name 'github-actions[bot]'
           git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
           for retry in 1 2 3 4 5 6 7 8; do
             git fetch --no-tags origin main
             git reset --hard origin/main
             python3 scripts/boat_edge_v214_shadow.py freeze
             git add -- data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
             if git diff --cached --quiet; then echo 'V214_NO_CHANGES_SHADOW_FREEZE'; break; fi
             git commit -m 'Freeze V214 immutable-odds shadow candidates without results'
             if git push origin HEAD:main; then echo 'V214_COMMITTED_SHADOW_FREEZE'; break; fi
             if [ "$retry" -eq 8 ]; then exit 1; fi
           done
      - name: Keep daily 50000 yen paper simulation running
        shell: bash
        run: |
          set -euo pipefail
           git config user.name 'github-actions[bot]'
           git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
           for retry in 1 2 3 4 5 6 7 8; do
             git fetch --no-tags origin main
             git reset --hard origin/main
             python3 scripts/boat_edge_v211_paper_sim.py select
             git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
             if git diff --cached --quiet; then echo 'V214_NO_CHANGES_PAPER_FREEZE'; break; fi
             git commit -m 'Keep daily 50000 yen paper simulation running'
             if git push origin HEAD:main; then echo 'V214_COMMITTED_PAPER_FREEZE'; break; fi
             if [ "$retry" -eq 8 ]; then exit 1; fi
           done
      - name: Grade previously frozen shadow outcomes only
        shell: bash
        run: |
          set -euo pipefail
           git config user.name 'github-actions[bot]'
           git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
           for retry in 1 2 3 4 5 6 7 8; do
             git fetch --no-tags origin main
             git reset --hard origin/main
             python3 scripts/boat_edge_v214_shadow.py settle
             git add -- data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
             if git diff --cached --quiet; then echo 'V214_NO_CHANGES_SHADOW_SETTLE'; break; fi
             git commit -m 'Grade previously frozen shadow outcomes only'
             if git push origin HEAD:main; then echo 'V214_COMMITTED_SHADOW_SETTLE'; break; fi
             if [ "$retry" -eq 8 ]; then exit 1; fi
           done
      - name: Settle previously committed paper entries only
        shell: bash
        run: |
          set -euo pipefail
           git config user.name 'github-actions[bot]'
           git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
           for retry in 1 2 3 4 5 6 7 8; do
             git fetch --no-tags origin main
             git reset --hard origin/main
             python3 scripts/boat_edge_v211_paper_sim.py settle
             git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
             if git diff --cached --quiet; then echo 'V214_NO_CHANGES_PAPER_SETTLE'; break; fi
             git commit -m 'Settle previously committed paper entries only'
             if git push origin HEAD:main; then echo 'V214_COMMITTED_PAPER_SETTLE'; break; fi
             if [ "$retry" -eq 8 ]; then exit 1; fi
           done
      - name: Disable replaced V213 scheduler only after V214 success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/BOAT_EDGE_V213_SHADOW_ROI.yml/disable"; then
            echo 'V214_OLD_SCHEDULER_DISABLED'
          else
            echo 'V214_MANUAL_DISABLE_OLD_SCHEDULER_NEEDED'
          fi
