name: BOAT EDGE V226 - Guarded Pre-result Freeze and Isolated Odds Audit

# Manual recovery only. This workflow previously failed every hour while
# trying to overwrite the reviewed V133 prediction source from an obsolete
# pinned base (V226_INSTALLED_SOURCE_BASE_DRIFT_FAIL_CLOSED).
# V229/V235 own production pre-deadline freezing and V167 owns the real
# official-odds DOM audit. Running a second installer/auditor cannot improve
# live source freshness and must not race current production owners.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V226_SAFE_RECOVERY.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-edge-v226-site-only-safe-recovery
  cancel-in-progress: false

jobs:
  verify-current-source-without-installing-older-code:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read latest main (read only)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require closed formal gate and verify current approved SITE code
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          formal=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))
          guards=formal.get('guards') or {}
          if (any(guards.get(k) is not False for k in ('results_seen','unlock','scoring'))
                  or guards.get('RESULT_UNLOCK_TOKEN') is not None
                  or (formal.get('formalFirst100') or {}).get('races') != 0):
              raise SystemExit('V226_FORMAL_FRESH_LOCK_NOT_CLOSED')

          path=Path('scripts/site_final_history_v133.py')
          expected='7b2916df307fcb2783cfc6ddc38ff73903d56da5'
          actual=subprocess.check_output(['git','hash-object','--',str(path)],text=True).strip()
          if actual != expected:
              raise SystemExit('V226_CURRENT_REVIEWED_SITE_MODEL_PIN_DRIFT')
          contents=path.read_text(encoding='utf-8')
          markers=(
              'V226_IMMUTABLE_ORIGINAL_SNAPSHOT',
              'V226_SOURCE_GUARD',
              'V226_DECISION_WINDOW',
              'V226_ODDS_GUARD',
          )
          if any(contents.count(s) != 1 for s in markers):
              raise SystemExit('V226_CURRENT_PRODUCTION_GUARDS_MISSING')
          if not all(Path(p).is_file() for p in (
              '.github/workflows/BOAT_EDGE_V229_ATOMIC_FREEZE_AUDIT.yml',
              '.github/workflows/V235.yml',
              '.github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml')):
              raise SystemExit('V226_ACTIVE_SOURCE_OWNERS_NOT_PRESENT')
          print('V226_CURRENT_SOURCE_VERIFIED_NO_OLD_INSTALL_OR_DUPLICATE_COLLECTION')
          PY

      - name: Confirm workflow did not touch tracked files or formal state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo V226_MANUAL_RECOVERY_READ_ONLY_PASS
