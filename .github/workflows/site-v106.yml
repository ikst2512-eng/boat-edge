name: BOAT EDGE V106 CURRENT Stabilizer + Archive

on:
  push:
    paths:
      - ".github/workflows/site-v106.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v106-current
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable legacy UI schedulers and cancel legacy runs
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          for wf in "site-v103.yml" "site-v104.yml" "BOAT_EDGE_site-v98.yml"; do
            echo "Disabling $wf"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/disable" >/dev/null 2>&1 || true

            for status in in_progress queued waiting requested pending; do
              ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?status=${status}&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)"
              for id in $ids; do
                echo "Cancel legacy run $id ($wf / $status)"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
              done
            done
          done
          set -e

      - name: Build archive from all saved races since 2026-10-05
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone,timedelta

          START='20261005'
          JST=timezone(timedelta(hours=9))
          races=Path('data/races')
          results=Path('data/site_results')
          odds=Path('data/site_odds')
          out=Path('data/site_archive')
          out.mkdir(parents=True,exist_ok=True)
          days={}

          for p in sorted(races.glob('*.json')):
              m=re.fullmatch(r'(\d{8})-(\d{2})-(\d{2})\.json',p.name)
              if not m:
                  continue
              ymd,jcd,rno=m.groups()
              if ymd < START:
                  continue
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue

              meta=d.get('meta') or {}
              key=d.get('race_key') or p.stem
              day=days.setdefault(ymd,{})
              v=day.setdefault(jcd,{
                  'jcd':jcd,
                  'venue':meta.get('venue') or jcd,
                  'event':meta.get('event') or '',
                  'races':[]
              })

              res=None
              rp=results/f'{key}.json'
              if rp.exists():
                  try:
                      res=json.loads(rp.read_text(encoding='utf-8'))
                  except Exception:
                      res=None

              v['races'].append({
                  'race_key':key,
                  'race_no':int(meta.get('race_no') or rno),
                  'deadline':meta.get('deadline'),
                  'file':f'data/races/{key}.json',
                  'jcd':jcd,
                  'result_status':res.get('status') if res else None,
                  'trifecta':res.get('trifecta') if res else None,
                  'payout':res.get('trifecta_payout_yen_per_100') if res else None,
                  'has_odds':(odds/f'{key}.json').exists()
              })

          idx=[]
          keep=set()
          for ymd,vm in sorted(days.items()):
              venues=[]
              count=0
              for jcd,v in sorted(vm.items()):
                  v['races'].sort(key=lambda x:x['race_no'])
                  count += len(v['races'])
                  venues.append(v)

              doc={
                  'schema_version':'boat-edge-site-archive-v106',
                  'ymd':ymd,
                  'venue_count':len(venues),
                  'race_count':count,
                  'venues':venues
              }
              fp=out/f'{ymd}.json'
              fp.write_text(json.dumps(doc,ensure_ascii=False,indent=2),encoding='utf-8')
              keep.add(fp.name)
              idx.append({'ymd':ymd,'venues':len(venues),'races':count})

          root={
              'schema_version':'boat-edge-site-archive-index-v106',
              'start_date':'2026-10-05',
              'updated_at':datetime.now(JST).isoformat(timespec='seconds'),
              'dates':idx,
              'retention':'append from saved source data; no historical source deletion',
              'note':'10/5-10/6 may lack saved odds/results; missing values are not fabricated'
          }
          (out/'index.json').write_text(json.dumps(root,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(root,ensure_ascii=False))
          PY

      - name: Reassert V105 as CURRENT and remove legacy navigation overlays
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove legacy V103/V104 navigation overlays to avoid duplicate UI.
          for v in ('103','104'):
              s=re.sub(
                  rf'\s*<script src=["\']\./assets/boat_edge_v{v}\.js(?:\?v=\d+)?["\']></script>\s*',
                  '\n',s
              )
              s=re.sub(
                  rf'\s*<link[^>]+boat_edge_v{v}\.css(?:\?v=\d+)?[^>]*>\s*',
                  '\n',s
              )

          # Ensure V105 is loaded exactly once.
          s=re.sub(
              r'\s*<script src=["\']\./assets/boat_edge_v105\.js(?:\?v=\d+)?["\']></script>\s*',
              '\n',s
          )
          s=re.sub(
              r'\s*<link[^>]+boat_edge_v105\.css(?:\?v=\d+)?[^>]*>\s*',
              '\n',s
          )
          s=s.replace(
              '</head>',
              '<link rel="stylesheet" href="./assets/boat_edge_v105.css?v=105">\n</head>'
          )
          s=s.replace(
              '</body>',
              '<script src="./assets/boat_edge_v105.js?v=105"></script>\n</body>'
          )

          if re.search(r'<meta name="boat-edge-site-version" content="[^"]+">',s):
              s=re.sub(
                  r'<meta name="boat-edge-site-version" content="[^"]+">',
                  '<meta name="boat-edge-site-version" content="V106-STABLE-V105-UI">',
                  s
              )
          else:
              s=s.replace(
                  '</head>',
                  '<meta name="boat-edge-site-version" content="V106-STABLE-V105-UI">\n</head>'
              )

          p.write_text(s,encoding='utf-8')
          PY

      - name: Update persistent TODO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('BOAT_EDGE_CURRENT_TODO.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# BOAT EDGE CURRENT TODO\n'
          s=re.sub(r'Current UI target: V\d+','Current UI target: V106',s)

          lines=[
              '- V106 fixes V105 as the CURRENT UI.',
              '- V106 disables legacy scheduled V98/V103/V104 UI installers.',
              '- V106 cancels legacy queued/in-progress runs when first installed.',
              '- V106 keeps only archive rebuilding on a 5-minute schedule.',
              '- V106 removes V103/V104 navigation overlays from index.html to avoid duplicate controls.',
              '- Historical archive remains available from 2026-10-05 using saved source data.'
          ]

          marker='## NEXT'
          for line in lines:
              if line in s:
                  continue
              if marker in s:
                  s=s.replace(marker,line+'\n\n'+marker,1)
              else:
                  s += '\n'+line+'\n'

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate CURRENT
        shell: bash
        run: |
          test -f assets/boat_edge_v105.js
          test -f assets/boat_edge_v105.css
          node --check assets/boat_edge_v105.js
          grep -q 'V106-STABLE-V105-UI' index.html
          grep -q 'boat_edge_v105.js?v=105' index.html
          ! grep -q 'boat_edge_v103.js' index.html
          ! grep -q 'boat_edge_v104.js' index.html
          python - <<'PY'
          import json
          d=json.load(open('data/site_archive/index.json',encoding='utf-8'))
          assert d['start_date']=='2026-10-05'
          assert d['dates']
          print(d)
          PY

      - name: Save archive and CURRENT marker
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site_archive index.html BOAT_EDGE_CURRENT_TODO.md
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize BOAT EDGE V105 UI and archive"
          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
