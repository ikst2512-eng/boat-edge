      - name: Run unit tests and strict source/UI preflight
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/boat-edge-v165
          node test_v165.js
          python3 -m unittest -q test_builder_v165.py
          cd "$GITHUB_WORKSPACE"
          python3 /tmp/boat-edge-v165/v165_apply.py --check

      - name: Install view components and materialize PRE_RESULT racers only
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/boat-edge-v165/v165_apply.py
          node --check assets/boat_edge_v163_nav_stats.js
          node --check assets/boat_edge_v165_racer_stats.js
          git diff --check
          python3 - <<'PYIN'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('./assets/boat_edge_v165_racer_stats.js?v=165')==1
          assert s.count('./assets/boat_edge_v165_racer_stats.css?v=165')==1
          assert s.count('./assets/boat_edge_v163_nav_stats.js?v=163')==1
          print('PASS: V165 stats display is mounted once; V163 preserved')
          PYIN

      - name: Commit only read-only site features and derived PRE_RESULT output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/boat_edge_v165_racer_stats.js assets/boat_edge_v165_racer_stats.css scripts/site_recent_v165.py data/site_racer_recent_v165/
          python3 - <<'PYIN'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'index.html','assets/boat_edge_v165_racer_stats.js','assets/boat_edge_v165_racer_stats.css','scripts/site_recent_v165.py'}
          assert all(p in allowed or p.startswith('data/site_racer_recent_v165/') for p in paths),f'Unexpected write scope: {paths}'
          for p in paths:
              assert not any(x in p for x in ('results','payouts','formal','v155_fresh','v146/'))
          print('V165 staging validated:',sorted(paths))
          PYIN
          if git diff --cached --quiet; then
            echo 'V165 up-to-date, no commit required'
            exit 0
          fi
          git commit -m 'V165: show verified racer course 3m/6m rates and methods (display only)'
          for trial in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'V165 rebase conflict, leaving remote unchanged' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'PASS: V165 site display assets published to main'
              exit 0
            fi
            sleep 2
          done
          echo 'ERROR: V165 push failed; no deployment claimed' >&2
          exit 1
