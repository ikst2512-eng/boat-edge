name: BOAT EDGE V165 - Display Actual Course Racer History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V165_ONE_UPLOAD.yml'
      - 'data/today.json'
      - 'data/site_racer_actual_course/v146/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v165-display-current-racer-stats
  cancel-in-progress: false

