          python3 scripts/site_v179_patch.py
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import json,re,subprocess
          d=json.loads(Path('data/site_learning/v179_formal_readiness.json').read_text(encoding='utf-8'))
          assert d['production_prediction_weights_changed'] is False
          assert d['formal_current_scoring'] is False
          assert d['formal_current_gate_executed'] is False
          assert d['scope']=='SITE_CONSUMER_AND_PRE_RESULT_STATUS_ONLY_NO_FORMAL_GATE_RUN'
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'pAraw*100/worldSum' in html and 'pBraw*100/worldSum' in html
          assert 'verifiedTicketPercent.get(b.combo || b.ticket || b.bet)' in html
          for bad in ['Math.round(Number(a)*100)','Math.round(Number(b)*100)','Math.round(Number(w.probability)*100)',
                      'Math.round(Number(A.probability)*100)','Math.round(Number(B.probability)*100)',
                      'Math.round(Number(t.probability)*1000)/10','const amounts = allocateByWeights(items.map(x=>num(x.probability) || 1), budget)']:
              assert bad not in html,'V179_REMAINING_INCORRECT_UI_PERCENT '+bad
          # No result/payout directories, model weights, formal status or frozen snapshots may be changed.
          paths=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed={x[3:] for x in paths}
          allowed={'index.html','scripts/site_v179_patch.py','tests/test_v179_probability.py','data/site_learning/v179_formal_readiness.json'}
          assert changed<=allowed,'V179_UNEXPECTED_REPO_CHANGE '+repr(changed-allowed)
          print('V179_ONLY_UI_AND_READINESS_AUDIT_FILES_PASS',sorted(changed))
          print('V179_FORMAL_STATUS',d['formal_first100_races'],'FRESH100_FROZEN;',d['site_core7_eligible'],'SITE_CORE7')
          PYAUDIT
          git diff --check
      - name: Commit UI fix and non-formal readiness evidence only
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html scripts/site_v179_patch.py tests/test_v179_probability.py data/site_learning/v179_formal_readiness.json
          git diff --cached --quiet && { echo V179_NO_CHANGE; exit 0; }
          python3 - <<'PYGATE'
          import subprocess
          allowed={'index.html','scripts/site_v179_patch.py','tests/test_v179_probability.py','data/site_learning/v179_formal_readiness.json'}
          got=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert got<=allowed and got,'V179_STAGED_WRITE_OUT_OF_SCOPE '+repr(got)
          PYGATE
          git commit -m 'V179 normalize displayed prediction percentages and audit formal freeze readiness'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo V179_DISPLAY_READINESS_COMMITTED; exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 -m unittest discover -s tests -p 'test_v179_probability.py'
          done
          echo V179_PUSH_FAILED >&2
          exit 1
