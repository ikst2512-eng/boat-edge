name: BOAT EDGE V262 - Daily 50000 Paper Budget Evidence

on:
  push:
    branches: [main]
    paths:
      - 'ai-simulation.html'
      - 'assets/boat_edge_v211_paper.js'
      - 'assets/boat_edge_v262_budget.css'
      - 'tests/test_boat_edge_v262_budget.cjs'
      - '.github/workflows/v262-paper-budget-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boat-edge-v262-paper-ledger-audit
  cancel-in-progress: true

jobs:
  audit-paper-budget-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source-only daily budget, pending and settled risk labels
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/boat_edge_v211_paper.js
          node tests/test_boat_edge_v262_budget.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v245_paper_day.py' -v
      - name: Keep formal Fresh result unseen and forbid actual wagers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))
          guards=d.get('guards') or {}
          assert all(guards.get(k) is False for k in ('results_seen','unlock','scoring'))
          assert guards.get('RESULT_UNLOCK_TOKEN') is None
          paper=json.loads(Path('data/site_paper_sim/current.json').read_text(encoding='utf-8'))
          assert paper.get('mode')=='PAPER_ONLY'
          assert paper.get('money',{}).get('virtual_only') is True
          print('V262_PAPER_ONLY_FORMAL_PRE_RESULT_PASS')
          PY
