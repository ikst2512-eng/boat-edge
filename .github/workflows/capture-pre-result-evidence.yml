name: Capture official PRE_RESULT evidence
on:
  push:
    paths:
      - 'tools/*pre_result*.py'
      - 'tools/*start_order*.py'
      - 'tools/*entry*.py'
      - 'tools/verify_sidecars_before_push.py'
      - 'tools/verify_pre_result_capture.py'
      - 'tools/test_verify_pre_result_capture.py'
      - '.github/workflows/capture-pre-result-evidence.yml'
  schedule:
    - cron: '*/10 0-14 * * *'
  workflow_dispatch:
  # Backup wake only from the existing successful main source collector.
  workflow_run:
    workflows: ['BOAT EDGE 自動更新']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: official-prerace-evidence
  cancel-in-progress: false
jobs:
  capture:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pre-result Python scripts
        run: python -m compileall -q tools
      - name: Run focused pre-result unit and integration tests
        run: |
          set -e
          python -m unittest discover -s tools -p 'test_*pre_result*.py' -v
          python -m unittest discover -s tools -p 'test_parse_explicit_start_order.py' -v
          python -m unittest discover -s tools -p 'test_build_verified_entry_candidate.py' -v
          python -m unittest discover -s tools -p 'test_ingest_verified_start_order.py' -v
          python -m unittest discover -s tools -p 'test_prepare_public_entry_sidecars.py' -v
          python -m unittest discover -s tools -p 'test_verify_sidecars_before_push.py' -v
          python -m unittest discover -s tools -p 'test_verify_pre_result_capture.py' -v
      - name: Capture imminent official sources
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: python tools/capture_imminent_pre_result.py --races data/races --output artifacts/pre-result-captures --enriched-output artifacts/verified-entry-snapshots --maximum 12
      - name: Prepare public entry sidecars
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: python tools/prepare_public_entry_sidecars.py
      - name: Summarize verified capture and publication counts
        if: always() && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          raw=$(find artifacts/pre-result-captures -maxdepth 1 -name '*.beforeinfo.audit.json' -type f 2>/dev/null | wc -l || true)
          entries=$(find artifacts/verified-entry-snapshots -maxdepth 1 -name '*.json' -type f 2>/dev/null | wc -l || true)
          sidecars=$(find data/site_verified_entries -maxdepth 1 -name '*.json' -type f 2>/dev/null | wc -l || true)
          {
            echo '## PRE_RESULT pipeline'
            echo "Captured official source audits: $raw"
            echo "Validated entry snapshots: $entries"
            echo "Total sidecar files in checkout: $sidecars"
            echo 'A zero count is not a success signal; check eligible races and parser compatibility.'
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY_PRERACE_REPORT'
          import collections
          import json
          import os
          from pathlib import Path

          report_path = Path("artifacts/capture-report.json")
          if not report_path.exists():
              print("::warning::PRE_RESULT capture report missing; collection not verified")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write("\nCapture report: MISSING (not verified)\n")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              checked = report.get("checked", 0)
              selection = report.get("selection_diagnostic") or {}
              captured = len(report.get("captured", []))
              enriched = len(report.get("enriched", []))
              failures = report.get("failed", [])
              t12 = report.get("t12_receipts", [])
              t12_cutoff = sum(1 for item in t12 if item.get("timestamp_cutoff_ok") is True)
              reasons = collections.Counter(
                  f.get("capture_error_code") or f.get("reason") or "unspecified"
                  for f in failures
              )
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write(f"\nEligible races: {checked}; captures: {captured}; verified six-boat entries: {enriched}; failures: {len(failures)}\n")
                  out.write(f"\\nT-12 timestamp-only receipts: {t12_cutoff}/{len(t12)}; six-boat exhibition E2E: NOT VERIFIED\\n")
                  for code, count in sorted(reasons.items()):
                      out.write(f"- Failure class `{code}`: {count}\n")
                  if checked == 0:
                      out.write(f"\nNo eligible races: not an acquisition success test. Today files: {selection.get('today_race_files', 'unknown')}; excluded from capture window or safety: {selection.get('excluded_window_or_safety', 'unknown')}; observed: {selection.get('observed_at_jst', 'unknown')}\n")
                  elif enriched == 0:
                      out.write("\n**No verified race entries; gate 1C remains unproven.**\n")
              if checked and not enriched:
                  print(f"::warning::PRE_RESULT: 0 verified entries among {checked} eligible races")
          PY_PRERACE_REPORT
      - name: Publish only new sidecars
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d data/site_verified_entries ]; then exit 0; fi
          git add -- data/site_verified_entries/
          if git diff --cached --quiet; then exit 0; fi
          if git diff --cached --name-only | grep -Ev '^data/site_verified_entries/[0-9]{8}-[0-9]{2}-[0-9]{2}\.json$'; then
            echo 'Unexpected staged file'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/verify_sidecars_before_push.py
          git commit -m 'Publish verified pre-deadline entry sidecars'
          git push origin HEAD:main
      - name: Upload immutable evidence artifacts
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: prerace-evidence-${{ github.run_id }}
          path: |
            artifacts/pre-result-captures/
            artifacts/verified-entry-snapshots/
            artifacts/capture-report.json
          if-no-files-found: ignore
          retention-days: 14
