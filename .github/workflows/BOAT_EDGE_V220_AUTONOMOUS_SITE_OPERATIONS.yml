name: BOAT EDGE V220 - Autonomous Site Operations And Guarded Recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V220_AUTONOMOUS_SITE_OPERATIONS.yml']
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v220-site-operations-guarded
  cancel-in-progress: false

jobs:
  site-operations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main and full provenance
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned site-operations audit and compact UI, fail on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          installed=0
          for try_no in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PY_V220_INSTALL'
          from pathlib import Path
          import base64,gzip,hashlib,json
          items=json.loads(r'''{"scripts/boat_edge_v220_site_ops.py":{"sha256":"71e2203baf6feb2c00d701e401eed5a1c23b1710076f64327b62e85719654dab","payload":""},"assets/boat_edge_v220_site_ops.js":{"sha256":"ae39fefc224284875a9f4b865f169b33eb9f191002a750d369d81b28dfd0f96c","payload":""},"assets/boat_edge_v220_site_ops.css":{"sha256":"0880cf7153507f6868c75f58cd902239e8c0881f4d085676a84452456584ac93","payload":""},"tests/test_boat_edge_v220_site_ops.py":{"sha256":"c061f11758276daea1eeec48ca43fcf7ed0b447de9aeb741eca93f1f4e10bdfd","payload":""}}''')
          for filename,info in items.items():
              decoded=gzip.decompress(base64.b64decode(info['payload']))
              if hashlib.sha256(decoded).hexdigest()!=info['sha256']:
                  raise RuntimeError('V220_PINNED_PAYLOAD_MISMATCH '+filename)
              file=Path(filename)
              if file.exists() and file.read_bytes()!=decoded:
                  raise RuntimeError('V220_EXISTING_ASSET_CONFLICT_FAIL_CLOSED '+filename)
              file.parent.mkdir(parents=True,exist_ok=True)
              if not file.exists():file.write_bytes(decoded)
          index=Path('index.html')
          body=index.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./assets/boat_edge_v220_site_ops.css?v=220">'
          js='<script defer src="./assets/boat_edge_v220_site_ops.js?v=220"></script>'
          if body.count('</head>')!=1 or body.count('</body>')!=1:
              raise RuntimeError('V220_SITE_DOM_AMBIGUOUS')
          if body.count(css)>1 or body.count(js)>1:raise RuntimeError('V220_DUPLICATE_ASSET_TAG')
          if css not in body:body=body.replace('</head>',css+'\n</head>',1)
          if js not in body:body=body.replace('</body>',js+'\n</body>',1)
          index.write_text(body,encoding='utf-8')
          print('V220_STATIC_SITE_GUARD_INSTALLED_NO_MODEL_EDIT')
          PY_V220_INSTALL
            PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/boat_edge_v220_site_ops.py tests/test_boat_edge_v220_site_ops.py
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_boat_edge_v220_site_ops.py
            node --check assets/boat_edge_v220_site_ops.js
            git add -- scripts/boat_edge_v220_site_ops.py assets/boat_edge_v220_site_ops.js assets/boat_edge_v220_site_ops.css tests/test_boat_edge_v220_site_ops.py index.html
            if git diff --cached --quiet; then echo 'V220_INSTALL_ALREADY_CURRENT'; installed=1; break; fi
            git commit -m 'V220 install autonomous site-operations health and safety tests'
            if git push origin HEAD:main; then echo 'V220_INSTALLED'; installed=1; break; fi
            if [ "$try_no" -eq 6 ]; then echo 'V220_INSTALL_RETRY_EXHAUSTED'; exit 1; fi
          done
          test "$installed" = 1

      - name: Generate observed pre-result site-operations report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          saved=0
          for try_no in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_boat_edge_v220_site_ops.py
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v220_site_ops.py
            git add -- data/site_ops_v220/current.json
            if git diff --cached --quiet; then echo 'V220_OPERATIONS_UNCHANGED'; saved=1; break; fi
            git commit -m 'V220 record observed site-only pre-result operating status'
            if git push origin HEAD:main; then echo 'V220_OPERATIONS_RECORDED'; saved=1; break; fi
            if [ "$try_no" -eq 6 ]; then echo 'V220_REPORT_RETRY_EXHAUSTED'; exit 1; fi
          done
          test "$saved" = 1

      - name: Retry missed PRE_RESULT collector workflows only if no recent runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A safe missed-cron nudge only. It is NOT a model change, formal unlock, payout fetch or purchase.
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v220_site_ops.py --recovery-plan > /tmp/v220_recovery_plan.json
          cat /tmp/v220_recovery_plan.json
          if ! command -v gh >/dev/null || ! command -v jq >/dev/null; then echo 'V220_RECOVERY_CLI_UNAVAILABLE_FAIL_CLOSED'; exit 0; fi
          for wf in $(jq -r '.workflows[]?' /tmp/v220_recovery_plan.json); do
            case "$wf" in auto-update.yml|site-odds.yml) ;; *) echo 'V220_REJECTED_UNAPPROVED_WORKFLOW'; exit 1;; esac
            if ! runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=12" 2>/dev/null); then
               echo "V220_RECOVERY_SKIPPED_STATUS_UNVERIFIABLE $wf"; continue
            fi
            current=$(date -u +%s)
            # If the job has run within 15 min, even if it silently failed, don't create a storm.
            if echo "$runs" | jq -e --argjson t "$current" '[.workflow_runs[]? | select(.created_at != null) | select((.created_at|fromdateiso8601) <= $t and ($t - (.created_at|fromdateiso8601)) < 900)] | length > 0' >/dev/null; then
               echo "V220_RECOVERY_COOLDOWN_OR_SCHEDULE_ACTIVE $wf"; continue
            fi
            if gh workflow run "$wf" --ref main; then
               echo "V220_RECOVERY_DISPATCHED_ONLY_PRE_RESULT $wf"
            else
               echo "V220_RECOVERY_DISPATCH_FAILED_FAIL_CLOSED $wf"
            fi
          done

