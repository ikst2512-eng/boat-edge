name: BOAT EDGE V220 - Autonomous Site Operations And Guarded Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V220_AUTONOMOUS_SITE_OPERATIONS.yml'
      - 'scripts/boat_edge_v220_site_ops.py'
      - 'tests/test_boat_edge_v220_site_ops.py'
      - 'scripts/boat_edge_v227_autopilot.py'
      - 'tests/test_boat_edge_v227_autopilot.py'
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'
  # Existing V186's independently scheduled source/scratch publication can
  # wake the SAME V220 guarded recovery owner when the V71 cron is omitted.
  # V186 does not listen to V220, V216 or V71: no feedback loop. Only V186
  # schedule events are accepted; keep V216's already approved event path.
  # No new cron, workflow, writer, results read or paid third-party service.
  workflow_run:
    workflows:
      - 'BOAT EDGE V216 - Identify Exact Pre-Deadline Source Gaps'
      - 'BOAT EDGE V186 - Keep Scratch Fresh for V185 Prospective Accuracy'
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v220-site-operations-guarded
  cancel-in-progress: false

jobs:
  site-operations:
    # workflow_run must be a verified successful SAME-REPOSITORY main event;
    # a forked/failed source job never authorizes dispatch or repository writes.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.name == 'BOAT EDGE V216 - Identify Exact Pre-Deadline Source Gaps' ||
         (github.event.workflow_run.name == 'BOAT EDGE V186 - Keep Scratch Fresh for V185 Prospective Accuracy' &&
          github.event.workflow_run.event == 'schedule'))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main and full provenance
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify current versioned site-operations code without overwriting main
        # Event recovery reuses the V220 plan: needed source collection or
        # strict evidence-ready missed V229; no extra main/Pages writer.
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          # V270: do not restore embedded V220 payloads over newer V267+ checks.
          # The GitHub main branch is the sole source of executable code.
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/boat_edge_v220_site_ops.py tests/test_boat_edge_v220_site_ops.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_boat_edge_v220_site_ops.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v227_autopilot.py' -q
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/boat_edge_v227_autopilot.py
          node --check assets/boat_edge_v220_site_ops.js
          test -f assets/boat_edge_v220_site_ops.css
          test -f index.html

      - name: Recover stale collectors or evidence-ready missed V229 without duplicate runs
        # Existing 15-minute collector cooldown is unchanged; V229 is allowed
        # only for source-complete uncommitted FINAL in its actual 2-10m window.
        # A 2-minute V229 cooldown lets genuine cron gaps recover while
        # suppressing duplicate queued/running execution and rapid retries.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A safe missed-cron nudge only. It is NOT a model change, formal unlock, payout fetch or purchase.
          # Gate 1C: recover against latest main BEFORE report Git retries
          # consume the strictly limited 2-10 minute PRE_RESULT window.
          # This is the SAME recovery step, not a second dispatch path.
          git fetch --no-tags origin main
          git reset --hard origin/main
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v220_site_ops.py --recovery-plan > /tmp/v220_recovery_plan.json
          cat /tmp/v220_recovery_plan.json
          if ! command -v gh >/dev/null || ! command -v jq >/dev/null; then echo 'V220_RECOVERY_CLI_UNAVAILABLE_FAIL_CLOSED'; exit 0; fi
          for wf in $(jq -r '.workflows[]?' /tmp/v220_recovery_plan.json); do
            case "$wf" in
              auto-update.yml|site-odds.yml) cooldown=900 ;;
              BOAT_EDGE_V229_ATOMIC_FREEZE_AUDIT.yml) cooldown=120 ;;
              *) echo 'V220_REJECTED_UNAPPROVED_WORKFLOW'; exit 1 ;;
            esac
            # Source readiness was checked on latest main in --recovery-plan;
            # every V229 invocation performs its own independent PRE_RESULT,
            # official source, 120-odds and Git-first-add fail-closed checks.
            if ! runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=100" 2>/dev/null); then
               echo "V220_RECOVERY_SKIPPED_STATUS_UNVERIFIABLE $wf"; continue
            fi
            current=$(date -u +%s)
            # Malformed status is unknown, never permission to dispatch.
            if ! echo "$runs" | jq -e '(.workflow_runs | type) == "array"' >/dev/null 2>&1; then
               echo "V220_RECOVERY_MALFORMED_STATUS_FAIL_CLOSED $wf"; continue
            fi
            # Never dispatch if a V229 instance is pending/running, regardless
            # of start time; keep original 15-min cooldown for collectors.
            if [[ "$wf" == BOAT_EDGE_V229_ATOMIC_FREEZE_AUDIT.yml ]]; then
               if echo "$runs" | jq -e '[.workflow_runs[]? | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length > 0' >/dev/null; then
                  echo "V220_V229_ALREADY_ACTIVE_NO_DUPLICATE"; continue
               fi
            fi
            # A skipped workflow_run (V229 OR collector) did no work and must
            # not consume the 120s / 900s production cooldown. Preserve it
            # for all real attempts and queued/running jobs. Production
            # 2026-10-17 20:29:35 JST skipped auto-update otherwise blocked
            # genuine stale-source recovery despite no collector since 19:15.
            # Fetch 100 statuses so skipped triggers do not hide real runs.
            if echo "$runs" | jq -e --arg wf "$wf" --argjson t "$current" --argjson c "$cooldown" '[.workflow_runs[]? | select(.created_at != null and .conclusion != "skipped") | select((.created_at|fromdateiso8601) <= $t and ($t - (.created_at|fromdateiso8601)) < $c)] | length > 0' >/dev/null; then
               echo "V220_RECOVERY_COOLDOWN_OR_SCHEDULE_ACTIVE $wf"; continue
            fi
            if gh workflow run "$wf" --ref main; then
               echo "V220_RECOVERY_DISPATCHED_ONLY_PRE_RESULT $wf"
            else
               echo "V220_RECOVERY_DISPATCH_FAILED_FAIL_CLOSED $wf"
            fi
          done


      - name: Generate observed pre-result site-operations report
        shell: bash
        run: |
          set -euo pipefail
          # The existing V216 workflow_run recovery previously skipped the
          # existing V220 monitor writer entirely. If GitHub delays its 15-min
          # schedule, publish a fresh source-dated report ONLY when the last
          # report's actual main Git commit is >=15 minutes old. This reuses
          # the SAME owner and does not add another cron, writer, or trigger.
          if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_run" ]]; then
            last_report_commit="$(git log -1 --format=%ct -- data/site_ops_v220/gate1c_current.json || true)"
            if [[ "$last_report_commit" =~ ^[0-9]+$ ]]; then
              now_epoch="$(date -u +%s)"
              report_age="$((now_epoch - last_report_commit))"
              if (( report_age >= 0 && report_age < 900 )); then
                echo "V220_EVENT_REPORT_FRESH_SKIP age_sec=$report_age"
                exit 0
              fi
            fi
            echo 'V220_EVENT_REPORT_STALE_REFRESH_EXISTING_OWNER'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          saved=0
          for try_no in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_boat_edge_v220_site_ops.py
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_01_gate1c_missing_freeze_diagnostics.py' -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v220_site_ops.py
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v220_site_ops.py --gate1c-proof
            # V281: coalesce the stale V227 UI status with the existing
            # 15-minute V220 publish, not a second duplicate Pages writer.
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v227_autopilot.py
            python3 - <<'PY_V281_FRESH_SAFE'
          import datetime as dt,json
          from pathlib import Path
          root=Path('.')
          formal=json.loads((root/'data/formal_status.json').read_text(encoding='utf-8'))
          guard=formal.get('guards') or {}
          if not all(guard.get(k) is False for k in ('results_seen','unlock','scoring')) or guard.get('RESULT_UNLOCK_TOKEN') is not None:
              raise SystemExit('V281_FORMAL_FRESH_LOCK_UNVERIFIED')
          if (formal.get('formalFirst100') or {}).get('races',0)!=0:
              raise SystemExit('V281_FORMAL_FIRST100_LOCK_UNVERIFIED')
          state=json.loads((root/'data/site_autopilot/v227_current.json').read_text(encoding='utf-8'))
          day=dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).strftime('%Y%m%d')
          if state.get('schema')!='BOAT_EDGE_V227_SITE_AI_SELF_DRIVE_STATUS_V1' or state.get('day_jst')!=day:
              raise SystemExit('V281_CURRENT_DAY_UI_STATE_MISMATCH')
          if state.get('formal',{}).get('guard_closed') is not True or state.get('formal',{}).get('results_read_by_v227') is not False or state.get('prediction',{}).get('model_auto_promotion') is not False:
              raise SystemExit('V281_UI_STATUS_FALSE_CLAIM_BLOCKED')
          print('V281_DATE_BOUND_UI_STATUS_AND_FORMAL_LOCK_PASS',day)
          PY_V281_FRESH_SAFE
            git add -- data/site_ops_v220/current.json data/site_ops_v220/gate1c_current.json data/site_autopilot/v227_current.json
            python3 - <<'PY_V281_STAGED'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'data/site_ops_v220/current.json','data/site_ops_v220/gate1c_current.json','data/site_autopilot/v227_current.json'}
          if not staged.issubset(allowed):raise SystemExit('V281_FORBIDDEN_MONITOR_STAGE_'+str(staged-allowed))
          print('V281_ONLY_SITE_MONITOR_FILES_STAGED',len(staged))
          PY_V281_STAGED
            git diff --cached --check
            if git diff --cached --quiet; then echo 'V220_OPERATIONS_UNCHANGED'; saved=1; break; fi
            git commit -m 'V281 refresh source-dated V220+V227 site-only autopilot status'
            if git push origin HEAD:main; then echo 'V220_OPERATIONS_RECORDED'; saved=1; break; fi
            if [ "$try_no" -eq 6 ]; then echo 'V220_REPORT_RETRY_EXHAUSTED'; exit 1; fi
          done
          test "$saved" = 1

