name: BOAT EDGE V211 - Daily 50K AI Paper Simulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V211_DAILY_50K_SIM.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v211-daily-50k
  cancel-in-progress: false

jobs:
  paper-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install corrected daily budget and BOATERS-style page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PYINSTALL'
          from pathlib import Path
          import base64,hashlib,gzip,re,json
          FILES={'ai-simulation.html': {'sha256': '1525528e8caf18a58d01d13a575110ea5bccbb6d5950c007173eef5ebf126609', 'base64_gzip': ''}, 'assets/boat_edge_v211_paper.css': {'sha256': 'be636a399ae9ea7c66e29885bd4e02ed871b171cc544f6e8dae9870a23fac6ea', 'base64_gzip': ''}, 'assets/boat_edge_v211_paper.js': {'sha256': '9eed09cad99634ca4b8fd89f84fdccec9b179ea42cd7d889bf364d2913c99e8a', 'base64_gzip': ''}, 'scripts/boat_edge_v211_paper_sim.py': {'sha256': '119a6db4b016609b88c4c578adad97613b90a4eb99b12096bbf57fbdcdf37265', 'base64_gzip': ''}, 'scripts/boat_edge_v211_replay_20261008.py': {'sha256': 'df565a8eaf2e53bba872d19833ca45ec8ad95931efa96fb873913eba6d5abe8e', 'base64_gzip': ''}}
          for relative,meta in FILES.items():
              raw=gzip.decompress(base64.b64decode(meta['base64_gzip']))
              if hashlib.sha256(raw).hexdigest()!=meta['sha256']:
                  raise SystemExit('V211_ASSET_SHA_MISMATCH '+relative)
              target=Path(relative)
              if target.exists() and target.read_bytes()!=raw:
                  # Only replace older V209-controlled simulation page, never an unrelated asset.
                  if relative!='ai-simulation.html' or 'V209' not in target.read_text(encoding='utf8'):
                      raise SystemExit('V211_UNEXPECTED_EXISTING_ASSET '+relative)
              target.parent.mkdir(parents=True,exist_ok=True)
              if not target.exists() or target.read_bytes()!=raw:
                  target.write_bytes(raw)
                  print('V211_INSTALL '+relative)
          index=Path('index.html')
          if not index.is_file():raise SystemExit('V211_MISSING_MAIN_PAGE')
          s=index.read_text(encoding='utf8')
          if 'boat_edge_v208_latest_clean.css?v=208' not in s or not re.search(r'boat_edge_v207_first_prediction[.]js\?v=(?:207|208)',s):
              raise SystemExit('V211_REQUIRES_CURRENT_V208')
          css='<link rel="stylesheet" href="./assets/boat_edge_v211_paper.css?v=211">'
          if css not in s:
              if s.count('</head>')!=1:raise SystemExit('V211_MISSING_HEAD')
              s=s.replace('</head>',css+'\n</head>')
          old='<a class="be209-header-link" href="./ai-simulation.html">AI自走シミュレーション</a>'
          new='<a class="be209-header-link" href="./ai-simulation.html" aria-label="AI自走シミュレーション"><span>AI自走</span><span>シミュレーション</span></a>'
          if old in s:s=s.replace(old,new)
          if new not in s:
              anchor=re.search(r'<div class="brandtext">BOAT EDGE <small>[^<]*</small></div>',s)
              if not anchor:raise SystemExit('V211_MISSING_BRAND')
              s=s[:anchor.end()]+new+s[anchor.end():]
          if s.count(new)!=1 or s.count(css)!=1:raise SystemExit('V211_DUPLICATE_MAIN_LINK')
          if s!=index.read_text(encoding='utf8'):index.write_text(s,encoding='utf8')
          retired=Path('.github/workflows/BOAT_EDGE_V209_AI_AUTORUN_SIM.yml')
          if retired.is_file():
              oldtext=retired.read_text(encoding='utf8')
              if 'BOAT EDGE V209 - AI Paper Autonomy 50K' not in oldtext and 'BOAT EDGE V209 - Retired by V211' not in oldtext:
                  raise SystemExit('V211_UNEXPECTED_V209_WORKFLOW')
              disabled='name: BOAT EDGE V209 - Retired by V211\non:\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  retired:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo "V209 replaced by BOAT EDGE V211 daily-50k simulator; no scheduled V209 purchase logic"\n'
              if retired.read_text(encoding='utf8')!=disabled:
                  retired.write_text(disabled,encoding='utf8')
                  print('V211_RETIRED_OLD_V209_SCHEDULE')
          print('V211_SITE_ASSETS_AND_BUDGET_POLICY_PASS')

          PYINSTALL
            python3 -m py_compile scripts/boat_edge_v211_paper_sim.py scripts/boat_edge_v211_replay_20261008.py
            node --check assets/boat_edge_v211_paper.js
            git add -- ai-simulation.html assets/boat_edge_v211_paper.css assets/boat_edge_v211_paper.js scripts/boat_edge_v211_paper_sim.py scripts/boat_edge_v211_replay_20261008.py index.html .github/workflows/BOAT_EDGE_V209_AI_AUTORUN_SIM.yml
            if git diff --cached --quiet; then echo V211_INSTALL_IDEMPOTENT_PASS; break; fi
            git commit -m 'V211 daily 50k paper allocation and condensed simulator dashboard'
            if git push origin HEAD:main; then echo V211_ASSETS_PUBLISHED; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Freeze prospective decisions before any result access
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v211_paper_sim.py select
            git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
            if git diff --cached --quiet; then echo V211_SELECT_NO_NEW_CHANGES; break; fi
            git commit -m 'V211 paper pre-result decisions, daily 50k ceiling'
            if git push origin HEAD:main; then echo V211_SELECT_COMMIT_PASS; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Settle previously frozen paper records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v211_paper_sim.py settle
            git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
            if git diff --cached --quiet; then echo V211_SETTLE_NO_NEW_CHANGES; break; fi
            git commit -m 'V211 settle only previously committed paper bets'
            if git push origin HEAD:main; then echo V211_SETTLE_COMMIT_PASS; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Publish strictly retrospective Oct 8 replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            if [ ! -f data/site_paper_sim/replay_20261008.json ]; then
              python3 scripts/boat_edge_v211_replay_20261008.py
            fi
            test -s ai-simulation-20261008.html
            test -s data/site_paper_sim/replay_20261008.json
            python3 - <<'PYTEST'
          from pathlib import Path
          import json
          r=json.loads(Path('data/site_paper_sim/replay_20261008.json').read_text())
          assert r['scope']=='SITE_REFERENCE_HISTORICAL_DIAGNOSTIC_NOT_FORMAL_FRESH'
          assert r['paper_simulation']['closing_balance_yen']==50000
          assert r['paper_simulation']['paper_bets']==0
          assert r['paper_simulation']['roi_percent'] is None
          print('V211_10_8_REPLAY_NO_FABRICATED_BETS_PASS')
          PYTEST
            git add -- ai-simulation-20261008.html data/site_paper_sim/replay_20261008.json
            if git diff --cached --quiet; then echo V211_REPLAY_NO_NEW_CHANGES; break; fi
            git commit -m 'V211 October 8 historical replay without retroactive purchases'
            if git push origin HEAD:main; then echo V211_REPLAY_COMMIT_PASS; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
