name: BOAT EDGE V97 Odds Payout UX

on:
  push:
    paths:
      - ".github/workflows/site-v97.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V97 odds payout overlay
        shell: bash
        run: |
          mkdir -p assets
          cat > assets/boat_edge_v97.js <<'JS'
          /* BOAT_EDGE_V97_ODDS_PAYOUT_UX */
          (()=>{"use strict";
          const cache=new Map();
          const yen=n=>Number.isFinite(n)?Math.round(n).toLocaleString()+"円":"－";
          const pct=n=>Number.isFinite(n)?Math.round(n).toLocaleString()+"%":"－";
          const numText=s=>{const m=String(s||"").replace(/,/g,"").match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null};
          const raceKey=()=>{const f=window.be90cur?.f||"";return f.match(/(\d{8}-\d{2}-\d{2})/)?.[1]||null};
          async function oddsFor(key){
            if(!key)return null;
            const hit=cache.get(key), now=Date.now();
            if(hit&&now-hit.at<15000)return hit.value;
            const value=await fetch(`./data/site_odds/${key}.json?t=${now}`,{cache:"no-store"}).then(async r=>r.ok?r.json():null).catch(()=>null);
            cache.set(key,{at:now,value});return value;
          }
          function ensureInfo(row){
            let el=row.querySelector(".be97-odds");
            if(!el){el=document.createElement("div");el.className="be97-odds";row.appendChild(el)}
            return el;
          }
          function augmentRows(doc){
            const rows=[...document.querySelectorAll("#buyBoard .buy-ticket")];
            if(!rows.length)return;
            const odds=doc?.trifecta_odds||{};
            let total=0,minPay=Infinity,maxPay=0,minProfit=Infinity,maxProfit=-Infinity,priced=0;
            for(const row of rows){
              const combo=row.querySelector(".buy-combo")?.textContent?.trim();
              const stake=numText(row.querySelector(".buy-money")?.textContent);
              const o=combo?Number(odds[combo]):NaN;
              if(Number.isFinite(stake))total+=stake;
              const box=ensureInfo(row);
              if(!Number.isFinite(o)||!Number.isFinite(stake)||stake<=0){
                box.innerHTML='<span class="miss">オッズ未取得</span>';
                continue;
              }
              const payout=stake*o;
              const profit=payout;
              priced++;
              minPay=Math.min(minPay,payout);maxPay=Math.max(maxPay,payout);
              box.dataset.payout=String(payout);
              box.dataset.stake=String(stake);
              box.dataset.odds=String(o);
              box.innerHTML=`<span><small>オッズ</small><b>${o.toFixed(1)}倍</b></span><span><small>的中時払戻</small><b>${yen(payout)}</b></span><span><small>回収率</small><b class="be97-roi">計算中</b></span><span><small>損益</small><b class="be97-profit">計算中</b></span>`;
            }
            // total investment must be computed after all rows are scanned.
            for(const row of rows){
              const payout=Number(row.querySelector(".be97-odds")?.dataset?.payout);
              if(!Number.isFinite(payout)||!total)continue;
              const roi=payout/total*100;
              const profit=payout-total;
              minProfit=Math.min(minProfit,profit);maxProfit=Math.max(maxProfit,profit);
              const roiEl=row.querySelector(".be97-roi"), profitEl=row.querySelector(".be97-profit");
              if(roiEl)roiEl.textContent=pct(roi);
              if(profitEl){profitEl.textContent=(profit>=0?"+":"")+yen(profit);profitEl.classList.toggle("plus",profit>=0);profitEl.classList.toggle("minus",profit<0)}
            }
            let summary=document.querySelector("#buyBoard .be97-summary");
            if(!summary){summary=document.createElement("div");summary.className="be97-summary";document.getElementById("buyBoard")?.appendChild(summary)}
            if(priced){
              summary.innerHTML=`<div><small>総投資</small><b>${yen(total)}</b></div><div><small>的中時払戻レンジ</small><b>${yen(minPay)}〜${yen(maxPay)}</b></div><div><small>損益レンジ</small><b>${(minProfit>=0?"+":"")+yen(minProfit)}〜${(maxProfit>=0?"+":"")+yen(maxProfit)}</b></div><p>※各買い目が的中した場合の払戻。オッズは変動するため購入時点の値とズレる場合があります。</p>`;
            }else{
              summary.innerHTML=`<div><small>総投資</small><b>${yen(total)}</b></div><div><small>オッズ</small><b>未取得</b></div><p>公式3連単オッズ取得後に、払戻・損益・回収率を自動表示します。</p>`;
            }
          }
          let lastKey="",lastStamp=0;
          async function run(){
            const key=raceKey();if(!key)return;
            const now=Date.now();
            if(key===lastKey&&now-lastStamp<5000)return;
            lastKey=key;lastStamp=now;
            const doc=await oddsFor(key);
            augmentRows(doc);
          }
          new MutationObserver(()=>run()).observe(document.documentElement,{subtree:true,childList:true});
          setInterval(run,2500);run();
          })();
          JS

          cat > assets/boat_edge_v97.css <<'CSS'
          /* BOAT_EDGE_V97_ODDS_PAYOUT_UX */
          #buyBoard .buy-ticket{grid-template-columns:32px 34px minmax(76px,1fr) 56px 68px!important;grid-template-areas:"check rank combo prob money" "odds odds odds odds odds"}
          #buyBoard .buy-check{grid-area:check}#buyBoard .buy-rank{grid-area:rank}#buyBoard .buy-combo{grid-area:combo}#buyBoard .buy-prob{grid-area:prob}#buyBoard .buy-money{grid-area:money}
          .be97-odds{grid-area:odds;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:5px;padding-top:7px;border-top:1px dashed #dfe9f6}
          .be97-odds>span{display:block;background:#f7fbff;border:1px solid #e6eef8;border-radius:9px;padding:6px 7px;min-width:0}
          .be97-odds small{display:block;font-size:8px;color:#71859c;font-weight:800;white-space:nowrap}.be97-odds b{display:block;font-size:10px;color:#173d6b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .be97-odds .plus{color:#08795a}.be97-odds .minus{color:#c03b55}.be97-odds .miss{grid-column:1/-1;color:#8b98a8;font-size:9px;background:#f8fafc}
          .be97-summary{grid-column:1/-1;margin-top:10px;padding:11px;border:1px solid #cfe1f6;border-radius:13px;background:linear-gradient(180deg,#f8fbff,#eef6ff);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
          .be97-summary>div{padding:8px;border-radius:10px;background:#fff;border:1px solid #e2ecf8}.be97-summary small{display:block;color:#71859c;font-size:8px}.be97-summary b{display:block;color:#173d6b;font-size:12px;margin-top:3px}.be97-summary p{grid-column:1/-1;margin:0;font-size:8px;color:#71859c;line-height:1.5}
          @media(max-width:640px){.be97-odds{grid-template-columns:repeat(2,minmax(0,1fr))}.be97-summary{grid-template-columns:1fr}.be97-summary p{grid-column:1}.be97-odds b{font-size:9px}}
          CSS

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          h=p.read_text(encoding="utf-8")
          h=re.sub(r'\s*<script src=["\']\./assets/boat_edge_v97\.js(?:\?v=\d+)?["\']></script>\s*','\n',h)
          h=re.sub(r'\s*<link[^>]+boat_edge_v97\.css(?:\?v=\d+)?[^>]*>\s*','\n',h)
          h=h.replace('</head>','<link rel="stylesheet" href="./assets/boat_edge_v97.css?v=97">\n</head>')
          h=h.replace('</body>','<script src="./assets/boat_edge_v97.js?v=97"></script>\n</body>')
          h=re.sub(r'<meta name="boat-edge-site-version" content="[^"]+">','<meta name="boat-edge-site-version" content="V97-ODDS-PAYOUT">',h)
          h=h.replace('<li><b>未接続</b>: オッズ / 選手写真 / 詳細コース別長期成績 / AI予測ST / モーター詳細ランキング。未接続値は作らず「未取得」で表示</li>',
                      '<li><b>オッズ接続済み</b>: BOAT RACE公式3連単オッズ（締切45分前〜5分後）。配分から的中時払戻・損益・回収率を表示</li><li><b>未接続</b>: 選手写真 / 詳細コース別長期成績 / AI予測ST / モーター詳細ランキング。未接続値は作らず「未取得」で表示</li>')
          p.write_text(h,encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          node --check assets/boat_edge_v97.js
          grep -q 'BOAT_EDGE_V97_ODDS_PAYOUT_UX' assets/boat_edge_v97.js
          grep -q 'V97-ODDS-PAYOUT' index.html
          grep -q 'boat_edge_v97.js?v=97' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/boat_edge_v97.js assets/boat_edge_v97.css
          git diff --cached --quiet && exit 0
          git commit -m "Add BOAT EDGE V97 odds payout UX"
          git push
