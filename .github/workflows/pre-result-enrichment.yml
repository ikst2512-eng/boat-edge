name: PRE_RESULT enrichment validation
on:
  push:
    paths:
      - tools/validate_pre_result_enrichment.py
      - tools/test_validate_pre_result_enrichment.py
      - tools/archive_pre_result_source.py
      - tools/test_archive_pre_result_source.py
      - tools/verify_pre_result_capture.py
      - tools/test_verify_pre_result_capture.py
      - tools/parse_explicit_start_order.py
      - tools/test_parse_explicit_start_order.py
      - tools/build_verified_entry_candidate.py
      - tools/test_build_verified_entry_candidate.py
      - tools/ingest_verified_start_order.py
      - tools/test_ingest_verified_start_order.py
      - tools/capture_imminent_pre_result.py
      - tools/test_capture_imminent_pre_result.py
      - tools/prepare_public_entry_sidecars.py
      - tools/test_prepare_public_entry_sidecars.py
      - tools/apply_pre_result_enrichment.py
      - .github/workflows/pre-result-enrichment.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pre-result enrichment tests
        run: |\n          python -m unittest discover -s tools -p 'test_*pre_result*.py' -v\n          python -m unittest discover -s tools -p 'test_parse_explicit_start_order.py' -v
          python -m unittest discover -s tools -p 'test_build_verified_entry_candidate.py' -v
          python -m unittest discover -s tools -p 'test_ingest_verified_start_order.py' -v
          python -m unittest discover -s tools -p 'test_capture_imminent_pre_result.py' -v
          python -m unittest discover -s tools -p 'test_prepare_public_entry_sidecars.py' -v
