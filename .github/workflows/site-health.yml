name: BOAT EDGE 稼働ステータス V72

on:
  push:
    paths:
      - ".github/workflows/site-health.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boat-edge-site-health-v72
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: V72反映・稼働状況生成
        shell: bash
        env:
          BE72_ADDON_B64: ""
        run: |
          python - <<'PY'
          import os, re, json, base64, hashlib
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST).isoformat(timespec="seconds")

          def load(path):
              p=Path(path)
              try:return json.loads(p.read_text(encoding="utf-8"))
              except:return {}

          js=Path("assets/boat_edge_simple_v51.js")
          s=js.read_text(encoding="utf-8")
          marker="BOAT_EDGE_SITE_V72_LIVE_STATUS"
          if marker not in s:
              addon=base64.b64decode(os.environ["BE72_ADDON_B64"]).decode("utf-8")
              s=re.sub(r'^/\* BOAT_EDGE_SITE_V\d+_[^*]+ \*/',
                       '/* BOAT_EDGE_SITE_V72_LIVE_STATUS */',s,count=1)
              s=s.rstrip()+"\n\n"+addon+"\n"
              js.write_text(s,encoding="utf-8")

          odds=load("data/site_odds/index.json")
          learning=load("data/site_learning/summary.json")
          results=load("data/site_results/index.json")
          today=load("data/today.json")

          health={
            "schema_version":"boat-edge-site-health-v72",
            "site_version":"V72",
            "generated_at":now,
            "site_asset_v72":marker in js.read_text(encoding="utf-8"),
            "asset_sha256":hashlib.sha256(js.read_bytes()).hexdigest(),
            "today":{
              "date":today.get("date"),
              "updated_at":today.get("updated_at"),
              "phase":today.get("phase"),
              "results_seen":today.get("results_seen"),
              "unlock":today.get("unlock"),
              "scoring":today.get("scoring"),
              "active_venues":len(today.get("venues",[]))
            },
            "odds":{
              "updated_at":odds.get("updated_at"),
              "checked":odds.get("checked",0),
              "updated":odds.get("updated",0),
              "errors":len(odds.get("errors",[])),
              "prediction_logic_uses_odds":odds.get("prediction_logic_uses_odds",False),
              "source":odds.get("source")
            },
            "results":{
              "updated_at":results.get("updated_at"),
              "checked":results.get("checked",0),
              "updated":results.get("updated",0),
              "errors":len(results.get("errors",[]))
            },
            "learning":{
              "updated_at":learning.get("updated_at"),
              "evaluated":learning.get("evaluated",0),
              "ranked":learning.get("ranked",0),
              "top10_rate":learning.get("top10_rate"),
              "top30_rate":learning.get("top30_rate"),
              "avg_rank":learning.get("avg_rank"),
              "results_seen_in_prediction":learning.get("results_seen_in_prediction",False)
            }
          }
          Path("data/site_health.json").write_text(
              json.dumps(health,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(health,ensure_ascii=False))
          PY

      - name: 保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js data/site_health.json
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V72 live status"
          git push
