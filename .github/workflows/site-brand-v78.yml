name: BOAT EDGE V78 ブランドタイトル

on:
  push:
    paths:
      - ".github/workflows/site-brand-v78.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: V78タイトル反映
        shell: bash
        env:
          BE78_JS: ""
          BE78_CSS: ""
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          jp=Path("assets/boat_edge_simple_v51.js")
          cp=Path("assets/boat_edge_simple_v51.css")
          js=jp.read_text(encoding="utf-8")
          css=cp.read_text(encoding="utf-8")
          if "BOAT_EDGE_SITE_V78_BRAND_TITLE" not in js:
              js=js.rstrip()+"\n\n"+base64.b64decode(os.environ["BE78_JS"]).decode()+"\n"
          if "BOAT_EDGE_SITE_V78_BRAND_TITLE" not in css:
              css=css.rstrip()+"\n\n"+base64.b64decode(os.environ["BE78_CSS"]).decode()+"\n"
          jp.write_text(js,encoding="utf-8")
          cp.write_text(css,encoding="utf-8")
          PY

      - name: V78キャッシュ更新
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html");s=p.read_text(encoding="utf-8")
          s=re.sub(r'boat_edge_simple_v51\.js(?:\?v=\d+)?','boat_edge_simple_v51.js?v=78',s)
          s=re.sub(r'boat_edge_simple_v51\.css(?:\?v=\d+)?','boat_edge_simple_v51.css?v=78',s)
          p.write_text(s,encoding="utf-8")
          PY

      - name: 保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js assets/boat_edge_simple_v51.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V78 brand title"
          git push
