# BOAT EDGE 01: V195 was a one-time bootstrap that dispatched V194.
# The V194 diagnostics schedule is now independently owned by V194 itself.
# Keep a manual read-only tombstone to prevent accidental resurrection of
# an obsolete scheduler/dispatcher. Freeze writers V180/V185 are untouched.
name: BOAT EDGE V195 - Retired V194 Bootstrap (Manual No-op)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain current ownership without dispatch or data writes
        run: |
          echo 'V195_RETIRED_NO_V194_REDISPATCH'
          echo 'V180 and V185 own prospective research freezes.'
          echo 'V194 owns hourly research-only health diagnostics.'
