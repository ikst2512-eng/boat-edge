name: BOAT EDGE V213 - Prospective Shadow ROI Audit (No Purchases)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V213_SHADOW_ROI.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v213-shadow-ledger
  cancel-in-progress: false
jobs:
  shadow-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install isolated shadow model and site tab
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 - <<'PYINSTALL'
          from pathlib import Path
          import base64,gzip,hashlib
          P={'scripts/boat_edge_v213_shadow.py': {'sha256': '0a745d52886ad6eb7374dd63c99fc5bb581a0e2f6bd76ae20a49c149ebc4a1b6', 'base64_gzip': ''}, 'assets/boat_edge_v213_shadow.js': {'sha256': '2f74b3ffae34f81bdd5a5d84a4349a208379294862c1165a8726cc6422a3745c', 'base64_gzip': ''}, 'assets/boat_edge_v213_shadow.css': {'sha256': '7862d33f90ff5aa7769ff07ef3464f45d0404ca843b0fcce924ff214795c1fc1', 'base64_gzip': ''}}
          for name,archive in P.items():
              b=gzip.decompress(base64.b64decode(archive['base64_gzip']))
              if hashlib.sha256(b).hexdigest()!=archive['sha256']:raise SystemExit('V213_ARTIFACT_SHA_MISMATCH '+name)
              f=Path(name)
              if f.exists() and f.read_bytes()!=b:raise SystemExit('V213_EXISTING_CODE_CONFLICT '+name)
              if not f.exists():
                  f.parent.mkdir(parents=True,exist_ok=True)
                  f.write_bytes(b)
                  print('V213_ADD '+name)
          page=Path('ai-simulation.html')
          if not page.is_file():raise SystemExit('V213_V212_NOT_INSTALLED')
          s=page.read_text(encoding='utf-8')
          if 'boat_edge_v211_paper.js?v=211' not in s or '50,000' not in s or 'panel-decision' not in s:
              raise SystemExit('V213_V212_UNRECOGNIZED_BASE')
          css='<link rel="stylesheet" href="./assets/boat_edge_v213_shadow.css?v=213">'
          js='<script defer src="./assets/boat_edge_v213_shadow.js?v=213"></script>'
          if css not in s or js not in s:
              if s.count('</head>')!=1:raise SystemExit('V213_BAD_HEAD')
              s=s.replace('</head>',(css+'\n' if css not in s else '')+(js+'\n' if js not in s else '')+'</head>')
          if s.count(css)!=1 or s.count(js)!=1:raise SystemExit('V213_DUPLICATED_IMPORT')
          if s!=page.read_text(encoding='utf-8'):page.write_text(s,encoding='utf-8')
          print('V213_ISOLATED_SHADOW_INSTALL_PASS')
          PYINSTALL
           python3 -m py_compile scripts/boat_edge_v213_shadow.py
           node --check assets/boat_edge_v213_shadow.js
           git add -- ai-simulation.html scripts/boat_edge_v213_shadow.py assets/boat_edge_v213_shadow.js assets/boat_edge_v213_shadow.css
           if git diff --cached --quiet; then echo V213_INSTALL_ALREADY_PRESENT_PASS; break; fi
           git commit -m 'V213 prospective shadow verification UI and engine'
           if git push origin HEAD:main; then echo V213_INSTALL_PASS; break; fi
           if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Freeze shadow candidates without result file access
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v213_shadow.py freeze
           git add -- data/site_paper_sim/shadow_v213_ledger.json data/site_paper_sim/shadow_v213_current.json
           if git diff --cached --quiet; then echo V213_FREEZE_NO_CHANGE; break; fi
           git commit -m "V213 frozen prospective shadow candidates, no result lookup"
           if git push origin HEAD:main; then echo V213_FREEZE_COMMITTED; break; fi
           if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Freeze daily 50K paper selection with no result read
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v211_paper_sim.py select
           git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
           if git diff --cached --quiet; then echo V213_PAPER_SELECT_NO_CHANGE; break; fi
           git commit -m "V213 retains V211 daily 50k paper selection, no result reads"
           if git push origin HEAD:main; then echo V213_PAPER_SELECT_COMMITTED; break; fi
           if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Score only already frozen shadow predictions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v213_shadow.py settle
           git add -- data/site_paper_sim/shadow_v213_ledger.json data/site_paper_sim/shadow_v213_current.json
           if git diff --cached --quiet; then echo V213_SETTLE_NO_CHANGE; break; fi
           git commit -m "V213 shadow-only outcomes scored after frozen predictions"
           if git push origin HEAD:main; then echo V213_SETTLE_COMMITTED; break; fi
           if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Settle only earlier committed 50K paper transactions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v211_paper_sim.py settle
           git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
           if git diff --cached --quiet; then echo V213_PAPER_SETTLE_NO_CHANGE; break; fi
           git commit -m "V213 retains V211 prior frozen paper settlement"
           if git push origin HEAD:main; then echo V213_PAPER_SETTLE_COMMITTED; break; fi
           if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Disable replaced V212 schedule after V213 success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for file in BOAT_EDGE_V212_PAPER_SIM_INSTALL.yml; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${file}/disable"; then
               echo "V213_PREVIOUS_SCHEDULER_DISABLED $file"
            else
               echo "V213_SCHEDULER_DISABLE_NEEDS_MANUAL_ACTION $file"
            fi
          done
          exit 0
