name: BOAT EDGE V212 - Deploy Daily 50K Simulator (Safe Install)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V212_PAPER_SIM_INSTALL.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v212-paper-only
  cancel-in-progress: false
jobs:
  deploy-and-monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install paper simulator without touching workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PYINSTALL'
          from pathlib import Path
          import gzip,base64,hashlib,re
          FILES={'ai-simulation.html': {'sha256': '1525528e8caf18a58d01d13a575110ea5bccbb6d5950c007173eef5ebf126609', 'gzip_b64': ''}, 'assets/boat_edge_v211_paper.css': {'sha256': 'be636a399ae9ea7c66e29885bd4e02ed871b171cc544f6e8dae9870a23fac6ea', 'gzip_b64': ''}, 'assets/boat_edge_v211_paper.js': {'sha256': '9eed09cad99634ca4b8fd89f84fdccec9b179ea42cd7d889bf364d2913c99e8a', 'gzip_b64': ''}, 'scripts/boat_edge_v211_paper_sim.py': {'sha256': 'dfd48dfe738fb49d9a00f46d195a1ad94c2cc9e2fe173b1332da12e76cfa3401', 'gzip_b64': ''}, 'scripts/boat_edge_v211_replay_20261008.py': {'sha256': 'df565a8eaf2e53bba872d19833ca45ec8ad95931efa96fb873913eba6d5abe8e', 'gzip_b64': ''}}
          for relative,record in FILES.items():
              raw=gzip.decompress(base64.b64decode(record['gzip_b64']))
              if hashlib.sha256(raw).hexdigest()!=record['sha256']:raise SystemExit('V212_SOURCE_SHA_MISMATCH '+relative)
              dest=Path(relative)
              if dest.exists() and dest.read_bytes()!=raw:
                  if relative!='ai-simulation.html' or not any(z in dest.read_text(encoding='utf8') for z in ('V209','V211')):
                      raise SystemExit('V212_UNEXPECTED_ASSET_CONFLICT '+relative)
              dest.parent.mkdir(parents=True,exist_ok=True)
              if not dest.exists() or dest.read_bytes()!=raw:
                  dest.write_bytes(raw)
                  print('V212_INSTALL '+relative)
          index=Path('index.html')
          if not index.exists():raise SystemExit('V212_MAIN_INDEX_MISSING')
          s=index.read_text(encoding='utf8')
          if 'boat_edge_v208_latest_clean.css?v=208' not in s or not re.search(r'boat_edge_v207_first_prediction[.]js\?v=(207|208)',s):
              raise SystemExit('V212_REQUIRES_CURRENT_V208')
          css='<link rel="stylesheet" href="./assets/boat_edge_v211_paper.css?v=211">'
          if css not in s:
              if s.count('</head>')!=1:raise SystemExit('V212_HEAD_UNEXPECTED')
              s=s.replace('</head>',css+'\n</head>')
          old='<a class="be209-header-link" href="./ai-simulation.html">AI自走シミュレーション</a>'
          new='<a class="be209-header-link" href="./ai-simulation.html" aria-label="AI自走シミュレーション"><span>AI自走</span><span>シミュレーション</span></a>'
          if old in s:s=s.replace(old,new)
          if new not in s:
              match=re.search(r'<div class="brandtext">BOAT EDGE <small>[^<]*</small></div>',s)
              if not match:raise SystemExit('V212_NO_BRAND_ANCHOR')
              s=s[:match.end()]+new+s[match.end():]
          if s.count(new)!=1 or s.count(css)!=1:raise SystemExit('V212_DUPLICATE_LINK_OR_CSS')
          if index.read_text(encoding='utf8')!=s:index.write_text(s,encoding='utf8')
          print('V212_INSTALL_SAFE_NO_WORKFLOW_FILE_MUTATION_PASS')
          PYINSTALL
            python3 -m py_compile scripts/boat_edge_v211_paper_sim.py scripts/boat_edge_v211_replay_20261008.py
            node --check assets/boat_edge_v211_paper.js
            git add -- index.html ai-simulation.html assets/boat_edge_v211_paper.css assets/boat_edge_v211_paper.js scripts/boat_edge_v211_paper_sim.py scripts/boat_edge_v211_replay_20261008.py
            if git diff --cached --quiet; then echo V212_ALREADY_INSTALLED_PASS; break; fi
            git commit -m 'V212 install BOAT EDGE daily 50K paper simulator (no workflow edits)'
            if git push origin HEAD:main; then echo V212_INSTALL_COMMIT_SUCCESS; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Freeze potential paper decisions before result reads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v211_paper_sim.py select
            git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
            if git diff --cached --quiet; then echo V212_SELECT_NO_CHANGES; break; fi
            git commit -m "V212 paper-only 50K decisions frozen before result reads"
            if git push origin HEAD:main; then echo V212_SELECT_COMMIT_SUCCESS; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Settle only previously frozen decisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v211_paper_sim.py settle
            git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
            if git diff --cached --quiet; then echo V212_SETTLE_NO_CHANGES; break; fi
            git commit -m "V212 settle previously frozen virtual tickets only"
            if git push origin HEAD:main; then echo V212_SETTLE_COMMIT_SUCCESS; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Build historical Oct 8 replay without retroactive purchases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v211_replay_20261008.py
            test -s ai-simulation-20261008.html
            test -s data/site_paper_sim/replay_20261008.json
            python3 - <<'PYTEST'
          import json
          from pathlib import Path
          r=json.loads(Path('data/site_paper_sim/replay_20261008.json').read_text())
          assert r['scope']=='SITE_REFERENCE_HISTORICAL_DIAGNOSTIC_NOT_FORMAL_FRESH'
          assert r['paper_simulation']['closing_balance_yen']==50000
          assert r['paper_simulation']['paper_bets']==0
          assert r['paper_simulation']['roi_percent'] is None
          assert not r['paper_simulation']['no_ex_post_purchases'] is False
          print('V212_10_8_REPLAY_NO_RETROACTIVE_BETS_PASS')
          PYTEST
            git add -- ai-simulation-20261008.html data/site_paper_sim/replay_20261008.json
            if git diff --cached --quiet; then echo V212_REPLAY_NO_CHANGES; break; fi
            git commit -m "V212 Oct 8 replay, results descriptive only"
            if git push origin HEAD:main; then echo V212_REPLAY_COMMIT_SUCCESS; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Attempt to disable outdated V209 and failed V211 schedules
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for file in BOAT_EDGE_V209_AI_AUTORUN_SIM.yml BOAT_EDGE_V211_DAILY_50K_SIM.yml; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${file}/disable"; then
              echo "V212_OLD_WORKFLOW_DISABLED ${file}"
            else
              echo "V212_OLD_WORKFLOW_MANUAL_DISABLE_REQUIRED ${file} (Actions permission unavailable)"
            fi
          done
          exit 0
