name: BOAT EDGE C1 - Read-only First Git Evidence Accounting

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/boat_edge_c1_observed_audit.py'
      - 'tests/test_boat_edge_c1_observed_audit.py'
      - '.github/workflows/c1-observed-git-audit.yml'

permissions:
  contents: read

jobs:
  observed-only-git-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify provisional versus proven Git cases
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_c1_observed_audit.py' -v
      - name: Audit historical October 20 first Git receipts (read only)
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/boat_edge_c1_observed_audit.py --day 20261020 > /tmp/c1-historical.json
          python3 - <<'PY_C1_HIST'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/c1-historical.json').read_text())
          print('C1_HISTORICAL_COUNTS',json.dumps({
              'day':d['day_jst'],'observed':d['observed_races'],
              'status':d['classification_counts'],
              'receipt':d['receipt_status_counts'],
              'eligible_denominator_verified':d['eligible_denominator_verified']},sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### Historical C1 evidence, observed cohort only\\n\\n')
              out.write(json.dumps(d['classification_counts'],sort_keys=True)+'\\n\\n')
              out.write('C1 99% acceptance: NOT PROVEN\\n')
          PY_C1_HIST
      - name: Summarize actual Git receipts without writing predictions
        if: github.ref == 'refs/heads/main'
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/boat_edge_c1_observed_audit.py > /tmp/c1-observed-audit.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path('/tmp/c1-observed-audit.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### C-1 observed first Git accounting (NOT 99% proof)\n\n')
              out.write('Observed races: '+str(result['observed_races'])+'\n\n')
              out.write('Status counts: '+json.dumps(result['classification_counts'],sort_keys=True)+'\n\n')
              out.write('Not observed: '+str(result['not_observed_count'])+'\n\n')
              out.write('Eligible denominator independently verified: NO\n')
          PY
