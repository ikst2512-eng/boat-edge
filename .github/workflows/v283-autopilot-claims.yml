name: BOAT EDGE V283 - Distinct Autopilot Safety Claims

on:
  push:
    branches: [main, fix/v283-selfdrive-claim-separation]
    paths:
      - 'autopilot.html'
      - 'assets/boat_edge_v283_claims.js'
      - 'BOAT_EDGE_AUTODEV_TASKS.md'
      - 'tests/test_boat_edge_v283_claims.cjs'
      - '.github/workflows/v283-autopilot-claims.yml'
  pull_request:
    paths:
      - 'autopilot.html'
      - 'assets/boat_edge_v283_claims.js'
      - 'BOAT_EDGE_AUTODEV_TASKS.md'
      - 'tests/test_boat_edge_v283_claims.cjs'
      - '.github/workflows/v283-autopilot-claims.yml'
permissions:
  contents: read
concurrency:
  group: boat-edge-v283-safety-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check UI-only formal lock and published/test distinction
        run: |
          set -euo pipefail
          node --check assets/boat_edge_v283_claims.js
          node tests/test_boat_edge_v283_claims.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v240_guard.py' -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('data/formal_status.json').read_text())['guards']
          assert all(g[k] is False for k in ('results_seen','unlock','scoring'))
          assert g['RESULT_UNLOCK_TOKEN'] is None
          print('V283_FORMAL_LOCK_UNTOUCHED')
          PY
          git diff --check
