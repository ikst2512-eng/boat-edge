name: BOAT EDGE Development CI
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'assets/**', 'health.html', '.github/workflows/**', 'AGENTS.md']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'assets/**', 'health.html', '.github/workflows/**', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-edge-development-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-only-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            assets
            .github
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pyyaml
      - name: Validate tracked source pins
        run: python3 scripts/verify_workflow_source_pins.py
      - name: Test guards, exact odds mapping, immutable prediction evidence and daily budgets
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v23*.py' -q
      - name: Ensure obsolete UI installers cannot race current owners
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v298*.py' -q
      - name: Verify strict V256 official 120-price source provenance (fail closed)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v256_odds_guard.py' -v
      - name: Guard V254 site-only research against unverified formal cohorts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH=tests python3 -m unittest -v \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_formal_first100_missing_nonzero_or_wrong_type_fails_before_site_reads \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_empty_formal_first100_is_accepted_without_unlocking \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_bad_formal_guard_blocks_even_research
      - name: Test JST rollover and virtual balance display
        run: node --test tests/test_boat_edge_v271_health.cjs
      - name: Check live odds invalidation without fetching results
        run: node tests/test_boat_edge_v222_live_odds.cjs assets/boat_edge_v222_live_odds.js
