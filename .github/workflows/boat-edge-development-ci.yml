name: BOAT EDGE Development CI
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'assets/**', 'health.html', '.github/workflows/**', 'AGENTS.md']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'assets/**', 'health.html', '.github/workflows/**', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-edge-development-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-only-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            assets
            .github
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pyyaml
      - name: Validate tracked source pins
        run: python3 scripts/verify_workflow_source_pins.py
      - name: Test guards, exact odds mapping, immutable prediction evidence and daily budgets
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v23*.py' -q
      - name: Ensure obsolete UI installers cannot race current owners
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v298*.py' -q
      - name: Verify strict V256 official 120-price source provenance (fail closed)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v256_odds_guard.py' -v
      - name: Enforce retired Actions schedules and inspect potential concurrent main writers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v299_workflow_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v342_retired_schedulers.py' -v
          python3 scripts/boat_edge_v299_workflow_inventory.py
      - name: Audit static scheduled staging-path overlaps without disabling workflows
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v341_scheduled_writer_path_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v343_scheduled_writer_collision_classes.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v344_exact_writer_triage.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v345_writer_trigger_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v346_runtime_proof_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v347_runtime_evidence_intake.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v348_actions_run_export.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v349_schedule_run_overlap.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v351_scheduled_evidence.py' -v
          python3 - <<'PY_V341'
          from scripts.boat_edge_v341_scheduled_writer_path_audit import audit
          import json
          a = audit()
          print('V341_READONLY_WRITER_PATH_AUDIT_PASS')
          print(json.dumps({
              'scheduled_writer_candidates': a['scheduled_contents_write_candidates'],
              'overlap_pair_candidates': a['candidate_overlapping_workflow_pairs'],
              'unknown_path_candidates': a['candidates_with_no_literal_staging_path'],
              'verified_duplicate_writers': a['verified_duplicate_writers'],
              'overlap_is_only_candidate_not_proof': a['overlap_is_only_candidate_not_proof'],
          }, sort_keys=True))
          PY_V341
          python3 - <<'PY_V343'
          from scripts.boat_edge_v343_scheduled_writer_collision_classes import audit
          import json
          a = audit()
          assert a['verified_duplicate_writers'] == 0
          assert a['classification_does_not_authorize_workflow_disable']
          print('V343_REAL_WORKFLOW_CLASSIFICATION_CANDIDATE_ONLY_PASS')
          print(json.dumps({
              'pair_class_counts': a['pair_class_counts'],
              'exact_path_witness_count': a['exact_path_witness_count'],
              'parent_directory_witness_count': a['parent_directory_witness_count'],
              'candidate_overlapping_workflow_pairs': a['candidate_overlapping_workflow_pairs'],
              'candidates_with_unresolved_staging': a['candidates_with_unresolved_staging'],
          }, sort_keys=True))
          PY_V343
      - name: Guard V254 site-only research with synthetic formal-cohort fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH=tests python3 -m unittest -v \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_formal_first100_missing_nonzero_or_wrong_type_fails_before_site_reads \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_empty_formal_first100_is_accepted_without_unlocking \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_bad_formal_guard_blocks_even_research
      - name: Test JST rollover and virtual balance display
        run: node --test tests/test_boat_edge_v271_health.cjs
      - name: Check live odds invalidation without fetching results
        run: node tests/test_boat_edge_v222_live_odds.cjs assets/boat_edge_v222_live_odds.js
