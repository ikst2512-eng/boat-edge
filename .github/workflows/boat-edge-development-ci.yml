name: BOAT EDGE Development CI
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'assets/**', 'health.html', '.github/workflows/**', 'AGENTS.md']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'assets/**', 'health.html', '.github/workflows/**', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-edge-development-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-only-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            assets
            index.html
            ai-simulation.html
            .github
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pyyaml
      - name: Verify obsolete V226 recovery cannot interrupt active SITE collectors
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_01_v226_recovery_owner.py' -v
      - name: Validate tracked source pins
        run: python3 scripts/verify_workflow_source_pins.py
      - name: Check V229 live browser trigger needs real Git-first-add and SHA
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v01_live_browser_gate.py' -v
          python3 -m py_compile scripts/boat_edge_v01_live_browser_gate.py
      - name: Verify concurrent first-freeze preserves remote race and publishes unrelated source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v01_prune_frozen_collector.py' -v
          python3 -m py_compile scripts/boat_edge_v01_prune_frozen_collector.py
      - name: Verify conflict-safe collector rebase against simultaneous V186 scratch writes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v01_scratch_rebase_guard.py' -v
          python3 -m py_compile scripts/boat_edge_v01_scratch_rebase_guard.py
      - name: Verify same-run official scratch evidence (synthetic HTML only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v01_collector_scratch.py' -v
          python3 -m py_compile scripts/boat_edge_v01_collector_scratch.py
      - name: Reject false green published mobile TopK after V229 first Git-add
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_live_final_browser_acceptance.py' -v
          python3 -m py_compile scripts/boat_edge_01_live_final_browser_acceptance.py
      - name: Re-attest exact V228 live SITE model blob and no-result extraction
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v228_freeze_only.py' -v
      - name: Prove V235 08:20 window and source-bound Git first-add SHA (no result access)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v235_predeadline_receipt.py' -v
      - name: V392 verify prospective next-day official cards and independent UI TopK
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v392_card_preview.py' -v
          node tests/test_boat_edge_v392_early_prediction.cjs
          python3 -m py_compile scripts/boat_edge_v392_card_preview.py

      - name: Compile V136 production scorer before deployment
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m py_compile scripts/site_accuracy_v136.py scripts/site_v136_historical_proof.py
      - name: Validate V136 fresh-main SITE-only score publication on conflicts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v136_safe_publish.py' -v
      - name: Prove V136 old-day V125 audit and immutable first Git source before scoring
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v136_historical_proof.py' -v
      - name: Prove V257 cron ownership and strict single 08:20 prewarm before main
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v257_event_trigger.py' -v
      - name: Test guards, exact odds mapping, immutable prediction evidence and daily budgets
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v23*.py' -q
      - name: Ensure obsolete UI installers cannot race current owners
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v298*.py' -q
      - name: Verify strict V256 official 120-price source provenance (fail closed)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v256_odds_guard.py' -v
      - name: Enforce retired Actions schedules and inspect potential concurrent main writers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v125_git_race_safety.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_v125_preserve_v229_proof.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_pages_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v236_v336_research_workflow.py' -v
          python3 tests/test_boat_edge_v220_site_ops.py
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_v219_no_legacy_reinstall.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_v180_v185_v186_no_reinstall.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_v228_v232_no_old_bootstrap.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_v240_completed_queue.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_venue_legacy_reinstall.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_01_v167_no_reinstall.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v299_workflow_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v342_retired_schedulers.py' -v
          python3 scripts/boat_edge_v299_workflow_inventory.py
      - name: Audit static scheduled staging-path overlaps without disabling workflows
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_v341_scheduled_writer_path_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v343_scheduled_writer_collision_classes.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v344_exact_writer_triage.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v345_writer_trigger_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v346_runtime_proof_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v347_runtime_evidence_intake.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v348_actions_run_export.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v349_schedule_run_overlap.py' -v
          python3 -m unittest discover -s tests -p 'test_boat_edge_v351_scheduled_evidence.py' -v
          python3 - <<'PY_V341'
          from scripts.boat_edge_v341_scheduled_writer_path_audit import audit
          import json
          a = audit()
          print('V341_READONLY_WRITER_PATH_AUDIT_PASS')
          print(json.dumps({
              'scheduled_writer_candidates': a['scheduled_contents_write_candidates'],
              'overlap_pair_candidates': a['candidate_overlapping_workflow_pairs'],
              'unknown_path_candidates': a['candidates_with_no_literal_staging_path'],
              'verified_duplicate_writers': a['verified_duplicate_writers'],
              'overlap_is_only_candidate_not_proof': a['overlap_is_only_candidate_not_proof'],
          }, sort_keys=True))
          PY_V341
          python3 - <<'PY_V343'
          from scripts.boat_edge_v343_scheduled_writer_collision_classes import audit
          import json
          a = audit()
          assert a['verified_duplicate_writers'] == 0
          assert a['classification_does_not_authorize_workflow_disable']
          print('V343_REAL_WORKFLOW_CLASSIFICATION_CANDIDATE_ONLY_PASS')
          print(json.dumps({
              'pair_class_counts': a['pair_class_counts'],
              'exact_path_witness_count': a['exact_path_witness_count'],
              'parent_directory_witness_count': a['parent_directory_witness_count'],
              'candidate_overlapping_workflow_pairs': a['candidate_overlapping_workflow_pairs'],
              'candidates_with_unresolved_staging': a['candidates_with_unresolved_staging'],
          }, sort_keys=True))
          PY_V343
      - name: Verify forward-only provisional best-ten selection matches frozen V254
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_boat_edge_02_site_provisional_adoption.py' -v
          node tests/test_boat_edge_02_site_provisional_adoption.cjs
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v229_atomic_freeze.py' -v
          node --check assets/boat_edge_v108.js
          python3 -m py_compile scripts/site_final_history_v133.py
      - name: Guard V254 site-only research with synthetic formal-cohort fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH=tests python3 -m unittest -v \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_formal_first100_missing_nonzero_or_wrong_type_fails_before_site_reads \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_empty_formal_first100_is_accepted_without_unlocking \
            test_boat_edge_v254_third_tail.ProspectiveThirdTail.test_bad_formal_guard_blocks_even_research
      - name: Test JST rollover and virtual balance display
        run: node --test tests/test_boat_edge_v271_health.cjs
      - name: Check live odds invalidation without fetching results
        run: node tests/test_boat_edge_v222_live_odds.cjs assets/boat_edge_v222_live_odds.js
