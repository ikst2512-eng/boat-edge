      - name: Offline regression and JavaScript parser checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_site_mode_venue_v170.py' -v
          python3 -m py_compile scripts/site_mode_venue_v170.py
          node --check assets/boat_edge_v170_venue_accuracy.js

      - name: Generate descriptive V136 site prediction venue report
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_mode_venue_v170.py

      - name: Install display-only UI bindings without changing prediction engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUI'
          from pathlib import Path
          p=Path('index.html')
          data=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./assets/boat_edge_v170_venue_accuracy.css?v=170">'
          js='<script src="./assets/boat_edge_v170_venue_accuracy.js?v=170"></script>'
          if data.count('</head>')!=1 or data.count('</body>')!=1:
              raise RuntimeError('Unexpected site structure; no UI files committed')
          if css not in data:
              data=data.replace('</head>',css+'\n</head>')
          if js not in data:
              data=data.replace('</body>',js+'\n</body>')
          if data.count(css)!=1 or data.count(js)!=1:
              raise RuntimeError('Duplicate UI binding')
          p.write_text(data,encoding='utf-8')
          print('UI_BINDINGS_PASS',css,js)
          PYUI

      - name: Commit only descriptive venue statistics and display UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/site_mode_venue_v170.py tests/test_site_mode_venue_v170.py assets/boat_edge_v170_venue_accuracy.js assets/boat_edge_v170_venue_accuracy.css data/site_learning/mode_venue_accuracy_v170.json index.html
          if git diff --cached --quiet; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git commit -m 'V170: show audited website prediction hit rate and ROI by venue (display only)'
          git push origin HEAD:main
