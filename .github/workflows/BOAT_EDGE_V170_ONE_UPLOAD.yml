name: BOAT EDGE V170 - Prediction Venue Accuracy by Model Mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V170_ONE_UPLOAD.yml'
      - 'data/site_learning/mode_accuracy_v136.json'
  workflow_dispatch:
  schedule:
    - cron: '13 0-14 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v170-reference-venue-model-stats
  cancel-in-progress: false

jobs:
  display-site-prediction-venue-performance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current tracked V170 sources without restoring obsolete bundle
        shell: bash
        run: |
          set -euo pipefail
          # No historical compressed source is reinstalled on live main;
          # verified tracked sources can evolve through normal reviewed PRs.
          for source in scripts/site_mode_venue_v170.py tests/test_site_mode_venue_v170.py \
                        assets/boat_edge_v170_venue_accuracy.js assets/boat_edge_v170_venue_accuracy.css; do
            git ls-files --error-unmatch -- "$source" >/dev/null
            test -s "$source"
          done
          echo V170_TRACKED_SOURCES_NO_LEGACY_REINSTALL_PASS
      - name: Offline regression and JavaScript parser checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_site_mode_venue_v170.py' -v
          python3 -m py_compile scripts/site_mode_venue_v170.py
          node --check assets/boat_edge_v170_venue_accuracy.js

      - name: Generate descriptive V136 site prediction venue report
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_mode_venue_v170.py

      - name: Install display-only UI bindings without changing prediction engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUI'
          from pathlib import Path
          p=Path('index.html')
          data=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./assets/boat_edge_v170_venue_accuracy.css?v=170">'
          js='<script src="./assets/boat_edge_v170_venue_accuracy.js?v=170"></script>'
          if data.count('</head>')!=1 or data.count('</body>')!=1:
              raise RuntimeError('Unexpected site structure; no UI files committed')
          if css not in data:
              data=data.replace('</head>',css+'\n</head>')
          if js not in data:
              data=data.replace('</body>',js+'\n</body>')
          if data.count(css)!=1 or data.count(js)!=1:
              raise RuntimeError('Duplicate UI binding')
          p.write_text(data,encoding='utf-8')
          print('UI_BINDINGS_PASS',css,js)
          PYUI

      - name: Commit only descriptive venue statistics and display UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/site_mode_venue_v170.py tests/test_site_mode_venue_v170.py assets/boat_edge_v170_venue_accuracy.js assets/boat_edge_v170_venue_accuracy.css data/site_learning/mode_venue_accuracy_v170.json index.html
          if git diff --cached --quiet; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git commit -m 'V170: show audited website prediction hit rate and ROI by venue (display only)'
          # This site research report can race many unrelated live-data workers.
          # Never force-push and never overwrite a concurrent main update.
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo V170_SAFE_SITE_ONLY_PUBLISH_PASS
              exit 0
            fi
            git fetch origin main
            # If another job modified the same source report, fail closed
            # instead of resolving the conflict by inventing new statistics.
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo V170_SOURCE_CONFLICT_NO_OVERWRITE >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
          echo V170_PUSH_BUSY_NO_FORCE_PUBLISH >&2
          exit 1
