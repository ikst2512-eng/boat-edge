name: V303 ranked TopK readiness (pre-result only)
on:
  pull_request:
    paths:
      - 'scripts/boat_edge_v303_ranked_topk_gate.py'
      - 'tests/test_boat_edge_v303_ranked_topk_gate.py'
      - '.github/workflows/v303-ranked-topk-readiness.yml'
      - 'scripts/boat_edge_v306_v360_ranked_gate.py'
      - 'tests/test_boat_edge_v306_v360_ranked_gate.py'
      - 'scripts/boat_edge_02_st_distribution_research.py'
      - 'tests/test_boat_edge_v236_02_st_distribution_research.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ranked-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V303 synthetic guard tests
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v303_ranked_topk_gate.py' -v
      - name: Test V306 research-only V360 120-way ranking
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v306_v360_ranked_gate.py' -v
      - name: Verify actual official six-boat START tokens in ST research
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_boat_edge_v236_02_st_distribution_research.py' -v
      - name: Audit only PRE_RESULT ranked cohort availability
        run: python3 scripts/boat_edge_v303_ranked_topk_gate.py
