      - name: Verify source controls and real display patch
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_v174.py' -v
          node --check assets/boat_edge_v174_confidence.js
          node tests/test_v174_js.cjs
          python3 -m py_compile scripts/site_v174_patch.py
          python3 scripts/site_v174_patch.py --root .
          git diff --check
          python3 - <<'PYGUARDS'
          from pathlib import Path
          s=Path('assets/boat_edge_v108.js').read_text()
          h=Path('index.html').read_text()
          assert s.count('window.BoatEdgeV174?.register?.(')==1
          assert h.count('./assets/boat_edge_v174_confidence.js?v=174')==1
          assert h.count('./assets/boat_edge_v174_confidence.css?v=174')==1
          assert 'boat_edge_v173' not in h
          print('V174_DISPLAY_HOOK_AND_NO_FORMAL_CHANGE_PASS')
          PYGUARDS
      - name: Commit only UI changes and enable new site display
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/boat_edge_v108.js assets/boat_edge_v174_confidence.js assets/boat_edge_v174_confidence.css index.html
          python3 - <<'PYFILES'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'assets/boat_edge_v108.js','assets/boat_edge_v174_confidence.js','assets/boat_edge_v174_confidence.css','index.html'}
          if not files.issubset(allowed):raise SystemExit('V174_FORBIDDEN_PATH '+repr(files))
          print('V174_UI_ONLY_STAGED '+repr(sorted(files)))
          PYFILES
          git diff --cached --quiet && { echo 'V174_ALREADY_PRESENT'; exit 0; }
          git commit -m 'V174 display audited mode hit rates and head overlap, remove fake confidence percent'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo 'V174_UI_COMMITTED; formal and frozen predictions unchanged'
              exit 0
            fi
            echo "V174_REBASE_RETRY_${attempt}"
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          echo 'V174_PUSH_FAILED' >&2
          exit 1
