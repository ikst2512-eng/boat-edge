name: BOAT EDGE 自己復旧ホーム V73

on:
  push:
    paths:
      - ".github/workflows/site-recovery.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boat-edge-site-recovery-v73
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: V73自己復旧ホーム反映
        shell: bash
        env:
          BE73_ADDON_B64: ""
        run: |
          python - <<'PY'
          import os,re,json,base64,hashlib
          from pathlib import Path
          from datetime import datetime,timezone,timedelta

          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST).isoformat(timespec="seconds")
          js=Path("assets/boat_edge_simple_v51.js")
          s=js.read_text(encoding="utf-8")
          marker="BOAT_EDGE_SITE_V73_SELF_HEALING_HOME"
          if marker not in s:
              addon=base64.b64decode(os.environ["BE73_ADDON_B64"]).decode("utf-8")
              s=re.sub(r'^/\* BOAT_EDGE_SITE_V\d+_[^*]+ \*/',
                       '/* BOAT_EDGE_SITE_V73_SELF_HEALING_HOME */',s,count=1)
              s=s.rstrip()+"\n\n"+addon+"\n"
              js.write_text(s,encoding="utf-8")

          def load(p):
              try:return json.loads(Path(p).read_text(encoding="utf-8"))
              except:return {}

          today=load("data/today.json")
          odds=load("data/site_odds/index.json")
          results=load("data/site_results/index.json")
          learning=load("data/site_learning/summary.json")
          health={
            "schema_version":"boat-edge-site-health-v73",
            "site_version":"V73",
            "generated_at":now,
            "site_asset_v73":marker in js.read_text(encoding="utf-8"),
            "asset_sha256":hashlib.sha256(js.read_bytes()).hexdigest(),
            "today":{
              "date":today.get("date"),
              "updated_at":today.get("updated_at"),
              "active_venues":len(today.get("venues",[])),
              "results_seen":today.get("results_seen"),
              "unlock":today.get("unlock"),
              "scoring":today.get("scoring")
            },
            "odds":{
              "updated_at":odds.get("updated_at"),
              "checked":odds.get("checked",0),
              "updated":odds.get("updated",0),
              "errors":len(odds.get("errors",[])),
              "prediction_logic_uses_odds":odds.get("prediction_logic_uses_odds",False)
            },
            "results":{
              "updated_at":results.get("updated_at"),
              "checked":results.get("checked",0),
              "updated":results.get("updated",0),
              "errors":len(results.get("errors",[]))
            },
            "learning":{
              "updated_at":learning.get("updated_at"),
              "evaluated":learning.get("evaluated",0),
              "ranked":learning.get("ranked",0),
              "results_seen_in_prediction":learning.get("results_seen_in_prediction",False)
            }
          }
          Path("data/site_health.json").write_text(json.dumps(health,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(health,ensure_ascii=False))
          PY

      - name: 保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js data/site_health.json
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V73 self-healing home"
          git push
