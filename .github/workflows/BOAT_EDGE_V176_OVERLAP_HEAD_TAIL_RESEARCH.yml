        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v176_overlap_head_tail_research.py --self-test
          python3 -m py_compile /tmp/v176_overlap_head_tail_research.py
          python3 /tmp/v176_overlap_head_tail_research.py
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          p=Path('data/site_learning/v176_overlap_head_tail_research.json')
          d=json.loads(p.read_text())
          assert d['eligible_races']==105
          assert d['status']=='RESEARCH_ONLY_NOT_PROMOTED'
          assert d['formal_current_modified'] is False
          assert d['production_model_modified'] is False
          assert d['fresh_validation_pass'] is False
          assert d['production_adoption']=='BLOCKED_PENDING_FRESH'
          assert d['research']['win_joint_hit_hole']=={'both':30,'hit_only':9,'hole_only':6,'neither':60}
          assert d['research']['head_tail_near_miss']['correct_head_but_missed']==53
          print('V176_FROZEN_AUDIT_AND_GUARDS_PASS')
          PYGUARD
      - name: Publish research report only (never change prediction files)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/site_learning/v176_overlap_head_tail_research.json
          python3 - <<'PYFILES'
          import subprocess
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert staged in ([],['data/site_learning/v176_overlap_head_tail_research.json']),repr(staged)
          print('V176_SAFE_RESEARCH_ONLY_STAGED',staged)
          PYFILES
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'V176_ALREADY_CURRENT'
            exit 0
          fi
          git commit -m 'V176 audit exact-overlap and conditional head-tail on pinned site reference 105R (research only)'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo 'V176_REPORT_PUBLISHED_FORMAL_UNCHANGED'
              exit 0
            fi
            echo "V176_REBASE_RETRY_${attempt}"
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          echo 'V176_PUSH_FAILED' >&2
          exit 1
