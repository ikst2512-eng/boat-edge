name: BOAT EDGE V336 - SITE Research Live Freeze (isolated)

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read

concurrency:
  group: boat-edge-v336-live-research
  cancel-in-progress: false

jobs:
  prospective-research-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Assert Formal Fresh remains locked (no result reads)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          g = json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))['guards']
          assert all(g.get(x) is False for x in ('results_seen', 'unlock', 'scoring'))
          assert g.get('RESULT_UNLOCK_TOKEN') is None
          print('FORMAL_GUARD_UNTOUCHED')
          PY
      - name: Install V357 research parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          # V362/V370 introduced bs4+lxml; V336 originally had no dependency setup.
          # Same parser packages as Development CI and existing V288/V235 workflows.
          python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
          python3 -c 'from bs4 import BeautifulSoup; import lxml, requests'
      - name: Permission-safe SITE predeadline readiness scan (no automated third-party capture)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/boat_edge_v334_live_batch_runner.py --root . --window-minutes 15 --max-races 12 > "$RUNNER_TEMP/v336_report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'v336_report.json').read_text())
          # V340: report source-readiness reasons, not a false "0/0 OK" claim.
          # These flags remain strictly research-only and never authorize scoring.
          forbidden_claims = ('formal_fresh_read', 'results_read',
                              'accuracy_improvement_proven',
                              'production_model_changed', 'wagers_authorized',
                              'immutable_across_independent_actions_runs_verified')
          if any(report.get(flag) is not False for flag in forbidden_claims):
              raise SystemExit('RESEARCH_REPORT_SAFETY_FLAGS_INVALID')
          # Issue #204: unattended research must never fetch BOATERS / 競艇日和.
          # A successful dry-run is not a provider snapshot or model freeze.
          if report.get('capture_requested') is not False or report.get('completed_count') != 0:
              raise SystemExit('V336_UNAUTHORIZED_AUTOCAPTURE_OR_FREEZE')
          window = report['window']
          coverage = window['coverage']
          diagnostic = report['run_diagnostic']
          print(json.dumps({
            'run_diagnostic':diagnostic,
            'coverage':coverage,
            'selected':len(window['candidates']),
            'frozen':report['completed_count'],
            'failures':report['failures'],
            'global_uniqueness_verified':False,
            'research_only':True,
            'third_party_capture_permitted':False,
          },ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload immutable prospective research artifacts and audit report
        uses: actions/upload-artifact@v4
        with:
          name: v336-site-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/research_local_v332/
            data/source_captures/
            ${{ runner.temp }}/v336_report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm no tracked files or production code changed
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))['guards']
          assert g['results_seen'] is False and g['unlock'] is False and g['scoring'] is False
          PY
