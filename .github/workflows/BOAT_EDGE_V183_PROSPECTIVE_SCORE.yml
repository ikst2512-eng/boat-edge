          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/site_v183_audit.py tests/test_v183_audit.py data/site_tail_shadow_v180/evaluation_v183.json
          if git diff --cached --quiet; then echo V183_NO_CHANGES; exit 0; fi
          git commit -m 'V183 independently score post-settlement prospective V180 shadow without promotion'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then echo V183_RESEARCH_AUDIT_COMMITTED; exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 scripts/site_v183_audit.py --repo . --out data/site_tail_shadow_v180/evaluation_v183.json
            python3 tests/test_v183_audit.py
            git add data/site_tail_shadow_v180/evaluation_v183.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          done
          echo V183_GIT_PUSH_BLOCKED >&2
          exit 1
