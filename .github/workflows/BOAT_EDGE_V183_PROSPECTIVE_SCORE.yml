          assert not (v['status']=='RESEARCH_ONLY_NO_ADOPTION' and v['settled_races']==0)
          assert all(x['race_key'][:8]>='20261010' for x in v['races'])
          assert all(x['source_saved_at']<x['added_at'] for x in v['races'])
          print('V183_PROSPECTIVE_SEPARATION_AND_RUN1_RUN2_PASS',v['settled_races'])
          PYGATE
