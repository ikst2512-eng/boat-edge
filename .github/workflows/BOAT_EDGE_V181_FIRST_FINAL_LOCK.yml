        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html assets/boat_edge_v108.js scripts/site_v181_patch.py tests/test_v181_prediction_lock.py
          if git diff --cached --quiet; then
            echo V181_ALREADY_APPLIED
            exit 0
          fi
          git commit -m "V181 preserve first viewed picks and forbid post-deadline recomputed historical picks"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo V181_FIRST_AND_FINAL_INTEGRITY_APPLIED
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            node --check assets/boat_edge_v108.js
            python3 tests/test_v181_prediction_lock.py
          done
          echo V181_GIT_PUSH_RETRY_EXHAUSTED >&2
          exit 1
