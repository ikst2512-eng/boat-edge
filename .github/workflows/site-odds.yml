name: BOAT EDGE 3連単オッズ更新 V71

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-odds.yml"
  workflow_dispatch:
  schedule:
    # Gate 1C: retain exactly the same 12 five-minute UTC slots, spread over
    # three disjoint cron identities to test resilience to omitted GitHub
    # schedule deliveries. No additional run windows, workflow or writer.
    - cron: "0,15,30,45 * * * *"
    - cron: "5,20,35,50 * * * *"
    - cron: "10,25,40,55 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-site-odds-v71
  cancel-in-progress: false

jobs:
  odds:
    # Guard workflow_dispatch, not just push: feature branches must never
    # reset their checkout to origin/main and publish official odds there.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'ikst2512-eng/boat-edge'
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリ
        run: pip install requests beautifulsoup4 lxml

      - name: V256 odds fail-closed and timestamp merge regressions
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v256_odds_guard.py' -v
          node --check assets/boat_edge_v108.js
          node tests/test_boat_edge_v256_odds_rejection.cjs
          node tests/test_boat_edge_v254_odds_cutoff.cjs
          python3 - <<'PYV256CODE'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/boat_edge_v256_odds_guard.py').read_text(encoding='utf-8'))
          print('V256_ODDS_GUARD_PARSE_PASS')
          PYV256CODE

      - name: 公式3連単オッズ取得
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time, random
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          import requests
          from bs4 import BeautifulSoup
          from scripts.boat_edge_v256_odds_guard import rejected_document

          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST)
          ymd=now.strftime("%Y%m%d")
          iso=now.isoformat(timespec="seconds")

          DATA=Path("data")
          TODAY=DATA/"today.json"
          OUT=DATA/"site_odds"
          OUT.mkdir(parents=True,exist_ok=True)

          def load(p):
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return None

          today=load(TODAY) or {}
          races=[]
          for v in today.get("venues",[]):
              jcd=str(v.get("jcd") or "").zfill(2)
              for r in v.get("races",[]):
                  key=r.get("race_key")
                  rno=r.get("race_no")
                  dl=r.get("deadline")
                  if not key or not rno or not dl:
                      continue
                  m=re.fullmatch(r"(\d{1,2}):(\d{2})",str(dl).strip())
                  if not m:
                      continue
                  deadline=now.replace(hour=int(m.group(1)),minute=int(m.group(2)),second=0,microsecond=0)
                  delta=(deadline-now).total_seconds()/60
                  # Current purchase layer only needs near-race odds.
                  # Keep official-site load low: 45 min before deadline through 5 min after.
                  if -5 <= delta <= 45:
                      races.append({
                          "race_key":key,
                          "jcd":jcd,
                          "race_no":int(rno),
                          "deadline":dl,
                          "minutes_to_deadline":round(delta,1)
                      })

          # Gate 1C: source collection is sequential. Prioritize the actual
          # V229 2-10m first-freeze opportunity over venue/catalog order.
          # This does not bypass the original 120-odds verification, V229's
          # independent deadline gate, or the existing Git publisher.
          def source_priority(item):
              lead=item["minutes_to_deadline"]
              if 2 <= lead <= 10:
                  tier=0
              elif 10 < lead <= 45:
                  tier=1
              elif 0 < lead < 2:
                  tier=2
              else:
                  tier=3  # past deadline: keep V71's existing +5m UI coverage
              return (tier,lead,item["race_key"])
          races.sort(key=source_priority)

          session=requests.Session()
          session.headers.update({
              "User-Agent":"Mozilla/5.0 (compatible; BOAT-EDGE-SITE-ODDS/1.0)",
              "Accept-Language":"ja-JP,ja;q=0.9,en;q=0.5",
              "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Connection":"close"
          })

          def fetch(url,tries=2):
              last=None
              for i in range(tries):
                  try:
                      res=session.get(url,timeout=(5,20),allow_redirects=True)
                      res.raise_for_status()
                      res.encoding=res.apparent_encoding or res.encoding or "utf-8"
                      return res
                  except Exception as e:
                      last=e
                      if i+1<tries:
                          time.sleep(0.7+random.random())
              raise last

          def parse_odds(html):
              soup=BeautifulSoup(html,"lxml")
              cells=soup.select("td.oddsPoint")
              if len(cells) != 120:
                  # Some pages use oddsPoint on a non-td element; keep a safe fallback.
                  cells=soup.select(".oddsPoint")
              texts=[re.sub(r"\s+","",c.get_text("",strip=True)) for c in cells]
              if len(texts) != 120:
                  raise ValueError(f"oddsPoint_count={len(texts)}")

              # Official table is 20 rows x 6 first-course columns.
              # DOM order is row-major; transpose to get the 20 values for
              # 1st=1, then 1st=2 ... 1st=6.
              matrix=[texts[i*6:(i+1)*6] for i in range(20)]
              ordered=[]
              for col in range(6):
                  ordered.extend(matrix[row][col] for row in range(20))

              combos=[]
              for fst in range(1,7):
                  for snd in range(1,7):
                      if snd==fst: continue
                      for trd in range(1,7):
                          if trd in (fst,snd): continue
                          combos.append(f"{fst}-{snd}-{trd}")

              if len(combos)!=120 or len(ordered)!=120:
                  raise ValueError("mapping_size_error")

              odds={}
              unavailable=[]
              for combo,raw in zip(combos,ordered):
                  raw=raw.replace(",","")
                  try:
                      v=float(raw)
                      if v>0:
                          odds[combo]=v
                      else:
                          unavailable.append(combo)
                  except Exception:
                      unavailable.append(combo)

              # V167: fail closed unless all 120 DOM labels match their odds.
              from scripts.site_odds_v167_dom_verifier import verify_official_dom_price_mapping
              verify_official_dom_price_mapping(html)
              # Purchase evidence is fail-closed: partial official prices cannot
              # prove a safe 120-combination market or a racer scratch.
              if len(odds) != 120 or unavailable:
                  raise ValueError(f"valid_odds_too_few={len(odds)}")
              return odds, unavailable

          updated=0
          errors=[]
          checked=0

          for item in races:
              checked+=1
              key=item["race_key"]
              url=(
                  "https://www.boatrace.jp/owpc/pc/race/odds3t"
                  f"?hd={ymd}&jcd={item['jcd']}&rno={item['race_no']}"
              )
              try:
                  res=fetch(url)
                  odds,unavailable=parse_odds(res.text)
                  doc={
                      "schema_version":"boat-edge-site-odds-v71",
                      "race_key":key,
                      "fetched_at":datetime.now(JST).isoformat(timespec="seconds"),
                      "source":"BOAT RACE オフィシャルウェブサイト 3連単オッズ",
                      "source_url":url,
                      "phase":"PRE_RESULT_PURCHASE_ONLY",
                      "results_seen":False,
                      "scoring":False,
                      "deadline":item["deadline"],
                      "minutes_to_deadline":item["minutes_to_deadline"],
                      "trifecta_odds":odds,
                      "available_count":len(odds),
                      "unavailable_count":len(unavailable),
                      "unavailable_combinations":unavailable,
                      "odds_validation":"VERIFIED",
                      "no_bet":False,
                      "verified_official_dom_v167":True,
                      "raw_official_html_sha256":hashlib.sha256(res.content).hexdigest()
                  }
                  (OUT/f"{key}.json").write_text(
                      json.dumps(doc,ensure_ascii=False,indent=2),
                      encoding="utf-8"
                  )
                  updated+=1
              except Exception as e:
                  # Never publish partial or formerly valid odds after a newer
                  # official source failure. This marker contains NO price map.
                  # 60 numerical combinations do NOT prove a racer scratch.
                  rejected=rejected_document(
                      key=key,url=url,deadline=item["deadline"],
                      checked_at=datetime.now(JST).isoformat(timespec="seconds"),
                      error=type(e).__name__+": "+str(e)
                  )
                  (OUT/f"{key}.json").write_text(
                      json.dumps(rejected,ensure_ascii=False,indent=2),
                      encoding="utf-8"
                  )
                  errors.append({
                      "race_key":key,
                      "error":repr(e),
                      "url":url,
                      "odds_validation":"REJECTED_NO_BET",
                      "observed_numeric_count":rejected["observed_numeric_count"],
                      "scratch_status":"UNVERIFIED"
                  })
              time.sleep(0.35)

          index={
              "schema_version":"boat-edge-site-odds-index-v71",
              "updated_at":datetime.now(JST).isoformat(timespec="seconds"),
              "date":now.strftime("%Y-%m-%d"),
              "checked":checked,
              "updated":updated,
              "rejected_no_bet":len(errors),
              "errors":errors[:30],
              "window":"deadline -45min to +5min",
              "source":"official odds3t only",
              "prediction_logic_uses_odds":False
          }
          (OUT/"index.json").write_text(
              json.dumps(index,ensure_ascii=False,indent=2),
              encoding="utf-8"
          )
          print(json.dumps(index,ensure_ascii=False))
          PY

      - name: 保存（競合時は取得時刻を照合して安全に再試行）
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve actual fetched source bytes before updating the checkout.
          # Never rerank bets and never create odds from missing source data.
          saved="$(mktemp -d)"
          trap 'rm -rf "$saved"' EXIT
          mkdir -p "$saved/site_odds"
          cp -a data/site_odds/. "$saved/site_odds/"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python3 - "$saved/site_odds" <<'PYODDSMERGE'
          import json, re, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.boat_edge_v256_odds_guard import is_safe_record, should_replace

          src=Path(sys.argv[1]);dst=Path('data/site_odds');dst.mkdir(parents=True,exist_ok=True)
          key_re=re.compile(r'20\d{6}-\d{2}-\d{2}\.json')
          combo_re=re.compile(r'[1-6]-[1-6]-[1-6]')
          def obj(p):
              try:return json.loads(p.read_text(encoding='utf-8'))
              except (ValueError,OSError,UnicodeError):return None
          def stamp(value):
              try:
                  d=datetime.fromisoformat(str(value).replace('Z','+00:00'))
                  return d.astimezone(timezone.utc) if d.tzinfo else None
              except (ValueError,TypeError):return None
          copied=skipped=0
          for p in sorted(src.glob('*.json')):
              if not key_re.fullmatch(p.name):continue
              x=obj(p)
              # Allow only fully sourced valid prices OR strict empty-price
              # rejection markers. A newer rejection must supersede a previous
              # good odds snapshot; stale failures never replace newer source.
              if not is_safe_record(x,p.stem):continue
              target=dst/p.name
              prev=obj(target) if target.exists() else None
              if not should_replace(prev,x,p.stem):
                  skipped+=1;continue
              target.write_bytes(p.read_bytes());copied+=1
          p=src/'index.json'
          if p.exists():
              x=obj(p);old=obj(dst/'index.json')
              if isinstance(x,dict) and x.get('schema_version')=='boat-edge-site-odds-index-v71' and x.get('source')=='official odds3t only':
                  new_stamp=stamp(x.get('updated_at'))
                  old_stamp=stamp(old.get('updated_at')) if isinstance(old,dict) else None
                  if new_stamp and (not old_stamp or new_stamp>old_stamp):
                      (dst/'index.json').write_bytes(p.read_bytes())
          print('V71_FRESHER_SOURCE_ONLY_RECONCILED',{'written':copied,'newer_remote_preserved':skipped})
          PYODDSMERGE
            git add -- data/site_odds/
            git diff --cached --check
            if git diff --cached --quiet; then
              echo V71_FRESH_ODDS_ALREADY_PRESENT_OR_REMOTE_NEWER
              exit 0
            fi
            git commit -m 'Update BOAT EDGE live trifecta odds V71 (source-time guarded)'
            if git push origin HEAD:main; then
              echo V71_SOURCE_TIMESTAMP_GUARDED_ODDS_PUBLISHED
              exit 0
            fi
            echo "V71_RETRY_${attempt}_AFTER_CONCURRENT_PUSH"
          done
          echo V71_PUBLISH_FAILED_AFTER_RETRIES >&2
          exit 1

      # A producer success can precede a delayed/dropped workflow_run event.
      # Call only the existing source+deadline guarded V229, never freeze here.
      - name: Nudge existing V229 from successfully published PRE_RESULT inputs
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash -n scripts/boat_edge_v01_first_freeze_nudge.sh
          bash scripts/boat_edge_v01_first_freeze_nudge.sh
