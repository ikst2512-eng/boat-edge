name: BOAT EDGE V81 レース画面一括

on:
  push:
    paths:
      - ".github/workflows/site-race-v81.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: V81一括反映
        shell: bash
        env:
          V81_JS: ""
          V81_CSS: ""
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          jp=Path("assets/boat_edge_simple_v51.js");cp=Path("assets/boat_edge_simple_v51.css")
          js=jp.read_text(encoding="utf-8");css=cp.read_text(encoding="utf-8")
          if "BOAT_EDGE_SITE_V81_MOBILE_RACE_SUITE" not in js:
              js=js.rstrip()+"\n\n"+base64.b64decode(os.environ["V81_JS"]).decode()+"\n"
          if "BOAT_EDGE_SITE_V81_MOBILE_RACE_SUITE" not in css:
              css=css.rstrip()+"\n\n"+base64.b64decode(os.environ["V81_CSS"]).decode()+"\n"
          jp.write_text(js,encoding="utf-8");cp.write_text(css,encoding="utf-8")
          PY
      - name: V81キャッシュ更新
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html");s=p.read_text(encoding="utf-8")
          s=re.sub(r'boat_edge_simple_v51\.js(?:\?v=\d+)?','boat_edge_simple_v51.js?v=81',s)
          s=re.sub(r'boat_edge_simple_v51\.css(?:\?v=\d+)?','boat_edge_simple_v51.css?v=81',s)
          p.write_text(s,encoding="utf-8")
          PY
      - name: 保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js assets/boat_edge_simple_v51.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V81 race mobile suite"
          git push
