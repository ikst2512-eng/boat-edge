name: BOAT EDGE V208 - Always Latest Before Deadline and Clean BOATERS Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V208_ALWAYS_LATEST_COMPACT.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v208-presentation-only
  cancel-in-progress: false

jobs:
  install-v208:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install with final snapshot and source audit safeguards
        shell: bash
        run: |
          set -euo pipefail
           git config user.name 'github-actions[bot]'
           git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
           for attempt in 1 2 3 4 5 6 7 8; do
             git fetch --no-tags origin main
             git reset --hard origin/main
             python3 - <<'PYINSTALL'
          import base64, gzip, hashlib
          from pathlib import Path
          CSS = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(CSS).hexdigest() == '2c5e9d461a4ef59785cf0110bb7c39c94b916ae72001885d01a0d9b775dc02d1'
          out=Path('assets/boat_edge_v208_latest_clean.css')
          out.parent.mkdir(exist_ok=True)
          if out.is_file() and out.read_bytes()!=CSS:
              raise RuntimeError('V208 stylesheet collision: leave original unchanged')
          out.write_bytes(CSS)
          PATCH=gzip.decompress(base64.b64decode(''))
          exec(compile(PATCH,'v208_patch', 'exec'))
          PYINSTALL
             node --check assets/boat_edge_v108.js
             node --check assets/boat_edge_v207_first_prediction.js
             node <<'JSCHECK'
          const fs = require('fs');
          const vm = require('vm');
          const s=fs.readFileSync('assets/boat_edge_v108.js','utf8');
          const start=s.indexOf('function be181ShowChoice('),end=s.indexOf('function be181InstallStyle(',start);
          if(start<0||end<0||end<=start)throw Error('V181 isolated function missing');
          const ctx={readLocal:()=> 'first'};
          vm.runInNewContext(s.slice(start,end)+';this.pick=be181ShowChoice;',ctx);
          const first={modes:{hit:{tickets:[{combo:'1-2-3',p:.2}]}}};
          const modes={hit:[{combo:'1-3-4',p:.3}]};
          const final={modes:{hit:{tickets:[{combo:'1-4-2',p:.1}]}}};
          const pre=ctx.pick('20261011-23-04',10,false,null,first,modes,'hit');
          if(pre.source!=='latest'||pre.rows[0].combo!=='1-3-4')throw Error('latest default not forced');
          const closed=ctx.pick('20261011-23-04',-1,false,final,first,modes,'hit');
          if(closed.source!=='final'||closed.rows[0].combo!=='1-4-2')throw Error('postcutoff frozen branch changed');
          const noFinal=ctx.pick('20261011-23-04',-1,true,null,first,modes,'hit');
          if(noFinal.source!=='unavailable'||noFinal.rows.length)throw Error('missing final must not reconstruct');
          const v207=fs.readFileSync('assets/boat_edge_v207_first_prediction.js','utf8');
          if(!v207.includes('showAll?rows.length:showFive?5:3'))throw Error('in-place all-tickets switch missing');
          if(v207.includes('scrollIntoView({behavior:'))throw Error('unexpected automatic scroll');
          if(!v207.includes('be208-details-on'))throw Error('detail toggle missing');
          if(!v207.includes("const fresh=Boolean(sum.fresh&&!settled)"))throw Error('stale odds guard missing');
          console.log('V208_NODE_LATEST_FINAL_NO_REWRITE_PASS');
          JSCHECK
             git diff --check
             git add assets/boat_edge_v108.js assets/boat_edge_v207_first_prediction.js assets/boat_edge_v208_latest_clean.css index.html
             if git diff --cached --quiet; then
               echo 'V208_ALREADY_INSTALLED_PASS'
               exit 0
             fi
             git commit -m 'V208 latest predeadline picks and BOATERS-like compact UI; keep frozen final'
             if git push origin HEAD:main; then
               echo 'V208_INSTALLED_PUSH_PASS; Pages deployment to verify separately'
               exit 0
             fi
             echo "Concurrent site update; retry ${attempt}/8"
             sleep 2
           done
           echo 'V208_PUSH_RETRY_EXHAUSTED' >&2
           exit 1
