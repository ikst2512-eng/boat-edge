
name: BOAT EDGE V224 - Repair Odds Audit and Lock Server FINAL15 Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V224_PROVENANCE_GUARDS.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v224-preserve-prospective-site-provenance
  cancel-in-progress: false

jobs:
  repair-provenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main and immutable Git history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Repair only pinned V167 import and V133 first-save immutability
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          done_patch=0
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            git checkout -B main origin/main
            python3 - <<'PY_V224_EDIT'
          import subprocess
          from pathlib import Path
          def sha(path):
              return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()

          # First repair the previous V167 import failure, without touching odds logic.
          odds_wf=Path('.github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml')
          old_sha='edc11a79485643a9de63af544598b4b8a5120886'
          content=odds_wf.read_text(encoding='utf-8')
          old='          python3 scripts/site_odds_v167_live_audit.py'
          new='          PYTHONPATH=. python3 scripts/site_odds_v167_live_audit.py'
          assert content.count('name: BOAT EDGE V167 - Independent Official Odds 120-Combo Verification')==1, 'V167_IDENTITY_MISMATCH'
          if content.count(new)==1 and content.count(old)==0:
              print('V224_V167_ALREADY_REPAIRED')
          else:
              assert content.count(old)==1 and content.count(new)==0, 'V167_COMMAND_CONFLICT'
              assert sha(odds_wf)==old_sha, 'V167_WORKFLOW_SHA_DRIFT_FAIL_CLOSED'
              revised=content.replace(old,new)
              assert revised.replace(new,old)==content, 'V167_UNEXPECTED_EDIT'
              odds_wf.write_text(revised,encoding='utf-8')
              print('V224_V167_IMPORT_PATH_FIXED')

          # Lock the server-side pre-result FINAL_15M evidence at its *first* write.
          # V222 already protected browser-local history; V133 previously overwrote server
          # snapshots at each cron run. Do NOT retroactively create/repair any prior file.
          engine=Path('scripts/site_final_history_v133.py')
          old_sha='3173487604095f3b615f6d29acfbb189df809c8f'
          source=engine.read_text(encoding='utf-8')
          original='    key=race.get("race_key") or race_path.stem\n'
          guard='    # V224_FIRST_SERVER_FINAL15_FREEZE: once saved, never rewrite existing prospective evidence.\n    if (SNAPS/f"{key}.json").is_file():\n        continue\n'
          assert source.count('V218_SINGLE_READ_ODDS_PROVENANCE')==1, 'V218_ODDS_LOCK_NOT_PRESENT'
          assert source.count(original)==1, 'V133_RACE_LOOP_ANCHOR_CHANGED'
          assert source.count('for race_path in sorted(RACES.glob(f"{TODAY}-*.json")):')==1, 'V133_LOOP_IDENTITY_MISMATCH'
          if source.count(guard)==1:
              print('V224_V133_IMMUTABILITY_ALREADY_PRESENT')
          else:
              assert source.count('V224_FIRST_SERVER_FINAL15_FREEZE')==0, 'V133_PARTIAL_GUARD_CONFLICT'
              assert sha(engine)==old_sha, 'V133_ENGINE_SHA_DRIFT_FAIL_CLOSED'
              changed=source.replace(original,original+guard)
              assert changed.replace(original+guard,original)==source, 'V133_UNEXPECTED_EDIT'
              engine.write_text(changed,encoding='utf-8')
              print('V224_V133_FIRST_SERVER_FREEZE_GUARD_INSTALLED')
          PY_V224_EDIT
            python3 -m py_compile scripts/site_final_history_v133.py
            python3 - <<'PY_V224_TEST'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import subprocess, textwrap, ast
          e=Path('scripts/site_final_history_v133.py').read_text(encoding='utf-8')
          w=Path('.github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml').read_text(encoding='utf-8')
          marker='    # V224_FIRST_SERVER_FINAL15_FREEZE: once saved, never rewrite existing prospective evidence.\n'
          rule='    if (SNAPS/f"{key}.json").is_file():\n        continue\n'
          assert e.count(marker)==1 and e.count(rule)==1
          assert e.index('    key=race.get("race_key") or race_path.stem\n')<e.index(marker)<e.index('    scratches=read_json(')
          assert w.count('          PYTHONPATH=. python3 scripts/site_odds_v167_live_audit.py')==1
          assert '          python3 scripts/site_odds_v167_live_audit.py' not in w
          assert 'auto-enable collector guard only after 2x120 PASS' in w
          assert 'if write_if_changed(SNAPS/f"{key}.json",snap):' in e  # new snapshots still saved
          ast.parse(e)
          with TemporaryDirectory() as work:
              home=Path(work)
              (home/'one.json').write_text('frozen',encoding='utf-8')
              snippets='for key in ["one","two"]:\n'+rule+'    processed.append(key)\n'
              state={'SNAPS':home,'processed':[]}
              exec(snippets,state,state)
              assert state['processed']==['two'],'V224_EXISTING_BYTES_MUST_NOT_BE_REGENERATED'
              assert (home/'one.json').read_text(encoding='utf-8')=='frozen'
          print('V224_FIRST_SAVE_IMMUTABILITY_REGRESSION_PASS')
          PY_V224_TEST
            git diff --check
            # Protect all files outside the exact two allowlisted existing paths.
            changed_files=$(git diff --name-only)
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              case "$name" in
                .github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml|scripts/site_final_history_v133.py) ;;
                *) echo "V224_UNEXPECTED_CHANGED_FILE: $name" >&2; exit 1 ;;
              esac
            done <<< "$changed_files"
            git add -- .github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml scripts/site_final_history_v133.py
            if git diff --cached --quiet; then
              echo 'V224_BOTH_PATCHES_ALREADY_CURRENT'
              done_patch=1
              break
            fi
            git commit -m 'V224 fix odds audit import and preserve first server FINAL15 freeze'
            if git push origin HEAD:main; then
              echo 'V224_PROSPECTIVE_PROVENANCE_GUARDS_COMMITTED'
              done_patch=1
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'V224_PUSH_RETRIES_EXHAUSTED_NO_CLAIM' >&2
              exit 1
            fi
            sleep 2
          done
          test "$done_patch" = 1
      - name: Dispatch independent V167 official-odds parity audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run BOAT_EDGE_V167_ONE_UPLOAD.yml --ref main
          echo 'V224_V167_AUDIT_DISPATCHED_NOT_YET_VERIFIED'
          echo 'V224_DONE_NO_MODEL_NO_PAPER_NO_FORMAL_FRESH_EDITS'
