            node - <<'NODECHECK'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const js=fs.readFileSync('assets/boat_edge_v205_clean.js','utf8');
          const css=fs.readFileSync('assets/boat_edge_v205_clean.css','utf8');
