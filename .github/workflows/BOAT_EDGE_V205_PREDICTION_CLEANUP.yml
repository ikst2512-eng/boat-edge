            CHANGED=$(git status --porcelain | awk '{print $2}' | grep -v '^.github/workflows/' || true)
            if [ -n "$CHANGED" ]; then printf '%s\n' "$CHANGED" | while IFS= read -r path; do
              case "$path" in
                index.html|assets/boat_edge_v205_clean.js|assets/boat_edge_v205_clean.css) ;;
                *) echo "V205_FORBIDDEN_FILE_CHANGED: $path"; exit 1 ;;
              esac
            done; fi
