name: BOAT EDGE V205 - Prediction Cleanup With Safety Source Visible

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V205_PREDICTION_CLEANUP.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v205-ui-only
  cancel-in-progress: false

jobs:
  display-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install V205 with sha-verified assets and invariants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PYINSTALL'
