name: Entry attack 120 research tests
on:
  push:
    branches:
      - research/entry-attack-mixture-120-20261026
    paths:
      - 'scripts/boat_edge_entry_attack_mixture_research.py'
      - 'scripts/boat_edge_paired120_research_evaluate.py'
      - 'scripts/boat_edge_paired120_significance.py'
      - 'scripts/boat_edge_research_git_receipt.py'
      - 'scripts/boat_edge_site_evidence_triage.py'
      - 'tests/test_boat_edge_entry_attack_mixture_research.py'
      - 'tests/test_boat_edge_paired120_research_evaluate.py'
      - 'tests/test_boat_edge_paired120_significance.py'
      - 'tests/test_boat_edge_research_git_receipt.py'
      - 'tests/test_boat_edge_site_evidence_triage.py'
      - '.github/workflows/entry-attack-120-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated entry and attack research tests
        run: |
          python -m unittest discover -s tests -p 'test_boat_edge_entry_attack_mixture_research.py' -v
          python -m unittest discover -s tests -p 'test_boat_edge_paired120_research_evaluate.py' -v
          python -m unittest discover -s tests -p 'test_boat_edge_paired120_significance.py' -v
          python -m unittest discover -s tests -p 'test_boat_edge_research_git_receipt.py' -v
          python -m unittest discover -s tests -p 'test_boat_edge_site_evidence_triage.py' -v
      - name: Read-only SITE evidence coverage counts (no result scoring)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.boat_edge_site_evidence_triage import audit_directory
          result = audit_directory(Path("."))
          result.pop("rows", None)
          print("SITE_EVIDENCE_TRIAGE_COUNTS=" + json.dumps(result, sort_keys=True))
          PY
