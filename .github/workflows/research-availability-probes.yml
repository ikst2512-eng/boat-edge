name: Research race-card availability probes
on:
  schedule:
    - cron: '*/10 0-13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-availability-probe
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe due races, never score results
        run: python research_next/scheduled_probe.py
      - name: Save exact capture bytes and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-probes-${{ github.run_id }}
          path: research_next/probes/
          if-no-files-found: ignore
          retention-days: 30
      - name: Run collection regression tests
        run: python -m unittest discover -s research_next -p 'test_*.py'
