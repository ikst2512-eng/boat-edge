name: Research race-card availability probes
on:
  schedule:
    - cron: '*/10 0-13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-availability-probe
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe due races, never score results
        run: python research_next/scheduled_probe.py
      - name: Summarize cutoff availability
        if: always()
        shell: bash
        run: |
          python research_next/probe_report.py research_next/probes > research_next/probe_summary.json
          cat research_next/probe_summary.json
          if [ -f research_next/probe_run_status.json ]; then
            python research_next/probe_health.py research_next/probe_run_status.json research_next/probe_summary.json > research_next/probe_health.json
            cat research_next/probe_health.json
          fi
          {
            echo '## Research acquisition status'
            echo 'Run status:'
            cat research_next/probe_run_status.json || true
            echo ''
            echo 'Verified snapshots:'
            cat research_next/probe_summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save exact capture bytes and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-probes-${{ github.run_id }}
          path: |
            research_next/probes/
            research_next/probe_run_status.json
            research_next/probe_summary.json
            research_next/probe_health.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Run collection regression tests
        run: python -m unittest discover -s research_next -p 'test_*.py'
