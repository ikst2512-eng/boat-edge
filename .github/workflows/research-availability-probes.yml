name: Research race-card availability probes
on:
  schedule:
    # 07:00-08:55 JST (previous UTC day) plus 09:00-22:55 JST
    - cron: '*/5 22-23 * * *'
    - cron: '*/5 0-13 * * *'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: research-availability-probe
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    # Must end before the next 5-minute cron slot; failure remains visible, never promoted to evidence.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Actions execution identity
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          record = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
              "runner_recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "external_source_publication_verified": False,
          }
          Path("research_next/probe_execution.json").write_text(
              json.dumps(record, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(record, sort_keys=True))
          PY
      - name: Run collection regression tests
        id: tests
        run: |
          python -m unittest discover -s research_next -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_research_final15m_source_audit.py' -v
      - name: Report saved pre-result source gaps by deadline window
        if: always()
        shell: bash
        run: |
          python scripts/research_final15m_source_audit.py > research_next/final15m_source_audit.json
          python -m json.tool research_next/final15m_source_audit.json > /dev/null
          echo 'Saved source-window audit (no result access)' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("research_next/final15m_source_audit.json").read_text(encoding="utf-8"))
          assert audit["read_only"] is True and audit["phase"]=="PRE_RESULT"
          for cohort in audit["cohorts"].values():
              for counts in cohort["reason_counts"].values():
                  assert sum(counts.values())==cohort["count"]
          print({name:data["count"] for name,data in audit["cohorts"].items()})
          PY
      - name: Probe due races, never score results
        id: capture_probe
        run: python research_next/scheduled_probe.py
      - name: Summarize cutoff availability
        if: always()
        shell: bash
        run: |
          python research_next/probe_report.py research_next/probes > research_next/probe_summary.json
          cat research_next/probe_summary.json
          if [ -f research_next/probe_run_status.json ]; then
            python research_next/probe_health.py research_next/probe_run_status.json research_next/probe_summary.json > research_next/probe_health.json
            cat research_next/probe_health.json
          fi
          {
            echo '## Research acquisition status'
            echo 'Run status:'
            cat research_next/probe_run_status.json || true
            echo ''
            echo 'Verified snapshots:'
            cat research_next/probe_summary.json
            echo ''
            echo 'Evidence classification:'
            cat research_next/probe_health.json || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require trustworthy acquisition classification
        id: classify
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research_next/probe_health.json")
          if not path.is_file():
              raise SystemExit("Missing acquisition health report")
          health = json.loads(path.read_text(encoding="utf-8"))
          accepted = {"NO_RACES_DUE", "PROBE_EVIDENCE_PRESENT_NOT_EXTERNALLY_ATTESTED"}
          if health.get("state") not in accepted:
              raise SystemExit(f"Acquisition evidence rejected: {health.get('state')}")
          print(f"Acquisition evidence state: {health['state']}")
          PY
      - name: Require complete evidence report files
        id: guard
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          required = (
              "probe_execution.json",
              "probe_run_status.json",
              "probe_summary.json",
              "probe_health.json",
              "final15m_source_audit.json",
          )
          base = Path("research_next")
          missing = [name for name in required if not (base / name).is_file()]
          if missing:
              raise SystemExit("Missing required evidence files: " + ", ".join(missing))
          for name in required:
              path = base / name
              if path.stat().st_size == 0:
                  raise SystemExit("Empty required evidence file: " + name)
              try:
                  parsed = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit("Invalid evidence JSON: " + name) from exc
              if not isinstance(parsed, dict):
                  raise SystemExit("Evidence JSON must be an object: " + name)
          audit = json.loads((base / "final15m_source_audit.json").read_text(encoding="utf-8"))
          if audit.get("read_only") is not True or audit.get("phase") != "PRE_RESULT":
              raise SystemExit("Source-window audit must be read-only PRE_RESULT")
          cohorts = audit.get("cohorts")
          if not isinstance(cohorts, dict) or set(cohorts) != {"final15m", "future", "past_locked"}:
              raise SystemExit("Source-window audit cohorts invalid")
          for name, cohort in cohorts.items():
              count = cohort.get("count")
              reasons = cohort.get("reason_counts")
              if type(count) is not int or count < 0 or not isinstance(reasons, dict):
                  raise SystemExit("Invalid source-window audit cohort: " + name)
              if set(reasons) != {"stt", "tkz", "sui", "original_exhibition"}:
                  raise SystemExit("Invalid source-window audit roles: " + name)
              for role, counts in reasons.items():
                  if not isinstance(counts, dict) or any(type(n) is not int or n < 0 for n in counts.values()) or sum(counts.values()) != count:
                      raise SystemExit("Unbalanced source-window audit: " + name + "/" + role)
          # The observation must belong to this runner day, not to a prior
          # persisted race collection. No data may be promoted from stale runs.
          from datetime import datetime, timezone
          observation = datetime.fromisoformat(audit["observation_at"])
          if observation.tzinfo is None:
              raise SystemExit("Source-window audit timestamp lacks timezone")
          current = datetime.now(timezone.utc)
          if abs((current - observation.astimezone(timezone.utc)).total_seconds()) > 600:
              raise SystemExit("Stale source-window audit observation")
          execution = json.loads((base / "probe_execution.json").read_text(encoding="utf-8"))
          status = json.loads((base / "probe_run_status.json").read_text(encoding="utf-8"))
          health = json.loads((base / "probe_health.json").read_text(encoding="utf-8"))
          summary = json.loads((base / "probe_summary.json").read_text(encoding="utf-8"))
          sys.path.insert(0, str(base.resolve()))
          from probe_health import assess
          if health != assess(status, summary):
              raise SystemExit("Health report differs from independently recomputed assessment")
          if execution.get("run_id") != os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("Execution identity does not match current Actions run")
          if execution.get("head_sha") != os.environ.get("GITHUB_SHA"):
              raise SystemExit("Execution commit does not match current Actions commit")
          if execution.get("external_source_publication_verified") is not False:
              raise SystemExit("External publication must remain unverified")
          if status.get("status") == "ok":
              counts = (status.get("due"), status.get("captured"), status.get("failed"))
              if any(type(value) is not int or value < 0 for value in counts):
                  raise SystemExit("Invalid collection counts")
              due, captured, failed = counts
              if due != captured + failed:
                  raise SystemExit("Collection counts do not balance")
          if health.get("state") == "NO_RACES_DUE" and status.get("due") != 0:
              raise SystemExit("No-races-due state contradicts collector")
          if health.get("state") == "PROBE_EVIDENCE_PRESENT_NOT_EXTERNALLY_ATTESTED":
              if status.get("status") != "ok" or status.get("due", 0) <= 0:
                  raise SystemExit("Evidence-positive state contradicts collector")
          print("Required evidence reports and run identity are consistent")
          PY
      - name: Save exact capture bytes and manifests
        id: save_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-probes-${{ github.run_id }}
          path: |
            research_next/probes/
            research_next/probe_run_status.json
            research_next/probe_summary.json
            research_next/probe_health.json
            research_next/probe_execution.json
            research_next/final15m_source_audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish discoverable probe run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture_probe.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.save_artifact.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          outcomes = [os.environ[k] for k in ("TEST_OUTCOME", "CAPTURE_OUTCOME",
                                              "GUARD_OUTCOME", "CLASSIFY_OUTCOME",
                                              "ARTIFACT_OUTCOME")]
          health_file = Path("research_next/probe_health.json")
          try:
              health = json.loads(health_file.read_text(encoding="utf-8")) if health_file.is_file() else {}
              classification = health.get("state", "NO_HEALTH_REPORT") if isinstance(health, dict) else "INVALID_HEALTH_REPORT"
              if not isinstance(classification, str) or not classification:
                  classification = "INVALID_HEALTH_STATE"
          except (OSError, UnicodeError, ValueError):
              classification = "UNREADABLE_HEALTH_REPORT"
          if not all(x == "success" for x in outcomes):
              state = "failure"
          elif classification == "PROBE_EVIDENCE_PRESENT_NOT_EXTERNALLY_ATTESTED":
              state = "success"
          elif classification == "NO_RACES_DUE":
              state = "pending"
          else:
              state = "failure"
          payload = json.dumps({
              "state": state,
              "context": "research/probe-evidence",
              "description": classification[:140],
              "target_url": os.environ["GH_RUN_URL"],
          }).encode()
          req = Request(
              "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] +
              "/statuses/" + os.environ["GH_SHA"],
              data=payload,
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json",
                       "X-GitHub-Api-Version": "2022-11-28"},
              method="POST")
          with urlopen(req, timeout=15) as response:
              if response.status != 201:
                  raise SystemExit("Unable to publish discoverable run status")
          print("Published evidence status; run URL:", os.environ["GH_RUN_URL"])
          PY
