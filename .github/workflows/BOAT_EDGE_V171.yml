      - name: Offline 12-case safety checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_v171.py' -v
          python3 -m py_compile scripts/site_v171_prospective.py
      - name: Prior-day scoring or before-race prospective freeze
        shell: bash
        run: |
          set -euo pipefail
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = '15 0 * * *' ]; then
            python3 scripts/site_v171_prospective.py score
          else
            python3 scripts/site_v171_prospective.py capture
          fi
      - name: Commit only V171 prospective research artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Permanent lock: result/odds/formal/prediction-engine folders are not writable.
          git add -A -- data/site_learning/v171_prospective_venue/ 2>/dev/null || true
          git diff --cached --quiet && { echo 'V171_NO_NEW_RESEARCH_ARTIFACTS'; exit 0; }
          if git diff --cached --name-only | grep -v '^data/site_learning/v171_prospective_venue/'; then
            echo 'V171_UNEXPECTED_STAGED_PATH'; exit 1
          fi
          # Gate new freeze COMMITS against the cutoff, too, not just generation.
          if git diff --cached --name-only | grep -q '/freeze.json$'; then
            localhm=$(TZ=Asia/Tokyo date +%H%M)
            if [ "$localhm" -ge 0815 ]; then
              echo 'V171_FREEZE_COMMIT_TOO_LATE; do not commit retroactively'
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V171 record prospective research-only venue policy and audited scores'
          for attempt in 1 2 3; do
            if git show --pretty= --name-only HEAD | grep -q '/freeze.json$'; then
              localhm=$(TZ=Asia/Tokyo date +%H%M)
              if [ "$localhm" -ge 0815 ]; then
                echo 'V171_FREEZE_PUSH_TOO_LATE; no late prospective freeze'
                exit 1
              fi
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "V171_PUSH_RETRY $attempt"
            git fetch origin main
            git rebase origin/main
          done
          echo 'V171_PUSH_FAILED'; exit 1
