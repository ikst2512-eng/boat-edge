name: BOAT EDGE V171 - Prospective Venue Mode Selection RESEARCH ONLY

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V171_ONE_UPLOAD.yml'
  workflow_dispatch:
  schedule:
    # At 08:00, 08:05, 08:10 JST: before first race, immutable choice freeze.
    - cron: '0,5,10 23 * * *'
    # At 09:15 JST: score prior day, read ONLY audited website reference results.
    - cron: '15 0 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v171-prospective-venue-paired
  cancel-in-progress: false

jobs:
  research-only-venue-gate:
