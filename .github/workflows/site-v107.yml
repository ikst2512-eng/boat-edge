name: BOAT EDGE V107 Tabs + Site Back

on:
  push:
    paths:
      - ".github/workflows/site-v107.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v107-current
  cancel-in-progress: false

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable previous CURRENT scheduler
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${ github.token }
        shell: bash
        run: |
          set +e
          gh api --method PUT "repos/${ github.repository }/actions/workflows/site-v106.yml/disable" >/dev/null 2>&1 || true
          for status in in_progress queued waiting requested pending; do
            ids="$(gh api "repos/${ github.repository }/actions/workflows/site-v106.yml/runs?status=${status}&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)"
            for id in $ids; do
              gh api --method POST "repos/${ github.repository }/actions/runs/$id/cancel" >/dev/null 2>&1 || true
            done
          done
          set -e

      - name: Rebuild archive from saved data
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone,timedelta

          START='20261005'
          JST=timezone(timedelta(hours=9))
          races=Path('data/races'); results=Path('data/site_results'); odds=Path('data/site_odds')
          out=Path('data/site_archive'); out.mkdir(parents=True,exist_ok=True)
          days={}

          for p in sorted(races.glob('*.json')):
              m=re.fullmatch(r'(\d{8})-(\d{2})-(\d{2})\.json',p.name)
              if not m: continue
              ymd,jcd,rno=m.groups()
              if ymd<START: continue
              try:d=json.loads(p.read_text(encoding='utf-8'))
              except:continue
              meta=d.get('meta') or {}
              key=d.get('race_key') or p.stem
              day=days.setdefault(ymd,{})
              v=day.setdefault(jcd,{'jcd':jcd,'venue':meta.get('venue') or jcd,'event':meta.get('event') or '','races':[]})
              res=None; rp=results/f'{key}.json'
              if rp.exists():
                  try:res=json.loads(rp.read_text(encoding='utf-8'))
                  except:res=None
              v['races'].append({
                  'race_key':key,'race_no':int(meta.get('race_no') or rno),'deadline':meta.get('deadline'),
                  'file':f'data/races/{key}.json','jcd':jcd,
                  'result_status':res.get('status') if res else None,
                  'trifecta':res.get('trifecta') if res else None,
                  'payout':res.get('trifecta_payout_yen_per_100') if res else None,
                  'has_odds':(odds/f'{key}.json').exists()
              })

          idx=[]
          for ymd,vm in sorted(days.items()):
              venues=[];count=0
              for jcd,v in sorted(vm.items()):
                  v['races'].sort(key=lambda x:x['race_no']);count+=len(v['races']);venues.append(v)
              doc={'schema_version':'boat-edge-site-archive-v107','ymd':ymd,'venue_count':len(venues),'race_count':count,'venues':venues}
              (out/f'{ymd}.json').write_text(json.dumps(doc,ensure_ascii=False,indent=2),encoding='utf-8')
              idx.append({'ymd':ymd,'venues':len(venues),'races':count})
          root={
              'schema_version':'boat-edge-site-archive-index-v107',
              'start_date':'2026-10-05',
              'updated_at':datetime.now(JST).isoformat(timespec='seconds'),
              'dates':idx,
              'retention':'saved source data; no deletion',
              'note':'missing historical odds/results are shown as unavailable'
          }
          (out/'index.json').write_text(json.dumps(root,ensure_ascii=False,indent=2),encoding='utf-8')
          print(root)
          PY

      - name: Install V107 UI
        shell: bash
        run: |
          mkdir -p assets
          cat > assets/boat_edge_v107.js <<'JS'
          /* BOAT_EDGE_V107_TAB_BACK_CLEANUP */
          (()=>{"use strict";
          const $=(s,r=document)=>r.querySelector(s);
          const $$=(s,r=document)=>[...r.querySelectorAll(s)];
          const STACK_KEY="boatEdgeV107ViewStack";
          const ORDER=["pred","scenario","card","before","data","audit"];
          const LABEL={pred:"予想",scenario:"展開",card:"選手",before:"直前",data:"データ",audit:"監査"};

          function getStack(){
            try{return JSON.parse(sessionStorage.getItem(STACK_KEY)||"[]")}catch(_){return []}
          }
          function setStack(v){
            try{sessionStorage.setItem(STACK_KEY,JSON.stringify(v.slice(-30)))}catch(_){}
          }
          function activeView(){return $(".view.active")?.id||"homeView"}
          function pushView(id){
            const s=getStack(),last=s[s.length-1];
            if(last!==id){s.push(id);setStack(s)}
          }
          function goView(id){
            if(typeof window.showView==="function"){window.showView(id);return}
            $$(".view").forEach(v=>v.classList.toggle("active",v.id===id));
            $$(".bottomnav [data-view]").forEach(v=>v.classList.toggle("on",v.dataset.view===id));
            window.scrollTo({top:0,behavior:"smooth"});
          }
          function siteBack(){
            const s=getStack();
            let id=s.pop()||"homeView";
            setStack(s);
            if(!$("#"+id))id="homeView";
            goView(id);
          }
          function fixBottom(){
            const b=$('.bottomnav [data-view="raceView"]');
            if(b){
              const icon=$(".navicon",b)?.outerHTML||'<span class="navicon">◎</span>';
              b.innerHTML=icon+"予想";
            }
          }
          function fixTabs(){
            const tabs=$("#raceTabs");if(!tabs)return;
            const map=new Map($$("[data-tab]",tabs).map(b=>[b.dataset.tab,b]));
            const direct=map.get("direct");
            if(direct)direct.remove();
            const dview=$("#tab-direct");
            if(dview){
              dview.classList.remove("active");
              dview.style.display="none";
            }
            for(const key of ORDER){
              const b=map.get(key);
              if(!b)continue;
              b.textContent=LABEL[key];
              tabs.appendChild(b);
            }
            const active=$("[data-tab].on",tabs);
            if(!active || !ORDER.includes(active.dataset.tab)){
              $$("[data-tab]",tabs).forEach(b=>b.classList.toggle("on",b.dataset.tab==="pred"));
              $$(".subview").forEach(v=>v.classList.toggle("active",v.id==="tab-pred"));
            }
          }
          function fixBackButtons(){
            for(const sel of [".be105-back",".be104-view-back button",".be103-view-back button"]){
              $$(sel).forEach(b=>{
                b.textContent="← 戻る";
                b.onclick=e=>{e.preventDefault();e.stopPropagation();siteBack()};
              });
            }
          }
          function captureBottom(){
            document.addEventListener("click",e=>{
              const b=e.target.closest?.(".bottomnav [data-view]");
              if(!b)return;
              const dest=b.dataset.view,cur=activeView();
              if(dest&&dest!==cur)pushView(cur);
            },true);
          }
          function captureRaceOpen(){
            document.addEventListener("click",e=>{
              const race=e.target.closest?.("[data-file],[data-race-file]");
              if(!race)return;
              if(activeView()!=="raceView")pushView(activeView());
            },true);
          }
          function tidy(){fixBottom();fixTabs();fixBackButtons()}
          captureBottom();captureRaceOpen();tidy();
          new MutationObserver(()=>tidy()).observe(document.documentElement,{subtree:true,childList:true});
          setInterval(tidy,1500);
          })();
          JS

          cat > assets/boat_edge_v107.css <<'CSS'
          /* BOAT_EDGE_V107_TAB_BACK_CLEANUP */
          #tab-direct{display:none!important}
          #raceTabs [data-tab="direct"]{display:none!important}
          #raceTabs{scrollbar-width:none}
          #raceTabs::-webkit-scrollbar{display:none}
          #raceTabs [data-tab]{min-width:64px}
          @media(max-width:640px){
            #raceTabs [data-tab]{min-width:60px;padding-left:8px;padding-right:8px}
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script src=["\']\./assets/boat_edge_v107\.js(?:\?v=\d+)?["\']></script>\s*','\n',s)
          s=re.sub(r'\s*<link[^>]+boat_edge_v107\.css(?:\?v=\d+)?[^>]*>\s*','\n',s)
          s=s.replace('</head>','<link rel="stylesheet" href="./assets/boat_edge_v107.css?v=107">\n</head>')
          s=s.replace('</body>','<script src="./assets/boat_edge_v107.js?v=107"></script>\n</body>')
          if re.search(r'<meta name="boat-edge-site-version" content="[^"]+">',s):
              s=re.sub(r'<meta name="boat-edge-site-version" content="[^"]+">','<meta name="boat-edge-site-version" content="V107-TABS-SITE-BACK">',s)
          else:
              s=s.replace('</head>','<meta name="boat-edge-site-version" content="V107-TABS-SITE-BACK">\n</head>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Update TODO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('BOAT_EDGE_CURRENT_TODO.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# BOAT EDGE CURRENT TODO\n'
          s=re.sub(r'Current UI target: V\d+','Current UI target: V107',s)
          lines=[
            '- V107 race tabs fixed to 予想 / 展開 / 選手 / 直前 / データ / 監査.',
            '- V107 hides legacy 直前モード tab.',
            '- V107 bottom navigation レース -> 予想.',
            '- V107 site-local back stack replaces browser-history back for internal views.',
            '- V107 becomes the only scheduled CURRENT stabilizer/archive builder.'
          ]
          marker='## NEXT'
          for line in lines:
              if line not in s:
                  s=s.replace(marker,line+'\n\n'+marker,1) if marker in s else s+'\n'+line+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check assets/boat_edge_v107.js
          grep -q 'V107-TABS-SITE-BACK' index.html
          grep -q 'boat_edge_v107.js?v=107' index.html
          test -f data/site_archive/index.json
          python - <<'PY'
          import json
          d=json.load(open('data/site_archive/index.json',encoding='utf-8'))
          assert d['start_date']=='2026-10-05'
          assert d['dates']
          print(d)
          PY

      - name: Save
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site_archive assets/boat_edge_v107.js assets/boat_edge_v107.css index.html BOAT_EDGE_CURRENT_TODO.md
          git diff --cached --quiet && exit 0
          git commit -m "Add BOAT EDGE V107 tabs and site-local back"
          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
