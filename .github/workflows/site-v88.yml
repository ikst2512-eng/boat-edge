name: BOAT EDGE V88 Safe Boot Formal Adapter

on:
  push:
    paths:
      - ".github/workflows/site-v88.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install V88 safe boot and formal display contract
        shell: bash
        env:
          V88_JS: ""
        run: |
          python - <<'PY'
          import os,base64,re
          from pathlib import Path
          js=Path("assets/boat_edge_v88.js")
          js.write_text(base64.b64decode(os.environ["V88_JS"]).decode()+"\n",encoding="utf-8")
          p=Path("index.html"); h=p.read_text(encoding="utf-8")

          # Never present the legacy site-side calculator as the latest/formal model.
          h=h.replace('label:"暫定予想（サイト簡易）"','label:"旧サイト簡易（参考）"')
          h=h.replace('reason: `正式CURRENTとは別計算。','reason: `【最新モデルではありません】正式CURRENTとは別計算。')
          h=h.replace('caption:`サイト簡易スコア。正式CURRENTとは別計算。1号艇中心の内残り。`',
                      'caption:`旧サイト簡易スコア（参考表示）。正式CURRENTとは別計算。`')
          h=h.replace('caption:`サイト簡易スコア。攻め役は ${leader} 想定。`',
                      'caption:`旧サイト簡易スコア（参考表示）。正式CURRENTとは別計算。`')

          # Formal display: do not arbitrarily truncate formal tickets at 8.
          h=h.replace('const bets = (world?.tickets || world?.bets || world?.combinations || []).slice(0,8);',
                      'const bets = (world?.tickets || world?.bets || world?.combinations || []);')

          # Add V88 script after V86 guard.
          h=re.sub(r'\s*<script src=["\']\./assets/boat_edge_v88\.js(?:\?v=\d+)?["\']></script>\s*','\n',h)
          h=h.replace('</body>','<script src="./assets/boat_edge_v88.js?v=88"></script>\n</body>')
          h=re.sub(r'<meta name="boat-edge-site-version" content="[^"]+">',
                   '<meta name="boat-edge-site-version" content="V88-SAFE-BOOT">',h)
          p.write_text(h,encoding="utf-8")
          PY
      - name: Validate
        shell: bash
        run: |
          node --check assets/boat_edge_v88.js
          grep -q 'V88-SAFE-BOOT' index.html
          grep -q '旧サイト簡易（参考）' index.html
          grep -q 'boat_edge_v88.js?v=88' index.html
          if grep -Eq '<script[[:space:]]+src=["'\'']\./assets/boat_edge_simple_v51\.js' index.html; then exit 1; fi
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/boat_edge_v88.js
          git diff --cached --quiet && exit 0
          git commit -m "BOAT EDGE V88 safe boot and formal adapter"
          git push
