name: BOAT EDGE V169 - Racer Venue Affinity Display Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V169_ONE_UPLOAD.yml'
  workflow_dispatch:
  schedule:
    # Once a day after new race cards normally arrive (09:15 JST).
    - cron: '15 0 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v169-venue-history-display
  cancel-in-progress: false

jobs:
  build-venue-affinity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout recent main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install history fetch dependencies
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Verify current tracked V169 sources without restoring obsolete bundle
        shell: bash
        run: |
          set -euo pipefail
          # The old embedded tarball unconditionally wrote historical source
          # bytes over independently maintained files on every daily run.
          # Current Git-tracked versions are the source of truth.
          for source in scripts/site_racer_venue_v169.py tests/test_site_racer_venue_v169.py \
                        assets/boat_edge_v169_venue_stats.js assets/boat_edge_v169_venue_stats.css; do
            git ls-files --error-unmatch -- "$source" >/dev/null
            test -s "$source"
          done
          echo V169_TRACKED_SOURCES_NO_LEGACY_REINSTALL_PASS
      - name: Test exact history join and hard cutoff guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_site_racer_venue_v169.py -v
          python3 -m py_compile scripts/site_racer_venue_v169.py
          node --check assets/boat_edge_v169_venue_stats.js
      - name: Compile 92-day historical venue data and active racer subset
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_racer_venue_v169.py .
      - name: Validate existing V169 venue imports without rewriting UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V169_IMPORTS'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          for resource in (
              './assets/boat_edge_v169_venue_stats.css?v=169',
              './assets/boat_edge_v169_venue_stats.js?v=169',
              'boat_edge_v165_racer_stats.js',
              'boat_edge_v166_refresh.js',
          ):
              if html.count(resource)!=1:
                  raise SystemExit('V169_TRACKED_SITE_IMPORT_NOT_UNIQUE_'+resource)
          code=Path('scripts/site_racer_venue_v169.py').read_text(encoding='utf-8')
          if 'site_final_history_v133.py' in code:
              raise SystemExit('V169_PREDICTION_SOURCE_COUPLING_FORBIDDEN')
          print('V169_TRACKED_SITE_IMPORTS_READ_ONLY_PASS')
          PY_V169_IMPORTS
      - name: Commit only independent V169 display source and facts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Tracked source and UI are owned by reviewed PRs; never let daily
          # historical report runs resurrect old UI or fight track 03.
          git diff --exit-code -- index.html assets/boat_edge_v169_venue_stats.js assets/boat_edge_v169_venue_stats.css scripts/site_racer_venue_v169.py tests/test_site_racer_venue_v169.py
          git add -- data/site_racer_venue_v169/
          if git diff --cached --quiet; then echo 'V169 already up to date'; exit 0; fi
          git commit -m 'V169: display audited racer-by-venue preference without prediction changes'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo 'V169 PUSH PASS';exit 0; fi
            echo "V169 retry $attempt"
            sleep 2
          done
          echo 'V169 PUSH FAILED (no retroactive overwrite)' >&2
          exit 1
