name: BOAT EDGE V169 - Racer Venue Affinity Display Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V169_ONE_UPLOAD.yml'
  workflow_dispatch:
  schedule:
    # Once a day after new race cards normally arrive (09:15 JST).
    - cron: '15 0 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v169-venue-history-display
  cancel-in-progress: false

jobs:
  build-venue-affinity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout recent main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install history fetch dependencies
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Verify current tracked V169 sources without restoring obsolete bundle
        shell: bash
        run: |
          set -euo pipefail
          # The old embedded tarball unconditionally wrote historical source
          # bytes over independently maintained files on every daily run.
          # Current Git-tracked versions are the source of truth.
          for source in scripts/site_racer_venue_v169.py tests/test_site_racer_venue_v169.py \
                        assets/boat_edge_v169_venue_stats.js assets/boat_edge_v169_venue_stats.css; do
            git ls-files --error-unmatch -- "$source" >/dev/null
            test -s "$source"
          done
          echo V169_TRACKED_SOURCES_NO_LEGACY_REINSTALL_PASS
      - name: Test exact history join and hard cutoff guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_site_racer_venue_v169.py -v
          python3 -m py_compile scripts/site_racer_venue_v169.py
          node --check assets/boat_edge_v169_venue_stats.js
      - name: Compile 92-day historical venue data and active racer subset
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_racer_venue_v169.py .
      - name: Connect view only UI and verify no model change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYIN'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./assets/boat_edge_v169_venue_stats.css?v=169">'
          js='<script src="./assets/boat_edge_v169_venue_stats.js?v=169"></script>'
          assert s.count('</head>')==1 and s.count('</body>')==1
          assert 'boat_edge_v165_racer_stats.js' in s and 'boat_edge_v166_refresh.js' in s
          if css not in s:
              assert 'boat_edge_v169_venue_stats.css' not in s
              s=s.replace('</head>',css+'\n</head>')
          if js not in s:
              assert 'boat_edge_v169_venue_stats.js' not in s
              s=s.replace('</body>',js+'\n</body>')
          assert s.count(css)==1 and s.count(js)==1
          p.write_text(s,encoding='utf-8')
          assert 'site_final_history_v133.py' not in str(Path('scripts/site_racer_venue_v169.py').read_text())
          print('V169 HTML 1/1; prediction, stake, freeze, payout unchanged')
          PYIN
      - name: Commit only independent V169 display source and facts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/boat_edge_v169_venue_stats.js assets/boat_edge_v169_venue_stats.css scripts/site_racer_venue_v169.py tests/test_site_racer_venue_v169.py data/site_racer_venue_v169/
          if git diff --cached --quiet; then echo 'V169 already up to date'; exit 0; fi
          git commit -m 'V169: display audited racer-by-venue preference without prediction changes'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo 'V169 PUSH PASS';exit 0; fi
            echo "V169 retry $attempt"
            sleep 2
          done
          echo 'V169 PUSH FAILED (no retroactive overwrite)' >&2
          exit 1
