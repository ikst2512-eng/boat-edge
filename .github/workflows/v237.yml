name: BOAT EDGE V237 - Site Autonomy Health and Obsolete Worker Retirement

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v237.yml']
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v237-health-legacy-228-cleanup
  cancel-in-progress: false

jobs:
  safe-site-health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full latest repository (no formal results accessed)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify source and publish health report without model changes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v237_install.py" <<'PY_V237_INSTALL'
          import base64,gzip,hashlib,ast
          from pathlib import Path
          resources = {
            'scripts/boat_edge_v237_health.py': ('804549b05745050e6cd83d35b9584843b29c479c3e336283bde6e62ac86d81da', ''),
            'tests/test_boat_edge_v237_health.py': ('e5bd043b0e01059de345e45f1608b9c71c17644389fa1e53dcd0895e03abc2c4', ''),
            'health.html': ('00009f10a939e425abb2c258574f0a4686252dfac9114edfb0411f7699ec3ee8', ''),
          }
          for file,(expected,payload) in resources.items():
              data=gzip.decompress(base64.b64decode(payload))
              if hashlib.sha256(data).hexdigest()!=expected:
                  raise SystemExit('V237_PINNED_PAYLOAD_MISMATCH_'+file)
              p=Path(file)
              if p.exists() and p.read_bytes()!=data:
                  raise SystemExit('V237_PINNED_EXISTING_SOURCE_DRIFT_'+file)
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(data)
              if file.endswith('.py'):ast.parse(data.decode('utf-8'))
          print('V237_PINNED_RESEARCH_HEALTH_SOURCE_VERIFIED',len(resources))
          PY_V237_INSTALL
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 "$RUNNER_TEMP/v237_install.py"
            PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v237_health.py' -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v237_health.py
            git add -- scripts/boat_edge_v237_health.py tests/test_boat_edge_v237_health.py health.html data/site_autopilot/v237_current.json
            python3 - <<'PY_V237_STAGED'
          import subprocess
          allowed={'scripts/boat_edge_v237_health.py','tests/test_boat_edge_v237_health.py',
                   'health.html','data/site_autopilot/v237_current.json'}
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged-allowed:raise SystemExit('V237_UNEXPECTED_STAGED_FILES_'+repr(staged-allowed))
          print('V237_HEALTH_ONLY_STAGED',len(staged))
          PY_V237_STAGED
            git diff --cached --check
            if git diff --cached --quiet; then
              echo V237_NO_NEW_HEALTH_STATE_NO_EXTRA_COMMIT
              published=true; break
            fi
            git commit -m 'V237 publish audit-only site self-drive and research health'
            if git push origin HEAD:main; then
              echo V237_SITE_HEALTH_GIT_PUBLISHED
              published=true; break
            fi
            echo "V237_PUSH_CONFLICT_DROP_LOCAL_RECALCULATE_$attempt"
          done
          if [[ "$published" != true ]]; then echo V237_SITE_HEALTH_NOT_PUBLISHED >&2; exit 1; fi
      - name: Retire only proven broken legacy V228 once replacement is healthy
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # V228 refuses to run unless autopilot.html has this exact old SHA,
          # although the newer page has legitimate independent changes.
          prior_sha='68a499385e858490e9e3ef95486d63704f43a00e53ad85dd11099f51581b019c'
          if [[ ! -f autopilot.html ]]; then echo V237_KEEP_V228_NO_MONITOR_PAGE; exit 0; fi
          if [[ "$(sha256sum autopilot.html | cut -d' ' -f1)" == "$prior_sha" ]]; then
            echo V237_KEEP_V228_OLD_PAGE_STILL_MATCHES; exit 0
          fi
          for required in V235.yml v236.yml; do
            if ! state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${required}" --jq '.state' 2>/dev/null); then
              echo "V237_KEEP_V228_UNVERIFIED_WORKFLOW_$required"; exit 0
            fi
            if [[ "$state" != active ]]; then echo "V237_KEEP_V228_REPLACEMENT_NOT_ACTIVE_$required"; exit 0; fi
            if ! recent=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${required}/runs?per_page=12" --jq '[.workflow_runs[] | select(.conclusion=="success")] | length' 2>/dev/null); then
              echo "V237_KEEP_V228_CANNOT_VERIFY_SUCCESS_$required"; exit 0
            fi
            if (( recent < 1 )); then echo "V237_KEEP_V228_NO_CONFIRMED_REPLACEMENT_SUCCESS_$required"; exit 0; fi
          done
          old='BOAT_EDGE_V228_SITE_AI_AUTOPILOT.yml'
          if ! old_state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${old}" --jq '.state' 2>/dev/null); then
            echo V237_KEEP_V228_LEGACY_STATE_UNKNOWN; exit 0
          fi
          if [[ "$old_state" != active ]]; then echo "V237_V228_ALREADY_$old_state"; exit 0; fi
          if ! failures=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${old}/runs?per_page=12" --jq '[.workflow_runs[] | select(.conclusion=="failure")] | length' 2>/dev/null); then
            echo V237_KEEP_V228_FAILURE_HISTORY_UNAVAILABLE; exit 0
          fi
          if (( failures < 3 )); then echo "V237_KEEP_V228_FAILURE_EVIDENCE_INSUFFICIENT_$failures"; exit 0; fi
          python3 - <<'PY_V237_GUARD'
          import json
          from pathlib import Path
          d=json.loads(Path('data/site_autopilot/v237_current.json').read_text())
          assert d['schema']=='BOAT_EDGE_V237_SITE_SELF_DRIVE_HEALTH_V1'
          assert d['formal_guard_closed'] is True
          assert d['production_model_changed'] is False
          assert d['model_promotion_authorized'] is False
          assert d['formal_results_read_by_v237'] is False
          PY_V237_GUARD
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${old}/disable" >/dev/null; then
            echo V237_ONLY_CHRONIC_BROKEN_V228_WORKFLOW_DISABLED_AFTER_V235_AND_V236_SUCCESS
          else
            echo V237_OBSOLETE_V228_DISABLE_DENIED_NO_OTHER_WORKFLOWS_TOUCHED
          fi
