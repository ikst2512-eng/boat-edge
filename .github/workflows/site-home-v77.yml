name: BOAT EDGE V77 トップ仕上げ

on:
  push:
    paths:
      - ".github/workflows/site-home-v77.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: V77トップ仕上げ反映
        shell: bash
        env:
          BE77_ADDON_B64: ""
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path("assets/boat_edge_simple_v51.js")
          s=p.read_text(encoding="utf-8")
          marker="BOAT_EDGE_SITE_V77_HOME_POLISH"
          if marker not in s:
              s=s.rstrip()+"\n\n"+base64.b64decode(os.environ["BE77_ADDON_B64"]).decode("utf-8")+"\n"
              p.write_text(s,encoding="utf-8")
          PY

      - name: V77キャッシュ更新
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html");s=p.read_text(encoding="utf-8")
          s=re.sub(r'boat_edge_simple_v51\.js(?:\?v=\d+)?','boat_edge_simple_v51.js?v=77',s)
          s=re.sub(r'boat_edge_simple_v51\.css(?:\?v=\d+)?','boat_edge_simple_v51.css?v=77',s)
          p.write_text(s,encoding="utf-8")
          PY

      - name: 保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V77 home polish"
          git push
