name: BOAT EDGE V392 - Live Pages Early TopK Proof
on:
  pull_request:
    paths:
      - 'tests/browser/test_boat_edge_v392_live_preview.py'
      - 'assets/boat_edge_v392_early_prediction.js'
      - '.github/workflows/v392-live-pages-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 0,4,8 * * *'
permissions:
  contents: read
jobs:
  live-early-topk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browsers
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Source-bound live Pages TopK - Chromium
        run: python tests/browser/test_boat_edge_v392_live_preview.py --engine chromium
      - name: Source-bound live Pages TopK - WebKit
        run: python tests/browser/test_boat_edge_v392_live_preview.py --engine webkit
