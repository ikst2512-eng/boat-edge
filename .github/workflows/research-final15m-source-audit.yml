name: Research PRE_RESULT source availability audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-final15m-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source-audit cohort boundaries
        run: python3 -m unittest discover -s tests -p 'test_research_final15m_source_audit.py' -v
      - name: Produce read-only source audit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-output
          python3 scripts/research_final15m_source_audit.py > research-output/source-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("research-output/source-audit.json").read_text())
          assert x["read_only"] is True and x["phase"]=="PRE_RESULT"
          assert all(sum(v.values())==x["cohorts"][cohort]["count"]
                     for cohort, c in x["cohorts"].items()
                     for v in c["reason_counts"].values())
          print("RESEARCH_SOURCE_AUDIT_PASS",x["observation_at"])
          PY
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: research-final15m-source-audit
          path: research-output/source-audit.json
          retention-days: 30
