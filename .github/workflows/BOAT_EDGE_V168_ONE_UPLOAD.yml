          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # UI correction is published first; optional V167 workflow update must not block it.
          git restore -- .github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml
          git add -- assets/boat_edge_v108.js index.html scripts/boat_edge_v168_odds_display_fix.py tests/test_boat_edge_v168_odds_behavior.js
