          import subprocess
          allowed={'assets/boat_edge_v108.js','index.html','scripts/boat_edge_v168_odds_display_fix.py','tests/test_boat_edge_v168_odds_behavior.js'}
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
