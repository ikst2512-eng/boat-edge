            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'V168 odds UI changes saved; V167 independent audit can run on workflow update'
              exit 0
            fi
            sleep 2
          done
          echo 'V168 UI push failed; do not claim publication' >&2
          exit 1
      - name: Best-effort repair of V167 audit import path after UI is safely committed
