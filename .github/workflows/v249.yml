name: BOAT EDGE V249 - Mobile Race Navigation and Six Boat Readability

# Legacy V249 packaged assets are no longer byte-identical to the improved
# production UI. Its fail-closed installer is retained for deliberate manual
# legacy inspection only. Never schedule an old installer to rewrite new CSS.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v249-mobile-race-focus
  cancel-in-progress: false

jobs:
  mobile-readable-site-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main including history for source integrity
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install verified display-only resources and run 16 regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v249_install.py" <<'PY_V249_INSTALL'
          from pathlib import Path
          import base64,hashlib,gzip,json
          resources=json.loads(r'''{"assets/boat_edge_v249_focus.css":{"sha256":"4fa200b0c862765f76f34a30694d77c408a2c2ba2edeacf70469991f9f343b0a","gz":""},"assets/boat_edge_v249_focus.js":{"sha256":"48051fca0fe341a7e45074ce37bd4c3c2c8f86cd744313bb3048bb34ca001e81","gz":""},"scripts/boat_edge_v249_patch.py":{"sha256":"0880d05da46f4b062fc82d3d914db444417523ec47eecedd7a1cb0789bf6b1f4","gz":""},"tests/test_boat_edge_v249_focus.py":{"sha256":"7364a04429a4c388389af643391a4a6717c756b4727857ecc16a0efd092a0423","gz":""}}''')
          for name,item in resources.items():
              data=gzip.decompress(base64.b64decode(item['gz']))
              if hashlib.sha256(data).hexdigest()!=item['sha256']:
                  raise SystemExit('V249_PACKAGED_SHA_MISMATCH_'+name)
              path=Path(name)
              if path.exists():
                  if path.read_bytes()!=data:
                      raise SystemExit('V249_VERIFIED_UI_RESOURCE_DRIFT_'+name)
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          print('V249_EXACT_PACKAGED_ASSETS_VERIFIED',len(resources))
          PY_V249_INSTALL
          python3 "$RUNNER_TEMP/v249_install.py"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v249_focus.py' -q
          node --check assets/boat_edge_v249_focus.js
          python3 -m py_compile scripts/boat_edge_v249_patch.py
          echo V249_SIXTEEN_UI_SAFETY_TESTS_PASS
      - name: Safely add race-focus assets without changing forecasts or result data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 "$RUNNER_TEMP/v249_install.py"
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v249_focus.py' -q
            node --check assets/boat_edge_v249_focus.js
            python3 - <<'PY_V249_FORMAL'
          import json
          from pathlib import Path
          f=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))
          g=f.get('guards') or {}
          assert all(g.get(k) is False for k in ('results_seen','unlock','scoring')), 'V249_FORMAL_RESULT_LOCK_OPEN'
          assert g.get('RESULT_UNLOCK_TOKEN') is None, 'V249_FORMAL_UNLOCK_TOKEN_PRESENT'
          assert (f.get('formalFirst100') or {}).get('races') == 0, 'V249_FORMAL_FIRST100_NOT_ZERO'
          print('V249_FORMAL_RESULT_LOCK_READ_ONLY_PASS')
          PY_V249_FORMAL
            python3 scripts/boat_edge_v249_patch.py
            git add -- index.html assets/boat_edge_v249_focus.css assets/boat_edge_v249_focus.js scripts/boat_edge_v249_patch.py tests/test_boat_edge_v249_focus.py
            python3 - <<'PY_V249_STAGE'
          import subprocess
          expected={'index.html','assets/boat_edge_v249_focus.css',
                    'assets/boat_edge_v249_focus.js','scripts/boat_edge_v249_patch.py',
                    'tests/test_boat_edge_v249_focus.py'}
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged.issubset(expected), 'V249_PRODUCTION_OR_FORMAL_STAGE_REJECTED_'+str(staged-expected)
          print('V249_STAGED_DISPLAY_ONLY_FILES',len(staged))
          PY_V249_STAGE
            git diff --cached --check
            if git diff --cached --quiet; then echo V249_ALREADY_DEPLOYED; success=true; break; fi
            git commit -m 'V249 site-only mobile quick race navigation and readable six-boat comparison'
            if git push origin HEAD:main; then echo V249_DISPLAY_ONLY_MAIN_PUBLISHED; success=true; break; fi
            echo "V249_CONCURRENT_PUSH_RETRY_${attempt}"
          done
          if test "$success" != true; then echo V249_FAIL_CLOSED_NO_PUBLISH; exit 1; fi
