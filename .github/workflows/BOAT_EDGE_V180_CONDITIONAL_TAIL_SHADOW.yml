name: BOAT EDGE V180 - Prospective Tail-Conditional Shadow Freeze

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V180_CONDITIONAL_TAIL_SHADOW.yml']
  workflow_dispatch:
  schedule:
    - cron: "*/10 0-14,23 * * *" # 08:00-23:59 JST (UTC cron)

permissions:
  contents: write

concurrency:
  group: boat-edge-v180-site-shadow
  cancel-in-progress: false

