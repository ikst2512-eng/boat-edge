      - name: Freeze new site-reference races only while before local deadline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_v180_shadow.py --repo .
      - name: Stage and scope-check only research additions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/site_v180_shadow.py tests/test_v180_shadow.py data/site_tail_shadow_v180/contract.json
          git add -A -- data/site_tail_shadow_v180/predictions/ 2>/dev/null || true
          python3 - <<'PYSCOPE'
          import subprocess,re
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          fixed={'scripts/site_v180_shadow.py','tests/test_v180_shadow.py','data/site_tail_shadow_v180/contract.json'}
          for path in changed:
              ok=path in fixed or re.fullmatch(r"data/site_tail_shadow_v180/predictions/20\d{6}-\d{2}-\d{2}\.json",path)
              if not ok:raise SystemExit('V180_UNEXPECTED_WRITE '+path)
              if path.endswith(".json") and "/predictions/" in path and path.split("/")[-1][:8]<"20261010":
                  raise SystemExit('V180_BACKFILL_FORBIDDEN '+path)
          print('V180_RESEARCH_ONLY_SCOPE_PASS',changed)
          PYSCOPE
          git diff --cached --check
      - name: Commit prospective frozen research without changing formal CURRENT
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then echo V180_NO_NEW_SHADOW; exit 0; fi
          git commit -m 'V180 prospective pre-result site-reference conditional tail shadow (research only)'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then echo V180_SHADOW_FROZEN_SUCCESS; exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 tests/test_v180_shadow.py
          done
          echo V180_PUSH_NOT_COMPLETE >&2
          exit 1
