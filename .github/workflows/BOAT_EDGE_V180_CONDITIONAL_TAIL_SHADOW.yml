name: BOAT EDGE V180 - Prospective Tail-Conditional Shadow Freeze

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V180_CONDITIONAL_TAIL_SHADOW.yml']
  workflow_dispatch:
  schedule:
    - cron: "*/10 0-14,23 * * *" # 08:00-23:59 JST (UTC cron)

permissions:
  contents: write

concurrency:
  group: boat-edge-v180-site-shadow
  cancel-in-progress: false

jobs:
  freeze-only-site-reference:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify tracked V180 sources without restoring historical code
        shell: bash
        run: |
          set -euo pipefail
          # All these files are already tracked in main. Historical embedded
          # gzip/bootstrap assets must never silently overwrite later fixes.
          for path in scripts/site_v180_shadow.py tests/test_v180_shadow.py; do
            git ls-files --error-unmatch "$path" >/dev/null
            test -s "$path"
          done
          echo 'V180_TRACKED_MAIN_SOURCE_NO_LEGACY_RESTORE_PASS'

      - name: Test future only cutoff odds independence and immutable replay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/site_v180_shadow.py tests/test_v180_shadow.py
          python3 tests/test_v180_shadow.py
      - name: Freeze new site-reference races only while before local deadline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_v180_shadow.py --repo .
      - name: Stage and scope-check only research additions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/site_v180_shadow.py tests/test_v180_shadow.py data/site_tail_shadow_v180/contract.json
          git add -A -- data/site_tail_shadow_v180/predictions/ 2>/dev/null || true
          python3 - <<'PYSCOPE'
          import subprocess,re
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          fixed={'scripts/site_v180_shadow.py','tests/test_v180_shadow.py','data/site_tail_shadow_v180/contract.json'}
          for path in changed:
              ok=path in fixed or re.fullmatch(r"data/site_tail_shadow_v180/predictions/20\d{6}-\d{2}-\d{2}\.json",path)
              if not ok:raise SystemExit('V180_UNEXPECTED_WRITE '+path)
              if path.endswith(".json") and "/predictions/" in path and path.split("/")[-1][:8]<"20261010":
                  raise SystemExit('V180_BACKFILL_FORBIDDEN '+path)
          print('V180_RESEARCH_ONLY_SCOPE_PASS',changed)
          PYSCOPE
          git diff --cached --check
      - name: Commit prospective frozen research without changing formal CURRENT
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then echo V180_NO_NEW_SHADOW; exit 0; fi
          git commit -m 'V180 prospective pre-result site-reference conditional tail shadow (research only)'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then echo V180_SHADOW_FROZEN_SUCCESS; exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 tests/test_v180_shadow.py
          done
          echo V180_PUSH_NOT_COMPLETE >&2
          exit 1
