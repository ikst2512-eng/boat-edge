name: BOAT EDGE V199 - Unseen Head Second Original Scenario Ablations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V199_PROSPECTIVE_SCENARIO_ABLATIONS.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'BOAT EDGE V185 - Prospective Third Role Challenger 10-20x Accuracy'
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/5 0-14,23 * * *' # JST 08:00-23:59; future-only before-deadline research

permissions:
  contents: write

concurrency:
  group: boat-edge-v199-future-ablation-studies
  cancel-in-progress: false

