      - name: Independently replay first Git addition before optional site-only result scoring
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum scripts/site_v199_research.py | cut -d' ' -f1)" = '630c52003d490372203f80d6a8061e5301ec4f39f5a624e0882fa8180e8716f1'
          python3 scripts/site_v199_research.py score --model-sha '630c52003d490372203f80d6a8061e5301ec4f39f5a624e0882fa8180e8716f1' --out /tmp/V199_RUN1.json
          python3 scripts/site_v199_research.py score --model-sha '630c52003d490372203f80d6a8061e5301ec4f39f5a624e0882fa8180e8716f1' --out /tmp/V199_RUN2.json
          cmp /tmp/V199_RUN1.json /tmp/V199_RUN2.json
          python3 - <<'PYAUDIT'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/V199_RUN1.json').read_text(encoding='utf-8'))
          assert d['formal_results_accessed'] is False
          assert d['production_model_changed'] is False
          assert not d['invalid'],d['invalid']
          assert d['decision']=='NOT_ADOPTABLE_WITHOUT_MULTIDAY_FRESH_PRECOMMIT_GAINS'
          print('V199_DOUBLE_RUN_BYTE_IDENTICAL_FORMAL_LOCKED',d['settled_verified'],d['pending_results'])
          PYAUDIT

      - name: Save only research evidence with safe concurrent-write retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            test "$(sha256sum scripts/site_v199_research.py | cut -d' ' -f1)" = '630c52003d490372203f80d6a8061e5301ec4f39f5a624e0882fa8180e8716f1'
            python3 scripts/site_v199_research.py score --model-sha '630c52003d490372203f80d6a8061e5301ec4f39f5a624e0882fa8180e8716f1' --out data/site_shadow_v199/evaluation.json
            git add -- data/site_shadow_v199/evaluation.json
            git diff --cached --check
            if git diff --cached --quiet; then
              echo V199_EVIDENCE_ALREADY_CURRENT
              exit 0
            fi
            git commit -m 'V199 site-only immutable independent ablation score; no promotion'
            if git push origin HEAD:main; then
              echo V199_RESEARCH_REPORT_COMMITTED_NO_PRODUCTION_PROMOTION
              exit 0
            fi
            echo "V199_REPORT_RETRY_${attempt}_REMOTE_UPDATE"
          done
          echo V199_REPORT_PUSH_RETRIES_EXHAUSTED >&2
          exit 1
