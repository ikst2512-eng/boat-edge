name: BOAT EDGE V76 常駐締切順

on:
  push:
    paths:
      - ".github/workflows/site-home-v76.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: V76反映
        shell: bash
        env:
          BE76_ADDON_B64: ""
        run: |
          python - <<'PY'
          import os,re,base64
          from pathlib import Path
          js=Path("assets/boat_edge_simple_v51.js")
          s=js.read_text(encoding="utf-8")
          marker="BOAT_EDGE_SITE_V76_PERSISTENT_PRIORITY"
          if marker not in s:
              addon=base64.b64decode(os.environ["BE76_ADDON_B64"]).decode("utf-8")
              s=re.sub(r'^/\* BOAT_EDGE_SITE_V\d+_[^*]+ \*/',
                       '/* BOAT_EDGE_SITE_V76_PERSISTENT_PRIORITY */',s,count=1)
              s=s.rstrip()+"\n\n"+addon+"\n"
              js.write_text(s,encoding="utf-8")
          PY
      - name: index cache更新
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html");s=p.read_text(encoding="utf-8")
          s=re.sub(r'boat_edge_simple_v51\.js\?v=\d+','boat_edge_simple_v51.js?v=76',s)
          s=re.sub(r'boat_edge_simple_v51\.css\?v=\d+','boat_edge_simple_v51.css?v=76',s)
          p.write_text(s,encoding="utf-8")
          PY
      - name: 保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update BOAT EDGE V76 persistent deadline home"
          git push
