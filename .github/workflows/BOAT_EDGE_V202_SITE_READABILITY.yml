on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V202_SITE_READABILITY.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v202-readability-only
  cancel-in-progress: false

