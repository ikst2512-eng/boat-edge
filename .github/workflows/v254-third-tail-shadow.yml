name: BOAT EDGE V254 - Future Only Third Tail Ten-Ticket Research

on:
  push:
    branches:
      - main
      - feat/v254-prospective-third-tail-shadow-20261012
      - feat/v257-event-driven-v254-coverage-20261012
    paths:
      - '.github/workflows/v254-third-tail-shadow.yml'
      - 'scripts/boat_edge_v254_third_tail.py'
      - 'tests/test_boat_edge_v254_third_tail.py'
      - 'assets/boat_edge_v254_tail_status.js'
      - 'tests/test_boat_edge_v254_tail_status.cjs'
      - 'tests/test_boat_edge_v257_event_trigger.py'
      - '.github/workflows/V235.yml'
      - '.github/workflows/V234.yml'
      - '.github/workflows/V233.yml'
      - 'autopilot.html'
  workflow_dispatch:
  # V286: V235 already performs a same-run, future-only research freeze
  # immediately after immutable source commit. Do NOT enqueue a redundant
  # full V254 workflow after every successful V235 run (often 0 new races).
  # Keep the old V232 success event if separately reenabled, plus a staggered
  # 5-minute fallback and manual recovery. All pre-result gates stay unchanged.
  workflow_run:
    workflows:
      - 'BOAT EDGE V232 - Independent Pre-Result Accuracy Cohort'
    types: [completed]
  schedule:
    # Keep the five-minute PRE_RESULT freeze cadence; score older SITE-only
    # frozen cohorts on one staggered 15-minute tick to reduce Pages churn.
    - cron: '3,18,33,48 0-14,23 * * *'
    - cron: '8,23,38,53 0-14,23 * * *'
    - cron: '13,28,43,58 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v254-exact-third-tail-forward-shadow
  cancel-in-progress: false

jobs:
  verify-future-gates:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check frozen-only candidate and no-formal safety
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v254_third_tail.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v257_event_trigger.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v253_miss_audit.py' -q
          python3 - <<'PY'
          import ast,json
          from pathlib import Path
          ast.parse(Path('scripts/boat_edge_v254_third_tail.py').read_text())
          guard=json.loads(Path('data/formal_status.json').read_text())['guards']
          assert all(guard.get(k) is False for k in ('results_seen','unlock','scoring'))
          assert guard.get('RESULT_UNLOCK_TOKEN') is None
          print('V254_FORMAL_FRESH_STAYS_LOCKED')
          PY
          node --check assets/boat_edge_v254_tail_status.js
          node tests/test_boat_edge_v254_tail_status.cjs
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_02_site_provisional_adoption.py' -v
          node tests/test_boat_edge_02_site_provisional_adoption.cjs
          node --check assets/boat_edge_v108.js
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/site_final_history_v133.py
          git diff --check
          echo V254_FUTURE_ONLY_PREDECLARED_TAIL_CANDIDATE_TEST_PASS

  freeze-forward-candidates:
    if: github.ref == 'refs/heads/main'
    needs: verify-future-gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Commit only genuinely future and immutable candidate rows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v254_frozen data/site_autopilot/v254_pre_current.json
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v254_third_tail.py freeze
            if test -f data/site_autopilot/v254_pre_current.json; then git add -- data/site_autopilot/v254_pre_current.json; fi
            if test -d data/site_autopilot/v254_frozen; then git add -A -- data/site_autopilot/v254_frozen; fi
            python3 - <<'PY_STAGE_V254_PRE'
          import re,subprocess
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for p in staged:
              if p=='data/site_autopilot/v254_pre_current.json' or re.fullmatch(r'data/site_autopilot/v254_frozen/20\d{6}-\d{2}-\d{2}\.json',p):continue
              raise SystemExit('V254_FORBIDDEN_PRE_RESULT_STAGE_'+p)
          print('V254_ONLY_PRE_RESULT_RESEARCH_STAGED',len(staged))
          PY_STAGE_V254_PRE
            git diff --cached --check
            if git diff --cached --quiet; then echo V254_NO_NEW_UNSEEN_COHORT;success=true;break;fi
            git commit -m 'V254 untouched new future third-tail 10-ticket shadow freeze'
            if git push origin HEAD:main; then echo V254_PRE_RESULT_IMMUTABLY_FROZEN;success=true;break;fi
          done
          if test "$success" != true; then echo V254_PRE_RESULT_PUBLISH_CONFLICT;exit 1;fi

  score-only-prior-frozen-after-deadline:
    # Readonly tests and source-first freeze still run on every trigger.
    # Results are scored only in this deliberately staggered research window.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '13,28,43,58 0-14,23 * * *'))
    needs: freeze-forward-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Score only previously Git-frozen candidates after verified site result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v254_scored data/site_autopilot/v254_score_current.json
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v254_third_tail.py score
            if test -f data/site_autopilot/v254_score_current.json; then git add -- data/site_autopilot/v254_score_current.json; fi
            if test -d data/site_autopilot/v254_scored; then git add -A -- data/site_autopilot/v254_scored; fi
            python3 - <<'PY_STAGE_V254_POST'
          import re,subprocess
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for p in staged:
              if p=='data/site_autopilot/v254_score_current.json' or re.fullmatch(r'data/site_autopilot/v254_scored/20\d{6}-\d{2}-\d{2}\.json',p):continue
              raise SystemExit('V254_FORBIDDEN_POST_RESULT_STAGE_'+p)
          print('V254_ONLY_SITE_RESEARCH_SCORE_STAGED',len(staged))
          PY_STAGE_V254_POST
            git diff --cached --check
            if git diff --cached --quiet; then echo V254_NO_NEW_CONFIRMED_SITE_RESULT;success=true;break;fi
            git commit -m 'V254 scored previously frozen future site-only tail shadow'
            if git push origin HEAD:main; then echo V254_POST_RESULT_DESCRIPTIVE_SCORE_PUBLISHED;success=true;break;fi
          done
          if test "$success" != true; then echo V254_SCORE_PUBLISH_CONFLICT;exit 1;fi
