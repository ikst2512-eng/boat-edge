name: Fresh First Git State Audit (read only)
on:
  pull_request:
    paths:
      - 'scripts/fresh_first_git_state_audit.py'
      - 'scripts/fresh_race_csv_state_compare.py'
      - 'scripts/fresh_upcoming_state_targets.py'
      - 'scripts/fresh_collector_actions_timeline.py'
      - 'scripts/fresh_historical_freeze_run_evidence.py'
      - 'scripts/fresh_nov01_source_wake_audit.py'
      - 'tests/test_fresh_nov01_source_wake_audit.py'
      - 'tests/test_fresh_historical_freeze_run_evidence.py'
      - 'tests/test_fresh_first_git_state_audit.py'
      - 'tests/test_fresh_race_csv_state_compare.py'
      - 'tests/test_fresh_upcoming_state_targets.py'
      - '.github/workflows/fresh-first-git-state-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run first-addition auditor regressions
        run: python3 -m unittest discover -s tests -p 'test_fresh_first_git_state_audit.py' -v
      - name: Test CSV per-race matching with synthetic inputs
        run: python3 -m unittest discover -s tests -p 'test_fresh_race_csv_state_compare.py' -v
      - name: Test future-only PRE_RESULT target selection
        run: python3 -m unittest discover -s tests -p 'test_fresh_upcoming_state_targets.py' -v
      - name: Test historical workflow-start audit with synthetic inputs
        run: python3 -m unittest discover -s tests -p 'test_fresh_historical_freeze_run_evidence.py' -v
      - name: Verify full Git history is present
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Audit original race-state Git additions without results
        run: python3 scripts/fresh_first_git_state_audit.py
      - name: Compare observed CSV row keys with saved race source audits
        run: python3 scripts/fresh_race_csv_state_compare.py
      - name: Inspect prospective near-deadline state audit freshness
        run: python3 scripts/fresh_upcoming_state_targets.py
      - name: Inspect live CSV target rows for up to 3 upcoming races (read only)
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          targets = json.loads(Path("fresh_upcoming_state_targets.json").read_text(encoding="utf-8")).get("targets", [])
          keys = [x["race_key"] for x in targets[:3]]
          if keys:
              subprocess.run(["python3", "scripts/fresh_race_csv_state_compare.py", *keys,
                              "--output", "fresh_upcoming_csv_state_comparison.json"], check=True)
          else:
              Path("fresh_upcoming_csv_state_comparison.json").write_text(json.dumps({
                  "schema": "BOAT_EDGE_UPCOMING_CSV_COMPARISON_EMPTY_V1",
                  "reason": "NO_UPCOMING_PRE_RESULT_TARGETS",
                  "results_accessed": False, "formal_unlock_authorized": False,
                  "races": []
              }) + "\\n", encoding="utf-8")
          PY
      - name: Inspect collector Actions timeline around 14:24 to 15:15 JST
        env:
          GH_READONLY_TOKEN: ${{ github.token }}
        run: python3 scripts/fresh_collector_actions_timeline.py
      - name: Inspect two missing 2026-10-31 races' V229/V216 workflow starts
        env:
          GH_READONLY_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fresh_historical_freeze_run_evidence.py \
            --race-key 20261031-23-06 --race-key 20261031-24-09
      - name: Test Nov 1 source wake audit (synthetic only)
        run: python3 -m unittest discover -s tests -p 'test_fresh_nov01_source_wake_audit.py' -v
      - name: Inspect November 1 source wake incident (read only)
        env:
          GH_READONLY_TOKEN: ${{ github.token }}
        run: python3 scripts/fresh_nov01_source_wake_audit.py
      - name: Preserve non-formal provenance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-first-git-state-audit
          path: |
            fresh_first_git_state_audit.json
            fresh_race_csv_state_comparison.json
            fresh_upcoming_state_targets.json
            fresh_upcoming_csv_state_comparison.json
            fresh_collector_actions_timeline.json
            historical_freeze_run_evidence.json
            nov01_source_wake_gap_audit.json
          if-no-files-found: warn
          retention-days: 30
