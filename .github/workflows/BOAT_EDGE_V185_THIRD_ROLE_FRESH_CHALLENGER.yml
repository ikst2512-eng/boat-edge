name: BOAT EDGE V185 - Prospective Third Role Challenger 10-20x Accuracy

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V185_THIRD_ROLE_FRESH_CHALLENGER.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/10 0-14,23 * * *' # JST 08:00-23:59, no historical backfill

permissions:
  contents: write

concurrency:
  group: boat-edge-v185-research-tail-role
  cancel-in-progress: false

jobs:
  prospective-third-role:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout full history and existing site-reference freeze engine
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify tracked V185 sources without restoring historical code
        shell: bash
        run: |
          set -euo pipefail
          # All these files are already tracked in main. Historical embedded
          # gzip/bootstrap assets must never silently overwrite later fixes.
          for path in scripts/site_v185_role_shadow.py scripts/site_v185_score.py tests/test_v185_role_shadow.py tests/test_v185_git_provenance.py; do
            git ls-files --error-unmatch "$path" >/dev/null
            test -s "$path"
          done
          echo 'V185_TRACKED_MAIN_SOURCE_NO_LEGACY_RESTORE_PASS'

      - name: Test exact role separation and immutable predeadline settlement
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/site_v180_shadow.py
          python3 -m py_compile scripts/site_v185_role_shadow.py scripts/site_v185_score.py
          python3 tests/test_v185_role_shadow.py
          python3 tests/test_v185_git_provenance.py
          python3 - <<'PYGUARD'
          from pathlib import Path
          s=Path('scripts/site_v185_role_shadow.py').read_text()
          forbidden=['site_results','site_prediction_history','payout_yen','trifecta_payout','combined_api','resultFor(']
          assert all(k not in s for k in forbidden),[k for k in forbidden if k in s]
          assert 'FIRST_DATE' in Path('scripts/site_v180_shadow.py').read_text()
          print('V185_PREDICTOR_NOT_READING_RESULTS_OR_ODDS_PASS')
          PYGUARD
      - name: Independently score already committed and confirmed future candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_v185_score.py --repo . --out data/site_tail_shadow_v185/evaluation.json
      - name: Freeze only new PRE_RESULT 2026-10-10+ research candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_v185_role_shadow.py --repo .
          git diff --check
      - name: Commit research-only evidence, preserve user predictions and original model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/site_v185_role_shadow.py scripts/site_v185_score.py tests/test_v185_role_shadow.py tests/test_v185_git_provenance.py data/site_tail_shadow_v185/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo V185_RESEARCH_IDEMPOTENT_NO_NEW_PRE_RESULT_FILES
            exit 0
          fi
          git commit -m 'V185 prospective third-role site reference challenger and immutable evidence'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo V185_FUTURE_ONLY_PRE_RESULT_RESEARCH_APPLIED
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            python3 tests/test_v185_role_shadow.py
            python3 tests/test_v185_git_provenance.py
          done
          echo V185_PUSH_RETRIES_EXHAUSTED >&2
          exit 1
