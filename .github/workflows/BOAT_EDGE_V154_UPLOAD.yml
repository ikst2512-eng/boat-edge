name: BOAT EDGE V154 Inside-Wall vs Attack Research SAFE-CUTOFF

on:
  push:
    paths:
      - ".github/workflows/BOAT_EDGE_V154_UPLOAD.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v154-inside-wall-vs-attack-research
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Acquire pinned pre-target data through 2026-10-07
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/boatracecsv
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/BoatraceCSV/boatracecsv.github.io.git /tmp/boatracecsv
          git -C /tmp/boatracecsv sparse-checkout init --no-cone
          cat > /tmp/boatracecsv/.git/info/sparse-checkout <<'PATTERNS'
          /data/results/realtime/2025/11/
          /data/programs/race_cards/2025/11/
          /data/results/realtime/2025/12/
          /data/programs/race_cards/2025/12/
          /data/results/realtime/2026/01/
          /data/programs/race_cards/2026/01/
          /data/results/realtime/2026/02/
          /data/programs/race_cards/2026/02/
          /data/results/realtime/2026/03/
          /data/programs/race_cards/2026/03/
          /data/results/realtime/2026/04/
          /data/programs/race_cards/2026/04/
          /data/results/realtime/2026/05/
          /data/programs/race_cards/2026/05/
          /data/results/realtime/2026/06/
          /data/programs/race_cards/2026/06/
          /data/results/realtime/2026/07/
          /data/programs/race_cards/2026/07/
          /data/results/realtime/2026/08/
          /data/programs/race_cards/2026/08/
          /data/results/realtime/2026/09/
          /data/programs/race_cards/2026/09/
          /data/results/realtime/2026/10/01.csv
          /data/programs/race_cards/2026/10/01.csv
          /data/results/realtime/2026/10/02.csv
          /data/programs/race_cards/2026/10/02.csv
          /data/results/realtime/2026/10/03.csv
          /data/programs/race_cards/2026/10/03.csv
          /data/results/realtime/2026/10/04.csv
          /data/programs/race_cards/2026/10/04.csv
          /data/results/realtime/2026/10/05.csv
          /data/programs/race_cards/2026/10/05.csv
          /data/results/realtime/2026/10/06.csv
          /data/programs/race_cards/2026/10/06.csv
          /data/results/realtime/2026/10/07.csv
          /data/programs/race_cards/2026/10/07.csv
          PATTERNS
          SOURCE_COMMIT="2d149e1ae838f6ed3426a7989be69e799ac2988f"
          git -C /tmp/boatracecsv fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C /tmp/boatracecsv checkout --force --detach "$SOURCE_COMMIT"
          test "$(git -C /tmp/boatracecsv rev-parse HEAD)" = "$SOURCE_COMMIT"
          test ! -e /tmp/boatracecsv/data/results/realtime/2026/10/08.csv
          test ! -e /tmp/boatracecsv/data/programs/race_cards/2026/10/08.csv

      - name: Compare V154 pre-wall and attack scenarios twice; V153 54-model parity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v154.py <<'PY'
          from __future__ import annotations
          import csv, hashlib, itertools, json, math, os
          from collections import Counter, defaultdict
          from datetime import date, timedelta
          from pathlib import Path
          
          SRC=Path(os.getenv('BOAT_CSV_ROOT','/tmp/boatracecsv'))
          OUT=Path(os.getenv('V154_OUT','data/site_racer_actual_course/v154_research'))
          OUT.mkdir(parents=True,exist_ok=True)
          TEST=os.environ.get('V154_TEST_MODE')=='1'
          SOURCE_SHA='2d149e1ae838f6ed3426a7989be69e799ac2988f'
          FIRST=date(2025,11,1)
          TARGET=date(2026,10,8)
          FOLDS=[('F1',date(2026,7,7),date(2026,7,8),date(2026,8,7)),
                 ('F2',date(2026,8,7),date(2026,8,8),date(2026,9,7)),
                 ('F3',date(2026,9,7),date(2026,9,8),date(2026,10,7))]
          MODELS=('baseline_pl','head_history_pl','v148_cond_full','role_head12','role_guarded',
                  'head_tail_baseline','head_tail_place','head_tail_base_cond',
                  'pre_head_pressure','pre_head_pressure_cond','pre_head_multisignal',
                  'world_tail_base','world_tail_place','world_tail_conditional','world_tail_conditional_place',
                  'head_blend05_pl','head_blend05_weak_cond','head_blend05_place',
                  'v154_wall_pl','v154_wall_cond','v154_attack_cond','v154_wall_attack_cond')
          SEGMENTS=('all','pred_head1','pred_head2','pred_head34','pred_head56',
                    'changed_entry_DIAGNOSTIC','unchanged_entry_DIAGNOSTIC',
                    'realized_1_2_DIAGNOSTIC','realized_attack34_benefit56_DIAGNOSTIC',
                  'pre_wall_SUPPORTED','pre_attack_SUPPORTED','pre_neutral_SUPPORTED')
          COURSE_PRIOR_EXP=0.65
          BACKOFF_N=12
          HEAD_EFFECT_EXP=0.5
          PL2_PSEUDO=40
          PL3_PSEUDO=25
          PLACE_BACKOFF_N=20
          PLACE_EFFECT_EXP=0.35
          TAIL_B2_BLEND=0.18
          TAIL_B3_BLEND=0.10
          # Freeze pre-race head / escape pressure hypotheses before evaluation.
          ST_ADV_SCALE=0.065      # 0.065 sec faster than 1 = full score
          MOTOR_ADV_SCALE=22.0    # percentage point units (0..100)
          NAT2_ADV_SCALE=26.0     # percentage point units (0..100)
          HEAD_PRESSURE_GAIN=1.5
          HEAD_PRESSURE_ESCAPE_DAMP=0.38
          HEAD_MULTI_GAIN=1.05
          HEAD_MULTI_ESCAPE_DAMP=0.20
          # V154 frozen scenario reweighting: no odds, no target results, no race-day observations.
          V154_WALL_MULT=1.25
          V154_ATTACK_MULT=1.18
          # V153 predeclared: fixed 50% geometric shrink of head pressure; weak conditional training-only tails.
          V153_BLEND=0.50
          V153_P2_BLEND=0.12
          V153_P3_BLEND=0.07
          # V152 preregistered: conditional-on-hypothetical-head tail response, no outcome features.
          # Shrink toward race-card Plackett-Luce; only training-fold conditional counts used.
          WORLD_P2_ALPHA_BY_HEAD=(0.10,0.20,0.20,0.20,0.06,0.06)
          WORLD_P3_ALPHA_BY_HEAD=(0.06,0.10,0.10,0.10,0.03,0.03)
          WORLD_P2_PSEUDO=80
          WORLD_P3_PSEUDO=55
          assert all(e<h<=end<TARGET for _,e,h,end in FOLDS)
          SHA=lambda b:hashlib.sha256(b).hexdigest()
          
          
          def read_pair(d):
              rel=f'{d:%Y/%m/%d}.csv'
              rp=SRC/'data/results/realtime'/rel
              cp=SRC/'data/programs/race_cards'/rel
              if not (rp.exists() and cp.exists()):
                  return None,None,dict(date=d.isoformat(),result=rp.exists(),card=cp.exists())
              rb,cb=rp.read_bytes(),cp.read_bytes()
              return (list(csv.DictReader(rb.decode('utf-8-sig').splitlines())),
                      list(csv.DictReader(cb.decode('utf-8-sig').splitlines())),
                      (rel,SHA(rb),SHA(cb)))
          
          
          def data_number(value):
              try:
                  x=float(str(value).strip())
                  return x if x>0 and math.isfinite(x) else None
              except (ValueError,TypeError):return None
          
          
          def optional_st(v):
              try:
                  x=float(str(v).strip())
                  return x if math.isfinite(x) and 0.0 <= x <= 0.45 else None
              except (ValueError,TypeError):return None
          
          
          def optional_pct(v):
              try:
                  x=float(str(v).strip())
                  return x if math.isfinite(x) and 0.0 <= x <= 100.0 else None
              except (ValueError,TypeError):return None
          
          
          def prerace_exhibition_safe_card_features(card):
              # Pre-race *card* metrics only. No exhibition, actual entry, odds or results.
              return tuple((optional_st(card.get(f'艇{i}_全国平均ST')),
                            optional_pct(card.get(f'艇{i}_モーター2連対率')),
                            optional_pct(card.get(f'艇{i}_全国2連対率')))
                           for i in range(1,7))
          
          
          def clamp(x):return max(-1.0,min(1.0,x))
          
          
          def adjust_escape_pressure(head,pre,multisignal=False):
              # Scoring is applied to hypothetical frames/courses available before race.
              # A missing feature is NEUTRAL and never backfilled from race results.
              out=list(head)
              strongest=0.0
              scores=[]
              for i in range(1,4): # 2,3,4: potential challengers to the inside lead
                  components=[]
                  if pre[0][0] is not None and pre[i][0] is not None:
                      components.append(clamp((pre[0][0]-pre[i][0])/ST_ADV_SCALE))
                  if pre[0][1] is not None and pre[i][1] is not None:
                      components.append(clamp((pre[i][1]-pre[0][1])/MOTOR_ADV_SCALE))
                  if pre[0][2] is not None and pre[i][2] is not None:
                      components.append(clamp((pre[i][2]-pre[0][2])/NAT2_ADV_SCALE))
                  # Conservative: require at least two independent observed signals.
                  if len(components)<2: strength=0.0
                  elif multisignal:
                      strength=max(0.0,sum(components)/len(components)) if sum(v>0 for v in components)>=2 else 0.0
                  else:
                      strength=max(0.0,sum(components)/len(components))
                  scores.append(strength)
                  strongest=max(strongest,strength)
                  if multisignal:
                      out[i]*=1.0+HEAD_MULTI_GAIN*strength
                  else:
                      out[i]*=1.0+HEAD_PRESSURE_GAIN*strength
              out[0]/=1.0+(HEAD_MULTI_ESCAPE_DAMP if multisignal else HEAD_PRESSURE_ESCAPE_DAMP)*strongest
              assert all(math.isfinite(v) and v>0 for v in out)
              return out,tuple(scores)
          
          
          def v154_prerace_support(pre):
              # Card-only. An unavailable feature is not an inferred/zero observation.
              def observed_votes(items):
                  values=[v for v in items if v is not None]
                  return len(values)>=2 and sum(values)>=2
              def ge_with_slack(a,b,slack):
                  return a>=b-slack if a is not None and b is not None else None
              def st_not_late(a,b,slack):
                  return a<=b+slack if a is not None and b is not None else None
              p1,p2=pre[0],pre[1]
              escape=observed_votes([
                  st_not_late(p1[0],p2[0],0.015),
                  ge_with_slack(p1[1],p2[1],6),
                  ge_with_slack(p1[2],p2[2],6)])
              # Two-boat survives the 3/4 pressure, not a claim of actual live 2-course wall.
              rivals=pre[2:4]
              checks=[]
              for dim in range(3):
                  vals=[v[dim] for v in rivals if v[dim] is not None]
                  if p2[dim] is None or not vals:checks.append(None)
                  elif dim==0:checks.append(p2[dim]<=min(vals)+0.025)
                  else:checks.append(p2[dim]>=max(vals)-10)
              wall=bool(escape and observed_votes(checks))
              challengers=[]
              for i in (2,3):
                  q=pre[i]
                  supporters=observed_votes([
                      q[0]<=p1[0]-0.020 if q[0] is not None and p1[0] is not None else None,
                      q[1]>=p1[1]+5 if q[1] is not None and p1[1] is not None else None,
                      q[2]>=p1[2]+5 if q[2] is not None and p1[2] is not None else None])
                  if supporters:challengers.append(i)
              beneficiaries=[]
              for i in (4,5):
                  q=pre[i]
                  if observed_votes([q[0]<=0.22 if q[0] is not None else None,
                                     q[1]>=25 if q[1] is not None else None,
                                     q[2]>=25 if q[2] is not None else None]):
                      beneficiaries.append(i)
              return wall,tuple(challengers),tuple(beneficiaries)
          
          
          def extract(r,card,need_nat):
              try:
                  lanes=[int(str(r[f'{i}コース_艇番']).strip()) for i in range(1,7)]
                  finish=[int(str(r[f'{i}着_艇番']).strip()) for i in range(1,4)]
              except (ValueError,TypeError,KeyError):return None
              if sorted(lanes)!=[1,2,3,4,5,6] or len(set(finish))!=3 or any(x not in range(1,7) for x in finish):return None
              regs=[str(card.get(f'艇{i}_登録番号') or '').strip() for i in range(1,7)]
              if len(set(regs))!=6 or any(len(x)!=4 or not x.isdigit() for x in regs):return None
              nat=[data_number(card.get(f'艇{i}_全国勝率')) for i in range(1,7)] if need_nat else None
              if need_nat and any(x is None for x in nat):return None
              return (lanes,regs,finish,nat)
          
          
          def rank120(scores,heads,seconds,thirds,style,tail2=None,tail3=None,pre=None):
              # Rank-specific head/2nd/3rd scores. Existing V149 styles remain byte-for-byte
              # numerically identical; the new styles decouple head strength from tail strength.
              if style in ('v154_wall_pl','v154_wall_cond','v154_attack_cond','v154_wall_attack_cond'):
                  base_style='pl' if style=='v154_wall_pl' else 'head_blend05_weak_cond'
                  base=rank120(scores,heads,seconds,thirds,base_style,tail2,tail3)
                  wall,challengers,beneficiaries=v154_prerace_support(pre) if pre is not None else (False,(),())
                  use_wall=style in ('v154_wall_pl','v154_wall_cond','v154_wall_attack_cond')
                  use_attack=style in ('v154_attack_cond','v154_wall_attack_cond')
                  if not ((use_wall and wall) or (use_attack and challengers and beneficiaries)):
                      return base
                  weighted=[]; head_mass=[0.0]*6; head_raw=[0.0]*6
                  for seq,p in base:
                      a,b,c=seq
                      boost=1.0
                      if use_wall and wall and a==1 and b==2:
                          boost*=V154_WALL_MULT
                      if use_attack and a-1 in challengers and ((b-1 in beneficiaries) or (c-1 in beneficiaries)):
                          boost*=V154_ATTACK_MULT
                      weighted.append((seq,p*boost))
                      head_mass[a-1]+=p
                      head_raw[a-1]+=p*boost
                  result=[(seq,p*head_mass[seq[0]-1]/head_raw[seq[0]-1]) for seq,p in weighted]
                  result.sort(key=lambda x:(-x[1],x[0]))
                  assert len(result)==120 and abs(sum(p for _,p in result)-1)<1e-9
                  for a in range(6):
                      assert abs(sum(p for seq,p in result if seq[0]==a+1)-scores[a]/sum(scores))<1e-9
                  return result
              total=sum(scores)
              total2=sum(tail2) if tail2 is not None else None
              total3=sum(tail3) if tail3 is not None else None
              output=[]
              for a,b,c in itertools.permutations(range(6),3):
                  p1=scores[a]/total
                  p2pl=scores[b]/(total-scores[a]) if tail2 is None else tail2[b]/(total2-tail2[a])
                  p3pl=scores[c]/(total-scores[a]-scores[b]) if tail3 is None else tail3[c]/(total3-tail3[a]-tail3[b])
                  if style=='v148_cond_full':
                      b2,b3=0.4,0.35
                  elif style=='role_head12':
                      b2,b3=((0.30,0.15) if a==0 else (0.20,0.10) if a==1 else (0.0,0.0))
                  elif style=='role_guarded':
                      b2,b3=((0.25,0.15) if a==0 else (0.18,0.10) if a==1 else (0.10,0.05) if a in (2,3) else (0.0,0.0))
                  elif style=='head_tail_base_cond':
                      b2,b3=TAIL_B2_BLEND,TAIL_B3_BLEND
                  elif style=='head_blend05_weak_cond':
                      b2,b3=V153_P2_BLEND,V153_P3_BLEND
                  elif style in ('world_tail_conditional','world_tail_conditional_place'):
                      b2,b3=WORLD_P2_ALPHA_BY_HEAD[a],WORLD_P3_ALPHA_BY_HEAD[a]
          
                  else:
                      b2,b3=0.0,0.0
                  if style in ('world_tail_conditional','world_tail_conditional_place'):
                      p2=(1-b2)*p2pl+b2*(seconds[(a,b)]+WORLD_P2_PSEUDO*p2pl)/(heads[a]+WORLD_P2_PSEUDO)
                      p3=(1-b3)*p3pl+b3*(thirds[(a,b,c)]+WORLD_P3_PSEUDO*p3pl)/(seconds[(a,b)]+WORLD_P3_PSEUDO)
                  else:
                      p2=(1-b2)*p2pl+b2*(seconds[(a,b)]+PL2_PSEUDO*p2pl)/(heads[a]+PL2_PSEUDO) if b2 else p2pl
                      p3=(1-b3)*p3pl+b3*(thirds[(a,b,c)]+PL3_PSEUDO*p3pl)/(seconds[(a,b)]+PL3_PSEUDO) if b3 else p3pl
                  output.append(((a+1,b+1,c+1),p1*p2*p3))
              output.sort(key=lambda x:(-x[1],x[0]))
              assert len(output)==120
              if not TEST:assert abs(sum(x[1] for x in output)-1)<1e-9
              return output
          
          
          # Separate untouched formal 10/8 target entirely from this retrospective research.
          assert not (SRC/'data/results/realtime/2026/10/08.csv').exists()
          assert not (SRC/'data/programs/race_cards/2026/10/08.csv').exists()
          records=[];missing=[];source_hashes=[];quality=Counter()
          d=FIRST
          while d<=FOLDS[-1][3]:
              rs,cs,hashline=read_pair(d)
              if rs is None:
                  missing.append(hashline)
                  d+=timedelta(days=1)
                  continue
              source_hashes.append(hashline)
              cards={str(c.get('レースコード') or ''):c for c in cs}
              for r in rs:
                  quality['rows']+=1
                  key=str(r.get('レースコード') or '')
                  card=cards.get(key)
                  if card is None:
                      quality['card_missing']+=1
                      continue
                  parts=extract(r,card,False)
                  if parts is None:
                      quality['invalid_race_or_racer']+=1
                      continue
                  lanes,regs,finish,_=parts
                  nat=[data_number(card.get(f'艇{i}_全国勝率')) for i in range(1,7)]
                  if any(x is None for x in nat):quality['national_strength_missing']+=1
                  records.append((d,key,lanes,regs,finish,nat,prerace_exhibition_safe_card_features(card)))
              d+=timedelta(days=1)
          
          fold_metrics={}; fold_counts={}; train_count={}; details={}; per_fold_notes={}
          for fid,train_end,hold_start,hold_end in FOLDS:
              train=[v for v in records if v[0]<=train_end]
              hold=[v for v in records if hold_start<=v[0]<=hold_end and all(x is not None for x in v[5])]
              train_count[fid]=len(train);fold_counts[fid]=len(hold)
              if TEST:
                  assert len(train)>=20 and len(hold)>=10,(fid,len(train),len(hold))
              else:
                  assert len(train)>25000 and len(hold)>3500,(fid,len(train),len(hold))
              starts=[0]*6;wins=[0]*6
              course_second=[0]*6;course_third=[0]*6
              racer_place=defaultdict(lambda:[0,0,0])
              racer=defaultdict(lambda:[0,0])
              heads=Counter();seconds=Counter();thirds=Counter()
              for _,_,lanes,regs,finish,_,_ in train:
                  a,b,c=(x-1 for x in finish)
                  heads[a]+=1;seconds[(a,b)]+=1;thirds[(a,b,c)]+=1
                  for ci,boat in enumerate(lanes):
                      starts[ci]+=1
                      iswin=boat==finish[0]
                      wins[ci]+=int(iswin)
                      course_second[ci]+=int(boat==finish[1])
                      course_third[ci]+=int(boat==finish[2])
                      rkey=(regs[boat-1],ci+1)
                      v=racer[rkey];v[0]+=1;v[1]+=int(iswin)
                      q=racer_place[rkey];q[0]+=1;q[1]+=int(boat==finish[1]);q[2]+=int(boat==finish[2])
              prior=[wins[i]/starts[i] for i in range(6)]
              second_prior=[course_second[i]/starts[i] for i in range(6)]
              third_prior=[course_third[i]/starts[i] for i in range(6)]
              assert all(0<x<1 for x in prior+second_prior+third_prior),(fid,prior,second_prior,third_prior)
              train_source_dates=[v[0] for v in train]
              assert train_source_dates and max(train_source_dates)<=train_end
          
              stats={seg:{m:dict(evaluated=0,head_top1=0,marginal_head_top1=0,trifecta_top3=0,trifecta_top5=0,trifecta_top10=0,head_ll_sum=0.0,pred_non1=0,true_non1=0,true_non1_called=0,false_non1=0,pred_head34=0,head_ticket_mismatch=0,mismatch_ticket_head_correct=0,mismatch_marginal_head_correct=0) for m in MODELS} for seg in SEGMENTS}
              for d,key,lanes,regs,finish,nat,pre in hold:
                  base=[nat[i]*(prior[i]/(1/6))**COURSE_PRIOR_EXP for i in range(6)]
                  head=[]
                  for i,reg in enumerate(regs):
                      pair=racer.get((reg,i+1))
                      if pair is None:
                          head.append(base[i])
                      else:
                          n,nw=pair;posterior=(nw+BACKOFF_N*prior[i])/(n+BACKOFF_N)
                          head.append(base[i]*(posterior/prior[i])**HEAD_EFFECT_EXP)
                  # Predeclared three rank-specialized candidates; all tails rely only
                  # on the held-out race card + earlier racer/actual-course history.
                  t2_place=[];t3_place=[]
                  for i,reg in enumerate(regs):
                      counts=racer_place.get((reg,i+1))
                      if counts is None:
                          t2_place.append(base[i]);t3_place.append(base[i]);continue
                      n,second_n,third_n=counts
                      q2=(second_n+PLACE_BACKOFF_N*second_prior[i])/(n+PLACE_BACKOFF_N)
                      q3=(third_n+PLACE_BACKOFF_N*third_prior[i])/(n+PLACE_BACKOFF_N)
                      t2_place.append(base[i]*(q2/second_prior[i])**PLACE_EFFECT_EXP)
                      t3_place.append(base[i]*(q3/third_prior[i])**PLACE_EFFECT_EXP)
                  multi_head=adjust_escape_pressure(head,pre,multisignal=True)[0]
                  # Geometric interpolation of positive scores preserves valid normalized head marginals.
                  blended=[head[i]**(1.0-V153_BLEND)*multi_head[i]**V153_BLEND for i in range(6)]
                  scoremap={
                      'baseline_pl':(base,'pl',None,None),
                      'head_history_pl':(head,'pl',None,None),
                      'v148_cond_full':(head,'v148_cond_full',None,None),
                      'role_head12':(head,'role_head12',None,None),
                      'role_guarded':(head,'role_guarded',None,None),
                      'head_tail_baseline':(head,'head_tail_baseline',base,base),
                      'head_tail_place':(head,'head_tail_place',t2_place,t3_place),
                      'head_tail_base_cond':(head,'head_tail_base_cond',base,base),
                      'pre_head_pressure':(adjust_escape_pressure(head,pre)[0],'pl',None,None),
                      'pre_head_pressure_cond':(adjust_escape_pressure(head,pre)[0],'v148_cond_full',None,None),
                      'pre_head_multisignal':(adjust_escape_pressure(head,pre,multisignal=True)[0],'pl',None,None),
                      'world_tail_base':(adjust_escape_pressure(head,pre,multisignal=True)[0],'pl',base,base),
