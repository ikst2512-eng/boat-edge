          assert r['formal_unlock'] is False and r['formal_scoring'] is False
          assert r['prediction_weights_changed'] is False
          assert r['heldout_total']==14049
          assert a['v150_threefold_parity']['checked'] and all(a['v150_threefold_parity']['models'].values())
          assert a['v151_threefold_parity']['checked'] and len(a['v151_threefold_parity']['models']) == 33
          assert all(a['v151_threefold_parity']['models'].values())
          assert len(a['v152_threefold_parity']['models'])==45 and all(a['v152_threefold_parity']['models'].values())
          assert len(a['v153_threefold_parity']['models'])==54 and all(a['v153_threefold_parity']['models'].values())
          assert a['prerace_segment_partition']
          assert a['head_ticket_mismatch_counts_valid']
          assert len(r['models'])==22
          assert r['heldout_total']==14049
          assert all(r['folds'][f]['hold_races']>3500 for f in ('F1','F2','F3'))
          assert all(m in r['models'] for m in ('world_tail_base','world_tail_place','world_tail_conditional','world_tail_conditional_place'))
          assert all(z['trifecta_top3']<=z['trifecta_top5']<=z['trifecta_top10']<=z['evaluated']
                     for f in ('F1','F2','F3') for z in r['metrics']['folds'][f]['all'].values())

          assert all(a[k] for k in ('train_before_heldout','holdout_dates_disjoint','all_fold_models_same_n','monotonic_trifecta'))
          assert not a['source_2026_10_08_result_materialized'] and not a['source_2026_10_08_card_materialized']
          for ss in [r['metrics']['aggregate'],*r['metrics']['folds'].values()]:
            for models in ss.values():
              for z in models.values():
                assert 0<=z['trifecta_top3']<=z['trifecta_top5']<=z['trifecta_top10']<=z['evaluated']
                assert z['true_non1_called']<=z['pred_non1']
                assert z['true_non1_called']<=z['true_non1']
          st=json.loads(Path('data/site_current_state.json').read_text(encoding='utf-8'))
          assert not any(st['formal_current']['guards'][k] for k in ('results_seen','unlock','scoring'))
          print('V154 RUN1_RUN2 BYTE_IDENTICAL PASS')
          print('V154 V153 54-OLD-MODEL PARITY PASS')
          print('V154 SCENARIO DIAGNOSTICS PASS')
          print('V154 FORMAL_LOCK NO_PRODUCTION_CHANGE PASS')
          PY

