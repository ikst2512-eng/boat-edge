      - name: Freeze ticket odds, original file SHA, and sidecar from the same bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 /tmp/boat_edge_v218_patch.py
            python3 -m py_compile scripts/site_final_history_v133.py scripts/boat_edge_v214_shadow.py scripts/boat_edge_v211_paper_sim.py
            if [ -e tests/test_v217_odds_guard.py ]; then
              python3 tests/test_v217_odds_guard.py
            fi
            git add -- scripts/site_final_history_v133.py
            if git diff --cached --quiet; then
              echo 'V218_ALREADY_INSTALLED_TESTS_PASS'
              exit 0
            fi
            git commit -m 'V218 source-atomic predeadline odds freeze for V133 snapshots'
            if git push origin HEAD:main; then
              echo 'V218_COMMIT_SUCCESS_TESTS_PASS'
              exit 0
            fi
            echo "V218_RETRY_FRESH_MAIN_${attempt}"
          done
          echo 'V218_PUSH_RETRY_EXHAUSTED' >&2
          exit 1
