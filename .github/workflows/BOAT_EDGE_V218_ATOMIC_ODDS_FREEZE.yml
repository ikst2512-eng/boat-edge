name: BOAT EDGE V218 - One-Read Predeadline Odds Freeze
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V218_ATOMIC_ODDS_FREEZE.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-edge-v218-atomic-odds-installer
  cancel-in-progress: false
jobs:
  fix-single-source-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
