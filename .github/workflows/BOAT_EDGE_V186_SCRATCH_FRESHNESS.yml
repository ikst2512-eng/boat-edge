          python3 scripts/site_v186_refresh_scratch.py
          python3 scripts/site_v186_patch_ui.py
          python3 tests/test_v186_refresh.py
          python3 - <<'PYCHECK'
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf8')
          assert page.count('BOAT_EDGE_V186_SCRATCH_FRESHNESS_FAIL_CLOSED')==1
          assert 'BOAT_EDGE_V182_SCRATCH_FAIL_CLOSED' in page
          assert Path('scripts/site_v185_role_shadow.py').is_file()
          print('V186_UI_FRESHNESS_AND_V185_MODEL_PRESERVED_PASS')
          PYCHECK
          git diff --check
      - name: Commit source verification and UI guard without changes to prediction models
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html scripts/site_v186_refresh_scratch.py scripts/site_v186_patch_ui.py tests/test_v186_refresh.py
