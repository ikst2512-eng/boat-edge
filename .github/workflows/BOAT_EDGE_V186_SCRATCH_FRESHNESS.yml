name: BOAT EDGE V186 - Keep Scratch Fresh for V185 Prospective Accuracy

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V186_SCRATCH_FRESHNESS.yml']
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 0-14,23 * * *' # two minutes after V182 and before V185's next check

permissions:
  contents: write

concurrency:
  group: boat-edge-v186-predeadline-scratch-freshness
  cancel-in-progress: false

jobs:
  refresh-verified-scratch-evidence:
