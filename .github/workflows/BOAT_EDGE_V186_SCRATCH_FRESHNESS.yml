name: BOAT EDGE V186 - Keep Scratch Fresh for V185 Prospective Accuracy

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V186_SCRATCH_FRESHNESS.yml']
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 0-14,23 * * *' # two minutes after V182 and before V185's next check

permissions:
  contents: write

concurrency:
  group: boat-edge-v186-predeadline-scratch-freshness
  cancel-in-progress: false

jobs:
  refresh-verified-scratch-evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify tracked V186 sources without restoring historical code
        shell: bash
        run: |
          set -euo pipefail
          # All these files are already tracked in main. Historical embedded
          # gzip/bootstrap assets must never silently overwrite later fixes.
          for path in scripts/site_v186_refresh_scratch.py scripts/site_v186_patch_ui.py tests/test_v186_refresh.py; do
            git ls-files --error-unmatch "$path" >/dev/null
            test -s "$path"
          done
          echo 'V186_TRACKED_MAIN_SOURCE_NO_LEGACY_RESTORE_PASS'

      - name: Re-evaluate V182 scratch flags then refresh timestamp for near-deadline races
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/site_v182_scratch_scan.py
          python3 scripts/site_v186_refresh_scratch.py
          python3 scripts/site_v186_patch_ui.py
          python3 tests/test_v186_refresh.py
          python3 - <<'PYCHECK'
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf8')
          assert page.count('BOAT_EDGE_V186_SCRATCH_FRESHNESS_FAIL_CLOSED')==1
          assert 'BOAT_EDGE_V182_SCRATCH_FAIL_CLOSED' in page
          assert Path('scripts/site_v185_role_shadow.py').is_file()
          print('V186_UI_FRESHNESS_AND_V185_MODEL_PRESERVED_PASS')
          PYCHECK
          git diff --check
      - name: Commit source verification and UI guard without changes to prediction models
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html scripts/site_v186_refresh_scratch.py scripts/site_v186_patch_ui.py tests/test_v186_refresh.py
          git add -A -- data/site_scratches_v182/
          if git diff --cached --quiet; then echo V186_FRESHNESS_NO_CHANGE; exit 0; fi
          git commit -m 'V186 recheck scratch evidence near deadline and make UI fail closed on stale checks'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo V186_VERIFIED_SCRATCH_FRESHNESS_APPLIED; exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 tests/test_v186_refresh.py
          done
          echo V186_PUSH_RETRY_EXHAUSTED >&2
          exit 1
