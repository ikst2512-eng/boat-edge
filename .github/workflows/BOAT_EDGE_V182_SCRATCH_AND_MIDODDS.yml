name: BOAT EDGE V182 - Fix V181 and Scratch No Bet + 10-20 Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V182_SCRATCH_AND_MIDODDS.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v182-urgent-scratch-safety
  cancel-in-progress: false

jobs:
  fix-ui-and-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Restore tested fixes and V181 patch without broken assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRESTORE'
          from pathlib import Path
          import ast,hashlib,gzip,base64,textwrap
          source=Path('.github/workflows/BOAT_EDGE_V181_FIRST_FINAL_LOCK.yml').read_text(encoding='utf8')
          assert "python3 - <<'PYRESTORE'" in source,'V181_WORKFLOW_NOT_INSTALLED'
          source=textwrap.dedent(source.split("python3 - <<'PYRESTORE'",1)[1].split('\n          PYRESTORE',1)[0])
          tree=ast.parse(source)
          a=next(x for x in tree.body if isinstance(x,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='assets' for t in x.targets))
          assets=ast.literal_eval(a.value)
          for dst,(expected,payload) in assets.items():
           b=gzip.decompress(base64.b64decode(payload));assert hashlib.sha256(b).hexdigest()==expected,f'V181_BAD_SHA {dst}'
           p=Path(dst);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
