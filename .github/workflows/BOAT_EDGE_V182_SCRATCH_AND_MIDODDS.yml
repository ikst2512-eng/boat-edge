      - name: Install immutable first/final fix, scratch guards and analysis tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_v181_patch.py
          python3 tests/test_v181_prediction_lock.py
          python3 scripts/site_v182_patch.py
          python3 tests/test_v182_safe.py
          node --check assets/boat_edge_v108.js
          python3 -m py_compile scripts/site_final_history_v133.py
          python3 -m py_compile scripts/site_v182_scratch_scan.py
          python3 scripts/site_v182_scratch_scan.py
          python3 scripts/site_v182_band_audit.py
          git diff --check
      - name: Commit only source safeguards, not frozen snapshots or prediction weights
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html assets/boat_edge_v108.js scripts/site_final_history_v133.py scripts/site_v181_patch.py tests/test_v181_prediction_lock.py scripts/site_v182_patch.py scripts/site_v182_scratch_scan.py scripts/site_v182_band_audit.py tests/test_v182_safe.py data/site_learning/v182_mid_odds_audit.json
          git add -A -- data/site_scratches_v182/
          if git diff --cached --quiet; then echo V182_NO_CHANGES; exit 0; fi
          git commit -m 'V182 fix first/final lock, block scratch races, audit 10-20x misses without model changes'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then echo V182_APPLIED; exit 0; fi
            git fetch origin main
            git rebase origin/main
            node --check assets/boat_edge_v108.js
            python3 tests/test_v181_prediction_lock.py
            python3 tests/test_v182_safe.py
          done
          echo V182_PUSH_BLOCKED >&2
          exit 1
