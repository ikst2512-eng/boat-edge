          from pathlib import Path
          import subprocess
          paths=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          allowed={'index.html','assets/boat_edge_v203_readable.js','assets/boat_edge_v203_readable.css'}
          changed={line[3:] for line in paths if line}
          assert changed.issubset(allowed), ('V203_DISALLOWED_FILE_CHANGE',sorted(changed))
          assert 'site_results' not in Path('assets/boat_edge_v203_readable.js').read_text()
          print('V203_SITE_ONLY_NO_MODEL_NO_FORMAL_NO_RESULT_WRITE_PASS')
          PYGUARD
            git add -- index.html assets/boat_edge_v203_readable.js assets/boat_edge_v203_readable.css
            git diff --cached --check
            if git diff --cached --quiet; then
              echo V203_SITE_DISPLAY_ALREADY_CURRENT
              exit 0
            fi
            git commit -m 'V203 mobile 6-boat pre-race cards and scratch-source status; no prediction changes'
            if git push origin HEAD:main; then
              echo V203_SITE_DISPLAY_PUBLISHED_PAGES_WILL_REBUILD
              exit 0
            fi
            echo "V203_CONCURRENT_MAIN_RETRY_${attempt}"
          done
          echo V203_PUSH_RETRY_EXHAUSTED >&2
          exit 1
