            node - <<'NODETEST'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const js=fs.readFileSync('assets/boat_edge_v203_readable.js','utf8');
          const css=fs.readFileSync('assets/boat_edge_v203_readable.css','utf8');
          const document={readyState:'loading',addEventListener:()=>{},querySelector:()=>null};
          const context={window:{},document,Date,Number,Array,JSON,String,RegExp,Set,Map};
          vm.runInNewContext(js,context,{timeout:1000});
          const api=context.window.BoatEdgeV203;
          assert(api&&typeof api.getRows==='function'&&typeof api.scratchHint==='function');
          const sample={race_key:'20261010-09-10',meta:{deadline:'15:07'},racers:[1,2,3,4,5,6].map(lane=>({lane,name:'boat'+lane})),beforeinfo:{racers:[{lane:1,exhibition_time:6.77}]},actual_entry:[{lane:1,course:1,exhibition_st:.07}],source_audit:{beforeinfo:{status:'not_in_window',fetched_at:null},stt:{status:'not_in_window',fetched_at:null}}};
          assert.strictEqual(api.getRows(sample)[0].time,null,'unverified exhibition leaked');
          assert.strictEqual(api.getRows(sample)[0].st,null,'unverified ST leaked');
          assert.notStrictEqual(api.scratchHint(sample).type,'partial','6 boat card must not certify scratch safety');
          sample.source_audit.stt={status:'ok',fetched_at:'2026-10-10T15:00:00+09:00',sha256:'test'};
          assert.strictEqual(api.getRows(sample)[0].st,.07,'source verified STT should be visible');
          sample.scratch_audit={race_key:sample.race_key,blocked:true,reason:'withdrawn'};
          assert.strictEqual(api.scratchHint(sample).type,'stop','scratch stop not displayed');
          assert(!js.includes('data/site_results/')&&!js.includes('data/formal_predictions/')&&!js.includes('data/site_shadow_v199/predictions/'),'unapproved read');
          assert(css.includes('.be203-cards')&&css.includes('.be203-health'),'mobile styles missing');
          console.log('V203_UI_SOURCE_SCRATCH_SAFETY_TEST_PASS');
