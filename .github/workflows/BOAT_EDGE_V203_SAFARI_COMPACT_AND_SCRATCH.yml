name: BOAT EDGE V203 - Safari 6-Boat Comparison and Scratch Provenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V203_SAFARI_COMPACT_AND_SCRATCH.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v203-display-only
  cancel-in-progress: false

jobs:
  display-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
