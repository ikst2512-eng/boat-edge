name: BOAT EDGE V219 - Autonomous Independent Site Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V219_AUTONOMOUS_VALIDATION.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v219-autovalidation
  cancel-in-progress: false

jobs:
  independent-validation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history on latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify tracked validation runner and dashboard without legacy reinstall
        shell: bash
        run: |
          set -euo pipefail
          # V219's original embedded gzip/base64 installer was a historical
          # bootstrap. Replaying it on the live runner would reject legitimate
          # tracked-code updates or recreate old UI files. Main is authoritative.
          python3 - <<'PY_V219_TRACKED'
          from pathlib import Path
          expected=(
              'scripts/boat_edge_autovalidation.py',
              'tests/test_boat_edge_autovalidation.py',
              'assets/boat_edge_autovalidation.js',
              'assets/boat_edge_autovalidation.css',
              'ai-simulation.html',
          )
          for filename in expected:
              if not Path(filename).is_file():
                  raise SystemExit('V219_REQUIRED_TRACKED_FILE_MISSING_'+filename)
          page=Path('ai-simulation.html').read_text(encoding='utf-8')
          for marker in (
              'boat_edge_v213_shadow.js',
              './assets/boat_edge_autovalidation.css?v=219',
              './assets/boat_edge_autovalidation.js?v=219',
          ):
              if page.count(marker)!=1:
                  raise SystemExit('V219_CURRENT_DASHBOARD_LINK_UNVERIFIED_'+marker)
          print('V219_TRACKED_MAIN_SOURCE_ONLY_NO_LEGACY_INSTALL_PASS')
          PY_V219_TRACKED
          python3 -m py_compile scripts/boat_edge_autovalidation.py tests/test_boat_edge_autovalidation.py
          python3 tests/test_boat_edge_autovalidation.py
          node --check assets/boat_edge_autovalidation.js
          python3 scripts/boat_edge_autovalidation.py --dry-run
          git diff --exit-code -- scripts/boat_edge_autovalidation.py tests/test_boat_edge_autovalidation.py assets/boat_edge_autovalidation.js assets/boat_edge_autovalidation.css ai-simulation.html
      - name: Compare fresh site research and preserve deterministic audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          finished=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 tests/test_boat_edge_autovalidation.py
            python3 scripts/boat_edge_autovalidation.py
            git add -- data/site_autovalidation/current.json data/site_autovalidation/daily/
            if git diff --cached --quiet; then
              echo 'V219_REPORT_UNCHANGED_NO_SPURIOUS_COMMIT'
              finished=1
              break
            fi
            git commit -m 'V219 independent site-only prospective evaluation report'
            if git push origin HEAD:main; then
              echo 'V219_REPORT_PUBLISHED_NO_FORMAL_UNLOCK'
              finished=1
              break
            fi
            sleep 2
          done
          test "$finished" -eq 1
