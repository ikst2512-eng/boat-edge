name: BOAT EDGE V219 - Autonomous Independent Site Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V219_AUTONOMOUS_VALIDATION.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v219-autovalidation
  cancel-in-progress: false

jobs:
  independent-validation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history on latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned site-only validation runner once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          installed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PYV219_INSTALL'
          import base64, gzip, hashlib, json
          from pathlib import Path
          payload=json.loads('{"scripts/boat_edge_autovalidation.py":{"sha256":"fff35187b54a86d11f3a1025884d7b631efed3d3d3f16115b9229b907f65bd7e","base64_gzip":""},"tests/test_boat_edge_autovalidation.py":{"sha256":"3a6ec29b282e94594793a709d3aa565db2cdc0c91a7f132ff7216249d2d578f8","base64_gzip":""},"assets/boat_edge_autovalidation.js":{"sha256":"017ad240139fbe6d329f0e78ba6cf8458fa1a3ac11c3f1721ab6aa7806b4aad1","base64_gzip":""},"assets/boat_edge_autovalidation.css":{"sha256":"772006976fee8d00ef29625996c593caff99bbe45c78c00759a2bd8518da7ddd","base64_gzip":""}}')
          for rel,entry in payload.items():
              raw=gzip.decompress(base64.b64decode(entry['base64_gzip']))
              if hashlib.sha256(raw).hexdigest()!=entry['sha256']:
                  raise SystemExit('V219_BUNDLED_ASSET_SHA_MISMATCH '+rel)
              path=Path(rel)
              if path.exists():
                  if path.read_bytes()!=raw:raise SystemExit('V219_EXISTING_ASSET_CONFLICT_FAIL_CLOSED '+rel)
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(raw)
                  print('V219_INSTALL '+rel)
          page=Path('ai-simulation.html')
          if not page.exists():raise SystemExit('V219_AI_SIMULATION_PAGE_MISSING')
          s=page.read_text(encoding='utf-8')
          if 'boat_edge_v213_shadow.js' not in s:raise SystemExit('V219_REQUIRED_SHADOW_PANE_MISSING')
          links=['<link rel="stylesheet" href="./assets/boat_edge_autovalidation.css?v=219">',
                 '<script defer src="./assets/boat_edge_autovalidation.js?v=219"></script>']
          for link in links:
              if link not in s:
                  if s.count('</head>')!=1:raise SystemExit('V219_CANNOT_LOCATE_DOCUMENT_HEAD')
                  s=s.replace('</head>',link+'\n</head>')
              if s.count(link)!=1:raise SystemExit('V219_DUPLICATE_UI_IMPORT')
          if s!=page.read_text(encoding='utf-8'):
              page.write_text(s,encoding='utf-8')
          print('V219_INSTALL_AND_SITE_UI_SOURCE_INTEGRITY_PASS')
          PYV219_INSTALL
            python3 -m py_compile scripts/boat_edge_autovalidation.py tests/test_boat_edge_autovalidation.py
            python3 tests/test_boat_edge_autovalidation.py
            node --check assets/boat_edge_autovalidation.js
            python3 scripts/boat_edge_autovalidation.py --dry-run
            git add -- scripts/boat_edge_autovalidation.py tests/test_boat_edge_autovalidation.py assets/boat_edge_autovalidation.js assets/boat_edge_autovalidation.css ai-simulation.html
            if git diff --cached --quiet; then
              echo 'V219_INSTALL_NO_CHANGES_TESTED'
              installed=1
              break
            fi
            git commit -m 'V219 permanent audited site-only validation engine and site dashboard'
            if git push origin HEAD:main; then
              echo 'V219_INSTALL_COMMIT_SUCCESS'
              installed=1
              break
            fi
            sleep 2
          done
          test "$installed" -eq 1

      - name: Compare fresh site research and preserve deterministic audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          finished=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 tests/test_boat_edge_autovalidation.py
            python3 scripts/boat_edge_autovalidation.py
            git add -- data/site_autovalidation/current.json data/site_autovalidation/daily/
            if git diff --cached --quiet; then
              echo 'V219_REPORT_UNCHANGED_NO_SPURIOUS_COMMIT'
              finished=1
              break
            fi
            git commit -m 'V219 independent site-only prospective evaluation report'
            if git push origin HEAD:main; then
              echo 'V219_REPORT_PUBLISHED_NO_FORMAL_UNLOCK'
              finished=1
              break
            fi
            sleep 2
          done
          test "$finished" -eq 1
