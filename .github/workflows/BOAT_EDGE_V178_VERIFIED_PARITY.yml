      - name: Enforce fail-closed bridge and prove behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_v178_patch.py --root .
          python3 scripts/site_v178_patch.py --root .
          node --check assets/boat_edge_v178_verified_parity.js
          node tests/test_v178_verified_parity.cjs
          python3 -m py_compile scripts/site_v178_patch.py
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import json
          contract=json.loads(Path('data/site_latest_v178_parity_contract.json').read_text())
          assert contract['schema_version']=='boat-edge-v178-verified-model-parity-contract-v1'
          formal=json.loads(Path('data/formal_status.json').read_text())
          site=json.loads(Path('data/site_current_state.json').read_text())
          model=json.loads(Path('data/model_status.json').read_text())
          gates=formal.get('guards') or {}
          assert gates.get('results_seen') is False and gates.get('unlock') is False and gates.get('scoring') is False
          assert gates.get('RESULT_UNLOCK_TOKEN') is None
          connected=formal.get('connected') is True and formal.get('predictions_ready') is True
          digest_map=formal.get('approved_prediction_sha256_by_race') or {}
          full_formal=bool(connected and formal.get('active_model_id') and digest_map)
          result={
            'schema_version':'boat-edge-v178-site-latest-readiness-audit-v1',
            'scope':'NO_FORMAL_VALIDATION_OR_SCORING',
            'site_reference_prediction_policy':(site.get('latest_prediction_policy') or {}).get('version'),
            'latest_candidate_model':model.get('model'),
            'formal_current':formal.get('current'),
            'formal_connected':connected,
            'approved_sha_bindings_available':bool(digest_map),
            'rank120_publisher_ready':bool(full_formal),
            'formal_first100_frozen_races':(formal.get('formalFirst100') or {}).get('races'),
            'core7_site_only':(formal.get('collector_snapshot') or {}).get('core7_eligible_count'),
            'status':'WAIT_APPROVED_FORMAL_RANK120' if not full_formal else 'APPROVED_DIGESTS_PRESENT_VERIFY_PER_RACE_IN_BROWSER',
            'formal_guard_unchanged':True,
            'site_reference_weights_unchanged':True,
            'result_accessed':False,
            'publisher_modified':False,
            'contract':'data/site_latest_v178_parity_contract.json'
          }
          p=Path('data/site_learning/v178_latest_bridge_audit.json');p.parent.mkdir(parents=True,exist_ok=True)
          encoded=json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n'
          if not p.exists() or p.read_text()!=encoded:p.write_text(encoded)
          print('V178_MODEL_SYNC_GUARDS_PASS',result['status'],'formal_first100',result['formal_first100_frozen_races'])
          PYAUDIT
          git diff --check
      - name: Stage only display consumer and read-only audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/boat_edge_v178_verified_parity.js scripts/site_v178_patch.py tests/test_v178_verified_parity.cjs data/site_latest_v178_parity_contract.json data/site_learning/v178_latest_bridge_audit.json
          python3 - <<'PYSTAGE'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'index.html','assets/boat_edge_v178_verified_parity.js','scripts/site_v178_patch.py','tests/test_v178_verified_parity.cjs','data/site_latest_v178_parity_contract.json','data/site_learning/v178_latest_bridge_audit.json'}
          assert staged.issubset(allowed), 'V178_UNEXPECTED_STAGED_FILES '+repr(staged)
          print('V178_ONLY_APPROVED_SITE_CONSUMER_FILES',sorted(staged))
          PYSTAGE
          if git diff --cached --quiet; then echo V178_ALREADY_PRESENT; exit 0; fi
          git commit -m 'V178 require SHA-bound formal Top120 and audit model/site parity without prediction changes'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then echo V178_SITE_CONSUMER_COMMITTED; exit 0; fi
            git fetch origin main
            git rebase origin/main
            node tests/test_v178_verified_parity.cjs
            sleep 2
          done
          echo V178_PUSH_FAILED >&2
          exit 1
