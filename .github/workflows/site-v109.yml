name: BOAT EDGE V109 Result Payout Repair

on:
  push:
    paths:
      - ".github/workflows/site-v109.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v109-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Disable legacy result collector
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/site-results.yml/disable" >/dev/null 2>&1 || true
          for status in in_progress queued waiting requested pending; do
            ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/site-results.yml/runs?status=${status}&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)"
            for id in $ids; do
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
            done
          done
          set -e

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Repair payouts and collect results
        shell: bash
        run: |
          python - <<'PY'
          import json,re,time
          from pathlib import Path
          from datetime import datetime,timedelta,timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from bs4 import BeautifulSoup

          JST=timezone(timedelta(hours=9))
          now=datetime.now(JST)
          iso=now.isoformat(timespec='seconds')
          today=now.strftime('%Y%m%d')
          START='20261007'

          races=Path('data/races')
          out=Path('data/site_results')
          out.mkdir(parents=True,exist_ok=True)

          def clean(x):
              return re.sub(r'\s+',' ',x or '').strip()

          def money(text):
              t=clean(text)
              m=re.search(r'[¥￥]\s*([0-9][0-9,]*)',t)
              if m:
                  return int(m.group(1).replace(',',''))
              m=re.search(r'([0-9][0-9,]*)\s*円',t)
              if m:
                  return int(m.group(1).replace(',',''))
              return None

          def session():
              s=requests.Session()
              s.headers.update({
                  'User-Agent':'Mozilla/5.0 BOAT-EDGE-V109/1.0',
                  'Accept-Language':'ja-JP,ja;q=0.9'
              })
              return s

          def fetch_html(url):
              s=session()
              last=None
              for attempt in range(3):
                  try:
                      r=s.get(url,timeout=(5,18))
                      r.raise_for_status()
                      r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                      return r.text
                  except Exception as e:
                      last=e
                      if attempt<2:
                          time.sleep(0.8+attempt)
              raise last

          def parse_result(html):
              soup=BeautifulSoup(html,'lxml')

              finish=[]
              for tr in soup.find_all('tr'):
                  cells=[clean(x.get_text(' ',strip=True)) for x in tr.find_all(['th','td'])]
                  if len(cells)>=2 and re.fullmatch(r'[1-6]',cells[0]) and re.fullmatch(r'[1-6]',cells[1]):
                      finish.append((int(cells[0]),int(cells[1])))

              order=[]
              if finish:
                  by_place={a:b for a,b in finish}
                  order=[by_place[x] for x in sorted(by_place) if x in by_place][:3]

              combo=None
              payout=None
              row_debug=None

              for tr in soup.find_all('tr'):
                  row=clean(tr.get_text(' ',strip=True))
                  if '3連単' not in row:
                      continue
                  row_debug=row[:500]
                  m=re.search(r'([1-6])\s*[-－ー]\s*([1-6])\s*[-－ー]\s*([1-6])',row)
                  if m:
                      combo='-'.join(m.groups())
                  payout=money(row)
                  if combo:
                      break

              if not combo and len(order)>=3:
                  combo='-'.join(map(str,order[:3]))

              if combo and len(order)<3:
                  order=[int(x) for x in combo.split('-')]

              return {
                  'combo':combo,
                  'order':order[:3],
                  'payout':payout,
                  'row_debug':row_debug
              }

          def read_json(path):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return None

          candidates={}
          current_candidates=0
          historical_candidates=0

          # 1) Current-day races: after deadline +3m, fetch if missing/pending/payout missing.
          for p in sorted(races.glob(f'{today}-*.json')):
              doc=read_json(p)
              if not doc:
                  continue
              meta=doc.get('meta') or {}
              key=doc.get('race_key') or p.stem
              dl=meta.get('deadline')
              if not dl:
                  continue
              try:
                  hh,mm=map(int,dl.split(':'))
                  deadline=now.replace(hour=hh,minute=mm,second=0,microsecond=0)
              except Exception:
                  continue
              if now < deadline+timedelta(minutes=3):
                  continue

              target=out/f'{key}.json'
              old=read_json(target) if target.exists() else None
              complete=bool(
                  old and old.get('status')=='confirmed'
                  and old.get('trifecta')
                  and old.get('trifecta_payout_yen_per_100') is not None
              )
              if complete:
                  continue

              jcd=str(meta.get('venue_code') or key.split('-')[1]).zfill(2)
              rno=int(meta.get('race_no') or key.split('-')[2])
              candidates[key]={
                  'key':key,'ymd':today,'jcd':jcd,'rno':rno,
                  'target':target,'old':old,'kind':'current'
              }
              current_candidates+=1

          # 2) Historical confirmed results since 10/7 with payout missing.
          for p in sorted(out.glob('*.json')):
              m=re.fullmatch(r'(\d{8})-(\d{2})-(\d{2})\.json',p.name)
              if not m:
                  continue
              ymd,jcd,rno=m.groups()
              if ymd<START or ymd==today:
                  continue
              old=read_json(p)
              if not old or old.get('status')!='confirmed':
                  continue
              if old.get('trifecta_payout_yen_per_100') is not None:
                  continue
              key=p.stem
              candidates[key]={
                  'key':key,'ymd':ymd,'jcd':jcd,'rno':int(rno),
                  'target':p,'old':old,'kind':'historical'
              }
              historical_candidates+=1

          # During scheduled runs, limit historical repairs to avoid needless load.
          rows=list(candidates.values())
          if __import__('os').environ.get('GITHUB_EVENT_NAME')=='schedule':
              current=[x for x in rows if x['kind']=='current']
              historical=[x for x in rows if x['kind']=='historical'][:36]
              rows=current+historical

          def worker(item):
              key=item['key']
              url=f"https://www.boatrace.jp/owpc/pc/race/raceresult?hd={item['ymd']}&jcd={item['jcd']}&rno={item['rno']}"
              try:
                  parsed=parse_result(fetch_html(url))
                  return item,url,parsed,None
              except Exception as e:
                  return item,url,None,repr(e)

          checked=0
          updated=0
          payout_backfilled=0
          result_confirmed=0
          errors=[]

          max_workers=min(6,max(1,len(rows)))
          if rows:
              with ThreadPoolExecutor(max_workers=max_workers) as ex:
                  futs=[ex.submit(worker,x) for x in rows]
                  for fut in as_completed(futs):
                      item,url,parsed,err=fut.result()
                      checked+=1
                      key=item['key']
                      old=item.get('old') or {}

                      if err:
                          errors.append({'race_key':key,'error':err})
                          continue

                      combo=parsed.get('combo')
                      payout=parsed.get('payout')
                      order=parsed.get('order') or []

                      if not combo:
                          # Preserve old confirmed data; otherwise pending.
                          if old.get('status')=='confirmed':
                              continue
                          payload={
                              'schema_version':'boat-edge-site-result-v109',
                              'race_key':key,
                              'status':'pending',
                              'fetched_at':iso,
                              'source':url
                          }
                          item['target'].write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
                          updated+=1
                          continue

                      was_confirmed=old.get('status')=='confirmed'
                      was_missing_payout=(old.get('trifecta_payout_yen_per_100') is None)

                      payload={
                          'schema_version':'boat-edge-site-result-v109',
                          'race_key':key,
                          'status':'confirmed',
                          'fetched_at':iso,
                          'source':url,
                          'finish_order':order,
                          'trifecta':combo,
                          'trifecta_payout_yen_per_100':payout
                      }
                      item['target'].write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
                      updated+=1

                      if not was_confirmed:
                          result_confirmed+=1
                      if was_confirmed and was_missing_payout and payout is not None:
                          payout_backfilled+=1

          idx={
              'schema_version':'boat-edge-site-results-index-v109',
              'updated_at':iso,
              'date':now.strftime('%Y-%m-%d'),
              'checked':checked,
              'updated':updated,
              'result_confirmed':result_confirmed,
              'payout_backfilled':payout_backfilled,
              'current_candidates':current_candidates,
              'historical_candidates':historical_candidates,
              'processed_candidates':len(rows),
              'errors':errors[:30],
              'payout_parser':'¥ / ￥ / 円',
              'complete_rule':'confirmed + trifecta + payout non-null'
          }
          (out/'index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(idx,ensure_ascii=False))
          PY

      - name: Update TODO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('BOAT_EDGE_CURRENT_TODO.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# BOAT EDGE CURRENT TODO\n'
          lines=[
              '- V109 replaces the legacy result collector without changing V108 UI.',
              '- V109 treats confirmed + payout null as incomplete and refetches it.',
              '- V109 payout parser supports ¥ / ￥ / 円.',
              '- V109 backfills historical confirmed payout gaps from 2026-10-07.',
              '- V109 keeps result/trifecta data factual; missing payout is never fabricated.'
          ]
          marker='## NEXT'
          for line in lines:
              if line in s:
                  continue
              s=s.replace(marker,line+'\n\n'+marker,1) if marker in s else s+'\n'+line+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate result data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          idx=json.loads(Path('data/site_results/index.json').read_text(encoding='utf-8'))
          assert idx['schema_version']=='boat-edge-site-results-index-v109'
          assert idx['complete_rule']=='confirmed + trifecta + payout non-null'
          print(idx)

          sample=Path('data/site_results/20261007-01-12.json')
          if sample.exists():
              d=json.loads(sample.read_text(encoding='utf-8'))
              assert d.get('status')=='confirmed'
              assert d.get('trifecta')=='1-3-6'
              print({'sample':sample.name,'payout':d.get('trifecta_payout_yen_per_100')})
          PY

      - name: Save result repair
        shell: bash
        run: |
          set -e
          git config user.name "boat-edge-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site_results BOAT_EDGE_CURRENT_TODO.md
          git diff --cached --quiet && exit 0
          git commit -m "Repair BOAT EDGE result payouts V109"
          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
