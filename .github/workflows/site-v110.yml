name: BOAT EDGE V110 Stable V108 Runtime

on:
  push:
    paths:
      - ".github/workflows/site-v110.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v110-stable-runtime
  cancel-in-progress: false

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hard-disable legacy UI workflows by numeric ID
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Known legacy/current UI writers.
          # V103=377564111
          # V104=377581231
          # V106=377589946
          # V107=377595114
          # V108=377603522
          ids="377564111 377581231 377589946 377595114 377603522"

          for id in $ids; do
            echo "Disable workflow id=$id"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"

            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}" --jq '.state')"
            echo "workflow $id state=$state"
            test "$state" = "disabled_manually"

            for status in in_progress queued waiting requested pending; do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/runs?status=${status}&per_page=100" --jq '.workflow_runs[].id' || true)"
              for run_id in $runs; do
                echo "Cancel legacy run $run_id"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done
            done
          done

          # Best-effort daily V98 course-stats UI installer disable.
          # This one is non-critical to first install, but should normally succeed.
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/BOAT_EDGE_site-v98.yml/disable" >/dev/null 2>&1; then
            echo "V98 disabled"
          else
            echo "V98 disable endpoint not available; continuing because V98 is not a 5-minute current writer"
          fi

      - name: Rebuild historical archive only from saved data
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone,timedelta

          START='20261005'
          JST=timezone(timedelta(hours=9))
          races=Path('data/races')
          results=Path('data/site_results')
          odds=Path('data/site_odds')
          out=Path('data/site_archive')
          out.mkdir(parents=True,exist_ok=True)

          days={}

          for p in sorted(races.glob('*.json')):
              m=re.fullmatch(r'(\d{8})-(\d{2})-(\d{2})\.json',p.name)
              if not m:
                  continue
              ymd,jcd,rno=m.groups()
              if ymd<START:
                  continue

              try:
                  doc=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue

              meta=doc.get('meta') or {}
              key=doc.get('race_key') or p.stem

              day=days.setdefault(ymd,{})
              venue=day.setdefault(jcd,{
                  'jcd':jcd,
                  'venue':meta.get('venue') or jcd,
                  'event':meta.get('event') or '',
                  'races':[]
              })

              res=None
              rp=results/f'{key}.json'
              if rp.exists():
                  try:
                      res=json.loads(rp.read_text(encoding='utf-8'))
                  except Exception:
                      res=None

              venue['races'].append({
                  'race_key':key,
                  'race_no':int(meta.get('race_no') or rno),
                  'deadline':meta.get('deadline'),
                  'file':f'data/races/{key}.json',
                  'jcd':jcd,
                  'result_status':res.get('status') if res else None,
                  'trifecta':res.get('trifecta') if res else None,
                  'payout':res.get('trifecta_payout_yen_per_100') if res else None,
                  'has_odds':(odds/f'{key}.json').exists()
              })

          dates=[]
          changed=False

          for ymd,venue_map in sorted(days.items()):
              venues=[]
              race_count=0

              for jcd,venue in sorted(venue_map.items()):
                  venue['races'].sort(key=lambda x:x['race_no'])
                  race_count+=len(venue['races'])
                  venues.append(venue)

              payload={
                  'schema_version':'boat-edge-site-archive-v110',
                  'ymd':ymd,
                  'venue_count':len(venues),
                  'race_count':race_count,
                  'venues':venues
              }

              fp=out/f'{ymd}.json'
              new=json.dumps(payload,ensure_ascii=False,indent=2)
              old=fp.read_text(encoding='utf-8') if fp.exists() else None
              if old!=new:
                  fp.write_text(new,encoding='utf-8')
                  changed=True

              dates.append({
                  'ymd':ymd,
                  'venues':len(venues),
                  'races':race_count
              })

          idx_path=out/'index.json'
          old_idx={}
          if idx_path.exists():
              try:
                  old_idx=json.loads(idx_path.read_text(encoding='utf-8'))
              except Exception:
                  old_idx={}

          comparable={
              'start_date':'2026-10-05',
              'dates':dates,
              'retention':'saved source data; no deletion',
              'note':'missing historical odds/results are shown as unavailable'
          }
          old_comparable={k:old_idx.get(k) for k in comparable}

          if old_comparable!=comparable:
              changed=True

          idx={
              'schema_version':'boat-edge-site-archive-index-v110',
              **comparable,
              'updated_at':datetime.now(JST).isoformat(timespec='seconds') if changed
                           else old_idx.get('updated_at',datetime.now(JST).isoformat(timespec='seconds'))
          }

          new_idx=json.dumps(idx,ensure_ascii=False,indent=2)
          if not idx_path.exists() or idx_path.read_text(encoding='utf-8')!=new_idx:
              idx_path.write_text(new_idx,encoding='utf-8')

          print(json.dumps({
              'changed':changed,
              'dates':dates
          },ensure_ascii=False))
          PY

      - name: Reassert lightweight V108 page
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove every legacy UI runtime/style known to have accumulated.
          for name in [
              'v86_interaction','v88','v90','v96','v97',
              'v100','v101','v103','v104','v105','v107','v108'
          ]:
              s=re.sub(
                  rf'\s*<script src=["\']\./assets/boat_edge_{name}\.js(?:\?v=\d+)?["\']></script>\s*',
                  '\n',s
              )

          for v in ['90','96','97','100','101','103','104','105','107','108']:
              s=re.sub(
                  rf'\s*<link[^>]+boat_edge_v{v}\.css(?:\?v=\d+)?[^>]*>\s*',
                  '\n',s
              )

          # Ensure exactly one consolidated V108 CSS/JS ref.
          s=s.replace(
              '</head>',
              '<link rel="stylesheet" href="./assets/boat_edge_v108.css?v=108">\n</head>'
          )
          s=s.replace(
              '</body>',
              '<script src="./assets/boat_edge_v108.js?v=108"></script>\n</body>'
          )

          # Keep only lightweight base loop behavior.
          s=s.replace(
              'setInterval(()=>{ if(state.today){ renderSpotlightRaces(); renderDeadlineBoard(); updateNextRaceBar(); } }, 30000);',
              '/* V110: legacy hidden-home redraw disabled */'
          )
          s=s.replace(
              'setInterval(()=>{ if(state.race){ const pred=getPrediction(state.race); renderUrgency(state.race,pred); if(document.getElementById("tab-direct")?.classList.contains("active")) renderDirectMode(state.race,pred); } },1000);',
              '/* V110: legacy hidden-direct redraw disabled */'
          )

          if re.search(r'<meta name="boat-edge-site-version" content="[^"]+">',s):
              s=re.sub(
                  r'<meta name="boat-edge-site-version" content="[^"]+">',
                  '<meta name="boat-edge-site-version" content="V110-STABLE-V108-UI">',
                  s
              )
          else:
              s=s.replace(
                  '</head>',
                  '<meta name="boat-edge-site-version" content="V110-STABLE-V108-UI">\n</head>'
              )

          p.write_text(s,encoding='utf-8')
          PY

      - name: Update TODO
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('BOAT_EDGE_CURRENT_TODO.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# BOAT EDGE CURRENT TODO\n'
          s=re.sub(r'Current UI target: V\d+','Current UI target: V110',s)

          lines=[
              '- V109 backfilled 144/144 missing 2026-10-07 trifecta payouts with zero errors.',
              '- V110 hard-disables V103/V104/V106/V107/V108 by numeric workflow ID.',
              '- V110 verifies each disabled workflow reaches disabled_manually state.',
              '- V110 cancels queued/in-progress legacy UI runs.',
              '- V110 reasserts exactly V48 + consolidated V108 runtime on the page.',
              '- V110 becomes the sole 5-minute historical archive builder; V109 remains the result/payout collector.'
          ]

          marker='## NEXT'
          for line in lines:
              if line in s:
                  continue
              s=s.replace(marker,line+'\n\n'+marker,1) if marker in s else s+'\n'+line+'\n'

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate stable runtime
        shell: bash
        run: |
          node --check assets/boat_edge_v108.js

          grep -q 'V110-STABLE-V108-UI' index.html
          grep -q 'boat_edge_final_v48.js' index.html
          grep -q 'boat_edge_v108.js?v=108' index.html

          ! grep -q 'boat_edge_v105.js' index.html
          ! grep -q 'boat_edge_v107.js' index.html
          ! grep -q 'boat_edge_v100.js' index.html
          ! grep -q 'boat_edge_v101.js' index.html
          ! grep -q 'boat_edge_v90.js' index.html

          python - <<'PY'
          import re,json
          from pathlib import Path

          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script src="([^"]+)"',s)
          boat=[x for x in scripts if 'boat_edge' in x]
          assert boat==[
              './assets/boat_edge_final_v48.js',
              './assets/boat_edge_v108.js?v=108'
          ], boat

          archive=json.loads(Path('data/site_archive/index.json').read_text(encoding='utf-8'))
          assert archive['start_date']=='2026-10-05'
          assert archive['dates']

          sample=json.loads(Path('data/site_results/20261007-01-12.json').read_text(encoding='utf-8'))
          assert sample['status']=='confirmed'
          assert sample['trifecta']=='1-3-6'
          assert sample['trifecta_payout_yen_per_100']==2910

          print({
              'boat_scripts':boat,
              'sample_payout':sample['trifecta_payout_yen_per_100'],
              'archive_dates':archive['dates']
          })
          PY

      - name: Save V110 state
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/site_archive index.html BOAT_EDGE_CURRENT_TODO.md

          git diff --cached --quiet && exit 0

          git commit -m "Stabilize BOAT EDGE V108 runtime under V110"

          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done

          git push
