name: BOAT EDGE V230 - Manual Pre-Result Relay To Current V235

on:
  # V296: V230's five-minute legacy cron duplicated V235 and could replay
  # obsolete embedded V230 source bytes. Only V235 owns recurring fast refresh.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: boat-edge-v231-manual-relay-only
  cancel-in-progress: false

jobs:
  dispatch-current-v235:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read latest main safely
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-closed formal Fresh and exact current V230 source proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V296_RELAY'
          from pathlib import Path
          import json,re,subprocess
          formal=json.loads(Path('data/formal_status.json').read_text(encoding='utf8'))
          guards=formal.get('guards') or {}
          if any(guards.get(k) is not False for k in ('results_seen','unlock','scoring')):
              raise SystemExit('V296_FORMAL_LOCK_UNVERIFIED')
          if guards.get('RESULT_UNLOCK_TOKEN') is not None or (formal.get('formalFirst100') or {}).get('races')!=0:
              raise SystemExit('V296_FORMAL_FRESH_NOT_PRE_RESULT')
          source=Path('.github/workflows/V235.yml').read_text(encoding='utf8')
          match=re.search(r"'scripts/boat_edge_v230_fast_lane.py:([0-9a-f]{40})'",source)
          if not match or 'workflow_dispatch:' not in source:
              raise SystemExit('V296_CURRENT_V235_PIN_OR_MANUAL_TRIGGER_NOT_VERIFIED')
          current=subprocess.check_output(['git','hash-object','scripts/boat_edge_v230_fast_lane.py'],text=True).strip()
          if current!=match.group(1):
              raise SystemExit('V296_CURRENT_V230_PIN_MISMATCH')
          print('V296_NO_LEGACY_INSTALLER_FORMAL_GUARD_PIN_PASS',current)
          PY_V296_RELAY
      - name: Dispatch latest verified V235 exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run V235.yml --ref main
          echo 'V296_CURRENT_V235_DISPATCH_REQUESTED_NOT_ACCURACY_PASS'
