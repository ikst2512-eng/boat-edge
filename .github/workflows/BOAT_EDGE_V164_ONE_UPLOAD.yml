      - name: Validate targets before modifying UI
        shell: bash
        run: |
          set -euo pipefail
          python3 BOAT_EDGE_V163_ALL_IN_ONE.py --check

      - name: Apply today/yesterday + beforeinfo + BOATERS-inspired UI
        shell: bash
        run: |
          set -euo pipefail
          python3 BOAT_EDGE_V163_ALL_IN_ONE.py --apply
          node --check assets/boat_edge_v108.js
          node --check assets/boat_edge_v163_nav_stats.js
          git diff --check
          python3 - <<'PYTEST'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          core=Path('assets/boat_edge_v108.js').read_text(encoding='utf-8')
          js=Path('assets/boat_edge_v163_nav_stats.js').read_text(encoding='utf-8')
          assert html.count('boat_edge_v163_nav_stats.js') == 1
          assert html.count('boat_edge_v163_nav_stats.css') == 1
          assert 'be160LiveDayActivated' in core
          assert 'BE162_STRICT_REAL_BEFOREINFO' in core
          assert 'BE162_STRICT_REAL_BEFOREINFO' in html
          assert 'goHome()' in js
          assert 'renderTrio(race)' in js
          assert 'renderMethod(race)' in js
          assert 'site_results' not in js and 'formal_predictions' not in js
          print('PASS: V160, V162, V163 UI guards / source boundaries')
          PYTEST

      - name: Commit only site UI files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/boat_edge_v108.js \
            assets/boat_edge_v163_nav_stats.js assets/boat_edge_v163_nav_stats.css
          python3 - <<'PYFILES'
          import subprocess
          allowed={'index.html','assets/boat_edge_v108.js',
            'assets/boat_edge_v163_nav_stats.js','assets/boat_edge_v163_nav_stats.css'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed<=allowed, f'Unexpected file mutation: {changed-allowed}'
          print('Allowed changed files:',sorted(changed))
          PYFILES
          if git diff --cached --quiet; then
            echo 'V164 already applied; no new commit required'
            exit 0
          fi
          git commit -m 'V164: show live races, correct beforeinfo and add global race selector and stats'
          for n in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'V164 UI commit deployed to main'
              exit 0
            fi
            git pull --rebase origin main
          done
          echo 'ERROR: Git push failed after retries; do not claim deployed' >&2
          exit 1
