name: BOAT EDGE V236 - Hit Rate First Prospective Shadow Comparison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v236.yml', 'scripts/boat_edge_v236_hit_rate.py', 'tests/test_boat_edge_v236_hit_rate.py', 'hit-rate.html']
  workflow_dispatch:
  # 01 runtime dedup: five-minute prospective schedule remains the owner.
  # V235 also runs frequently; a workflow_run relay doubled research jobs,
  # commits and automatic Pages builds without improving freeze cadence.
  schedule:
    # Keep the five-minute PRE_RESULT freeze cadence; score older SITE-only
    # frozen cohorts on one staggered 15-minute tick to reduce Pages churn.
    - cron: '3,18,33,48 0-14,23 * * *'
    - cron: '8,23,38,53 0-14,23 * * *'
    - cron: '13,28,43,58 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v236-hit-rate-forward-shadow
  cancel-in-progress: false

jobs:
  pre-result-research-and-post-result-paired-score:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout full history to prove first pre-deadline Git commits
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin original standalone research code and test exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v236_install.py" <<'PY_V236_INSTALL'
          import hashlib
          from pathlib import Path
          source_pins = {'scripts/boat_edge_v236_hit_rate.py': 'f29cf602835b9aa545dfc8bf1a5c3631cc60ae7e79b44b94a571f265e02aa018', 'tests/test_boat_edge_v236_hit_rate.py': 'd4aa95c7656d295547e3da063406d76a8375132a1519356930a30e405ba1da44'}
          for name, expected in source_pins.items():
              path = Path(name)
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit("V236_TRACKED_SOURCE_PIN_MISMATCH_"+name)
          print("V236_TRACKED_SOURCE_PINS_PASS",len(source_pins))
          PY_V236_INSTALL
          python3 "$RUNNER_TEMP/v236_install.py"
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v236_hit_rate.py' -q
          python3 -m py_compile scripts/boat_edge_v236_hit_rate.py
          echo V236_V271_FAIL_CLOSED_TESTS_PASS
      - name: Persist tomorrow-and-today pre-result challengers without result reads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v236_frozen data/site_autopilot/v236_scored data/site_autopilot/v236_pre_current.json data/site_autopilot/v236_score_current.json scripts/boat_edge_v236_hit_rate.py tests/test_boat_edge_v236_hit_rate.py hit-rate.html
            # Fresh main may have moved since job startup. Verify the exact
            # code AND declared pin from this checkout, then rerun unit tests.
            # Do not trust the job-start embedded pin after git reset --hard.
            python3 scripts/verify_workflow_source_pins.py
            PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v236_hit_rate.py' -q
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v236_hit_rate.py freeze
            git add -- scripts/boat_edge_v236_hit_rate.py tests/test_boat_edge_v236_hit_rate.py hit-rate.html
            if test -f data/site_autopilot/v236_pre_current.json; then git add -- data/site_autopilot/v236_pre_current.json; fi
            if test -d data/site_autopilot/v236_frozen; then git add -A -- data/site_autopilot/v236_frozen; fi
            python3 - <<'PY_V236_STAGE_FROZEN'
          import subprocess,re
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          ok={'scripts/boat_edge_v236_hit_rate.py','tests/test_boat_edge_v236_hit_rate.py',
              'hit-rate.html','data/site_autopilot/v236_pre_current.json'}
          for path in files:
              if path in ok or re.fullmatch(r'data/site_autopilot/v236_frozen/20\d{6}-\d{2}-\d{2}\.json',path):continue
              raise SystemExit('V236_UNEXPECTED_STAGED_PATH_'+path)
          print('V236_SOURCE_ONLY_STAGING',len(files))
          PY_V236_STAGE_FROZEN
            git diff --cached --check
            if git diff --cached --quiet; then echo V236_NO_NEW_FUTURE_COHORT; success=true; break; fi
            git commit -m 'V236 prospectively freeze hit-rate comparison without results'
            if git push origin HEAD:main; then echo V236_PRE_RESULT_COMPARE_GIT_PUBLISHED; success=true; break; fi
            echo "V236_PRE_RESULT_PUSH_RACE_ABANDON_UNPUSHED_AND_RETRY_${attempt}"
          done
          if test "$success" != true; then echo V236_FREEZE_PUBLISH_FAILED_FAIL_CLOSED; exit 1; fi
      # Previous Git-attested SITE cohorts can be scored later; never delay
      # the five-minute, result-unseen prospective freeze above.
      - name: Score only previously Git-committed cohorts against confirmed SITE results
        # Existing five-minute freeze runs are not duplicated. Ordinary SITE
        # settlement remains fifteen-minute staggered; a first-Git frozen V2/V3
        # candidate with a confirmed official SITE result may score sooner.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' }}
        env:
          V236_SCHEDULED_TICK: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v236_scored data/site_autopilot/v236_score_current.json
            # Fresh main may have moved since job startup. Verify the exact
            # code AND declared pin from this checkout, then rerun unit tests.
            # Do not trust the job-start embedded pin after git reset --hard.
            python3 scripts/verify_workflow_source_pins.py
            PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v236_hit_rate.py' -q
            # Never accelerate the ordinary retrospective score/PAGES churn.
            # Extra existing 5-minute ticks may score ONLY newly confirmed
            # V2/V3 first-Git-frozen headsecond candidates, if any. Formal
            # results are not opened; the strict SITE official-result and first
            # predeadline Git checks are repeated by the actual score script.
            if [[ "$GITHUB_EVENT_NAME" == 'schedule' && "$V236_SCHEDULED_TICK" != '3,18,33,48 0-14,23 * * *' ]]; then
              fast_score_gate="$(PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY_V236_FAST_SCORE_GATE'
          from pathlib import Path
          from scripts.boat_edge_v236_hit_rate import pending_confirmed_prospective_score
          ready=pending_confirmed_prospective_score(Path('.'))
          print('V236_PENDING_CONFIRMED_PROSPECTIVE_SCORE' if ready
                else 'V236_NO_CONFIRMED_PROSPECTIVE_SCORE')
          PY_V236_FAST_SCORE_GATE
              )"
              if [[ "$fast_score_gate" != 'V236_PENDING_CONFIRMED_PROSPECTIVE_SCORE' ]]; then
                echo "$fast_score_gate"
                success=true
                break
              fi
              echo V236_ACCELERATE_ONLY_VERIFIED_PROSPECTIVE_CANDIDATE
            fi
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v236_hit_rate.py score
            if test -f data/site_autopilot/v236_score_current.json; then git add -- data/site_autopilot/v236_score_current.json; fi
            if test -d data/site_autopilot/v236_scored; then git add -A -- data/site_autopilot/v236_scored; fi
            python3 - <<'PY_V236_STAGE_SCORE'
          import subprocess,re
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for path in files:
              if path=='data/site_autopilot/v236_score_current.json':continue
              if re.fullmatch(r'data/site_autopilot/v236_scored/20\d{6}-\d{2}-\d{2}\.json',path):continue
              raise SystemExit('V236_UNEXPECTED_SCORE_PATH_'+path)
          print('V236_SCORE_ONLY_STAGING',len(files))
          PY_V236_STAGE_SCORE
            git diff --cached --check
            if git diff --cached --quiet; then echo V236_NO_NEW_CONFIRMED_PAIRED_RESULTS; success=true; break; fi
            git commit -m 'V236 compare prospectively frozen 10-ticket predictions without model promotion'
            if git push origin HEAD:main; then echo V236_PAIRED_HITRATE_RESULT_GIT_PUBLISHED; success=true; break; fi
            echo "V236_POST_RESULT_PUSH_CONFLICT_RETRY_${attempt}"
          done
          if test "$success" != true; then echo V236_SCORE_PUBLISH_FAILED_FAIL_CLOSED; exit 1; fi
