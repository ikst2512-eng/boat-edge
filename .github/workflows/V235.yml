name: BOAT EDGE V235 - Stable Autonomous Prediction Freeze and Verified Scoring
on:
  push:
    branches: [main]
    paths: ['.github/workflows/V235.yml']
  workflow_dispatch:
  # V288: the official PRE_RESULT collector is the dependable upstream source.
  # GitHub cron delivery is best-effort; run once on a successful collector
  # completion as well, without opening results or relaxing formal locks.
  workflow_run:
    workflows:
      - 'BOAT EDGE 自動更新'
    types: [completed]
  schedule:
    # 08:20 JST is 23:20 UTC on the previous calendar day.
    # PRE_RESULT source prewarm only; the strict V229 2-10m freeze window is unchanged.
    - cron: '20 23 * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 0-14,23 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v235-conflict-safe-source-and-scoring
  cancel-in-progress: false
jobs:
  freeze-then-score-site-only:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch full-depth main for actual Git pre-result commit-time attestation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare existing pre-result source parser dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Install evidence-bound scorer and run 35 regressions with pinned PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V234_INSTALL'
          from pathlib import Path
          import json,base64,gzip,hashlib,ast
          resources=json.loads(r'{"accuracy.html": {"gzip_b64": "", "sha256": "7c171d36a26d9ae1508bf9d6794700cd20e7f572911ca5cc9710beea5a2cb985"}, "scripts/boat_edge_v234_settle.py": {"gzip_b64": "", "sha256": "f993c55be5cef399c16bc12b3607670fb9af68b793aa933e4526bc546c3d5a0b"}, "tests/test_boat_edge_v234_settle.py": {"gzip_b64": "", "sha256": "19bcb16c34b6cdb42d8fb090e3ede5b5d147c937b74729df4ed77ad28115967c"}}')
          for name,payload in resources.items():
              b=gzip.decompress(base64.b64decode(payload['gzip_b64']))
              if hashlib.sha256(b).hexdigest()!=payload['sha256']:raise SystemExit('V234_EMBEDDED_SHA_MISMATCH_'+name)
              file=Path(name)
              if file.exists():
                  if file.read_bytes()!=b:raise SystemExit('V234_EXISTING_SOURCE_MISMATCH_'+name)
              else:
                  file.parent.mkdir(parents=True,exist_ok=True)
                  file.write_bytes(b)
              if name.endswith('.py'):ast.parse(b.decode('utf-8'))
          print('V234_SOURCE_HTML_AND_TEST_BYTES_PASS',len(resources))
          PY_V234_INSTALL
          for spec in \
            'scripts/boat_edge_v230_fast_lane.py:caab39ee5ef8c16ca8405c4e840469718e5fa774' \
            'scripts/boat_edge_v232_pre_result_cohort.py:99c69c924de451fe6635961253e9ea61d314366b' \
            'scripts/boat_edge_v215_readiness.py:f74705858e9bffbe28b4ce444d29aa8565ed6497' \
            'scripts/boat_edge_v214_shadow.py:2fafe6932383c0ace68d82d3cc2591591b6affdb' \
            'scripts/boat_edge_v229_atomic_freeze.py:3112e04bee01477c70f952d44aaccb77a836d862'; do
            path="${spec%:*}"; sha="${spec##*:}"
            test -f "$path" && test "$(git hash-object "$path")" = "$sha" || { echo "V234_PRE_RESULT_DEPENDENCY_CHANGED_$path"; exit 1; }
          done
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v230_fast_lane.py' -v
          # Priority 2026-10-14 Naruto 1R: exercise timestamp/SHA/Git-first-add proof without results access.
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v235_predeadline_receipt.py' -v
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v232_pre_result_cohort.py' -v
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v234_settle.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/boat_edge_v234_settle.py
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 tests/test_boat_edge_v265_readiness_sources.py
          echo V235_V265_STRICT_PRE_RESULT_ODDS_AND_SCRATCH_PROOF_REGRESSIONS_PASS
          echo V234_THIRTY_FIVE_PROSPECTIVE_AND_SETTLEMENT_REGRESSIONS_PASS
      - name: Immutable pre-result source prediction cohort with conflict re-execution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source_success=false
          for attempt in 1 2 3 4 5; do
            # Discard ALL unpushed projections, then regenerate using the current exact sources.
            git fetch --no-tags origin main
            git reset --hard origin/main
            # Remove only untracked local projections from a failed push. Otherwise a
            # stale uncommitted pre-result proof could leak into the next attempt.
            # Discard site-only ephemeral files generated by failed attempts.
            # Never clean data/ wholesale: formal Fresh and unrelated histories live there.
            git clean -fd -- data/site_prediction_snapshots/ data/site_prediction_audit/ data/site_autopilot/v229_evidence/ data/site_autopilot/v232_cohort/ data/site_odds/ data/site_scratches_v182/ data/races/ data/raw/ data/site_paper_sim/raw/ data/races/ data/site_odds/ data/site_scratches_v182/
            echo "V234_PRE_RESULT_SOURCE_RESTART_ATTEMPT_${attempt}"
            # V295: keep the upstream V230 max worker cap (8), reducing the
            # second network batch for 7-8 imminent races without changing
            # source identity, six-boat exhibition or odds verification.
            PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v230_fast_lane.py --workers 8
            # Snapshot proposal/attempt evidence lives ONLY in RUNNER_TEMP,
            # so Git reset/clean and repeated main conflicts cannot rewrite
            # an earlier attestation or backfill a race after deadline.
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v295_retry_trace.py \
              --attempt "$attempt" --state-path "$RUNNER_TEMP/boat_edge_v295_retry_trace.json"
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v232_pre_result_cohort.py
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v215_readiness.py
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v214_shadow.py freeze
            python3 - <<'PY_V234_STAGE'
          from pathlib import Path
          import json,subprocess,re
          root=Path('.')
          status=json.loads((root/'data/site_autopilot/v230_fast_current.json').read_text())
          cohort=json.loads((root/'data/site_autopilot/v232_current.json').read_text())
          assert status['schema']=='BOAT_EDGE_V230_OFFICIAL_IMMINENT_REFRESH_V1'
          assert cohort['schema']=='BOAT_EDGE_V232_SITE_PROSPECTIVE_COHORT_SUMMARY_V1'
          assert cohort['accuracy_improvement_proven'] is False and cohort['real_or_paper_wagers_placed']==0
          paths=['data/site_autopilot/v230_fast_current.json',
           'data/site_autopilot/v232_current.json','data/site_autopilot/v232_cohort',
           'data/site_paper_sim/readiness_v215_current.json','data/site_paper_sim/readiness_history_v215',
           'data/site_paper_sim/shadow_v213_current.json','data/site_paper_sim/shadow_v213_ledger.json',
           'data/site_prediction_snapshots','data/site_prediction_audit','data/site_autopilot/v229_evidence']
          keys=status['targets']
          if len(keys)>12:raise SystemExit('V234_MORE_THAN_12_OFFICIAL_TARGETS')
          for key in keys:
            if not re.fullmatch(r'20\d{6}-\d{2}-\d{2}',key):raise SystemExit('V234_BAD_RACE_KEY_'+key)
            date,venue,rr=key.split('-')
            paths.extend([f'data/races/{key}.json',f'data/site_scratches_v182/{key}.json',f'data/site_odds/{key}.json',
               f'data/raw/{date}/{venue}_{rr}_racelist.html',f'data/raw/{date}/{venue}_{rr}_beforeinfo.html',
               f'data/raw/{date}/{venue}_{rr}_odds3t.html.gz'])
          for p in paths:
            if (root/p).exists():subprocess.check_call(['git','add','-A','--',p])
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          base={'data/site_autopilot/v230_fast_current.json','data/site_autopilot/v232_current.json',
           'data/site_paper_sim/readiness_v215_current.json','data/site_paper_sim/shadow_v213_current.json',
           'data/site_paper_sim/shadow_v213_ledger.json'}
          fixed=set()
          for key in keys:
           date,venue,rr=key.split('-')
           fixed.update([f'data/races/{key}.json',f'data/site_scratches_v182/{key}.json',f'data/site_odds/{key}.json',
             f'data/raw/{date}/{venue}_{rr}_racelist.html',f'data/raw/{date}/{venue}_{rr}_beforeinfo.html',
             f'data/raw/{date}/{venue}_{rr}_odds3t.html.gz'])
          for path in staged:
           if path in base or path in fixed:continue
           if re.fullmatch(r'data/site_autopilot/v232_cohort/20\d{6}-\d{2}-\d{2}\.json',path):continue
           if re.fullmatch(r'data/site_paper_sim/readiness_history_v215/20\d{6}\.json',path):continue
           if path.startswith('data/site_prediction_snapshots/') or path.startswith('data/site_prediction_audit/') or path.startswith('data/site_autopilot/v229_evidence/'):
             continue
           raise SystemExit('V234_UNEXPECTED_SOURCE_STAGED_'+path)
          print('V234_SITE_PRE_RESULT_PUBLISH_SET',json.dumps({'files':len(staged),'new_prediction_audited':status['new_snapshots_atomic_audited'],
            'cohort_total_today':cohort['frozen_research_races_today'],'new_cohort':cohort['new_research_races_this_run']},sort_keys=True))
          PY_V234_STAGE
            git diff --cached --check -- . ':(exclude)data/raw'
            if git diff --cached --quiet; then echo V234_NO_NEW_PRE_RESULT_NOT_BACKFILLED; source_success=true; break; fi
            git commit -m 'V234 exact-source prospective prediction and independent accuracy freeze'
            if git push origin HEAD:main; then
              echo V234_SITE_PRE_RESULT_ATOMIC_PUBLISHED
              counts=$(python3 - <<'PY_V234_TAKEOVER'
          import json
          from pathlib import Path
          s=json.loads(Path('data/site_autopilot/v230_fast_current.json').read_text())
          c=json.loads(Path('data/site_autopilot/v232_current.json').read_text())
          print(int(s['new_snapshots_atomic_audited']),int(c['new_research_races_this_run']))
          PY_V234_TAKEOVER
              )
              read -r snaps cohorts <<< "$counts"
              if (( snaps>0 && cohorts>0 )); then
                # New snapshots/cohort prove local creation, NOT a first Git commit
                # before the deadline. Keep V233 until the next step verifies that.
                echo 'V235_TAKEOVER_CANDIDATE=1' >> "$GITHUB_ENV"
                echo 'V235_NEW_SITE_COHORT_COMMITTED_FIRST_GIT_PROOF_PENDING'
              fi
              source_success=true; break
            fi
            # NEVER rebase conflicting race/snapshot files. A new attempt must be prospective.
            echo "V234_CONCURRENT_GIT_UPDATE_ABANDON_LOCAL_PREDICTIONS_AND_RECHECK_NOW_$attempt"
          done
          if test "$source_success" != true; then echo V234_PRE_RESULT_SOURCE_PUBLISH_UNCONFIRMED; exit 1; fi
      - name: V235 read-only priority-race source, first-commit and SHA receipt
        # A failed fetch/commit is precisely when source diagnostics are needed.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # Report only saved original PRE_RESULT bytes and Git evidence.
          # No green PASS for a zero-snapshot run, and no result/formal access.
          python3 scripts/boat_edge_v235_predeadline_receipt.py | tee "$RUNNER_TEMP/v235-priority-receipt.jsonl"
          {
            echo '### V235 priority race: PRE_RESULT source / Git first-commit receipt'
            echo 'An Actions success is not a prediction-save success.'
            echo '```json'
            cat "$RUNNER_TEMP/v235-priority-receipt.jsonl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # An atomic snapshot and cohort can be committed too late. No V233
          # retirement unless a *first-add* Git blob, SHA and commit timestamp
          # pass the same result-free evidence gate as this priority receipt.
          if [[ "${V235_TAKEOVER_CANDIDATE:-0}" == '1' ]]; then
            python3 - <<'PY_V235_TAKEOVER_PROOF'
          import json,os
          from pathlib import Path
          from scripts.boat_edge_v235_predeadline_receipt import receipt,load
          root=Path('.')
          status=load(root/'data/site_autopilot/v230_fast_current.json')
          keys=status.get('targets') or []
          outcomes=[receipt(root,requested=key) for key in keys]
          passed=[x for x in outcomes if x.get('prediction_saved_proven') is True]
          print('V235_TAKEOVER_FIRST_GIT_PROOF',json.dumps({
            'targets':len(keys),'proven':len(passed),
            'race_keys':[x['race_key'] for x in passed],
            'failed_statuses':{x.get('race_key'):x.get('status') for x in outcomes
                               if not x.get('prediction_saved_proven')}
          },sort_keys=True))
          if not passed:
              raise SystemExit('V235_FIRST_GIT_PROOF_REQUIRED_KEEP_V233')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('V235_TAKEOVER_VERIFIED=1' + chr(10))
          print('V235_END_TO_END_SITE_PRE_RESULT_COHORT_VERIFIED')
          PY_V235_TAKEOVER_PROOF
          fi
      - name: V274 immediately freeze qualifying V254 site-only tail research before any result scoring
        shell: bash
        run: |
          set -euo pipefail
          # V274: same job as the source commit avoids workflow_run and cron delay.
          # This stage NEVER reads site results, actual finish, odds payout,
          # formal Fresh results, or changes the production model.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v254_frozen data/site_autopilot/v254_pre_current.json
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v254_third_tail.py' -q
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v254_third_tail.py freeze
            if test -f data/site_autopilot/v254_pre_current.json; then git add -- data/site_autopilot/v254_pre_current.json; fi
            if test -d data/site_autopilot/v254_frozen; then git add -A -- data/site_autopilot/v254_frozen; fi
            python3 - <<'PY_V274_STAGE'
          import re,subprocess
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for path in staged:
              if path=='data/site_autopilot/v254_pre_current.json':continue
              if re.fullmatch(r'data/site_autopilot/v254_frozen/20\d{6}-\d{2}-\d{2}\.json',path):continue
              raise SystemExit('V274_FORBIDDEN_PRE_RESULT_STAGE_'+path)
          print('V274_SITE_RESEARCH_ONLY_STAGED',len(staged))
          PY_V274_STAGE
            git diff --cached --check
            if git diff --cached --quiet; then
              echo V274_NO_ELIGIBLE_NEW_PRE_RESULT_COHORT_NO_BACKFILL
              exit 0
            fi
            git commit -m 'V274 immediate source-verified future-only 10-ticket tail shadow'
            if git push origin HEAD:main; then
              echo V274_FUTURE_SHADOW_PRE_RESULT_PUBLISHED
              exit 0
            fi
            # A competing Git writer advanced main. Recompute from remote,
            # never rebase / override original tickets or claim freeze.
            echo "V274_REMOTE_MOVED_RECHECK_SOURCE_$attempt"
          done
          echo V274_NO_PUBLISHED_SHADOW_CONFLICT_SAFE_RETRY_NEXT_RUN
          # The optional research lane cannot block primary frozen prediction
          # or its separate source-verified retrospective scoring.
      - name: Only after pre-result commit - score already confirmed SITE results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scoring_success=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- data/site_autopilot/v234_scored/
            # The scoring step alone opens confirmed site_results. Pre-result phase is finished.
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v234_settle.py
            python3 - <<'PY_V234_STAGE_SCORE'
          from pathlib import Path
          import subprocess,re,json
          root=Path('.')
          status=json.loads((root/'data/site_autopilot/v234_current.json').read_text())
          assert status['schema']=='BOAT_EDGE_V234_SITE_ONLY_ACCURACY_SUMMARY_V1'
          assert status['production_accuracy_improvement_proven'] is False
          assert status['real_or_paper_wagers_placed']==0
          paths=['scripts/boat_edge_v234_settle.py','tests/test_boat_edge_v234_settle.py','accuracy.html',
            'data/site_autopilot/v234_current.json','data/site_autopilot/v234_scored']
          for p in paths:
           if (root/p).exists():subprocess.check_call(['git','add','-A','--',p])
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed=set(paths[:4])
          for f in staged:
           if f in allowed or re.fullmatch(r'data/site_autopilot/v234_scored/20\d{6}-\d{2}-\d{2}\.json',f):continue
           raise SystemExit('V234_BAD_SCORE_STAGED_PATH_'+f)
          print('V234_SCORE_ONLY_STAGING',len(staged))
          PY_V234_STAGE_SCORE
            git diff --cached --check
            if git diff --cached --quiet; then echo V234_NO_NEW_VERIFIED_SETTLEMENT; scoring_success=true; break; fi
            git commit -m 'V234 score confirmed post-result site-only frozen cohorts with Git timestamp audit'
            if git push origin HEAD:main; then echo V234_OFFICIAL_SITE_RESULT_SCORE_PUBLISHED; scoring_success=true; break; fi
            echo "V234_SCORE_CONFLICT_RECHECK_FROM_CURRENT_GIT_$attempt"
          done
          if test "$scoring_success" != true; then echo V234_RESULT_SCORE_PUBLISH_UNCONFIRMED; exit 1; fi
      - name: Disable obsolete V234 and V233 only after verified V235 execution
        if: success() && github.event_name != 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # V234's importer is known broken; V235 fully replaces it once both
          # safe source and retrospective steps have completed in this job.
          for target in 'V234.yml'; do
            if ! state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${target}" --jq '.state' 2>/dev/null); then
              echo "V235_OBSOLETE_WORKFLOW_STATE_UNAVAILABLE_${target}"; continue
            fi
            if [[ "$state" == active ]]; then
              if gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${target}/disable" >/dev/null; then
                echo "V235_OLD_V234_DISABLED_AFTER_BOTH_STEPS_PASS"
              else
                echo "V235_OLD_V234_DISABLE_NOT_AUTHORIZED"
              fi
            else
              echo "V235_OLD_V234_ALREADY_${state}"
            fi
          done
          # The V233 freeze was operational; retire it only after V235 itself
          # produced a brand-new source-bound pre-result cohort and published it.
          if [[ "${V235_TAKEOVER_VERIFIED:-0}" != '1' ]]; then
            echo 'V235_KEEP_V233_UNTIL_NEW_PRE_RESULT_EVIDENCE_IS_COMMITTED'
            exit 0
          fi
          if state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/V233.yml" --jq '.state' 2>/dev/null); then
            if [[ "$state" == active ]]; then
              if gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/V233.yml/disable" >/dev/null; then
                echo 'V235_V233_DUPLICATE_DISABLED_POST_FIRST_FRESH_COHORT'
              else
                echo 'V235_V233_DISABLE_NOT_AUTHORIZED'
              fi
            fi
          else
            echo 'V235_V233_WORKFLOW_STATE_NOT_ACCESSIBLE'
          fi
