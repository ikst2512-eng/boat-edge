name: BOAT EDGE V209 - AI Paper Autonomy 50K (Never Real Bets)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V209_AI_AUTORUN_SIM.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v209-paper-only
  cancel-in-progress: false

jobs:
  paper-engine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install V209 page and paper-only engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PYINSTALL'
          from pathlib import Path
          import hashlib,base64,gzip,re,json
          P={"ai-simulation.html":{"sha256":"b44c74b41defa73057a38669310676afc4f73fd5e473b0c9c455df5205191918","base64_gzip":""},"assets/boat_edge_v209_paper.css":{"sha256":"971ae50501fd6aedbed5e735056aff86c542fb02a3133efc84082f5027c7b4ff","base64_gzip":""},"assets/boat_edge_v209_paper.js":{"sha256":"ac4d4ba93e3c3e52f9c0259c1da537aae1ff581fdec81d63dfd3dcdc1bc908e4","base64_gzip":""},"scripts/boat_edge_v209_paper_sim.py":{"sha256":"b08a47ab2ab8cc9bde4957c16b20e32116edeb99f175d8a4633d4ef00caa42e6","base64_gzip":""},"data/site_paper_sim/README.txt":{"sha256":"307802b7b19107d7d8b254dcb7382e57f0c7ad5a14e3e523d4651293197deba6","base64_gzip":""}}
          for relative,spec in P.items():
              target=Path(relative)
              blob=gzip.decompress(base64.b64decode(spec['base64_gzip']))
              if hashlib.sha256(blob).hexdigest()!=spec['sha256']:
                  raise SystemExit('V209_SOURCE_SHA_MISMATCH '+relative)
              if target.exists():
                  if target.read_bytes()!=blob:
                      raise SystemExit('V209_EXISTING_ASSET_CONFLICT '+relative)
                  continue
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(blob)
              print('V209_ADDED '+relative)
          index=Path('index.html')
          if not index.is_file():raise SystemExit('V209_NO_INDEX')
          content=index.read_text(encoding='utf-8')
          if 'boat_edge_v208_latest_clean.css?v=208' not in content or 'boat_edge_v207_first_prediction.js?v=207' not in content:
              raise SystemExit('V209_REQUIRES_V208_AND_V207')
          needle='<link rel="stylesheet" href="./assets/boat_edge_v209_paper.css?v=209">'
          if needle not in content:
              if content.count('</head>')!=1:raise SystemExit('V209_NO_HEAD')
              content=content.replace('</head>',needle+'\n</head>')
          # Place link directly NEXT TO the brand at the top of the main website.
          link='<a class="be209-header-link" href="./ai-simulation.html">AI自走シミュレーション</a>'
          if link not in content:
              match=re.search(r'<div class="brandtext">BOAT EDGE <small>[^<]*</small></div>',content)
              if not match:raise SystemExit('V209_NO_BRAND_ANCHOR')
              content=content[:match.end()]+link+content[match.end():]
          index.write_text(content,encoding='utf-8')
          assert content.count(link)==1 and content.count(needle)==1
          assert 'boat_edge_v208_latest_clean.css?v=208' in content
          print('V209_HEADER_LINK_INSTALL_PASS')
          PYINSTALL
          python3 -m py_compile scripts/boat_edge_v209_paper_sim.py
          node --check assets/boat_edge_v209_paper.js
          if [ ! -f data/site_paper_sim/current.json ]; then python3 scripts/boat_edge_v209_paper_sim.py select; fi
          git add -- index.html ai-simulation.html assets/boat_edge_v209_paper.css assets/boat_edge_v209_paper.js scripts/boat_edge_v209_paper_sim.py data/site_paper_sim/current.json data/site_paper_sim/ledger.json data/site_paper_sim/README.txt
          if git diff --cached --quiet; then echo 'V209_ALREADY_INSTALLED_PASS'; break; fi
          git commit -m 'V209 AI paper simulation dashboard 50K + guardrails'
          if git push origin HEAD:main; then echo 'V209_INSTALL_PERSISTED'; break; fi
          if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Independently freeze eligible paper decisions before result reads
        shell: bash
        run: |
          set -euo pipefail
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v209_paper_sim.py select
            git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
            if git diff --cached --quiet; then echo 'V209_NO_NEW_SELECTION'; break; fi
            git commit -m 'V209 PAPER pre-result selection without result lookahead'
            if git push origin HEAD:main; then echo 'V209_SELECTION_FROZEN'; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
      - name: Independently settle previously frozen paper decisions only
        shell: bash
        run: |
          set -euo pipefail
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 scripts/boat_edge_v209_paper_sim.py settle
            git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
            if git diff --cached --quiet; then echo 'V209_NO_SETTLEMENT'; break; fi
            git commit -m 'V209 PAPER settle frozen purchase only'
            if git push origin HEAD:main; then echo 'V209_SETTLED_FROZEN_ONLY'; break; fi
            if [ "$retry" -eq 8 ]; then exit 1; fi
          done
