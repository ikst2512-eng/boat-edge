          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const js=fs.readFileSync('assets/boat_edge_v204_prediction.js','utf8');
          const css=fs.readFileSync('assets/boat_edge_v204_prediction.css','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const context={window:{},document:{readyState:'loading',addEventListener:()=>{}},Number,Date,String,JSON};
          vm.runInNewContext(js,context,{timeout:1500});
          const api=context.window.BoatEdgeV204;
          assert(api&&typeof api.summarize==='function'&&typeof api.sync==='function');
          assert.equal(api.parseStake('現在の参考配分 1,200円 / 的中時想定払戻 21,600円'),1200);
          assert.equal(api.parsePayout('現在の参考配分 1,200円 / 的中時想定払戻 21,600円'),21600);
          assert.equal(api.parsePayout('払戻概算：オッズ未取得'),null);
          assert.equal(api.parseStake('締切前の保存配分 6,500円'),null);
          assert(!js.includes('fetch('),'V204_MUST_NOT_FETCH_RESULTS_OR_ODDS');
          for(const token of ['#be108PredictionModes','.be181-freeze-banner','.be166-odds-status','#scenarioHero','.be108-ticket-list'])
            assert(js.includes(token),'V204_SOURCE_BINDING_MISSING: '+token);
          for(const token of ['boat_edge_v203_readable.js?v=203','boat_edge_v204_prediction.js?v=204','boat_edge_v204_prediction.css?v=204'])
            assert(index.includes(token),'V204_INDEX_MISSING: '+token);
          assert(css.includes('@media(max-width:520px)'),'V204_PHONE_LAYOUT_MISSING');
          console.log('V204_PRESENTATION_ONLY_TESTS_PASS');
          NODETEST
            git add -- index.html assets/boat_edge_v204_prediction.js assets/boat_edge_v204_prediction.css
            if git diff --cached --quiet; then
              echo 'V204_ALREADY_INSTALLED_PASS'
              exit 0
            fi
            git commit -m 'V204 mobile prediction readability; display only, preserve frozen picks'
            if git push origin HEAD:main; then
              echo 'V204_GITHUB_COMMIT_SUCCESS; Pages deployment must be checked separately'
              exit 0
            fi
            echo "V204_PUSH_RETRY_${attempt}"
          done
          echo 'V204_PUSH_FAILED_NO_FALSE_SUCCESS'
          exit 1
