name: BOAT EDGE V204 - Mobile Prediction Display Safeguards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V204_PREDICTION_DISPLAY_FIXED.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v204-presentation-only
  cancel-in-progress: false

jobs:
  display-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install and audit V204 without touching prediction calculations
        shell: bash
