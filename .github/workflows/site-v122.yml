name: BOAT EDGE V122 Scenario Aware Reference FIXED

on:
  push:
    paths:
      - ".github/workflows/site-v122.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v122-scenario-aware-reference
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scenario-aware reference prediction
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v122_patch.py
          python /tmp/v122_patch.py

      - name: Validate V122
        shell: bash
        run: |
          set -e
          node --check assets/boat_edge_v108.js
          grep -q 'V122-SCENARIO-AWARE-REFERENCE-FIXED' index.html
          grep -q 'boat_edge_v108.js?v=122' index.html
          grep -q 'be122ScenarioAdjusted' assets/boat_edge_v108.js
          grep -q 'be122PredictionFromAdjusted' assets/boat_edge_v108.js
          grep -q '最新方針準拠・参考予想' assets/boat_edge_v108.js
          grep -q '実データが増えるたび展開確率を更新' assets/boat_edge_v108.js
          grep -q 'BOAT_EDGE_V122_SCENARIO_AWARE' assets/boat_edge_v108.css
          grep -q 'renderBuyBoard(race,adjustedPred)' assets/boat_edge_v108.js
          grep -q 'renderDirectMode(race,adjustedPred)' assets/boat_edge_v108.js
          grep -q 'async function showHeadPrediction' assets/boat_edge_v108.js
          grep -q 'be118-resultbar' assets/boat_edge_v108.js
          grep -q 'BOAT_EDGE_V118_COMPACT_CURRENT_RESULT' assets/boat_edge_v108.css
          ! grep -q 'Math.sqrt(Math.min(od(b)' assets/boat_edge_v108.js
          ! grep -q 'Math.pow(Math.min(od(b)' assets/boat_edge_v108.js
          ! grep -q 'MutationObserver' assets/boat_edge_v108.js
          ! grep -q 'setInterval(' assets/boat_edge_v108.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          boat=[x for x in re.findall(r'<script src="([^"]+)"',s) if "boat_edge" in x]
          assert boat==[
            "./assets/boat_edge_final_v48.js",
            "./assets/boat_edge_v108.js?v=122"
          ],boat
          print({"boat_scripts":boat,"scenario_aware":True,"formal_overlay_bypass":True,"odds_rank_weight":False})
          PY

      - name: Save V122
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_v108.js assets/boat_edge_v108.css index.html BOAT_EDGE_CURRENT_TODO.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix scenario-aware reference prediction V122"
          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
