name: BOAT EDGE V223 - Complete V222 and Show Exact Predeadline Source Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V223_SOURCE_EVIDENCE_AND_V222.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v223-safe-predeadline-display-install
  cancel-in-progress: false

jobs:
  site-only-freshness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install outstanding V222 and V223 site-only displays and regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            python3 - <<'PY_V223_RESTORE'
          from pathlib import Path
          import hashlib,base64,gzip,json
          files=json.loads(r"""{"assets/boat_edge_v222_live_odds.js":{"payload":"","sha256":"afe1eaa5d719f2f0066b2fe75cca576aca724af1a629476dbba252ebeef03197"},"scripts/boat_edge_v222_install.py":{"payload":"","sha256":"158402a3de69cf2bfcfe739b20684c9fa8918b346a2ab3e514af9c9d15c049ef"},"tests/test_boat_edge_v222_freeze.cjs":{"payload":"","sha256":"e1802229ddf2d1c6b626a65af562c42b3d9ee09e1e46c886610340f8633764e6"},"tests/test_boat_edge_v222_live_odds.cjs":{"payload":"","sha256":"b52675fab761ad5dd33cee9ae8241881a7a545a87f24347e2ab58757b8e7b2a5"},"assets/boat_edge_v223_source_visibility.js":{"payload":"","sha256":"c2a98a8b353180d3b8f323b2a88834ff7e40eefc6bd4c82a3a37388b63e26419"},"assets/boat_edge_v223_source_visibility.css":{"payload":"","sha256":"742d8961ca76d5dddecba7c118aee63fa176d5b018329ed370d0277d46d5e018"},"scripts/boat_edge_v223_install.py":{"payload":"","sha256":"741c4c341770687194cc094a17ebcd138d9a8e62c4bde93726439e0ebc8ff877"},"tests/test_boat_edge_v223_source.cjs":{"payload":"","sha256":"9a565b3b138e7e06607b40ae70028ebc7a53a46a0e5262e6c6ac051354668d65"}}""")
          for rel,meta in files.items():
              raw=gzip.decompress(base64.b64decode(meta['payload']))
              if hashlib.sha256(raw).hexdigest()!=meta['sha256']:
                  raise SystemExit('V223_ARTIFACT_SHA_MISMATCH '+rel)
              path=Path(rel)
              path.parent.mkdir(parents=True,exist_ok=True)
              if path.exists() and path.read_bytes()!=raw:
                  raise SystemExit('V223_UNEXPECTED_PREEXISTING_CONTENT_FAIL_CLOSED '+rel)
              if not path.exists():path.write_bytes(raw)
          print('V223_HASHED_CONTENT_RESTORED_V222_PLUS_V223')
          PY_V223_RESTORE
            python3 scripts/boat_edge_v222_install.py .
            python3 scripts/boat_edge_v223_install.py .
            python3 -m py_compile scripts/boat_edge_v222_install.py scripts/boat_edge_v223_install.py
            node --check assets/boat_edge_v222_live_odds.js
            node --check assets/boat_edge_v223_source_visibility.js
            node tests/test_boat_edge_v222_live_odds.cjs assets/boat_edge_v222_live_odds.js
            node tests/test_boat_edge_v222_freeze.cjs assets/boat_edge_v108.js
            node tests/test_boat_edge_v223_source.cjs assets/boat_edge_v223_source_visibility.js
            python3 - <<'PY_V223_ASSERT'
          from pathlib import Path
          v108=Path('assets/boat_edge_v108.js').read_text()
          site=Path('index.html').read_text()
          assert v108.count('V222_LOCAL_FINAL_IMMUTABLE')==1
          assert v108.count('if(previous!==null && previous!==undefined)return previous;')==1
          assert site.count('boat_edge_v222_live_odds.js?v=222')==1
          assert site.count('boat_edge_v223_source_visibility.js?v=223')==1
          assert site.count('boat_edge_v223_source_visibility.css?v=223')==1
          assert 'be181ShowChoice' in v108 and 'be166OddsStatus' in v108
          print('V223_SAFE_RENDER_AND_IMMUTABLE_FREEZE_ASSERT_PASS')
          PY_V223_ASSERT
            git add -- assets/boat_edge_v108.js assets/boat_edge_v222_live_odds.js assets/boat_edge_v223_source_visibility.js assets/boat_edge_v223_source_visibility.css index.html scripts/boat_edge_v222_install.py scripts/boat_edge_v223_install.py tests/test_boat_edge_v222_live_odds.cjs tests/test_boat_edge_v222_freeze.cjs tests/test_boat_edge_v223_source.cjs
            if git diff --cached --quiet; then
              echo 'V223_ALREADY_INSTALLED_TESTS_PASS'; exit 0
            fi
            git commit -m 'V223 exact predeadline source evidence with V222 immutable odds refresh'
            if git push origin HEAD:main; then
              echo 'V223_COMMIT_SUCCESS_TESTS_PASS'; exit 0
            fi
            if [ "$attempt" -eq 6 ]; then echo 'V223_PUSH_RETRIES_EXHAUSTED'; exit 1; fi
            sleep 3
          done
