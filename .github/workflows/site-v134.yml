name: BOAT EDGE V134 - Repair Source-Bound TODO Reconciler

on:
  push:
    branches: [main]
    paths: ['.github/workflows/site-v134.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['BOAT EDGE V133 Balance10 Wave18 FIXED']
    types: [completed]
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v134-evidence-todo
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile site-only immutable audit and unresolved accuracy TODO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRECONCILE'
          from __future__ import annotations
          import hashlib, json, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          ROOT=Path('.')
          FLOOR='20261009'
          POLICY='BALANCE10_WAVE12_15_18_V133_FIXED'
          JST=timezone(timedelta(hours=9))
          NOW=datetime.now(JST).strftime('%Y-%m-%d')
          SNAPS=ROOT/'data/site_prediction_snapshots'
          HIST=ROOT/'data/site_prediction_history'
          AUDITS=ROOT/'data/site_prediction_audit'
          PARITY=ROOT/'data/site_prediction_parity/v133.json'
          STATE=ROOT/'data/site_current_state.json'
          EVID=ROOT/'data/site_todo_evidence.json'
          JS=ROOT/'assets/boat_edge_v108.js'
          TODO=ROOT/'BOAT_EDGE_CURRENT_TODO.md'
          def read(p):
              try:return json.loads(p.read_text(encoding='utf-8'))
              except (OSError, ValueError, UnicodeDecodeError):return None
          def sha(p):
              try:return hashlib.sha256(p.read_bytes()).hexdigest()
              except OSError:return None
          def iso(s):
              try:
                  d=datetime.fromisoformat(str(s).replace('Z','+00:00'))
                  return d.astimezone(timezone.utc) if d.tzinfo else None
              except (TypeError, ValueError):return None
          state=read(STATE) or {}
          parity=read(PARITY) or {}
          js=JS.read_text(encoding='utf-8') if JS.exists() else ''
          state_ok=(state.get('ui')=={'version':'V133','status':'ACTIVE'}
                    and (state.get('parity') or {}).get('status')=='PASS'
                    and parity.get('pass') is True and not parity.get('errors'))
          ui_branch=all(t in js for t in ('id="be128HitStatus"','判定待ち','🎯 的中','✕ 不的中','判定対象外'))
          snapshots=[];audited=[];settled=[];counts=[];excluded={}
          for p in sorted(SNAPS.glob('20??????-??-??.json')):
              key=p.stem
              if key[:8]<FLOOR:continue
              d=read(p)
              if not isinstance(d,dict) or d.get('race_key')!=key or d.get('mode_policy')!=POLICY or d.get('prediction_kind')!='SITE_REFERENCE_V122' or d.get('snapshot_window')!='FINAL_15M':
                  excluded['bad_site_snapshot']=excluded.get('bad_site_snapshot',0)+1;continue
              if any((d.get('guards') or {}).get(k) is not False for k in ('results_seen','unlock','scoring')):
                  excluded['pre_result_guard_invalid']=excluded.get('pre_result_guard_invalid',0)+1;continue
              tc={m:len((d.get('modes') or {}).get(m,{}).get('tickets') or []) for m in ('hit','balance','hole','narrow')}
              x={'race_key':key,'sha256':sha(p),'saved_at':d.get('saved_at'),'counts':tc,'minutes_to_deadline':d.get('minutes_to_deadline')}
              snapshots.append(x);counts.append(tc)
              a=read(AUDITS/(key+'.json')) or {}
              # MUST require the exact per-race source evidence, not a rotating daily index.
              if a.get('pass') is True and a.get('latest_snapshot_sha256')==x['sha256'] and a.get('latest_snapshot_saved_at')==d.get('saved_at'):
                  audited.append(x)
              else:
                  # One bad record must prevent a blanket 'all audited' PASS.
                  excluded['sha_or_timestamp_audit_not_verified']=excluded.get('sha_or_timestamp_audit_not_verified',0)+1
              h=read(HIST/(key+'.json')) or {}
              ss=h.get('snapshot') or {};sett=h.get('settlement') or {}
              if h.get('race_key')==key and ss.get('race_key')==key and ss.get('prediction_kind')=='SITE_REFERENCE_V122' and ss.get('saved_at')==d.get('saved_at') and isinstance(sett,dict) and re.fullmatch(r'[1-6]-[1-6]-[1-6]',str(sett.get('winning_combo') or '')):
                  a1=iso(d.get('first_saved_at'));a2=iso(d.get('saved_at'));a3=iso(sett.get('settled_at'))
                  if a1 and a2 and a3 and a1<=a2<a3:
                      settled.append({'race_key':key,'winning_combo':sett['winning_combo']})
          wave=sorted({x['hole'] for x in counts})
          mode_counts_ok=bool(counts) and all(x['hit']==10 and x['balance']==10 and x['hole'] in (12,15,18) and x['narrow']==3 for x in counts)
          status={
           'task1_live_snapshot_audit': bool(state_ok and snapshots and len(audited)==len(snapshots)
              and not excluded.get('bad_site_snapshot') and not excluded.get('pre_result_guard_invalid')),
           # JS static-source evidence alone does NOT prove Safari/browser 🎯 rendering.
           'task2_settled_hit_ui_path': False,
           'task3_live_mode_counts_and_parity': bool(state_ok and mode_counts_ok and set(wave)>={12,15,18}
              and not excluded.get('bad_site_snapshot') and not excluded.get('pre_result_guard_invalid')
              and parity.get('balance_distinct_from_hit_on_fixed_fixture') is True)
          }
          summary={
           'v133_snapshot_count':len(snapshots),'v133_audited_pass_count':len(audited),
           'observed_wave_counts':wave,'all_live_mode_counts_ok':bool(mode_counts_ok),
           'v133_settled_count':len(settled),'ui_hit_branch_code_present':bool(ui_branch),
           'ui_hit_browser_verified':False,'ui_hit_branch_ok':bool(ui_branch),'parity_pass':parity.get('pass') is True and not parity.get('errors'),
           'v185_independent_fresh_not_certified_by_todo':True,'source_exclusions':excluded
          }
          base={'schema_version':'boat-edge-todo-evidence-v134','date':NOW,'site_floor_date':'2026-10-09',
                'current_ui':'V133','mode_policy':POLICY,'scope':'SITE_REFERENCE_ONLY_NOT_FORMAL_FRESH',
                'current_state_ok':bool(state_ok),'status':status,'summary':summary,
                'examples':{'first_audited_v133':audited[0] if audited else None,
                            'first_settled_v133':settled[0] if settled else None},
                'guards':{'formal_results_accessed':False,'formal_state_modified':False,
                          'ui_browser_certification_not_assumed':True},
                'source_hashes':{'parity_v133':sha(PARITY),'runtime_js':sha(JS)}}
          old=read(EVID) or {}
          old_cmp={k:v for k,v in old.items() if k!='updated_at'}
          evidence=dict(base)
          evidence['updated_at']=old.get('updated_at') if old_cmp==base and old.get('updated_at') else datetime.now(timezone.utc).isoformat()
          EVID.parent.mkdir(parents=True,exist_ok=True)
          encoded=json.dumps(evidence,ensure_ascii=False,indent=2)+'\n'
          if not EVID.exists() or EVID.read_text(encoding='utf-8')!=encoded:EVID.write_text(encoded,encoding='utf-8')
          active=[];done=[]
          if not status['task1_live_snapshot_audit']:active.append('1. [ ] FINAL_15M予想の個別監査SHAと保存時刻を確認する。')
          else:done.append(f'- [x] サイト参考FINAL_15M予想：SHA照合した監査 {len(audited)}R。')
          active.append('2. [ ] Safariで🎯的中・不的中・判定対象外を実機確認（コード検査だけではPASSにしない）。')
          if not status['task3_live_mode_counts_and_parity']:active.append('3. [ ] 4モード件数とブラウザ・サーバー整合性を監査する。')
          else:done.append('- [x] 4モード件数、V133固定のブラウザ・サーバーParity検査。')
          active += [
           '4. [ ] V185未見Freshで3着抜け31R/2着抜け20Rの改善候補を検証。Top3・Top5・Top10、A頭・非1頭を別計測。',
           '5. [ ] 進入実コース×1年/6か月/3か月と1×2壁・逃がし率の連動。',
           '6. [ ] 3/4攻め艇と5/6受益艇の展開分離。',
           '7. [ ] 直近節モーター、展示1周・まわり足・直線、展示ST差の個別検証。',
           '8. [ ] 会場×季節/風/潮と当日既走LIVE水面。欠測補完はしない。',
           '9. [ ] BOATERSと競艇日和の両方でオリ展照合。取得できない場合は明記。',
           '10. [ ] 平均信頼度81.53と観測的中40%の意味を分離し表示を校正。',
           '11. [ ] 的中/バランス/波乱の買い目重複を抑える候補を未見比較。'
          ]
          formal=state.get('formal_current') or {};guards=formal.get('guards') or {}
          lines=['# BOAT EDGE CURRENT TODO','',f'Updated: {NOW}',
                 'V134 repaired: SITE_REFERENCE 2026-10-09+ exact per-race SHA audit; never read formal results.','',
                 '## CURRENT','- UI: V133 (repository state as recorded)',
                 '- Latest model/formal freeze is NOT certified by this TODO.',
                 '- Official V185 prospective freeze requires pre-deadline immutable Git evidence.',
                 '- Browser display and model accuracy are separate certification gates.',
                 f'- Site snapshot count: {len(snapshots)}; SHA-verified audits: {len(audited)}; settled reference histories: {len(settled)}.',
                 f'- 🎯 indicator strings present in JS: {str(ui_branch).lower()}; Safari confirmation: false.',
                 f'- Formal state recorded as of: {state.get("as_of") or "unknown"} (may be stale).',
                 f'- Formal guards (recorded): results_seen={guards.get("results_seen")}, unlock={guards.get("unlock")}, scoring={guards.get("scoring")}.','',
                 '## ACTIVE TODO — priority order',*active,'',
                 '## WAITING / GATES',
                 '- Formal Fresh untouched until gate PASS. Site reference study != formal validation.',
                 '- Do not open formal result/payout/combined API or backfill prior predictions.',
                 '- No odds-based ranking or missing-feature imputation.',
                 '- Do not promote V180/V185 or any hypothesis before multi-day independent Fresh improvement.','',
                 '## RECENT DONE',*done,'',
                 '## TODO EVIDENCE','- data/site_todo_evidence.json',
                 '- data/site_learning/head_tail_rootcause_v196.json',
                 '- data/site_tail_shadow_v185/quality/20261010.json',
                 '- Source observations reflect site research only, not verified production accuracy.',
                 '- V109 payout repair is separately tracked; no historical stake allocations inferred.','',
                 '## TODO GUARD','- ACTIVE contains only incomplete tasks. Browser completion is never inferred from JS text.','']
          # Historic evidence is not an active task or a claimed new test PASS.
          # These lines were in the GitHub TODO before V134 overwrote the text.
          legacy=[
           '- [x] V133 browser/server parity PASS for all four prediction modes.',
           '- [x] V133 mode policy fixed at 的中重視10 / バランス10 / 波乱12・15・18 / 激絞り3.',
           '- [x] Live V133 FINAL_15M snapshot + audit PASS — `20261008-01-03`.',
           '- V109 replaces the legacy result collector without changing V108 UI.',
           '- V109 treats confirmed + payout null as incomplete and refetches it.',
           '- V109 payout parser supports ¥ / ￥ / 円.',
           '- V109 backfills historical confirmed payout gaps from 2026-10-07.',
           '- V109 keeps result/trifecta data factual; missing payout is never fabricated.',
          ]
          # Permit user-maintained archival notes: the auto-reconciler must not erase them.
          prev=TODO.read_text(encoding='utf-8') if TODO.exists() else ''
          marker='## PRESERVED HISTORICAL TODO / USER NOTES'
          if marker in prev:
              kept=prev.split(marker,1)[1].split('\n## ',1)[0]
              for line in kept.splitlines():
                  line=line.strip()
                  if line.startswith(('- ', '* ')) and line not in legacy:legacy.append(line)
          lines.extend(['',marker,
                        'Read-only history, not additional current-model certification.',
                        *legacy,''])
          content='\n'.join(lines)
          if not TODO.exists() or TODO.read_text(encoding='utf-8')!=content:TODO.write_text(content,encoding='utf-8')
          # Preserve every formal-current key and all unrelated state fields.
          state['todo_reconciler']={
           'version':'V134','status':'ACTIVE_EVIDENCE_GUARDED_SITE_ONLY',
           'evidence':'data/site_todo_evidence.json',
           'auto_completed':[k for k,v in status.items() if v],
           'pending':[k for k,v in status.items() if not v]}
          encoded=json.dumps(state,ensure_ascii=False,indent=2)+'\n'
          if not STATE.exists() or STATE.read_text(encoding='utf-8')!=encoded:STATE.write_text(encoded,encoding='utf-8')
          assert evidence['guards']['formal_results_accessed'] is False
          print('V134_SITE_REFERENCE_RECONCILE_PASS '+json.dumps({'date':NOW,'site_snapshots':len(snapshots),'sha_pass':len(audited),'settled_site':len(settled),'status':status,'js_branch':ui_branch},ensure_ascii=False))
          PYRECONCILE

      - name: Validate repaired V134 evidence independently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVALIDATE'
          import json
          from pathlib import Path
          e=json.loads(Path('data/site_todo_evidence.json').read_text(encoding='utf8'))
          state=json.loads(Path('data/site_current_state.json').read_text(encoding='utf8'))
          todo=Path('BOAT_EDGE_CURRENT_TODO.md').read_text(encoding='utf8')
          assert e['schema_version']=='boat-edge-todo-evidence-v134'
          assert e['scope']=='SITE_REFERENCE_ONLY_NOT_FORMAL_FRESH'
          assert state['todo_reconciler']['version']=='V134'
          assert not any(e['guards'][k] for k in ('formal_results_accessed','formal_state_modified'))
          assert 'ACTIVE TODO — priority order' in todo and 'V185未見Fresh' in todo
          assert '🎯的中・不的中・判定対象外を実機確認' in todo
          assert e['summary']['v133_audited_pass_count'] <= e['summary']['v133_snapshot_count']
          assert e['summary']['v133_settled_count'] <= e['summary']['v133_snapshot_count']
          if e['status']['task1_live_snapshot_audit']:
              assert e['summary']['v133_snapshot_count']>0
              assert e['summary']['v133_audited_pass_count']==e['summary']['v133_snapshot_count']
          if e['summary']['v133_audited_pass_count'] < e['summary']['v133_snapshot_count']:
              assert e['status']['task1_live_snapshot_audit'] is False
          assert '## PRESERVED HISTORICAL TODO / USER NOTES' in todo
          assert '- V109 payout parser supports ¥ / ￥ / 円.' in todo
          if e['status']['task3_live_mode_counts_and_parity']:
              assert e['summary']['all_live_mode_counts_ok']
          # Never equate source string presence with Safari browser verification.
          assert e['status']['task2_settled_hit_ui_path'] is False
          assert e['summary']['ui_hit_browser_verified'] is False
          print('V134_EXACT_SHA_TAMPER_GUARD_AND_HISTORY_PRESERVED_PASS')
          PYVALIDATE
          git diff --check
      - name: Commit only current TODO state and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- BOAT_EDGE_CURRENT_TODO.md data/site_todo_evidence.json data/site_current_state.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo V134_EVIDENCE_ALREADY_CURRENT
            exit 0
          fi
          git commit -m 'V134 restore dynamic site-only SHA-audited TODO without formal gate changes'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              echo V134_REPAIRED_TODO_COMMITTED
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo V134_PUSH_CONFLICT_NO_FALSE_COMPLETE >&2
          exit 1
