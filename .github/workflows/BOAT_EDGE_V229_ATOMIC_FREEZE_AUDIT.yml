name: BOAT EDGE V229 - Atomic Site Freeze and Pre-result Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V229_ATOMIC_FREEZE_AUDIT.yml']
  workflow_dispatch:
  # V292: GitHub cron can skip/delay the narrow V229 2-10m source window.
  # Start a guarded read of main after either independent PRE_RESULT input
  # producer succeeds. Failed, forked, or non-main runs cannot trigger writes.
  workflow_run:
    workflows:
      - 'BOAT EDGE 自動更新'
      - 'BOAT EDGE 3連単オッズ更新 V71'
    types: [completed]
  schedule:
    - cron: '6,11,16,21,26,31,36,41,46,51,56 0-14,23 * * *'
    - cron: '1 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v229-atomic-first-freeze-source-audit
  cancel-in-progress: false

jobs:
  atomic-prospective-site-evidence:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read current main without rewriting workflow or model
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin predecessor engine and restore site-only atomic validator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V229_INSTALL'
          from pathlib import Path
          import hashlib,gzip,base64,subprocess,ast
          locked={
            'scripts/site_final_history_v133.py':'9cde465969c887f48e7943c925b4f9becc702806',
            'scripts/boat_edge_v228_freeze_only.py':'964b35bc7636ceb68fb1f4d5b36977c49a376dbe3d1d71193571bd957c2ff313',
          }
          for fname,expected in locked.items():
              path=Path(fname)
              if not path.is_file():raise SystemExit('V229_DEPENDENCY_MISSING_'+fname)
              if fname.endswith('site_final_history_v133.py'):
                  actual=subprocess.check_output(['git','hash-object',fname],text=True).strip()
              else:
                  actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual!=expected:raise SystemExit('V229_PIN_DRIFT_REFUSE_DEPLOY_'+fname)
          objects={
            'scripts/boat_edge_v229_atomic_freeze.py': ('1b2810b6d72bb6a37594c0097ae0a333ce1c46f099980e6b809a3db18d2644d8', ''),
            'tests/test_boat_edge_v229_atomic_freeze.py': ('1bd1b38489d2739daea04a768c29a1952d60967cabb0f774c756481e0cb404aa', ''),
          }
          for fname,(expected,b64) in objects.items():
              raw=gzip.decompress(base64.b64decode(b64,validate=True))
              if hashlib.sha256(raw).hexdigest()!=expected:
                  raise SystemExit('V229_EMBEDDED_BYTES_SHA_FAIL_'+fname)
              p=Path(fname)
              if p.is_file() and p.read_bytes()!=raw:
                  raise SystemExit('V229_EXISTING_SOURCE_DRIFT_DO_NOT_OVERWRITE_'+fname)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(raw)
              ast.parse(raw.decode('utf8'))
          print('V229_DEPENDENCIES_PINNED_AND_SCRIPT_SHA_PASS')
          PY_V229_INSTALL
      - name: Run deterministic fail-closed regression tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v229_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/boat_edge_v229_atomic_freeze.py
          git diff --check
      - name: First freeze and audit same-run site-only evidence; never read results
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v229_atomic_freeze.py
          git diff --check
      # V320: independent, read-only observability. Never used as permission to freeze.
      - name: Report actual 2-10 minute site freeze blockers (read-only)
        continue-on-error: true
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/boat_edge_v229_eligibility_diagnostic.py --summary-only | tee /tmp/v229-window-diagnostic.json
          {
            echo '### V229 site-only decision-window diagnostics (not an eligibility proof)'
            echo '```json'
            cat /tmp/v229-window-diagnostic.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only new snapshot, byte-matched official odds, and atomic SHA provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/boat_edge_v229_atomic_freeze.py tests/test_boat_edge_v229_atomic_freeze.py
          git add -A -- data/site_prediction_snapshots/ data/site_prediction_audit/
          if [[ -d data/site_autopilot/v229_evidence ]]; then
            git add -A -- data/site_autopilot/v229_evidence/
          fi
          # Ignore unrelated worktree changes; never stage model, payout, result, formal, workflow.
          git diff --cached --name-only | while IFS= read -r f; do
            case "$f" in
              scripts/boat_edge_v229_atomic_freeze.py|tests/test_boat_edge_v229_atomic_freeze.py) ;;
              data/site_prediction_snapshots/20??????-??-??.json|data/site_prediction_snapshots/odds_v214/20??????-??-??-*.json) ;;
              data/site_prediction_audit/20??????-??-??.json|data/site_autopilot/v229_evidence/20??????-??-??.json) ;;
              *) echo "V229_UNAPPROVED_STAGED_FILE: $f" >&2; exit 1 ;;
            esac
          done
          if git diff --cached --quiet; then echo V229_NO_NEW_ELIGIBLE_EVIDENCE; exit 0; fi
          git diff --cached --check
          git commit -m 'V229 first-freeze evidence, source freshness and atomic pre-result SHA audit'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'V229_ATOMIC_PROSPECTIVE_EVIDENCE_COMMITTED'
              exit 0
            fi
            sleep 2
          done
          echo V229_PUSH_BLOCKED_NO_PRODUCTION_CLAIM >&2
          exit 1
