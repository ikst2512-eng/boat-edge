name: BOAT EDGE V229 - Atomic Site Freeze and Pre-result Audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V229_ATOMIC_FREEZE_AUDIT.yml']
  workflow_dispatch:
  # V292: GitHub cron can skip/delay the narrow V229 2-10m source window.
  # Start a guarded read of main after either independent PRE_RESULT input
  # producer succeeds. Failed, forked, or non-main runs cannot trigger writes.
  workflow_run:
    workflows:
      - 'BOAT EDGE 自動更新'
      - 'BOAT EDGE 3連単オッズ更新 V71'
    types: [completed]
  schedule:
    - cron: '6,11,16,21,26,31,36,41,46,51,56 0-14,23 * * *'
    - cron: '1 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v229-atomic-first-freeze-source-audit
  cancel-in-progress: false

jobs:
  atomic-prospective-site-evidence:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read current main without rewriting workflow or model
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify current tracked pre-result engine by exact Git blob SHA
        shell: bash
        run: |
          set -euo pipefail
          # V229 previously restored an obsolete embedded validator and pinned
          # V133 source from before the current approved V228 model migration.
          # Never reinstall old code or silently accept a new predictor. Check
          # the exact reviewed Git blobs already tracked in this checkout.
          python3 - <<'PY_V229_CURRENT_SOURCE'
          from pathlib import Path
          import re, subprocess
          expected = {
              'scripts/site_final_history_v133.py': '7b2916df307fcb2783cfc6ddc38ff73903d56da5',
              'scripts/boat_edge_v228_freeze_only.py': 'cd71bc51b943b485f08d9610e305a3a7cefb220e',
              'scripts/boat_edge_v229_atomic_freeze.py': '23246495c6296177f8d95a93eeabc0a832c633a4',
              'tests/test_boat_edge_v229_atomic_freeze.py': 'f6478da4da2af52195d1982397e9e74c8d491335',
          }
          for name, sha in expected.items():
              path = Path(name)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('V229_TRACKED_SOURCE_MISSING_' + name)
              actual = subprocess.check_output(
                  ['git', 'hash-object', '--', name], text=True).strip()
              if actual != sha:
                  raise SystemExit('V229_TRACKED_SOURCE_PIN_DRIFT_' + name)
          model = Path('scripts/boat_edge_v228_freeze_only.py').read_text(encoding='utf-8')
          declaration = re.search(r"(?m)^MODEL_SHA\s*=\s*['\"]([0-9a-f]{40})['\"]\s*$", model)
          if not declaration or declaration.group(1) != expected['scripts/site_final_history_v133.py']:
              raise SystemExit('V229_V228_MODEL_PIN_NOT_CURRENT_V133')
          print('V229_TRACKED_SOURCE_PINS_PASS', len(expected))
          PY_V229_CURRENT_SOURCE
      - name: Run deterministic fail-closed regression tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v229_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/boat_edge_v229_atomic_freeze.py
          git diff --check
      - name: First freeze and audit same-run site-only evidence; never read results
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v229_atomic_freeze.py
          git diff --check
      # V320: independent, read-only observability. Never used as permission to freeze.
      - name: Report actual 2-10 minute site freeze blockers (read-only)
        continue-on-error: true
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/boat_edge_v229_eligibility_diagnostic.py --summary-only | tee /tmp/v229-window-diagnostic.json
          {
            echo '### V229 site-only decision-window diagnostics (not an eligibility proof)'
            echo '```json'
            cat /tmp/v229-window-diagnostic.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only new snapshot, byte-matched official odds, and atomic SHA provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/boat_edge_v229_atomic_freeze.py tests/test_boat_edge_v229_atomic_freeze.py
          git add -A -- data/site_prediction_snapshots/ data/site_prediction_audit/
          if [[ -d data/site_autopilot/v229_evidence ]]; then
            git add -A -- data/site_autopilot/v229_evidence/
          fi
          # Ignore unrelated worktree changes; never stage model, payout, result, formal, workflow.
          git diff --cached --name-only | while IFS= read -r f; do
            case "$f" in
              scripts/boat_edge_v229_atomic_freeze.py|tests/test_boat_edge_v229_atomic_freeze.py) ;;
              data/site_prediction_snapshots/20??????-??-??.json|data/site_prediction_snapshots/odds_v214/20??????-??-??-*.json) ;;
              data/site_prediction_audit/20??????-??-??.json|data/site_autopilot/v229_evidence/20??????-??-??.json) ;;
              *) echo "V229_UNAPPROVED_STAGED_FILE: $f" >&2; exit 1 ;;
            esac
          done
          if git diff --cached --quiet; then echo V229_NO_NEW_ELIGIBLE_EVIDENCE; exit 0; fi
          git diff --cached --check
          git commit -m 'V229 first-freeze evidence, source freshness and atomic pre-result SHA audit'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'V229_ATOMIC_PROSPECTIVE_EVIDENCE_COMMITTED'
              exit 0
            fi
            sleep 2
          done
          echo V229_PUSH_BLOCKED_NO_PRODUCTION_CLAIM >&2
          exit 1
