name: BOAT EDGE V104 BOATERS Style Navigation

on:
  push:
    paths:
      - ".github/workflows/site-v104.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boat-edge-v104-nav
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build archive from saved data
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone,timedelta

          START='20261005'
          JST=timezone(timedelta(hours=9))
          races=Path('data/races'); results=Path('data/site_results'); odds=Path('data/site_odds')
          out=Path('data/site_archive'); out.mkdir(parents=True,exist_ok=True)
          days={}

          for p in sorted(races.glob('*.json')):
              m=re.fullmatch(r'(\d{8})-(\d{2})-(\d{2})\.json',p.name)
              if not m: continue
              ymd,jcd,rno=m.groups()
              if ymd<START: continue
              try:d=json.loads(p.read_text(encoding='utf-8'))
              except:continue
              meta=d.get('meta') or {}
              key=d.get('race_key') or p.stem
              day=days.setdefault(ymd,{})
              v=day.setdefault(jcd,{'jcd':jcd,'venue':meta.get('venue') or jcd,'event':meta.get('event') or '','races':[]})
              res=None; rp=results/f'{key}.json'
              if rp.exists():
                  try:res=json.loads(rp.read_text(encoding='utf-8'))
                  except:res=None
              v['races'].append({
                  'race_key':key,'race_no':int(meta.get('race_no') or rno),'deadline':meta.get('deadline'),
                  'file':f'data/races/{key}.json','jcd':jcd,'result_status':res.get('status') if res else None,
                  'trifecta':res.get('trifecta') if res else None,
                  'payout':res.get('trifecta_payout_yen_per_100') if res else None,
                  'has_odds':(odds/f'{key}.json').exists()
              })

          idx=[]
          for ymd,vm in sorted(days.items()):
              venues=[]
              count=0
              for jcd,v in sorted(vm.items()):
                  v['races'].sort(key=lambda x:x['race_no']);count+=len(v['races']);venues.append(v)
              doc={'schema_version':'boat-edge-site-archive-v104','ymd':ymd,'venue_count':len(venues),'race_count':count,'venues':venues}
              (out/f'{ymd}.json').write_text(json.dumps(doc,ensure_ascii=False,indent=2),encoding='utf-8')
              idx.append({'ymd':ymd,'venues':len(venues),'races':count})
          root={'schema_version':'boat-edge-site-archive-index-v104','start_date':'2026-10-05','updated_at':datetime.now(JST).isoformat(timespec='seconds'),'dates':idx,'retention':'saved-data-only; no deletion'}
          (out/'index.json').write_text(json.dumps(root,ensure_ascii=False,indent=2),encoding='utf-8')
          print(root)
          PY

      - name: Install V104 UI
        shell: bash
        run: |
          mkdir -p assets
          cat > assets/boat_edge_v104.js <<'JS'
          /* BOAT_EDGE_V104_BOATERS_NAV */
          (()=>{"use strict";
          const $=(s,r=document)=>r.querySelector(s);
          const $$=(s,r=document)=>[...r.querySelectorAll(s)];
          const esc=v=>String(v??"－").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
          const STORE_DATE="boatEdgeV104Date";
          const STORE_VENUE="boatEdgeV104Venue";
          const NAV_STACK="boatEdgeV104NavStack";
          const cache=new Map();
          let archiveIndex=null;
          let selectedDate=null;
          let selectedVenue=null;

          async function J(u){
            const key=u.replace(/\?.*$/,"");
            const hit=cache.get(key);
            if(hit&&Date.now()-hit.at<15000)return hit.v;
            try{
              const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
              if(!r.ok)return null;
              const v=await r.json();cache.set(key,{at:Date.now(),v});return v;
            }catch(_){return null}
          }
          function activeView(){return $(".view.active")?.id||"homeView"}
          function currentCtx(){return {view:activeView(),scroll:window.scrollY||0,date:selectedDate,venue:selectedVenue}}
          function navStack(){try{return JSON.parse(sessionStorage.getItem(NAV_STACK)||"[]")}catch(_){return []}}
          function saveStack(v){try{sessionStorage.setItem(NAV_STACK,JSON.stringify(v.slice(-40)))}catch(_){}}
          function pushCtx(){
            const s=navStack(),c=currentCtx(),p=s[s.length-1];
            if(p&&p.view===c.view&&p.date===c.date&&p.venue===c.venue&&Math.abs((p.scroll||0)-(c.scroll||0))<24)return;
            s.push(c);saveStack(s);
          }
          function activateView(id){
            $$(".view").forEach(v=>v.classList.toggle("active",v.id===id));
            $$(".bottomnav [data-view]").forEach(v=>v.classList.toggle("on",v.dataset.view===id));
          }
          function saveSelection(){
            try{
              if(selectedDate)localStorage.setItem(STORE_DATE,selectedDate);
              if(selectedVenue)localStorage.setItem(STORE_VENUE,selectedVenue);
            }catch(_){}
          }
          async function goBack(){
            const s=navStack(),p=s.pop();saveStack(s);
            if(!p){activateView("homeView");await renderHub();window.scrollTo({top:0,behavior:"smooth"});return}
            selectedDate=p.date||selectedDate;
            selectedVenue=p.venue||selectedVenue;
            saveSelection();
            activateView(p.view||"homeView");
            if((p.view||"homeView")==="homeView")await renderHub();
            setTimeout(()=>window.scrollTo({top:p.scroll||0,behavior:"smooth"}),40);
          }
          function dateObj(ymd){
            const s=String(ymd||"");
            if(!/^\d{8}$/.test(s))return null;
            return new Date(Number(s.slice(0,4)),Number(s.slice(4,6))-1,Number(s.slice(6,8)));
          }
          function sameToday(ymd){
            const d=dateObj(ymd),n=new Date();
            return d&&d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
          }
          function dateLabel(ymd){
            const d=dateObj(ymd);if(!d)return String(ymd||"");
            const wd=["日","月","火","水","木","金","土"][d.getDay()];
            return `${d.getMonth()+1}月${d.getDate()}日(${wd})`;
          }
          function dateTitle(ymd){return `${sameToday(ymd)?"本日":""}${dateLabel(ymd)}`}
          async function loadIndex(){if(archiveIndex)return archiveIndex;archiveIndex=await J("./data/site_archive/index.json");return archiveIndex}
          async function loadDay(ymd){return await J(`./data/site_archive/${ymd}.json`)}
          function indexDates(){return [...(archiveIndex?.dates||[])].map(x=>x.ymd).sort()}
          function ensureHub(){
            const home=$("#homeView");if(!home)return null;
            let sec=$("#be104Hub");
            if(!sec){sec=document.createElement("section");sec.id="be104Hub";sec.className="be104-hub";home.insertBefore(sec,home.firstChild)}
            return sec;
          }
          function statusText(r){
            if(r.result_status==="confirmed"){
              const pay=r.payout?` ${Number(r.payout).toLocaleString("ja-JP")}円`:"";
              return `結果 ${esc(r.trifecta||"確定")}${pay}`;
            }
            if(r.has_odds)return "オッズあり";
            return "保存データ";
          }
          function raceMini(r,active=false){
            return `<button type="button" class="be104-race-mini ${active?"on":""}" data-race-file="${esc(r.file)}" data-race-jcd="${esc(r.jcd)}"><b>${esc(r.race_no)}R</b><span>${esc(r.deadline||"－")}</span></button>`;
          }
          function raceRow(r){
            return `<button type="button" class="be104-race-row" data-race-file="${esc(r.file)}" data-race-jcd="${esc(r.jcd)}"><div class="be104-rno"><b>${esc(r.race_no)}R</b><small>予選</small></div><div class="be104-rmeta"><strong>締切 ${esc(r.deadline||"－")}</strong><span>${statusText(r)}</span></div><div class="be104-open">見る ›</div></button>`;
          }
          function venueCard(v){
            return `<button type="button" class="be104-venue ${selectedVenue===v.jcd?"on":""}" data-venue="${esc(v.jcd)}"><span class="be104-badge">一般</span><b>${esc(v.venue)}</b><small>${(v.races||[]).length}R</small></button>`;
          }
          function selectedVenueHtml(day){
            const v=(day?.venues||[]).find(x=>String(x.jcd)===String(selectedVenue));
            if(!v)return "";
            return `<div class="be104-venue-panel"><div class="be104-venue-head"><div><b>${esc(v.venue)}</b><span>${esc(v.event||"開催中")}</span></div><button type="button" id="be104CloseVenue">場一覧へ</button></div><div class="be104-race-strip">${(v.races||[]).map(r=>raceMini(r)).join("")}</div><div class="be104-race-list">${(v.races||[]).map(raceRow).join("")}</div></div>`;
          }
          function dateNavHtml(dates){
            const i=Math.max(0,dates.indexOf(selectedDate));
            const prev=dates[i-1]||null,next=dates[i+1]||null;
            return `<div class="be104-date-nav"><button type="button" data-day="${prev||""}" ${prev?"":"disabled"}>‹ 前日</button><div><b>${esc(dateTitle(selectedDate))}のレース</b><span>保存済みデータ</span></div><button type="button" data-day="${next||""}" ${next?"":"disabled"}>翌日 ›</button></div>`;
          }
          async function renderHub(){
            const sec=ensureHub();if(!sec)return;
            await loadIndex();
            const dates=indexDates();
            if(!dates.length){sec.innerHTML='<div class="be104-empty">保存済みレースを準備中です。</div>';return}
            if(!selectedDate||!dates.includes(selectedDate))selectedDate=dates[dates.length-1];
            const day=await loadDay(selectedDate);
            if(selectedVenue&&!(day?.venues||[]).some(v=>String(v.jcd)===String(selectedVenue)))selectedVenue=null;
            saveSelection();
            sec.innerHTML=`<div class="be104-shell">${dateNavHtml(dates)}<div class="be104-venue-grid">${(day?.venues||[]).map(venueCard).join("")}</div>${selectedVenueHtml(day)}</div>`;
            $$("[data-day]",sec).forEach(b=>b.onclick=async()=>{const d=b.dataset.day;if(!d)return;selectedDate=d;selectedVenue=null;saveSelection();await renderHub();window.scrollTo({top:0,behavior:"smooth"})});
            $$("[data-venue]",sec).forEach(b=>b.onclick=async()=>{selectedVenue=b.dataset.venue;saveSelection();await renderHub();setTimeout(()=>$(".be104-venue-panel",sec)?.scrollIntoView({behavior:"smooth",block:"start"}),30)});
            $("#be104CloseVenue",sec)?.addEventListener("click",async()=>{selectedVenue=null;saveSelection();await renderHub()});
            $$("[data-race-file]",sec).forEach(b=>b.onclick=()=>{pushCtx();selectedVenue=b.dataset.raceJcd||selectedVenue;saveSelection();if(typeof loadRace==="function")loadRace(b.dataset.raceFile,b.dataset.raceJcd)});
          }
          async function renderRaceHeader(){
            let race=null;try{race=state?.race||null}catch(_){}
            if(!race?.race_key)return;
            const ymd=String(race.race_key).slice(0,8),jcd=String(race.meta?.venue_code||"").padStart(2,"0");
            selectedDate=ymd;selectedVenue=jcd;saveSelection();
            const day=await loadDay(ymd);
            const v=(day?.venues||[]).find(x=>String(x.jcd)===jcd);
            if(!v)return;
            const summary=$(".race-summary");if(!summary)return;
            let wrap=$("#be104RaceTop");
            if(!wrap){wrap=document.createElement("div");wrap.id="be104RaceTop";const top=$(".summary-top",summary);top?.insertAdjacentElement("afterend",wrap)}
            wrap.innerHTML=`<div class="be104-race-backrow"><button type="button" id="be104Back">← ${esc(v.venue)} ${dateLabel(ymd)}へ</button><span>${esc(v.event||"")}</span></div><div class="be104-race-strip">${(v.races||[]).map(r=>raceMini(r,r.race_key===race.race_key)).join("")}</div>`;
            $("#be104Back",wrap).onclick=goBack;
            $$("[data-race-file]",wrap).forEach(b=>b.onclick=()=>{if(typeof loadRace==="function")loadRace(b.dataset.raceFile,b.dataset.raceJcd)});
            const tabs=$("#raceTabs");
            if(tabs){summary.appendChild(tabs);tabs.classList.add("be104-tabs")}
          }
          function installOtherBack(){
            for(const [id,label] of [["dataView","データ状況"],["auditView","監査"]]){
              const view=$("#"+id);if(!view)continue;
              let bar=$(".be104-view-back",view);
              if(!bar){bar=document.createElement("div");bar.className="be104-view-back";bar.innerHTML=`<button type="button">← 戻る</button><span>${label}</span>`;view.insertBefore(bar,view.firstChild)}
              $("button",bar).onclick=goBack;
            }
          }
          function captureNavigation(){
            document.addEventListener("click",e=>{const v=e.target.closest?.(".bottomnav [data-view]");if(v&&v.dataset.view!==activeView())pushCtx()},true);
          }
          async function init(){
            try{selectedDate=localStorage.getItem(STORE_DATE)||null;selectedVenue=localStorage.getItem(STORE_VENUE)||null}catch(_){}
            await renderHub();installOtherBack();renderRaceHeader();
          }
          captureNavigation();
          new MutationObserver(()=>{installOtherBack();renderRaceHeader()}).observe(document.documentElement,{subtree:true,childList:true});
          setInterval(()=>renderRaceHeader(),1500);
          init();
          })();
          JS

          cat > assets/boat_edge_v104.css <<'CSS'
          /* BOAT_EDGE_V104_BOATERS_NAV */
          #homeView>.hero,#homeView>.home-command{display:none!important}
          #homeView .venue-toolbar{display:none!important}
          #homeView #venueStats,#homeView #venues,#homeView #venueListTitle,#homeView #updatedHome{display:none!important}
          .be104-hub{padding:10px 12px 2px;background:#f4f6f9}
          .be104-shell{max-width:980px;margin:auto}
          .be104-date-nav{display:grid;grid-template-columns:84px 1fr 84px;gap:8px;align-items:center;margin-bottom:10px}
          .be104-date-nav>button{height:42px;border:1px solid #dde3ea;background:#fff;border-radius:22px;color:#4e6278;font-size:10px;font-weight:900}
          .be104-date-nav>button:disabled{opacity:.35}
          .be104-date-nav>div{text-align:center}.be104-date-nav b{display:block;font-size:15px;color:#142f52}.be104-date-nav span{display:block;margin-top:2px;font-size:8px;color:#7b8998}
          .be104-venue-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-left:1px solid #dfe4ea;border-top:1px solid #dfe4ea;background:#eef1f5}
          .be104-venue{min-height:82px;border:0;border-right:1px solid #dfe4ea;border-bottom:1px solid #dfe4ea;background:#fff;text-align:left;padding:9px;position:relative}
          .be104-venue.on{box-shadow:inset 0 0 0 2px #1b62ad;background:#f7fbff}
          .be104-venue .be104-badge{display:inline-block;background:#8ba9c8;color:#fff;border-radius:4px;padding:3px 5px;font-size:7px;font-weight:900}
          .be104-venue b{display:block;margin-top:5px;color:#172f50;font-size:12px}.be104-venue small{display:block;margin-top:3px;color:#788899;font-size:8px}
          .be104-venue-panel{margin-top:12px;background:#fff;border:1px solid #dfe5ed;border-radius:12px;overflow:hidden}
          .be104-venue-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #edf1f5}
          .be104-venue-head b{display:block;color:#172f50;font-size:18px}.be104-venue-head span{display:block;margin-top:3px;color:#718296;font-size:9px}
          .be104-venue-head button{border:1px solid #dce3ec;background:#f7f9fc;border-radius:9px;padding:7px 9px;color:#48617a;font-size:8px;font-weight:900}
          .be104-race-strip{display:flex;gap:6px;overflow:auto;padding:10px 10px 8px;scrollbar-width:none}.be104-race-strip::-webkit-scrollbar{display:none}
          .be104-race-mini{flex:0 0 66px;border:1px solid #dfe4eb;background:#f4f6f9;border-radius:7px;padding:8px 5px;text-align:center}
          .be104-race-mini b{display:block;font-size:13px;color:#1e2936}.be104-race-mini span{display:block;margin-top:4px;font-size:7px;color:#748394}
          .be104-race-mini.on{background:#22252b;border-color:#22252b}.be104-race-mini.on b,.be104-race-mini.on span{color:#fff}
          .be104-race-list{border-top:1px solid #edf1f5}.be104-race-row{width:100%;display:grid;grid-template-columns:72px 1fr 48px;gap:8px;align-items:center;border:0;border-bottom:1px solid #e4e9ef;background:#fff;padding:11px 12px;text-align:left}
          .be104-rno b{font-size:16px;color:#172f50}.be104-rno small{display:inline-block;margin-left:6px;padding:3px 5px;border-radius:4px;background:#f1f3f6;color:#68798b;font-size:7px}
          .be104-rmeta strong{display:block;font-size:11px;color:#25384d}.be104-rmeta span{display:block;margin-top:3px;font-size:8px;color:#718296}.be104-open{text-align:right;color:#1773d3;font-size:9px;font-weight:900}
          #be104RaceTop{margin-top:8px;border-top:1px solid #edf1f5;padding-top:8px}
          .be104-race-backrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px}
          .be104-race-backrow button{border:0;background:transparent;color:#1769bf;font-size:9px;font-weight:900;padding:5px 0}.be104-race-backrow span{font-size:8px;color:#718296}
          #raceNav,#raceQuickNav{display:none!important}
          #summaryStrip,#raceCommand,#raceMasthead,#urgencyRibbon,#freshnessStrip{display:none!important}
          #raceTabs.be104-tabs{display:flex!important;gap:5px;overflow:auto;margin:7px 0 0;padding:7px 0 0;border-top:1px solid #edf1f5;scrollbar-width:none}
          #raceTabs.be104-tabs::-webkit-scrollbar{display:none}
          #raceTabs.be104-tabs button{flex:0 0 auto;min-width:68px}
          .be104-view-back{display:flex;align-items:center;gap:10px;padding:10px 12px 0}.be104-view-back button{border:1px solid #dce3ec;background:#fff;border-radius:10px;padding:8px 10px;color:#173d6b;font-size:9px;font-weight:900}.be104-view-back span{color:#66798e;font-size:10px;font-weight:900}
          .be104-empty{padding:20px;background:#fff;border-radius:12px;text-align:center;color:#718296;font-size:10px}
          @media(max-width:640px){
            .be104-hub{padding:8px 8px 2px}.be104-date-nav{grid-template-columns:78px 1fr 78px}
            .be104-date-nav b{font-size:14px}.be104-venue-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
            .be104-venue{min-height:76px;padding:7px}.be104-venue b{font-size:11px}
            .be104-race-mini{flex-basis:62px}.be104-race-row{grid-template-columns:66px 1fr 42px;padding:10px 9px}
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script src=["\']\./assets/boat_edge_v104\.js(?:\?v=\d+)?["\']></script>\s*','\n',s)
          s=re.sub(r'\s*<link[^>]+boat_edge_v104\.css(?:\?v=\d+)?[^>]*>\s*','\n',s)
          s=s.replace('</head>','<link rel="stylesheet" href="./assets/boat_edge_v104.css?v=104">\n</head>')
          s=s.replace('</body>','<script src="./assets/boat_edge_v104.js?v=104"></script>\n</body>')
          if re.search(r'<meta name="boat-edge-site-version" content="[^"]+">',s):
              s=re.sub(r'<meta name="boat-edge-site-version" content="[^"]+">','<meta name="boat-edge-site-version" content="V104-BOATERS-NAV">',s)
          else:s=s.replace('</head>','<meta name="boat-edge-site-version" content="V104-BOATERS-NAV">\n</head>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Update TODO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('BOAT_EDGE_CURRENT_TODO.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# BOAT EDGE CURRENT TODO\n'
          s=re.sub(r'Current UI target: V\d+','Current UI target: V104',s)
          lines=[
            '- V104 top page previous/next day navigation.',
            '- V104 saved dates available from 2026-10-05.',
            '- V104 venue grid -> linked 1R-12R list with deadline times.',
            '- V104 race page keeps 1R-12R selector directly above prediction tabs.',
            '- V104 site back navigation restores date / venue / scroll context.',
            '- Historical odds/results are shown only when saved; missing values remain unavailable.'
          ]
          marker='## NEXT'
          for line in lines:
              if line not in s:
                  s=s.replace(marker,line+'\n\n'+marker,1) if marker in s else s+'\n'+line+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check assets/boat_edge_v104.js
          grep -q 'V104-BOATERS-NAV' index.html
          grep -q 'boat_edge_v104.js?v=104' index.html
          test -f data/site_archive/index.json
          python - <<'PY'
          import json
          d=json.load(open('data/site_archive/index.json',encoding='utf-8'))
          assert d['start_date']=='2026-10-05'
          assert d['dates']
          print(d)
          PY

      - name: Save V104
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site_archive assets/boat_edge_v104.js assets/boat_edge_v104.css index.html BOAT_EDGE_CURRENT_TODO.md
          git diff --cached --quiet && exit 0
          git commit -m "Add BOAT EDGE V104 BOATERS-style navigation"
          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
