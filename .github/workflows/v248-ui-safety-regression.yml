name: BOAT EDGE V248 - Safe Odds Paper TopK UI

on:
  pull_request:
    paths:
      - '.github/workflows/auto-update.yml'
      - 'tests/test_boat_edge_v274_urgent_first.py'
      - 'tests/test_boat_edge_v248_ui.cjs'
      - '.github/workflows/v248-ui-safety-regression.yml'
  push:
    branches: [main, feat/v248-a13-a16-odds-paper-pred-ui-20261012]
    paths:
      - 'assets/boat_edge_v166_refresh.js'
      - 'assets/boat_edge_v166_refresh.css'
      - 'assets/boat_edge_v211_paper.js'
      - 'assets/boat_edge_v204_prediction.js'
      - 'assets/boat_edge_v204_prediction.css'
      - 'index.html'
      - 'ai-simulation.html'
      - 'BOAT_EDGE_AUTODEV_TASKS.md'
      - 'tests/test_boat_edge_v248_ui.cjs'
      - 'tests/test_boat_edge_v269_urgent_telemetry.py'
      - 'tests/test_boat_edge_v274_urgent_first.py'
      - '.github/workflows/auto-update.yml'
      - '.github/workflows/v248-ui-safety-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-evidence-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test four source-bound UI changes with existing guards
        shell: bash
        run: |
          set -euo pipefail
          for p in assets/boat_edge_v166_refresh.js assets/boat_edge_v211_paper.js assets/boat_edge_v204_prediction.js; do node --check "$p"; done
          node tests/test_boat_edge_v248_ui.cjs
          node tests/test_boat_edge_v244_site.cjs
          node tests/test_boat_edge_v247_ui.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v245_paper_day.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v246_pages_cache.py' -v
          python3 - <<'PY'
          from pathlib import Path
          import json
          g=json.loads(Path('data/formal_status.json').read_text())['guards']
          assert all(g.get(k) is False for k in ('results_seen','unlock','scoring'))
          assert g.get('RESULT_UNLOCK_TOKEN') is None
          print('V248_FORMAL_FRESH_UNSEEN_LOCK_PASS')
          PY
          git diff --check
          echo V248_UI_SOURCE_GUARDS_PASS
