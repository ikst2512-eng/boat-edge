name: BOAT EDGE 03 - Real Race Browser E2E (Read Only)

on:
  pull_request:
    paths:
      - 'tests/browser/test_boat_edge_03_real_site.py'
      - '.github/workflows/boat-edge-03-real-browser.yml'
      - 'index.html'
      - 'assets/**'
  push:
    branches: [main]
    paths:
      - 'tests/browser/test_boat_edge_03_real_site.py'
      - '.github/workflows/boat-edge-03-real-browser.yml'
      - 'index.html'
      - 'assets/**'
  workflow_dispatch:
  # Integration-owned source signal: trigger existing read-only browser tests
  # only if a V229 commit has truly published a still-live SHA-audited FINAL.
  workflow_run:
    workflows:
      - 'BOAT EDGE V229 - Atomic Site Freeze and Pre-result Audit'
    types: [completed]
  # PRE_RESULT live TopK is not testable at the overnight UI push: revisit
  # public Pages while actual racing is underway (UTC -> JST +9).
  # This replaces, rather than adds to, the daily browser checks. GitHub cron
  # is best-effort: NOT a guarantee that the race will have verified TopK.
  # 23:29 UTC = next-day 08:29 JST (first 08:35 race, near freeze window),
  # 05:43 UTC = 14:43 JST; 09:13 UTC = 18:13 JST.
  # Schedule is owned by 03; 01 collection/freeze workflows remain untouched.
  schedule:
    - cron: '29 23 * * *'
    - cron: '43 5 * * *'
    - cron: '13 9 * * *'

permissions:
  contents: read

concurrency:
  group: boat-edge-03-real-browser-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap evidence and Git first-add check; zero-shot runs do not download
  # browsers or report a false LIVE TopK PASS.
  v229-source-first-add:
    runs-on: ubuntu-latest
    outputs:
      live_candidate: ${{ steps.probe.outputs.live_candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require actual source-SHA and first Git commit before the deadline
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != 'workflow_run' ]]; then
            echo 'live_candidate=true' >> "$GITHUB_OUTPUT"
            echo V01_NORMAL_BROWSER_CHECK_UNCHANGED
            exit 0
          fi
          if [[ "${{ github.event.workflow_run.conclusion }}" != 'success' ||
                "${{ github.event.workflow_run.head_branch }}" != 'main' ||
                "${{ github.event.workflow_run.head_repository.full_name }}" != "${{ github.repository }}" ]]; then
            echo 'live_candidate=false' >> "$GITHUB_OUTPUT"
            echo V01_UNTRUSTED_OR_FAILED_TRIGGER_NOT_CERTIFIED
            exit 0
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v01_live_browser_gate.py

  selected-race-to-prediction:
    needs: v229-source-first-add
    if: needs.v229-source-first-add.outputs.live_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install real Chromium and WebKit browsers
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.58.0"
          python -m playwright install --with-deps chromium webkit

      - name: Verify result-unseen formal gate (do not access outcomes)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/formal_status.json').read_text(encoding='utf-8'))
          g=x.get('guards') or {}
          assert all(g.get(k) is False for k in ('results_seen','unlock','scoring'))
          assert g.get('RESULT_UNLOCK_TOKEN') is None
          assert x.get('formalFirst100',{}).get('races') == 0
          print('BOAT_EDGE_03_FORMAL_FRESH_UNTOUCHED_PASS')
          PY

      - name: Real checkout - Chromium venue to race to prediction
        run: python tests/browser/test_boat_edge_03_real_site.py --engine chromium

      - name: Real checkout - WebKit iPhone-sized venue to prediction
        run: python tests/browser/test_boat_edge_03_real_site.py --engine webkit

      - name: Published Pages - Chromium live navigation
        run: |
          python tests/browser/test_boat_edge_03_real_site.py \
            --engine chromium \
            --site-url https://ikst2512-eng.github.io/boat-edge/index.html

      - name: Published Pages - WebKit iPhone-sized live navigation
        run: |
          python tests/browser/test_boat_edge_03_real_site.py \
            --engine webkit \
            --site-url https://ikst2512-eng.github.io/boat-edge/index.html

      - name: Upload actual screenshots (including failures)
        # No recurring artifact-storage buildup from twice-daily read-only probes.
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: boat-edge-03-real-browser-screenshots
          path: artifacts/boat-edge-03-browser/*.png
          if-no-files-found: warn
          retention-days: 7
