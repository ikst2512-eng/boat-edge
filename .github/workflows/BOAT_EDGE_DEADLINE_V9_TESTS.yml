name: Research Deadline V9 Tests
on:
  pull_request:
    paths:
      - 'scripts/deadline_v9/**'
      - 'tests/test_deadline_v9_capture.py'
      - '.github/workflows/BOAT_EDGE_DEADLINE_V9_TESTS.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V11 offline artifact integrity tests
        run: python -m unittest discover -s tests -p test_deadline_v11_verify.py -v
      - name: Run offline tests (no network calls)
        run: python -m unittest discover -s tests -p test_deadline_v9_capture.py -v
