name: BOAT EDGE V251 - Selected Race Result Link and Provenance Regression

on:
  push:
    branches: [main]
    paths:
      - index.html
      - results-detail.html
      - assets/boat_edge_v251_race_result.js
      - assets/boat_edge_v251_race_result.css
      - .github/workflows/v251-race-result-regression.yml
  workflow_dispatch:
  workflow_run:
    workflows: ['BOAT EDGE V241 - Readable Verified Results and Mobile Home']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: boat-edge-v251-source-safe-race-result-regression
  cancel-in-progress: true

jobs:
  verified-race-result:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current site content and independent stored evidence
        uses: actions/checkout@v4
      - name: Javascript syntax and selected race verification contract
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/boat_edge_v251_race_result.js
          node - <<'JS_V251'
          'use strict';
          const assert=require('node:assert/strict'), fs=require('node:fs');
          const v=require('./assets/boat_edge_v251_race_result.js');
          const report=JSON.parse(fs.readFileSync('data/site_autopilot/v241_results_current.json','utf8'));
          assert.equal(v.verifiedReport(report),true,'V251_SITE_REPORT_SCHEMA');
          assert.equal(report.rows.length,report.settled_verified_races);
          assert(report.rows.every(v.verifiedRow),'V251_ALL_SOURCE_VERIFIED_ROWS');
          const row=report.rows[0];
          assert.equal(v.resultFor(report,row.race_key).race_key,row.race_key);
          assert.equal(v.resultFor(report,'20261012-01-12'),report.rows.find(r=>r.race_key==='20261012-01-12')||null);
          assert.equal(v.resultFor(report,'20261012-01-99'),null);
          assert.equal(v.validKey('../../data/formal_status.json'),false);
          assert.equal(v.validCombo('1-2-2'),false);
          assert.equal(v.validCombo('1-3-2'),true);
          const edited=structuredClone(row);edited.post_result_verified=false;
          assert.equal(v.verifiedRow(edited),false);
          const altered=structuredClone(row);altered.mode_outcomes.hit.hypothetical_profit_yen=999999;
          assert.equal(v.verifiedRow(altered),false);
          const damaged=structuredClone(report);damaged.formal_result_access=true;
          assert.equal(v.verifiedReport(damaged),false);
          const invalid=structuredClone(report);invalid.production_model_changed=true;
          assert.equal(v.verifiedReport(invalid),false);
          const js=fs.readFileSync('assets/boat_edge_v251_race_result.js','utf8');
          const css=fs.readFileSync('assets/boat_edge_v251_race_result.css','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const page=fs.readFileSync('results-detail.html','utf8');
          assert(index.includes('boat_edge_v249_focus.js'));
          assert(index.includes('boat_edge_v251_race_result.js'));
          assert(index.includes('boat_edge_v251_race_result.css'));
          assert(index.includes('results-detail.html'));
          assert.equal((index.match(/boat_edge_v251_race_result.js/g)||[]).length,1);
          assert.equal((index.match(/boat_edge_v251_race_result.css/g)||[]).length,1);
          // Preserve the deep-link contract even when URLSearchParams is
          // stored in a local variable before reading its race/mode keys.
          assert(page.includes("new URLSearchParams(window.location.search)")&&
                 page.includes("query.get('race')")&&page.includes("query.get('mode')"));
          assert(page.includes('(!focusRace||r.race_key===focusRace)'));
          assert(page.includes('id="clearFocus"')&&page.includes("showTickets(focusRace,selected)"));
          assert(page.includes("crypto.subtle.digest('SHA-256',bytes)"));
          assert(js.includes("data.rows.every(verifiedRow)")&&!js.includes("official_payout?"));
          assert(css.includes('data-n="1"')&&css.includes('data-n="6"'));
          const inline=[...page.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          assert.equal(inline.length,1);
          new Function(inline[0][1]);
          const allModes=['hit','balance','hole','narrow'];
          const labels=['的中重視','バランス','波乱展開','激絞り'];
          for(const m of allModes){
            assert.equal(v.modeAllowed(m),true,'V255_MODE_NOT_ALLOWED_'+m);
            assert.equal(typeof v.MODES[m],'string');
            assert(report.rows.every(r=>r.mode_outcomes[m].stake_yen===10000));
            assert(report.rows.every(r=>r.mode_outcomes[m].hypothetical_profit_yen===r.mode_outcomes[m].hypothetical_return_yen-10000));
          }
          assert.equal(v.modeAllowed('unknown'),false);
          assert.equal(v.modeAllowed('__proto__'),false);
          assert.equal(v.syncedMode('balance','hit','narrow'),'balance');
          assert.equal(v.syncedMode('balance','balance','narrow'),'narrow');
          assert.equal(v.syncedMode('__proto__','hit','hit'),'hit');
          assert.equal(v.syncedMode(null,'hit','hole'),'hole');
          assert(js.includes("activePredictionMode=find('#be207Top .be207-modes button.on')"));
          assert(js.includes("selectedResultMode=syncedMode(activePredictionMode,lastPredictionMode,selectedResultMode)"));
          assert(labels.every(x=>Object.values(v.MODES).includes(x)));
          assert(js.includes('selectedResultMode')&&js.includes('button.dataset.resultMode=keyMode'));
          assert(js.includes("aria-pressed',String(selectedResultMode===keyMode)"));
          assert(js.includes("'&mode='+encodeURIComponent(selectedResultMode)"));
          assert(page.includes("query.get('mode')"));
          assert(page.includes("Object.prototype.hasOwnProperty.call(modes,requestedMode)"));
          assert(index.includes('./assets/boat_edge_v251_race_result.js?v=257'));
          assert(index.includes('./assets/boat_edge_v251_race_result.css?v=255'));
          console.log('V255_ALL_FOUR_VERIFIED_MODES_AND_DEEPLINK_PASS',report.rows.length);
          console.log('V251_RESULT_DEEPLINK_AND_DATA_GUARDS_PASS',report.rows.length);
          JS_V251
      - name: Verify all frozen ticket source hashes and nominal 10000-yen allocations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V251'
          import json,hashlib,re
          from pathlib import Path
          report=json.loads(Path('data/site_autopilot/v241_results_current.json').read_text(encoding='utf8'))
          assert report.get('scope')=='VERIFIED_POST_RESULT_SITE_RESEARCH_ONLY_NOT_FORMAL_FRESH'
          assert report.get('formal_result_access') is False
          assert report.get('production_model_changed') is False
          formal=json.loads(Path('data/formal_status.json').read_text(encoding='utf8'))
          guards=formal.get('guards') or {}
          assert all(guards.get(k) is False for k in ('results_seen','unlock','scoring'))
          assert guards.get('RESULT_UNLOCK_TOKEN') is None
          assert (formal.get('formalFirst100') or {}).get('races')==0
          for r in report['rows']:
              key=r['race_key']
              assert re.fullmatch(r'20\d{6}-\d{2}-\d{2}',key)
              p=Path('data/site_autopilot/v232_cohort')/(key+'.json')
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==r['precommitted_sha256']
              saved=json.loads(raw)
              assert saved['scope']=='SITE_REFERENCE_UNSEEN_PRE_RESULT_ONLY_NOT_FORMAL_FRESH'
              assert saved['race_key']==key and saved['model_id']==r['model_id']
              assert saved['formal_results_seen'] is False and saved['formal_gate_unlocked'] is False
              assert saved['deadline_jst']==r['deadline_jst']
              assert r['top10_hit']==(r['winning_combo'] in saved['top10'])
              assert r['head_hit']==(str(saved['head_top1'])==r['winning_combo'][0])
              for mode in ('hit','balance','hole','narrow'):
                  bets=saved['frozen_mode_tickets'][mode]
                  got=r['mode_outcomes'][mode]
                  assert len(bets)==got['tickets']
                  assert sum(t['stake_yen'] for t in bets)==10000
                  stake=sum(t['stake_yen'] for t in bets if t['combo']==r['winning_combo'])
                  assert stake==got['winning_ticket_stake_yen']
                  assert stake*r['official_payout_per_100_yen']//100==got['hypothetical_return_yen']
                  assert got['hypothetical_profit_yen']==got['hypothetical_return_yen']-10000
          print('V251_10000JPY_FROZEN_TICKET_PAYOUT_PARITY_PASS',len(report['rows']))
          PY_V251
