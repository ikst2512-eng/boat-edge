            const lane=Number(boat.dataset.be108Lane),pred=predOf();if(!lane||!pred)return;
            const rows=allTickets(pred).filter(x=>String(x.combo).startsWith(lane+"-")).slice(0,5);
            let box=$(".be108-headpick",boat);
