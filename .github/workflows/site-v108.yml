          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove legacy extension runtimes. Keep the base v48 runtime only.
          old_versions=['v86_interaction','v88','v90','v96','v97','v100','v101','v105','v107','v108']
          for name in old_versions:
              s=re.sub(rf'\s*<script src=["\']\./assets/boat_edge_{name}\.js(?:\?v=\d+)?["\']></script>\s*','\n',s)

          # Remove legacy extension styles.
          for v in ['90','96','97','100','101','105','107','108']:
              s=re.sub(rf'\s*<link[^>]+boat_edge_v{v}\.css(?:\?v=\d+)?[^>]*>\s*','\n',s)

          # Stop hidden/obsolete redraw loops in the base page.
          s=s.replace(
              'setInterval(()=>{ if(state.today){ renderSpotlightRaces(); renderDeadlineBoard(); updateNextRaceBar(); } }, 30000);',
              '/* V108: hidden legacy-home 30s redraw disabled */'
          )
          s=s.replace(
              'setInterval(()=>{ if(state.race){ const pred=getPrediction(state.race); renderUrgency(state.race,pred); if(document.getElementById("tab-direct")?.classList.contains("active")) renderDirectMode(state.race,pred); } },1000);',
              '/* V108: hidden direct-mode 1s redraw disabled */'
          )
          s=s.replace('},60000);','},120000);',1)

          s=s.replace('</head>','<link rel="stylesheet" href="./assets/boat_edge_v108.css?v=108">\n</head>')
          s=s.replace('</body>','<script src="./assets/boat_edge_v108.js?v=108"></script>\n</body>')

          if re.search(r'<meta name="boat-edge-site-version" content="[^"]+">',s):
              s=re.sub(r'<meta name="boat-edge-site-version" content="[^"]+">','<meta name="boat-edge-site-version" content="V108-PERFORMANCE-CONSOLIDATED">',s)
          else:
              s=s.replace('</head>','<meta name="boat-edge-site-version" content="V108-PERFORMANCE-CONSOLIDATED">\n</head>')

          p.write_text(s,encoding='utf-8')
          PY

