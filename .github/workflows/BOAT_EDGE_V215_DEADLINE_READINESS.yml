name: BOAT EDGE V215 - Next Deadline Readiness & Prospective Shadow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V215_DEADLINE_READINESS.yml'
  workflow_dispatch:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v215-prospective-only
  cancel-in-progress: false
jobs:
  deadline-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install next-deadline readiness and diagnostics UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 - <<'PYV215_INSTALL'
          from pathlib import Path
          import gzip, base64,hashlib,json
          BLOBS=json.loads("{\"assets/boat_edge_v215_readiness.css\": {\"b64\": \"\", \"sha256\": \"44c75700bcc69d9851402d51be4eb03ecbad0d2cc853893fb10c0954c855171d\"}, \"assets/boat_edge_v215_readiness.js\": {\"b64\": \"\", \"sha256\": \"8c7942f83e9472453d6844feae2740bcb3675bfe1d0eeb4f796923171ad49b8f\"}, \"scripts/boat_edge_v215_readiness.py\": {\"b64\": \"\", \"sha256\": \"da9ef24ff38aa82db7b10e77407d8223acf619ffedab8141687666b776b2d2cd\"}}")
          for relative,item in BLOBS.items():
              data=gzip.decompress(base64.b64decode(item['b64']))
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise SystemExit('V215_EMBEDDED_SHA_BAD '+relative)
              file=Path(relative)
              if file.exists():
                  if file.read_bytes()!=data:raise SystemExit('V215_EXISTING_CODE_CONFLICT '+relative)
              else:
                  file.parent.mkdir(parents=True,exist_ok=True)
                  file.write_bytes(data)
                  print('V215_ADDED '+relative)
          page=Path('ai-simulation.html')
          if not page.exists():raise SystemExit('V215_SITE_MISSING')
          s=page.read_text(encoding='utf-8')
          if 'boat_edge_v214_health.js?v=214' not in s or 'boat_edge_v213_shadow.js?v=213' not in s:
              raise SystemExit('V215_REQUIRES_V214')
          links=['<link rel="stylesheet" href="./assets/boat_edge_v215_readiness.css?v=215">','<script defer src="./assets/boat_edge_v215_readiness.js?v=215"></script>']
          for link in links:
              if link not in s:
                  if s.count('</head>')!=1:raise SystemExit('V215_INVALID_HEAD')
                  s=s.replace('</head>',link+'\n</head>')
          if any(s.count(link)!=1 for link in links):raise SystemExit('V215_DUPLICATE_LINK')
          if s!=page.read_text(encoding='utf-8'):page.write_text(s,encoding='utf-8')
          print('V215_PROSPECTIVE_READINESS_INSTALLED_NO_MODEL_CHANGE')
          PYV215_INSTALL
           python3 -m py_compile scripts/boat_edge_v215_readiness.py
           node --check assets/boat_edge_v215_readiness.js
           git add -- ai-simulation.html scripts/boat_edge_v215_readiness.py assets/boat_edge_v215_readiness.js assets/boat_edge_v215_readiness.css
           if git diff --cached --quiet; then echo 'V215_ALREADY_INSTALLED'; break; fi
           git commit -m 'V215 next-deadline readiness and persistent pre-result source audit'
           if git push origin HEAD:main; then echo 'V215_INSTALL_SUCCESS'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Audit upcoming races and preserve each day source gaps (NO results)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v215_readiness.py
           git add -- data/site_paper_sim/readiness_v215_current.json data/site_paper_sim/readiness_history_v215/
           if git diff --cached --quiet; then echo 'V215_NO_CHANGE_READINESS'; break; fi
           git commit -m 'V215 Audit upcoming races and preserve each day source gaps (NO results)'
           if git push origin HEAD:main; then echo 'V215_COMMITTED_READINESS'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Freeze eligible V214 odds-proof shadow BEFORE results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v214_shadow.py freeze
           git add -- data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
           if git diff --cached --quiet; then echo 'V215_NO_CHANGE_SHADOW_FREEZE'; break; fi
           git commit -m 'V215 Freeze eligible V214 odds-proof shadow BEFORE results'
           if git push origin HEAD:main; then echo 'V215_COMMITTED_SHADOW_FREEZE'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Continue approved-only 50000 JPY paper decisions BEFORE results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v211_paper_sim.py select
           git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
           if git diff --cached --quiet; then echo 'V215_NO_CHANGE_PAPER_SELECT'; break; fi
           git commit -m 'V215 Continue approved-only 50000 JPY paper decisions BEFORE results'
           if git push origin HEAD:main; then echo 'V215_COMMITTED_PAPER_SELECT'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Grade only existing frozen shadow rows AFTER earlier commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v214_shadow.py settle
           git add -- data/site_paper_sim/shadow_v213_current.json data/site_paper_sim/shadow_v213_ledger.json
           if git diff --cached --quiet; then echo 'V215_NO_CHANGE_SHADOW_GRADE'; break; fi
           git commit -m 'V215 Grade only existing frozen shadow rows AFTER earlier commit'
           if git push origin HEAD:main; then echo 'V215_COMMITTED_SHADOW_GRADE'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Settle only previously saved paper purchase ledger rows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
           git fetch --no-tags origin main
           git reset --hard origin/main
           python3 scripts/boat_edge_v211_paper_sim.py settle
           git add -- data/site_paper_sim/current.json data/site_paper_sim/ledger.json
           if git diff --cached --quiet; then echo 'V215_NO_CHANGE_PAPER_SETTLE'; break; fi
           git commit -m 'V215 Settle only previously saved paper purchase ledger rows'
           if git push origin HEAD:main; then echo 'V215_COMMITTED_PAPER_SETTLE'; break; fi
           if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
      - name: Stop replaced V214 schedule only after successful V215 audit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/BOAT_EDGE_V214_ODDS_ARCHIVE_SHADOW.yml/disable"; then
            echo 'V215_PREVIOUS_SCHEDULER_DISABLED'
          else
            echo 'V215_OLD_SCHEDULER_NEEDS_MANUAL_STOP'
          fi
