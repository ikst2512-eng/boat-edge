# V221 conservative legacy workflow dedup: exact SHAs, healthy alternatives, fail-closed.
name: BOAT EDGE V221 - Safe Verified Legacy Workflow Dedup
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/BOAT_EDGE_V221_GUARDED_DEDUP.yml
  workflow_dispatch: null
  schedule:
  - cron: 29 20 * * *
permissions:
  contents: write
  actions: write
concurrency:
  group: boat-edge-v221-guarded-cleanup
  cancel-in-progress: false
jobs:
  guarded-dedup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - name: Checkout current provenance and content
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Restore exactly pinned and fail-closed audit script
      shell: bash
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        for attempt in 1 2 3 4 5 6; do
          git fetch --no-tags origin main
          git reset --hard origin/main
          python3 - <<'PYV221_RESTORE'
        import base64, gzip, hashlib
        from pathlib import Path
        blob=gzip.decompress(base64.b64decode(""))
        if hashlib.sha256(blob).hexdigest()!="d30e6c08f04f5b2c45961965c18ed4abbb52f21891c284a464a24e38d6539b04":
            raise SystemExit('V221_PINNED_SOURCE_SHA_MISMATCH')
        p=Path('scripts/boat_edge_v221_workflow_dedup.py')
        p.parent.mkdir(parents=True,exist_ok=True)
        if p.exists() and p.read_bytes()!=blob:
            raise SystemExit('V221_EXISTING_SCRIPT_CONFLICT_FAIL_CLOSED')
        if not p.exists():p.write_bytes(blob)
        print('V221_SCRIPT_RESTORED_AND_HASH_VERIFIED')
        PYV221_RESTORE
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/boat_edge_v221_workflow_dedup.py
          git add -- scripts/boat_edge_v221_workflow_dedup.py
          if git diff --cached --quiet; then echo V221_SCRIPT_ALREADY_PRESENT; exit 0; fi
          git commit -m 'V221 install guarded non-disruptive workflow dedup audit'
          if git push origin HEAD:main; then echo V221_SCRIPT_INSTALL_SUCCESS; exit 0; fi
          if [ "$attempt" -eq 6 ]; then echo V221_INSTALL_RETRIES_EXHAUSTED; exit 1; fi
        done
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Audit and disable only proven duplicate workflows
      shell: bash
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        for attempt in 1 2 3 4 5 6; do
          git fetch --no-tags origin main
          git reset --hard origin/main
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v221_workflow_dedup.py
          git add -- data/site_ops_v221/workflow_dedup_current.json
          if git diff --cached --quiet; then echo V221_AUDIT_SAME_STATE_NO_COMMIT; exit 0; fi
          git commit -m 'V221 persist verified legacy-workflow cleanup state'
          if git push origin HEAD:main; then echo V221_AUDIT_COMMIT_SUCCESS; exit 0; fi
          if [ "$attempt" -eq 6 ]; then echo V221_AUDIT_PUSH_RETRIES_EXHAUSTED; exit 1; fi
        done
      env:
        GH_TOKEN: ${{ github.token }}
