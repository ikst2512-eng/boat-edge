name: BOAT EDGE V86 Interaction Guard

on:
  push:
    paths:
      - ".github/workflows/site-interaction-v86.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated interaction guard
        shell: bash
        env:
          V86_JS: ""
        run: |
          python - <<'PY'
          import os,base64,re
          from pathlib import Path
          js=Path("assets/boat_edge_v86_interaction.js")
          js.write_text(base64.b64decode(os.environ["V86_JS"]).decode("utf-8")+"\n",encoding="utf-8")
          p=Path("index.html")
          h=p.read_text(encoding="utf-8")
          h=re.sub(r'\s*<script\s+src=["\']\./assets/boat_edge_v86_interaction\.js(?:\?v=\d+)?["\']\s*></script>\s*','\n',h)
          tag='<script src="./assets/boat_edge_v86_interaction.js?v=86"></script>'
          h=h.replace('</body>',tag+'\n</body>')
          h=re.sub(r'<meta name="boat-edge-site-version" content="[^"]+">','<meta name="boat-edge-site-version" content="V86-INTERACTION-GUARD">',h)
          p.write_text(h,encoding="utf-8")
          PY
      - name: Validate
        shell: bash
        run: |
          node --check assets/boat_edge_v86_interaction.js
          grep -q 'BOAT_EDGE_V86_INTERACTION_GUARD' assets/boat_edge_v86_interaction.js
          grep -q 'boat_edge_v86_interaction.js?v=86' index.html
          if grep -Eq '<script[[:space:]]+src=["'\'']\./assets/boat_edge_simple_v51\.js' index.html; then exit 1; fi
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/boat_edge_v86_interaction.js
          git diff --cached --quiet && exit 0
          git commit -m "Add BOAT EDGE V86 interaction guard"
          git push
