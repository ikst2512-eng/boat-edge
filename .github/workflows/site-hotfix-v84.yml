name: BOAT EDGE V84 Interaction Hotfix

on:
  push:
    paths:
      - ".github/workflows/site-hotfix-v84.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Stop recursive redraw
        shell: bash
        env:
          V84_JS: ""
        run: |
          python - <<'PY'
          import os, base64, re
          from pathlib import Path

          p = Path("assets/boat_edge_simple_v51.js")
          s = p.read_text(encoding="utf-8")

          bad81 = 'new MutationObserver(()=>requestAnimationFrame(polish)).observe(document.body,{childList:true,subtree:true});'
          bad82 = 'new MutationObserver(()=>requestAnimationFrame(render)).observe(document.body,{childList:true,subtree:true});'

          s = s.replace(bad81, '/* V84: V81 recursive observer disabled */')
          s = s.replace(bad82, '/* V84: V82 recursive observer disabled */')

          marker = "BOAT_EDGE_SITE_V84_INTERACTION_HOTFIX"
          if marker not in s:
              s += "\n\n" + base64.b64decode(os.environ["V84_JS"]).decode("utf-8") + "\n"

          p.write_text(s, encoding="utf-8")

          ip = Path("index.html")
          h = ip.read_text(encoding="utf-8")
          h = re.sub(r'boat_edge_simple_v51\.js(?:\?v=\d+)?', 'boat_edge_simple_v51.js?v=84', h)
          h = re.sub(r'boat_edge_simple_v51\.css(?:\?v=\d+)?', 'boat_edge_simple_v51.css?v=84', h)
          ip.write_text(h, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          node --check assets/boat_edge_simple_v51.js
          grep -q "BOAT_EDGE_SITE_V84_INTERACTION_HOTFIX" assets/boat_edge_simple_v51.js
          grep -q "V84: V81 recursive observer disabled" assets/boat_edge_simple_v51.js
          grep -q "V84: V82 recursive observer disabled" assets/boat_edge_simple_v51.js
          grep -q "boat_edge_simple_v51.js?v=84" index.html

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boat_edge_simple_v51.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hotfix BOAT EDGE V84 interaction freeze"
          git push
