name: BOAT EDGE 改善ゲート

on:
  workflow_dispatch:
  # Read-only diagnosis stays manually runnable and on targeted code changes.
  push:
    branches: [main]
    paths:
      - scripts/boat_edge_improvement_gate.py
      - tests/test_boat_edge_improvement_gate.py

permissions:
  contents: read

concurrency:
  group: boat-edge-improvement-gate
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate regression tests
        run: python -m unittest discover -s tests -p 'test_boat_edge_improvement_gate.py' -v
      - name: Diagnose bottlenecks and protect formal lock
        run: python scripts/boat_edge_improvement_gate.py --out improvement-report.json
      - name: Save diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-edge-improvement-gate
          path: improvement-report.json
          if-no-files-found: ignore
          retention-days: 7
