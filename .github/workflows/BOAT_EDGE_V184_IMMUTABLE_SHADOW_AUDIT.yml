name: BOAT EDGE V184 - Immutable Shadow Commit Binding and Reproducibility

on:
  push:
    branches: [main]
    paths: ['.github/workflows/BOAT_EDGE_V184_IMMUTABLE_SHADOW_AUDIT.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-edge-v184-shadow-integrity
  cancel-in-progress: false

jobs:
  enforce-original-commit-and-source:
