name: BOAT EDGE V111 Stable Lightweight Runtime

on:
  push:
    paths:
      - ".github/workflows/site-v111.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-edge-v111-stable-runtime
  cancel-in-progress: false

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable legacy UI workflows safely
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # V103, V104, V106, V107, V108, V110
          ids="377564111 377581231 377589946 377595114 377603522 377620742"
          failed=""

          for id in $ids; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}" --jq '.state' 2>/dev/null || echo unknown)"
            echo "workflow $id initial_state=$state"

            if [ "$state" = "active" ]; then
              echo "Disabling workflow $id"
              if ! gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" >/dev/null 2>&1; then
                echo "disable request failed for $id"
              fi
            else
              echo "workflow $id already inactive or unavailable; skip disable request"
            fi

            final_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}" --jq '.state' 2>/dev/null || echo unknown)"
            echo "workflow $id final_state=$final_state"

            if [ "$final_state" = "active" ]; then
              failed="$failed $id"
            fi

            for status in in_progress queued waiting requested pending; do
              run_ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/runs?status=${status}&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)"
              for run_id in $run_ids; do
                echo "Cancel legacy run $run_id"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
              done
            done
          done

          # Best effort V98 disable. It is not a 5-minute writer, so failure here is non-fatal.
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/BOAT_EDGE_site-v98.yml/disable" >/dev/null 2>&1 || true

          if [ -n "$failed" ]; then
            echo "ERROR: workflows still active:$failed"
            exit 1
          fi

      - name: Rebuild historical archive from saved data
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone,timedelta

          START='20261005'
          JST=timezone(timedelta(hours=9))
          races=Path('data/races')
          results=Path('data/site_results')
          odds=Path('data/site_odds')
          out=Path('data/site_archive')
          out.mkdir(parents=True,exist_ok=True)

          days={}

          for p in sorted(races.glob('*.json')):
              m=re.fullmatch(r'(\d{8})-(\d{2})-(\d{2})\.json',p.name)
              if not m:
                  continue
              ymd,jcd,rno=m.groups()
              if ymd<START:
                  continue

              try:
                  doc=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue

              meta=doc.get('meta') or {}
              key=doc.get('race_key') or p.stem
              day=days.setdefault(ymd,{})
              venue=day.setdefault(jcd,{
                  'jcd':jcd,
                  'venue':meta.get('venue') or jcd,
                  'event':meta.get('event') or '',
                  'races':[]
              })

              res=None
              rp=results/f'{key}.json'
              if rp.exists():
                  try:
                      res=json.loads(rp.read_text(encoding='utf-8'))
                  except Exception:
                      res=None

              venue['races'].append({
                  'race_key':key,
                  'race_no':int(meta.get('race_no') or rno),
                  'deadline':meta.get('deadline'),
                  'file':f'data/races/{key}.json',
                  'jcd':jcd,
                  'result_status':res.get('status') if res else None,
                  'trifecta':res.get('trifecta') if res else None,
                  'payout':res.get('trifecta_payout_yen_per_100') if res else None,
                  'has_odds':(odds/f'{key}.json').exists()
              })

          dates=[]
          changed=False

          for ymd,venue_map in sorted(days.items()):
              venues=[]
              race_count=0

              for jcd,venue in sorted(venue_map.items()):
                  venue['races'].sort(key=lambda x:x['race_no'])
                  race_count+=len(venue['races'])
                  venues.append(venue)

              payload={
                  'schema_version':'boat-edge-site-archive-v111',
                  'ymd':ymd,
                  'venue_count':len(venues),
                  'race_count':race_count,
                  'venues':venues
              }

              fp=out/f'{ymd}.json'
              new=json.dumps(payload,ensure_ascii=False,indent=2)
              old=fp.read_text(encoding='utf-8') if fp.exists() else None

              if old!=new:
                  fp.write_text(new,encoding='utf-8')
                  changed=True

              dates.append({
                  'ymd':ymd,
                  'venues':len(venues),
                  'races':race_count
              })

          idx_path=out/'index.json'
          old_idx={}
          if idx_path.exists():
              try:
                  old_idx=json.loads(idx_path.read_text(encoding='utf-8'))
              except Exception:
                  old_idx={}

          comparable={
              'start_date':'2026-10-05',
              'dates':dates,
              'retention':'saved source data; no deletion',
              'note':'missing historical odds/results are shown as unavailable'
          }
          old_comparable={k:old_idx.get(k) for k in comparable}

          if old_comparable!=comparable:
              changed=True

          idx={
              'schema_version':'boat-edge-site-archive-index-v111',
              **comparable,
              'updated_at':datetime.now(JST).isoformat(timespec='seconds')
                  if changed else old_idx.get('updated_at',datetime.now(JST).isoformat(timespec='seconds'))
          }

          new_idx=json.dumps(idx,ensure_ascii=False,indent=2)
          if not idx_path.exists() or idx_path.read_text(encoding='utf-8')!=new_idx:
              idx_path.write_text(new_idx,encoding='utf-8')

          print(json.dumps({
              'changed':changed,
              'dates':dates
          },ensure_ascii=False))
          PY

      - name: Reassert V48 plus V108 only
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          legacy_js=[
              'v86_interaction','v88','v90','v96','v97',
              'v100','v101','v103','v104','v105','v107','v108'
          ]

          for name in legacy_js:
              s=re.sub(
                  rf'\s*<script src=["\']\./assets/boat_edge_{name}\.js(?:\?v=\d+)?["\']></script>\s*',
                  '\n',
                  s
              )

          for v in ['90','96','97','100','101','103','104','105','107','108']:
              s=re.sub(
                  rf'\s*<link[^>]+boat_edge_v{v}\.css(?:\?v=\d+)?[^>]*>\s*',
                  '\n',
                  s
              )

          # Re-add consolidated V108 exactly once.
          s=s.replace(
              '</head>',
              '<link rel="stylesheet" href="./assets/boat_edge_v108.css?v=108">\n</head>'
          )
          s=s.replace(
              '</body>',
              '<script src="./assets/boat_edge_v108.js?v=108"></script>\n</body>'
          )

          # Remove obsolete high-frequency loops if any older writer restored them.
          s=s.replace(
              'setInterval(()=>{ if(state.today){ renderSpotlightRaces(); renderDeadlineBoard(); updateNextRaceBar(); } }, 30000);',
              '/* V111: hidden legacy-home redraw disabled */'
          )
          s=s.replace(
              'setInterval(()=>{ if(state.race){ const pred=getPrediction(state.race); renderUrgency(state.race,pred); if(document.getElementById("tab-direct")?.classList.contains("active")) renderDirectMode(state.race,pred); } },1000);',
              '/* V111: hidden legacy-direct redraw disabled */'
          )

          if re.search(r'<meta name="boat-edge-site-version" content="[^"]+">',s):
              s=re.sub(
                  r'<meta name="boat-edge-site-version" content="[^"]+">',
                  '<meta name="boat-edge-site-version" content="V111-STABLE-LIGHTWEIGHT">',
                  s
              )
          else:
              s=s.replace(
                  '</head>',
                  '<meta name="boat-edge-site-version" content="V111-STABLE-LIGHTWEIGHT">\n</head>'
              )

          p.write_text(s,encoding='utf-8')
          PY

      - name: Update TODO
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('BOAT_EDGE_CURRENT_TODO.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# BOAT EDGE CURRENT TODO\n'
          s=re.sub(r'Current UI target: V\d+','Current UI target: V111',s)

          lines=[
              '- V109 repaired all 144/144 missing 2026-10-07 trifecta payouts with zero errors.',
              '- V110 failure cause: GitHub returns 403 when disabling an already-disabled workflow.',
              '- V111 checks workflow state first and disables only active legacy UI workflows.',
              '- V111 disables V103/V104/V106/V107/V108/V110 and cancels their queued/in-progress runs.',
              '- V111 reasserts exactly V48 + V108 runtime for lightweight production UI.',
              '- V111 owns archive refresh; V109 owns result/payout collection.'
          ]

          marker='## NEXT'
          for line in lines:
              if line in s:
                  continue
              s=s.replace(marker,line+'\n\n'+marker,1) if marker in s else s+'\n'+line+'\n'

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate stable lightweight state
        shell: bash
        run: |
          set -e
          node --check assets/boat_edge_v108.js

          grep -q 'V111-STABLE-LIGHTWEIGHT' index.html
          grep -q 'boat_edge_final_v48.js' index.html
          grep -q 'boat_edge_v108.js?v=108' index.html

          ! grep -q 'boat_edge_v105.js' index.html
          ! grep -q 'boat_edge_v107.js' index.html
          ! grep -q 'boat_edge_v100.js' index.html
          ! grep -q 'boat_edge_v101.js' index.html
          ! grep -q 'boat_edge_v90.js' index.html

          python - <<'PY'
          import re,json
          from pathlib import Path

          s=Path('index.html').read_text(encoding='utf-8')
          boat=[
              x for x in re.findall(r'<script src="([^"]+)"',s)
              if 'boat_edge' in x
          ]

          assert boat==[
              './assets/boat_edge_final_v48.js',
              './assets/boat_edge_v108.js?v=108'
          ], boat

          archive=json.loads(
              Path('data/site_archive/index.json').read_text(encoding='utf-8')
          )
          assert archive['start_date']=='2026-10-05'
          assert archive['dates']

          result_index=json.loads(
              Path('data/site_results/index.json').read_text(encoding='utf-8')
          )
          assert result_index['schema_version']=='boat-edge-site-results-index-v109'
          assert result_index['payout_backfilled']==144

          sample=json.loads(
              Path('data/site_results/20261007-01-12.json').read_text(encoding='utf-8')
          )
          assert sample['trifecta']=='1-3-6'
          assert sample['trifecta_payout_yen_per_100']==2910

          print({
              'boat_scripts':boat,
              'payout_backfilled':result_index['payout_backfilled'],
              'sample_payout':sample['trifecta_payout_yen_per_100'],
              'archive_dates':archive['dates']
          })
          PY

      - name: Save V111 state
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/site_archive index.html BOAT_EDGE_CURRENT_TODO.md

          git diff --cached --quiet && exit 0

          git commit -m "Stabilize BOAT EDGE lightweight runtime V111"

          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done

          git push
