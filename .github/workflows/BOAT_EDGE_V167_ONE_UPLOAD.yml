name: BOAT EDGE V167 - Independent Official Odds 120-Combo Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 0-13 * * *' # hourly integrity check; V71 already verifies each official odds fetch

permissions:
  contents: write

concurrency:
  group: boat-edge-v167-live-odds-parity
  cancel-in-progress: false

jobs:
  official-odds-dom-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install source verification dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Verify tracked official DOM auditor without legacy source restore
        shell: bash
        run: |
          set -euo pipefail
          # Current reviewed Git-tracked verifier is authoritative; do not
          # overwrite newer official DOM guards with historical compressed code.
          for source in scripts/site_odds_v167_dom_verifier.py \
                        scripts/site_odds_v167_live_audit.py \
                        tests/test_site_odds_v167.py \
                        tests/test_site_odds_v167_runner.py; do
            git ls-files --error-unmatch -- "$source" >/dev/null
            test -s "$source"
          done
          echo V167_TRACKED_AUDITOR_NO_LEGACY_REINSTALL_PASS
      - name: Run offline structural mapping regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_site_odds_v167*.py' -v
          python3 -m py_compile scripts/site_odds_v167_dom_verifier.py scripts/site_odds_v167_live_audit.py
          python3 -c 'from scripts.site_odds_v167_dom_verifier import verify_official_dom_price_mapping; print("V167_IMPORT_ROOT_PASS")'
      - name: Assert deployed official odds guard stays active
        run: |
          grep -Fqx '              verify_official_dom_price_mapping(html)' .github/workflows/site-odds.yml
          echo V167_V71_120_COMBINATION_GUARD_INSTALLED
      - name: Recheck V167 source (live re-fetch skipped if the guard is installed)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}" python3 scripts/site_odds_v167_live_audit.py
          git diff --check
      - name: Commit audit safely; auto-enable collector guard only after 2x120 PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Workflow self-modification is forbidden for GITHUB_TOKEN and is
          # redundant: the validated V71 guard is already committed to main.
          git restore -- .github/workflows/site-odds.yml
          git add -- scripts/site_odds_v167_dom_verifier.py scripts/site_odds_v167_live_audit.py tests/test_site_odds_v167.py data/site_odds/verification_v167.json
          if git diff --cached --quiet; then
            echo 'V167 already current, nothing to write'
            exit 0
          fi
          git commit -m 'V167: independently audit official 120-combo odds mapping; guard only after PASS'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'V167 audit / guarded collector committed to main'
              exit 0
            fi
            sleep 2
          done
          echo 'V167 push failed; do not claim deployed' >&2
          exit 1
