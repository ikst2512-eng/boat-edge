name: BOAT EDGE V167 - Independent Official Odds 120-Combo Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/BOAT_EDGE_V167_ONE_UPLOAD.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/30 0-13 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v167-live-odds-parity
  cancel-in-progress: false

jobs:
  official-odds-dom-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install source verification dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Restore checksum-verified verifier, mock tests and restricted live auditor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYIN'
          import base64, gzip, hashlib
          from pathlib import Path
          objects = {
            'scripts/site_odds_v167_dom_verifier.py': ('69dc593a4df78597679cff18267090ae2546a512bc4335c255ecd1b953de5239', ''),
            'tests/test_site_odds_v167.py': ('568e84c84f505127f6760af25d0d717d47ce2c42649d1abcf85215c2dd3a1fbc', ''),
            'tests/test_site_odds_v167_runner.py': ('7bca59f1afc8ebb15ac9f44fd0d49fde25dfbf21519ab056ba92ef0e61834a9a', ''),
            'scripts/site_odds_v167_live_audit.py': ('22b0535a9bd917f836e9c5566bca5f23d66f5980b3b1786a59ccb238d465f313', ''),
          }
          for dest,(expected,b64) in objects.items():
            content=gzip.decompress(base64.b64decode(b64))
            assert hashlib.sha256(content).hexdigest()==expected, dest+' SHA mismatch'
            p=Path(dest);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content)
          print('V167 verifiers integrity PASS:',len(objects))
          PYIN
      - name: Run offline structural mapping regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_site_odds_v167*.py' -v
          python3 -m py_compile scripts/site_odds_v167_dom_verifier.py scripts/site_odds_v167_live_audit.py
      - name: Compare two LIVE official pages before patching any collector
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/site_odds_v167_live_audit.py
          git diff --check
      - name: Commit audit safely; auto-enable collector guard only after 2x120 PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/site_odds_v167_dom_verifier.py scripts/site_odds_v167_live_audit.py tests/test_site_odds_v167.py data/site_odds/verification_v167.json .github/workflows/site-odds.yml
          if git diff --cached --quiet; then
            echo 'V167 already current, nothing to write'
            exit 0
          fi
          git commit -m 'V167: independently audit official 120-combo odds mapping; guard only after PASS'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'V167 audit / guarded collector committed to main'
              exit 0
            fi
            sleep 2
          done
          echo 'V167 push failed; do not claim deployed' >&2
          exit 1
