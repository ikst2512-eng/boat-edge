name: BOAT EDGE V241 - Readable Verified Results and Mobile Home

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v241.yml']
  workflow_dispatch:
  # V109 remains the five-minute result owner. Preserve this hourly UI/report
  # refresh, but avoid replaying the legacy home patch on every V235 run.
  schedule:
    - cron: '25 0-14,23 * * *'

permissions:
  contents: write

concurrency:
  group: boat-edge-v241-audit-results-and-mobile-home
  cancel-in-progress: false

jobs:
  verified-results-and-home:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete evidence and existing homepage
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify existing tracked results UI and audited scorer
        shell: bash
        run: |
          set -euo pipefail
          # Legacy gzip/base64 UI installation is retired. V109 owns result
          # ingestion; Track 03 owns HTML/JS/CSS. Never restore old UI bytes.
          python3 - <<'PY_V241_TRACKED'
          from pathlib import Path
          paths=(
            'results.html',
            'index.html',
            'assets/boat_edge_v241_results.css',
            'assets/boat_edge_v241_results.js',
            'assets/boat_edge_v241_home.css',
            'assets/boat_edge_v241_home.js',
            'scripts/boat_edge_v241_results.py',
            'scripts/boat_edge_v241_patch_home.py',
            'tests/test_boat_edge_v241_results.py',
          )
          for filename in paths:
              if not Path(filename).is_file():
                  raise SystemExit('V241_TRACKED_REQUIRED_FILE_MISSING_'+filename)
          print('V241_TRACKED_SITE_ONLY_NO_LEGACY_REINSTALL_PASS',len(paths))
          PY_V241_TRACKED
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v241_results.py' -v
          node --check assets/boat_edge_v241_results.js
          node --check assets/boat_edge_v241_home.js
          python3 -m py_compile scripts/boat_edge_v241_results.py scripts/boat_edge_v241_patch_home.py
          git diff --exit-code -- index.html results.html assets/boat_edge_v241_results.css assets/boat_edge_v241_results.js assets/boat_edge_v241_home.css assets/boat_edge_v241_home.js
      - name: Publish only verified results report, without overwriting site UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            # The scorer enforces a closed Formal Fresh guard and Git-first
            # immutable source provenance; it produces SITE-only summary data.
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_boat_edge_v241_results.py' -q
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/boat_edge_v241_results.py
            git add -- data/site_autopilot/v241_results_current.json
            python3 - <<'PY_V241_STAGE'
          import subprocess
          staged=set(subprocess.check_output(
              ['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'data/site_autopilot/v241_results_current.json'}
          if not staged.issubset(allowed):
              raise SystemExit('V241_STAGED_NON_REPORT_PATH_'+repr(sorted(staged-allowed)))
          print('V241_RESULTS_REPORT_ONLY_STAGE_PASS',len(staged))
          PY_V241_STAGE
            git diff --cached --check
            if git diff --cached --quiet; then
              echo V241_REPORT_UNCHANGED_NO_UI_REWRITE
              success=true
              break
            fi
            git commit -m 'V241 refresh verified site-only results report (UI unchanged)'
            if git push origin HEAD:main; then
              echo V241_REPORT_ONLY_GIT_PUBLISHED
              success=true
              break
            fi
            echo "V241_CONCURRENT_REPORT_RETRY_${attempt}"
            sleep "$((attempt * 2))"
          done
          test "$success" = true
