          import json
          from pathlib import Path
          p=Path('data/site_learning/v173_head_tail_diagnostic.json')
          a=json.loads(p.read_text(encoding='utf-8'))
          assert a['schema_version']=='boat-edge-v173-frozen-head-tail-diagnostics-v1'
          assert a['historical_mode']=='RETROSPECTIVE_DIAGNOSTIC_ONLY_NOT_FRESH_VALIDATION'
          assert a['formal_2026_10_08_touched'] is False
          assert a['formal_results_seen'] is False
          assert a['production_model_weights_changed'] is False
          assert a['eligible_races']>=1
          assert all(day>='20261009' for day in a['distinct_dates'])
          print('V173_SAFETY_GATES_PASS',a['eligible_races'],'races',a['excluded_records'],'excluded')
