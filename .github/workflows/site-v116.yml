name: BOAT EDGE V116 Cross Device Final History UI

on:
  push:
    paths:
      - ".github/workflows/site-v116.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge server final history into prediction UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/boat_edge_v108.js')
          s=p.read_text(encoding='utf-8')

          old='''async function loadServerHistoryIndex(){
            const d=await J("./data/site_prediction_history/index.json",30000);
            serverHistoryByKey=d?.races||{};
            return d||{races:{}};
          }'''
          new='''async function loadServerHistoryIndex(){
            const d=await J("./data/site_prediction_history/index.json",30000);
            serverHistoryByKey=d?.races||{};
            return d||{races:{}};
          }
          async function serverHistoryFor(key){
            if(!key)return null;
            return await J(`./data/site_prediction_history/${key}.json`,30000);
          }'''
          if old not in s:
              raise SystemExit('loadServerHistoryIndex anchor not found')
          s=s.replace(old,new,1)

          hist_re=re.compile(
              r'function historyHtml\(\)\{.*?\n\}\nfunction renderTicketRows',
              re.S
          )
          hist_new=r'''function historyHtml(){
            const local=(readLocal(HISTORY,[])||[]).filter(
              x=>x.hit_any
                && x.snapshot_window==="FINAL_15M"
                && x.snapshot_schema==="boat-edge-v113-final-snapshot-v1"
            );
            const server=Object.values(serverHistoryByKey||{})
              .filter(x=>x?.hit_any)
              .map(x=>({
                race_key:x.race_key,
                venue:x.venue,
                race_no:x.race_no,
                winning_combo:x.winning_combo,
                payout:x.payout,
                mode_hits:x.mode_hits||{},
                hit_any:true,
                settled_at:x.settled_at||null,
                source:"server"
              }));

            const merged=new Map();
            for(const x of server){
              if(x?.race_key)merged.set(x.race_key,x);
            }
            for(const x of local){
              if(x?.race_key&&!merged.has(x.race_key))merged.set(x.race_key,x);
            }

            const hits=[...merged.values()].sort((a,b)=>{
              const at=String(a.settled_at||a.final_saved_at||a.race_key||"");
              const bt=String(b.settled_at||b.final_saved_at||b.race_key||"");
              return bt.localeCompare(at);
            });

            if(!hits.length){
              return '<div class="be108-emptyline">締切15分前の最終予想による🎯履歴はまだありません。</div>';
            }

            return hits.slice(0,60).map(x=>{
              const modes=Object.entries(x.mode_hits||{})
                .filter(([,v])=>v)
                .map(([k])=>LABELS[k]?.name||k)
                .join(" / ");
              const shared=x.source==="server"?"共有 / ":"";
              return `<div class="be108-history-row">
                <div><b>🎯 ${esc(x.venue)} ${esc(x.race_no)}R</b><span>${esc(x.winning_combo)}</span></div>
                <div><small>${shared}${esc(modes)}</small>${x.payout?`<strong>${yen(x.payout)}/100円</strong>`:""}</div>
              </div>`;
            }).join("");
          }
          function renderTicketRows'''
          s,n=hist_re.subn(hist_new,s,count=1)
          if n!=1:
              raise SystemExit(f'historyHtml replacement count={n}')

          render_re=re.compile(
              r'async function renderPredictionModes\(race,pred\)\{.*?\n\}\nfunction renderMainPick',
              re.S
          )
          m=render_re.search(s)
          if not m:
              raise SystemExit('renderPredictionModes not found')
          block=m.group(0)

          block=block.replace(
              'const [odds,result]=await Promise.all([oddsFor(key),resultFor(key)]);',
              '''const [odds,result]=await Promise.all([oddsFor(key),resultFor(key)]);
            await loadServerHistoryIndex();''',
              1
          )

          block=block.replace(
              'const resultConfirmed=result?.status==="confirmed";',
              '''const resultConfirmed=result?.status==="confirmed";
            const serverSummary=resultConfirmed?(serverHistoryByKey?.[key]||null):null;
            const serverRecord=serverSummary?await serverHistoryFor(key):null;''',
              1
          )

          block=block.replace(
              '''const finalSnap=isFinalSnapshot(snap)?snap:null;
            const settled=finalSnap&&resultConfirmed?settle(finalSnap,result):null;
            const win=settled?.winning_combo||null;''',
              '''const finalSnap=isFinalSnapshot(snap)?snap:null;
            const serverSnap=serverRecord?.snapshot||null;
            const effectiveSnap=resultConfirmed?(serverSnap||finalSnap):finalSnap;
            const settled=resultConfirmed
              ? (serverRecord?.settlement||(finalSnap?settle(finalSnap,result):null))
              : null;
            const win=settled?.winning_combo||null;''',
              1
          )

          block=block.replace(
              'const frozenRows=finalSnap?.modes?.[mode]?.tickets||null;',
              'const frozenRows=effectiveSnap?.modes?.[mode]?.tickets||null;',
              1
          )

          block=block.replace(
              '''const conf=(resultConfirmed&&finalSnap?.modes?.[mode]?.confidence!=null)
              ? finalSnap.modes[mode].confidence''',
              '''const conf=(resultConfirmed&&effectiveSnap?.modes?.[mode]?.confidence!=null)
              ? effectiveSnap.modes[mode].confidence''',
              1
          )

          block=block.replace(
              '''}else if(resultConfirmed&&finalSnap){
              snapStatus=`🎯 締切前最終予想で判定・${esc(finalSnap.saved_at||"")}`;
            }else if(resultConfirmed&&!finalSnap){
              snapStatus="この端末に締切前の最終スナップショットなし・🎯判定対象外";''',
              '''}else if(resultConfirmed&&serverSnap){
              snapStatus=`🎯 サーバー保存の締切前最終予想で判定・${esc(serverSnap.saved_at||"")}`;
            }else if(resultConfirmed&&finalSnap){
              snapStatus=`🎯 この端末の締切前最終予想で判定・${esc(finalSnap.saved_at||"")}`;
            }else if(resultConfirmed&&!effectiveSnap){
              snapStatus="締切前の最終スナップショットなし・🎯判定対象外";''',
              1
          )

          s=s[:m.start()]+block+s[m.end():]

          old_cache='''function clearRaceCache(key){
            if(!key)return;
            jsonCache.delete(`./data/site_odds/${key}.json`);
            jsonCache.delete(`./data/site_results/${key}.json`);
          }'''
          new_cache='''function clearRaceCache(key){
            if(!key)return;
            jsonCache.delete(`./data/site_odds/${key}.json`);
            jsonCache.delete(`./data/site_results/${key}.json`);
            jsonCache.delete(`./data/site_prediction_history/${key}.json`);
            jsonCache.delete("./data/site_prediction_history/index.json");
            serverHistoryByKey={};
          }'''
          if old_cache not in s:
              raise SystemExit('clearRaceCache anchor not found')
          s=s.replace(old_cache,new_cache,1)

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          html=idx.read_text(encoding='utf-8')
          html=html.replace('boat_edge_v108.js?v=114','boat_edge_v108.js?v=116')
          html=html.replace('boat_edge_v108.css?v=114','boat_edge_v108.css?v=116')
          html=re.sub(
              r'<meta name="boat-edge-site-version" content="[^"]+">',
              '<meta name="boat-edge-site-version" content="V116-CROSS-DEVICE-HISTORY">',
              html
          )
          idx.write_text(html,encoding='utf-8')
          PY

      - name: Update TODO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('BOAT_EDGE_CURRENT_TODO.md')
          s=p.read_text(encoding='utf-8') if p.exists() else '# BOAT EDGE CURRENT TODO\n'
          s=re.sub(r'Current UI target: V\d+','Current UI target: V116',s)

          s=s.replace(
              '- Consider server-side cross-device prediction history only after a true PRE_RESULT snapshot pipeline is added.',
              '- DONE V116: server-side cross-device history is connected to the prediction tab using V114 PRE_RESULT FINAL_15M snapshots.'
          )

          lines=[
              '- V116 merges server and local FINAL_15M hit history without duplicate race rows.',
              '- V116 prefers the server-saved final snapshot on settled races so all devices see the same historical prediction.',
              '- V116 restores historical mode hits, winning ticket and payout from server history on other devices.',
              '- V116 labels server-sourced hit-history rows as shared.',
              '- V116 invalidates server-history cache on race refresh/resume.',
              '- V116 adds no MutationObserver and no setInterval.'
          ]

          marker='## NEXT'
          for line in lines:
              if line not in s:
                  s=s.replace(marker,line+'\n\n'+marker,1) if marker in s else s+'\n'+line+'\n'

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate V116
        shell: bash
        run: |
          set -e
          node --check assets/boat_edge_v108.js

          grep -q 'V116-CROSS-DEVICE-HISTORY' index.html
          grep -q 'boat_edge_v108.js?v=116' index.html
          grep -q 'serverHistoryFor' assets/boat_edge_v108.js
          grep -q 'effectiveSnap' assets/boat_edge_v108.js
          grep -q 'サーバー保存の締切前最終予想' assets/boat_edge_v108.js
          grep -q '共有 / ' assets/boat_edge_v108.js

          ! grep -q 'MutationObserver' assets/boat_edge_v108.js
          ! grep -q 'setInterval(' assets/boat_edge_v108.js

          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          boat=[x for x in re.findall(r'<script src="([^"]+)"',s) if 'boat_edge' in x]
          assert boat==[
              './assets/boat_edge_final_v48.js',
              './assets/boat_edge_v108.js?v=116'
          ],boat
          print({'boat_scripts':boat,'cross_device_history':True})
          PY

      - name: Save V116
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/boat_edge_v108.js index.html BOAT_EDGE_CURRENT_TODO.md

          git diff --cached --quiet && exit 0
          git commit -m "Connect cross-device final history UI V116"

          for n in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
